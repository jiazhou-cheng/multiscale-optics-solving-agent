  # =========================================================================
  # benchmarks/ top level
  # =========================================================================
  - path: benchmarks/inventory.yaml
    bucket: A
    justification: >-
      This triage. It is the record of which artifacts carry scientific evidence
      and which are the retired task layer, and it is what CHE-133's deletion is
      reviewed against.
    destination: >-
      Retained until the migration is complete; the destinations it names become
      the family registry's contents.
  - path: benchmarks/INVENTORY.md
    bucket: A
    justification: >-
      The reviewable rendering of inventory.yaml, generated by
      scripts/generate_benchmark_inventory.py and re-rendered in memory by the
      coverage test so the two cannot disagree.
    destination: Regenerated alongside inventory.yaml.
  - path: benchmarks/README.md
    bucket: C
    justification: >-
      Describes the per-task `benchmarks/levelN/<task_id>/` layout -- task.md,
      public_config.yaml, oracle_graph.yaml, cases/public, cases/hidden -- which is
      the retired design, and points at a `level2/` path that no longer exists.
      Rewritten rather than deleted; see pending_edits.

  # =========================================================================
  # src/agent/
  # =========================================================================
  - path: src/agent/benchmark_suite.py
    part: the harness
    bucket: A
    justification: >-
      Three declared context policies, the 8-code outcome taxonomy with its
      remedies, trial arithmetic reporting a rate over declared trials,
      void-vs-failed separation, the pluggable `command:` participant, and
      first-stage-that-failed grading. None of this is specific to the A1 tasks.
    destination: >-
      Stays in src/agent/ as the agent-evaluation harness (M9), which consumes
      VerificationResult rather than grading physics itself.
  - path: src/agent/benchmark_suite.py
    part: the six _reference_A1-* implementations and AgentTask entries
    bucket: C
    justification: The task definitions in the retired A1 id space.
  - path: src/agent/benchmark_suite.py
    part: the closed forms inside the six task definitions
    bucket: A
    justification: >-
      Five analytic oracles, each VERIFIED against the pinned solver before it
      shipped, each with a measured tolerance basis: R/(n-1) and EFL - t/n
      (1e-13 relative measured); t(1-1/n) (3.750048 mm real trace, 1.3e-5 from the
      closed form); w0 sqrt(1+(z/zR)^2) (6.040167 vs 6.039084 um, 1.8e-4);
      0.61 lambda/NA (6.65 vs 6.4985 um, a 2.3% sampling limit not a physics error);
      z tan(theta) (+17.5017 vs +17.4977 um, 2.3e-4). Plus the two MEASURED traps:
      Optiland's add_layer um/nm slip returning 0.04216384 against bare glass's
      0.04216456, and Chromatix's kykx meaning cycles-per-length on asm_propagate
      and radians-per-length on plane_wave, with the displacement opposite in sign.
    destination: >-
      Oracles of B1-RAY-EFL, B1-RAY-PLATE, B1-WAVE-GAUSS, B1-WAVE-AIRY,
      B1-WAVE-TILT; traps become B0-UNITS-01 and B0-UNITS-02, where contract
      status is `ok` and the physics is wrong.
  - path: src/agent/__init__.py
    bucket: A
    justification: Package marker for the agent harness.
    destination: Unchanged.

  # =========================================================================
  # src/verification/ -- benchmark-facing parts
  # =========================================================================
  - path: src/verification/claim_ledger.py
    bucket: A
    justification: >-
      A hand-maintained proto-schema for exactly this architecture: Oracle,
      OracleIndependence, GateStatus, ClaimKind, StochasticEvidence,
      tolerance-with-basis, and the enforced rule that a SHARES_CODE oracle cannot
      gate. Reuse the enums; do not fork them.
    destination: >-
      Enums move to the family schema; CLAIMS becomes a PROJECTION of the family
      registry so the two cannot drift (M0.5.2).
  - path: src/verification/psf_oracles.py
    bucket: A
    justification: >-
      The independent analytic PSF oracles. Expensive to derive and the only
      independent deciders the composed families have.
    destination: B3-PSF-SINGLET oracle callables.
  - path: src/verification/metrics.py
    bucket: A
    justification: >-
      The centralized metric definitions (CHE-112), promoted from an M2
      deliverable to a substrate one. NCC, relative L2 on field, relative L2 on
      intensity, power ratio and MSE-unit-sum each had more than one
      implementation, so a benchmark and its own probe could disagree about what
      a number means. Every definition states what it is blind to, and
      tests/test_metrics.py demonstrates each blind spot rather than asserting it.
    destination: >-
      Referenced by Metric.definition on every family; the single source for
      what a metric name means.
  - path: src/verification/psf_measurement.py
    bucket: A
    justification: PSF metric measurement -- Strehl, first null, encircled energy, residual L2.
    destination: src/verification/metrics.py (M2.4), one canonical definition each.
  - path: src/verification/asm_oracle.py
    bucket: A
    justification: >-
      The repository's own float64 ASM/RS propagator (O2). Genuinely useful
      characterization evidence that must NEVER decide a gate -- L2-PSF-01 once set
      a negative-control floor from an O2 comparison and had to retire it as
      circular.
    destination: >-
      Oracle kind with independence SHARES_CODE, structurally barred from gating.
  - path: src/verification/analytic.py
    bucket: A
    justification: >-
      The five closed forms promoted out of the retired A1 task set before it was
      deleted, each with the measured agreement against the pinned solver that its
      tolerance was derived from, the wrong answer that tolerance rejects, and
      where relevant what it deliberately does NOT separate.
    destination: >-
      Oracles of B1-RAY-EFL, B1-RAY-PLATE, B1-WAVE-GAUSS, B1-WAVE-AIRY and
      B1-WAVE-TILT, authored by M1.1 and M1.2.
  - path: src/verification/fixed_suite.py
    bucket: A
    justification: >-
      The FIXED-V1 selection itself (CHE-135). The choice is the deliverable, so
      it lives in one reviewable place; a test rejects any justification
      reducible to "it already existed".
    destination: The versioned manifest under benchmarks/instances/.
  - path: src/verification/hazards.py
    bucket: A
    justification: >-
      The two measured traps, with the numbers the mistaken code actually returns:
      Optiland's add_layer um/nm slip at 0.04216384 against bare glass's
      0.04216456, and Chromatix's kykx meaning cycles-per-length on asm_propagate
      and radians-per-length on plane_wave with the displacement opposite in sign.
      Both report an `ok` contract, which is what makes them the archetype.
    destination: B0-UNITS-01 and B0-UNITS-02, authored by M1.3.
  - path: src/verification/status.py
    bucket: A
    justification: >-
      The seven verification statuses, in their own module because both the
      family schema and the verifier need them. They exist separately because a
      pass/fail boolean cannot tell "the solver refuses this dtype" from "the
      approximation does not apply here" from "it ran and the number is wrong".
    destination: >-
      VerificationResult.status (M0.5.3) and BenchmarkFamily.failure_semantics.
  - path: src/verification/declaration_ledger.py
    bucket: A
    justification: >-
      The one place that maps every registry declaration -- 52 assumptions,
      warnings, hard limits and invariants across six components -- to the
      evidence that it is not merely prose. Asserted complete in BOTH directions:
      a declaration with no entry is a gap, an entry whose declaration was edited
      or deleted is orphaned, and every evidence reference is resolved against the
      tree rather than trusted as a string. Closes the same completeness gap M1.3
      and M2.4 each asked for separately.
    destination: >-
      B0-CONTRACT's declaration coverage and M2.4's invariant battery, from one
      source of truth rather than two hand-maintained lists.
  - path: src/verification/evidence.py
    bucket: A
    justification: >-
      The join between an executed instance and a VerificationResult: run and
      verify, fit a convergence exponent WITH its slope standard error, judge a
      broken twin against the gate's own threshold, take ensemble statistics with
      ddof=1, hash a scientific fingerprint, and write a provenance-stamped
      record. It lives here rather than in runtime/ because the dependency has to
      run that way -- an executor that imported verification/ could grade its own
      run.
    destination: >-
      Every family driver under benchmarks/instances/; the shared half of what
      each of them would otherwise reimplement.
  - path: src/verification/refusals.py
    bucket: A
    justification: >-
      The refusal catalogue: for every ContractCode, what triggers it, what would
      fix it, and which of the five negative outcomes it is. A test fails if a
      code has no entry or an entry names a code that no longer exists.
    destination: >-
      B0-CONTRACT's oracle, and the structured-refusal half of M3.2's discovery
      API.
  - path: src/verification/result.py
    bucket: A
    justification: >-
      VerificationResult and its parts: Measurement (a number cannot be reported
      without an uncertainty and a basis), MetricResult carrying whether its
      tolerance may gate, declared-versus-observed validity, the negative-control
      outcomes including FIRED_BACKWARDS, and the structured diagnostic codes.
      No top-level pass boolean and no scalar score.
    destination: >-
      The structure every scientific verdict this project makes is reported in;
      schemas/verification_result.schema.json is generated from it.
  - path: src/verification/verifier.py
    bucket: A
    justification: >-
      verify(family, instance, execution_record). Re-evaluates the family's
      validity predicates against the parameters the run actually realized rather
      than trusting the instance's declaration, and reads no committed record as
      truth.
    destination: The single entry point fixed evaluation and future RL both call.
  - path: src/verification/families/__init__.py
    bucket: A
    justification: The family substrate's public surface (CHE-131).
    destination: Unchanged; grows as families are authored.
  - path: src/verification/families/schema.py
    bucket: A
    justification: >-
      BenchmarkFamily, BenchmarkInstance, the four parameter kinds, the signed
      validity margin, and the oracle-independence and tolerance-gating rules
      enforced at construction.
    destination: The substrate M1/M2/M4 author against.
  - path: src/verification/families/registry.py
    bucket: A
    justification: >-
      The one place that knows which families exist, with the family_id
      uniqueness rule that replaces the retired A1-* id-space collision test.
    destination: Unchanged.
  - path: src/verification/families/predicates.py
    bucket: A
    justification: >-
      The already-measured validity bounds made executable: SI S3 curvature,
      per-axis Nyquist, ASM transfer-function sampling, capability intersection,
      hexapolar ring membership, declared planarity, Fresnel number, paraxial
      field angle.
    destination: Family validity tuples.
  - path: src/verification/families/b0_contract.py
    bucket: A
    justification: >-
      The four B0 contract-and-recovery families (CHE-108) and their ten canonical
      instances, one per declared boundary. The five negative outcomes are each
      produced by a different instance, and B0-UNITS carries the two measured
      traps whose expected contract status is `ok` while the physics is wrong.
    destination: The contract layer of the evidence set; feeds M7.3's robustness suite.
  - path: src/verification/families/b1_ray.py
    bucket: A
    justification: >-
      The five B1 ray-primitive families (CHE-106): EFL/BFL, plane-parallel
      plate, Snell with the TIR boundary as a validity predicate, the Lagrange
      invariant, and the off-axis pupil OPL whose omitted
      n_object * (d0 . r_launch) term recovered only 0.13% of the required tilt.
    destination: The ray half of the B1 evidence layer.
  - path: src/verification/families/b1_wave.py
    bucket: A
    justification: >-
      The seven B1 wave-primitive families (CHE-107), including B1-WAVE-ASM-VALIDITY,
      whose entire subject is behaviour near the sampling boundary and which is what
      forces the validity margin to be signed and normalized.
    destination: The wave half of the B1 evidence layer.
  - path: src/verification/families/b1_gsl_validity.py
    bucket: A
    justification: >-
      B1-GSL-VALIDITY (CHE-146, M2.10): the smooth-to-diffractive validity
      envelope for GENERALIZED_SNELL, against the analytic grating equation
      as the primary (gating) oracle and FULL_FIELD as CROSS_ROUTE diagnostic
      evidence only. Declares GRATING_ORDER_PROPAGATES (new) and reuses
      GENERALIZED_SNELL_SINGLE_ORDER_DOMINANCE and a measured wrapper around
      the coupler's own local-gradient-smoothness margin, rather than
      re-deriving M2.7's physics.
    destination: The diffractive-interaction half of the B1 evidence layer.
  - path: src/verification/families/b2_transitions.py
    bucket: A
    justification: >-
      The five B2 representation-transition families (CHE-109..CHE-112), and the
      WHAT_DOES_NOT_SURVIVE table naming what each coupler provably discards.
      B2-ROUNDTRIP makes "the deliberately broken twin ran" a validity predicate,
      so a round trip that cannot be made to fail reports OUT_OF_VALIDITY rather
      than a passing number.
    destination: The transition layer of the evidence set.
  - path: src/verification/families/b3_composed.py
    bucket: A
    justification: >-
      The three B3 composed families (CHE-116). B3-PSF-SINGLET carries the unmet
      1.0e-3 gate at 2.2072e-3 with every tolerance basis migrated verbatim from
      tolerances.yaml; B3-DEMO2 is the one composed case graded against an
      external published reference; B3-DUALROUTE gates on an intermediate
      invariant because no independent PSF route exists for the Cooke triplet.
    destination: The composed half of the validated evidence layer.
  - path: src/verification/families/b3_4f_ideal.py
    bucket: A
    justification: >-
      B3-4F-IDEAL (CHE-144, M2.8): the first layer-C system-ladder family. The
      independent oracle is a hand-derived Fourier-plane mask series (Bessel
      for the sinusoidal grating, the two-level square-wave series for the
      binary grating), sharing no code with the driver's fft2/ifft2 relay. The
      gate is carried NOT_MET and unwidened: two declared-INSIDE instances fail
      it, fully attributed to the mask's own Fourier-tail aliasing rather than
      a defect -- CHE-144's own requested characterization of where sampling
      stops matching the continuous theory.
    destination: The system half of the validated evidence layer.
  - path: src/verification/families/b3_doe_inline.py
    bucket: A
    justification: >-
      B3-DOE-INLINE and B4-DOE-INLINE (M2.12): the system-ladder rung where the
      diffractive interaction's RAY OUTPUT is load-bearing, because a downstream
      refractive trace consumes it directly. Two families in one module for the
      same reason as the 4f rung: B3 is a CONVENTION claim and gates -- the
      grating equation to 1e-14 in direction cosine, opl_in + m phi / k0
      reproduced from the declaration, |a_in| |t| for the amplitude, and the
      zero-phase limit BITWISE identical to the plain refractive train -- with
      the analytic grating-plus-lens order position over three periods as the
      forward-accuracy companion and its tolerance DERIVED from the
      PARAXIAL_ORDER_POSITION predicate's bound. B4 is category B4 and cannot
      gate: it measures the interference structure an aberrated singlet puts in
      a diffracted order against the diffraction-blurred ray density, whose
      fringe contrast is exactly zero at every aperture measured. The module
      also records two things it could NOT establish with numbers -- a pupil-side
      wavefront metric with a 0.00971 floor that does not resolve the sawtooth,
      and a PSF window that misses two B4 responses -- rather than omitting them.
    destination: The system half of the validated evidence layer.
  - path: src/verification/families/b3_4f_real.py
    bucket: A
    justification: >-
      B3-4F-REAL and B4-4F-REAL (CHE-145, M2.9): the second system-ladder rung
      and the first that genuinely requires hybrid ray-wave modelling. Two
      families in one module because the ticket's own acceptance criteria split
      that way -- B3 gates the paraxial limit, where the 4F-1 answer is an
      independent reference and third-order spherical aberration's fourth-power
      law fixes the convergence RATE rather than a chosen tolerance; B4 is
      category B4 and therefore structurally incapable of gating, which is how
      "labelled characterization where no oracle exists" is made a property of
      the schema rather than of discipline. Both gating field tolerances are
      DERIVED from the PARAXIAL_LIMIT predicate's own bound through a
      proportionality measured over a 256x span in aberration.
    destination: The system half of the validated evidence layer.
    note: >-
      Three sampling walls are declared as validity predicates rather than left
      in comments, because each caps a parameter range CHE-145 asks for: the
      field angle obeys theta_max * R = (object_grid_n / 2 - 4 *
      object_waist_pixels) * lambda / 2, the aperture ceiling is where the
      aberration's residual ray angle stops fitting the shared plane's grid,
      and the order copies must stay separated at the sensor -- which is what
      puts B3-4F-IDEAL's own best-behaved samples_per_period = 16 out of reach
      at a grid_n ** 4 ray count.
  - path: src/verification/families/b4_characterization.py
    bucket: A
    justification: >-
      The B4 characterization families (CHE-134). Carries the DEMO3-RW-P why_not
      migrated unreworded from manifest.yaml, the cost model, and the attributed
      cross-route discrepancy on the Cooke triplet. None of them can gate, and
      the schema refuses the promotion rather than relying on the label.
    destination: The characterization layer; B4 never joins a required gate.
  - path: src/verification/families/projection.py
    bucket: A
    justification: >-
      Projects registered families into claim_ledger Claims, so the coverage
      ledger is derived rather than typed twice.
    destination: Unchanged; the projection grows as families land.
  - path: src/verification/__init__.py
    bucket: A
    justification: Package marker.
    destination: Unchanged.
