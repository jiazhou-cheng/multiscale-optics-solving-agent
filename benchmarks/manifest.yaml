# CHE-87: this file lists **implemented** benchmarks only.
#
# It previously also carried nine planned tasks -- four at level 1, three at
# level 2, three at level 3 -- naming components with no adapter, and in three
# cases (M_TMM_JAXLAYERLUMOS, M_PC_LEGUME, C_FIELD_TO_PSF) no registry entry
# either. A manifest that mixes "this runs" with "we would like this to run"
# cannot be used to answer either question. The intent is preserved, marked
# non-executable, in benchmarks/roadmap.md.
# The M1 exit report and its independence check describe the archived gen1
# suites (archive/benchmarks/gen1/). They are the milestone record and stand;
# they are not runnable from here.
m1_exit_report: benchmarks/reports/2026-08/ray_and_wave_baselines.md
m1_independence_check: archive/benchmarks/gen1/archive/benchmarks/gen1/benchmarks/verify_m1_independence.py
# ---------------------------------------------------------------------------
# The levels: block is gone (CHE-133, M0.5.4)
# ---------------------------------------------------------------------------
#
# The L1/L2/L3 "levels" taxonomy was the retired evaluation design: a task id, a
# level number and a protocol id, with the interesting scientific content -- the
# tolerance, the oracle, the unmet gate -- as prose in a `gate_disposition`
# field that nothing could query. That is how the one live composed benchmark
# came to have an unmet primary gate and a false negative_controls_pass while
# being easy to plan against as though green.
#
# Its replacement is the family registry (`src/verification/families/`) plus
# `benchmarks/instances/`. Nothing was lost in the move, and each piece now has
# an executable home:
#
#   the 1.0e-3 fft_oracle_intensity_relative_l2 gate, UNMET at 2.2072e-3
#     -> verification.claim_ledger.open_gates(), cross-checked against
#        benchmarks/probes/records/m3_quadrature_weight.json by
#        tests/test_claim_ledger.py rather than restated here
#   the quadrature-weight control that fires BACKWARDS at 0.417
#     -> the same register, with its caveats
#   the rule that the gate must not be closed against another Optiland PSF
#   route -- FFTPSF and HuygensPSF share one Wavefront/OPD front end and are
#   not two oracles (PB7/CHE-58 finding F2)
#     -> structurally enforced: BenchmarkFamily refuses a CROSS_ROUTE oracle
#        outside category B4, and a B4 family cannot carry a gating tolerance
#   the residual analysis and the full disposition
#     -> benchmarks/physics/L2-PSF-01/README.md and
#        benchmarks/reports/2026-08/slice_cleanup_disposition.md item 3
#
# The runner `benchmarks/physics/L2-PSF-01/run_benchmark.py` is no longer the only
# way to execute this gate. CHE-115 (M3.3) reproduced its frozen
# `fft_oracle_intensity_relative_l2 = 0.0022072391812867093` BIT-IDENTICALLY
# through `GraphExecutor` from `examples/graphs/psf_singlet_sensor.yaml`, driven by
# `benchmarks/instances/b3_psf_singlet.py` and judged by
# `verify(B3_PSF_SINGLET, instance, record)`. The runner still owns what that path
# does not reproduce -- the 12-rung convergence ladder, the O2 ASM/RS
# characterization oracle, the exit-pupil hard-support control and the
# quadrature-weight regression control -- and its deletion is CHE-116's per
# CHE-115's own amendment. It is bucket C in benchmarks/inventory.yaml.

# ---------------------------------------------------------------------------
# Characterizations — NOT benchmarks, and the distinction is the entry
# ---------------------------------------------------------------------------
#
# CHE-120 (M5.3). These are recorded here because the question "is demo3 a
# validation target?" kept being answerable only by reading a report, and a
# manifest that lists benchmarks without saying which scientific tasks cannot
# become one invites somebody to plan against a validation that cannot exist.
#
# A characterization measures a property of an estimator or a cost. It has no
# oracle, so it has no pass/fail gate, and no number in its records is a
# threshold. That is a permanent property of the task, not a backlog item.
characterizations:
  - id: DEMO3-RW-P
    title: patch-route hologram + refractive lens (the paper's Fig 5c system)
    graph: [C_PATCH_WFT, M_RAY_OPTILAND, C_RAY_TO_WAVE]
    probes:
      - benchmarks/probes/ray_wave/demo3_hologram_lens.py
      - benchmarks/probes/ray_wave/demo3_convergence.py
      - benchmarks/probes/ray_wave/demo3_variance.py
    validation_target: false
    why_not: >-
      The paper states no conventional reference exists for this system; that is
      the point of its Fig 5c. Every demo3 number is a self-comparison -- one
      realization against another, or one arm of a probe against another arm.
      Nothing is scored against an independent oracle and no recorded threshold
      is a gate. This CANNOT be fixed by more compute: the missing thing is a
      reference, not a budget.
    what_it_does_support: >-
      Characterization of cost, convergence rate and estimator variance;
      anti-bias work, because unbiasedness IS testable at a reduced size where
      an enumerated oracle exists (tests/test_patch_positions.py,
      tests/test_patch_wft.py) and transfers to demo3 by construction; and
      relative claims between two arms of one probe. The components are
      validated elsewhere -- the full-aperture patch against an independent
      float64 ASM at 7.1e-13, and demo2 against the same oracle. demo3 is those
      validated components composed at a scale where the composition has no
      reference of its own.
    cost_ceiling: >-
      NCC 0.9 seed-to-seed needs 1.49e9 rays and 0.14 h/run on the shipped
      estimator, or 1.02e9 rays and 0.094 h with CHE-120's position importance
      sampling. The paper's SI Table S2 budget for this system is
      2.6e9 rays. Extrapolation basis and its 2.9x model spread:
      benchmarks/reports/2026-08/demo3_estimator_variance.md.
    report: benchmarks/reports/2026-08/demo3_estimator_variance.md
