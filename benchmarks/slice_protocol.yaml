# ---------------------------------------------------------------------------
# PSF measurement semantics -- frozen by CHE-36 (M3.7)
# ---------------------------------------------------------------------------
# M3.8 compares the measured PSF against an analytic Airy pattern and an
# independent FFT/Fraunhofer oracle. Both are defined only up to a scale, so the
# comparison means nothing unless these are a stated choice rather than an
# accident of the implementation. Frozen here so a later ticket cannot make its
# oracle pass by changing the measurement instead of finding the defect.
psf_measurement:
  category: observable
  is_a_coupler: false
  category_rationale: >-
    a coupler performs a physically meaningful change of representation and
    carries the assumptions that come with it -- C_RAY_TO_WAVE turns rays into a
    field and can refuse. `ComplexField -> |U|^2` changes no representation and
    consults no convention it does not already hold, so it is a measurement of
    the terminal state. C_FIELD_TO_PSF was removed from the registry rather than
    implemented; see open_structural_items.terminal_coupler_has_no_target_node.
  implementation: src/multiscale_optics_agent/evaluation/psf_measurement.py
  runs: after the graph, in the benchmark/measurement layer
  intensity: abs(u)**2
  intensity_taken_in: contracts.PSF.from_complex_field
  normalization:
    required: true
    defaulted: never
    frozen_for_m3_oracles: peak
    definition: intensity / max(intensity) over the sampled window
    why_peak: >-
      neither oracle fixes an absolute scale this slice could be held to. The
      Airy formula's absolute irradiance depends on total flux and aperture area,
      and the flux descends from Optiland's per-ray intensity weights, which are
      uncalibrated -- nothing between the trace and the propagated field converts
      them to watts. A raw comparison would test an arbitrary constant and would
      fail for a reason unrelated to the diffraction physics. Peak normalization
      removes exactly that degree of freedom and leaves peak position, first-null
      radius and profile shape untouched.
    what_it_hides: >-
      a constant multiplicative error, exactly. M2's amplitude-weight omission
      under uniform sampling was one. Energy normalization hides the same
      constant AND makes the result depend on how much energy left the window, so
      it is not a fix.
    mitigation: >-
      the raw scale is not discarded: raw_peak_intensity and raw_window_energy
      are recorded before scaling, and M3.8's energy ledger -- not the normalized
      profile -- is what constrains the multiplicative factor.
  axes:
    source: the propagated field's OUTPUT pitch (dx_out)
    never: the input pupil pitch
    why: >-
      PSF.from_complex_field takes its pitch from the field, so the axes are only
      as correct as the pitch the producing adapter declared. The Chromatix
      adapter carries both: its graph path writes dx_out onto the output
      artifact, and its baseline summary's field_metadata.sample_pitch_m is the
      input pitch. Taking the input pitch would rescale every distance the
      measurement reports while leaving the intensity map entirely plausible.
    enforced_by: >-
      evaluation.psf_measurement.measure_psf_from_record refuses with
      SAMPLE_PITCH_MISMATCH when the record's declared pitch is not the pitch the
      propagation reported. CHE-36 added input/output pitch to the graph path's
      diagnostics so there is something independent to compare against; reading
      the pitch off the artifact being checked is circular.
    asm_preserves_pitch: >-
      true, which makes the check cheap rather than vacuous. It is the same
      assertion for a method that does not preserve it, and the failure it guards
      against is silent.
  coherence_model: monochromatic, fully coherent, scalar (single wavelength)
  absolute_phase_required: false
  absolute_phase_note: >-
    abs(u)**2 is invariant under a global phase, which is what makes CHE-40's
    carrier-removed path admissible for the PSF; required_conditioning above
    mandates that path for any phase-insensitive M3 result.
  invariants:
    - name: nonnegative_intensity
      enforced_by: contracts.PSF.__post_init__ (NEGATIVE_INTENSITY)
    - name: declared_psf_normalization
      enforced_by: contracts.PSF.__post_init__ (MISSING_DECLARATION)
    - name: finite_intensity
      enforced_by: contracts.PSF.__post_init__ (NON_FINITE)
  invariant_provenance: >-
    the first two names are the ones the retired C_FIELD_TO_PSF entry declared
    and nothing executed. They are kept verbatim so M3.10's claim audit can trace
    them from the removed registry entry to the contract that now enforces them.
  failure_path: >-
    the PSF/measurement contract. Invalid construction raises ContractError; no
    graph coupler owns this refusal.
  excluded:
    - pixel integration       # M_SENSOR_IDEAL, out of M3
    - detector noise
    - incoherent aggregation
    - polychromatic aggregation
    - any gradient claim

# ---------------------------------------------------------------------------
# Feasibility verdict
# ---------------------------------------------------------------------------
feasibility:
  verdict: feasible_on_cpu_float64
  evidence: benchmarks/probes/m3_slice_feasibility.py
  binding_constraint: none_of_the_candidates_binds_on_a_carrier_conditioned_path
  binding_constraint_amended_by: CHE-40 (M3.2A)
  binding_constraint_amendment: >-
    M3.2 named Chromatix's complex64 cast against propagation distance as the
    binding constraint. CHE-40 showed that constraint was an artefact of
    propagating the absolute carrier phase, not of the dtype: with the carrier
    removed, the same complex64 engine holds 2.7e-4 relative intensity error at
    470 mm, ten times beyond the distance that rejected the first system. The
    dtype still costs something -- see the tolerance budget -- but it no longer
    bounds the system's absolute size.
  superseded_binding_constraint: chromatix_float32_cast_versus_propagation_distance
  superseded_binding_constraint_detail: >-
    C_RAY_TO_WAVE cost is rays x pixels and measured ~5.5e8 ray-pixel products
    per second, so both selected grids reconstruct in under a second. Neither
    memory nor the coupler is binding. What binds is Chromatix's unconditional
    complex64 cast: the ASM transfer-function phase is 2*pi*z/lambda, so the
    relative field error grows as eps32 * 2*pi*z/lambda. Measured 6.3e-2 at
    z = 47 mm against a predicted 6.4e-2 -- a ratio of 0.98, so the model is
    confirmed rather than fitted.
  rejected_configuration:
    id: unscaled 25 mm-radius singlet
    status: reinstated_as_admissible
    reinstated_by: CHE-40 (M3.2A)
    efl_mm: 48.37
    propagation_distance_mm: 47.06
    measured_float32_field_error: 6.3e-2
    original_reason_for_rejection: >-
      200x over M1's own float32 figure for this engine. A pupil-to-focus
      distance is set by the lens focal length, so this made the reference
      system's absolute SIZE a protocol decision rather than only its
      f-number. Scaling to 1/10 at fixed f-number shortens the propagation,
      reduces the aberration in waves by the same factor, and leaves the
      numerical aperture -- hence the Nyquist pitch -- unchanged.
    why_reinstated: >-
      CHE-40 propagated this system's own 4.987 mm exit pupil the full 47.06 mm
      to focus on a 2048^2 grid at its own 2.659 um pitch. Under the
      absolute-phase path it still fails, at 4.49e-4 relative intensity error
      against M3.2's own 3.5e-4 term -- so M3.2's rejection was correct for the
      propagation it had. Under the carrier-conditioned path the same geometry
      gives 2.21e-7, and the resulting Airy pattern agrees with the float64
      oracle's to within 1e-4 relative. Nothing about the system was changed.
    measured_carrier_conditioned_intensity_error: 2.2117405336498536e-07
    measured_absolute_phase_intensity_error: 4.4879159803374615e-04
    not_selected_because: >-
      cost, not precision. At 2048^2 it is ~120x the pixels of the scaled system
      for the same physics, and M3.9's convergence study sweeps grid and ray
      count on top of that. The scaled system stays the frozen primary; this one
      is available to any later ticket that wants a macroscopic case, and the
      choice is now a budget decision rather than a numerical impossibility.
  measured_coupler_throughput_ray_pixels_per_second: 5.5e8
  projected_reconstruction_seconds:
    M3-SINGLET-REF: 0.27
    M3-REVERSE-TELEPHOTO: 0.48
  timing_caveat: >-
    shared, unpinned machine, as in M1 and M2. These figures exist to reject
    infeasible configurations, not as a regression envelope.

# ---------------------------------------------------------------------------
# Inadmissible sources
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Known structural constraints handed to later tickets
# ---------------------------------------------------------------------------
open_structural_items:
  - id: terminal_coupler_has_no_target_node
    found_by: CHE-31
    owner: CHE-36 (M3.7)
    status: resolved
    resolved_by: CHE-36 (M3.7)
    description: >-
      Every graph edge requires a target NODE, and the only registered consumer
      of a `psf` artifact is M_SENSOR_IDEAL, which M3 excludes. So C_FIELD_TO_PSF
      as the final step cannot be expressed as an edge. examples/graphs/
      ray_to_wave.yaml therefore ends at the wave node's output field.
    honest_options:
      - add a minimal sink node for the PSF
      - run the reduction in the benchmark driver and record it in provenance
    not_an_option: >-
      pulling M_SENSOR_IDEAL into M3 to make the graph close, which would widen
      the milestone to make its diagram tidier
    resolution: >-
      the second option, and the framing changed with it. The symptom was read at
      M3.2 as a graph-model constraint -- a terminal coupler with nothing to point
      at. It is better read as the registry having mis-categorized the operation:
      `ComplexField -> |U|^2` is not a cross-representation handoff and so was
      never an edge to place. C_FIELD_TO_PSF is removed from
      registry/couplers.yaml, and PSF extraction is a measurement over the
      existing contracts.PSF primitive
      (src/multiscale_optics_agent/evaluation/psf_measurement.py), run after the
      graph and recorded in provenance. No sink node was added, and M_SENSOR_IDEAL
      stays out of M3.
    also_found: >-
      the entry could not be deprecated in place. CouplerSpec requires
      `framework` and `derivative.mode`, and Framework has no `none`, so any
      surviving entry keeps asserting a framework and a differentiation mode for
      numerics that never existed. The retired entry claimed `framework: jax` and
      `derivative.mode: native_autodiff`; both were artifacts of the abstraction,
      and the schema left removal as the only honest option.
  - id: airy_radius_entry_is_a_diameter
    found_by: CHE-33 (M3.4)
    owner: CHE-37 (M3.8) for the oracle, CHE-38 (M3.9) for the sampling claim
    description: >-
      systems.M3-SINGLET-REF.airy_radius_um = 12.974628171691823 is 1.22*lambda/NA,
      which is the Airy first-null DIAMETER. The radius is 0.61*lambda/NA =
      6.4873 um. The same factor of two propagates into
      sampling.grids.M3-SINGLET-REF.airy_radius_in_pixels = 4.88 (true radius:
      2.44 px at the frozen 2x oversampling) and into the oversampling rationale,
      which argues from "~2.44 px at the critically admissible pitch" -- that
      figure is the radius at 2x, not at 1x.
    not_changed_here_because: >-
      it changes the JUSTIFICATION for oversampling_factor = 2, not the factor
      itself, and the frozen grids are what M3.4-M3.6 are being built against.
      CHE-38 owns whether 2x is still the right number once the radius is counted
      correctly; CHE-37 owns the Airy oracle that consumes the radius directly,
      where using a diameter as a radius would be a factual error in the oracle.
    measured: 0.61 * 0.55 um / 0.05171631827291936 = 6.4873 um
    oracle_half_status: resolved
    oracle_half_resolved_by: CHE-37 (M3.8)
    oracle_half_resolution: >-
      evaluation/psf_oracles.py computes the radius from the first zero of J1
      (3.8317059702075125 / 2 pi = 0.6098349) and never reads airy_radius_um.
      Using the exact coefficient rather than the quoted 0.61 is a further 0.03%.
      The frozen fields are left as they are and the correction is recorded;
      tests/test_m3_psf_verification.py asserts the factor of 2 against this file,
      so correcting the fields later will surface here rather than silently.
    sampling_half_status: still open, owner CHE-38
  - id: off_axis_handoff_omits_the_pupil_tilt
    found_by: CHE-37 (M3.8)
    owner: CHE-41
    status: >-
      RESOLVED by CHE-41 under amendment A3. Retained in full, unedited below,
      because five records were measured while it was true and a reader of those
      records needs to be able to find out what they meant. The resolution is
      summarized in resolution/ and verified by
      benchmarks/probes/records/m3_off_axis_handoff.json.
    resolution:
      declared_reference: >-
        the plane wavefront of the incoming collimated bundle. The alternative --
        an explicit chief-ray-referenced frame -- was weighed and rejected; see
        amendment A3's the_alternative_and_why_not for the four reasons.
      cause_confirmed: >-
        the probable_cause below was right in mechanism and imprecise in form. The
        omitted term is n_object * (d0 . r_launch), not sin(theta) * y: it is
        evaluated at the LAUNCH coordinate, which is why it cannot be reconstructed
        from the exported pupil arrays and had to be exported by the ray adapter.
        Measured directly: the launch z spread is exactly 0 and the launch
        direction spread is 2.8e-17 across 3169 rays, so the seeded reference
        surface is a plane perpendicular to z rather than a wavefront
        (knowledge/solvers/optiland/expected/off_axis_opd_reference.json).
      opd_is_relative_to_chief_ray: >-
        still False, and now tested where it is testable: off axis the chief ray's
        own opd_native is 11051.3 waves rather than zero. The flag was correct; it
        was the reference SURFACE that was undeclared, and two new conventions
        entries now state it (opd_reference_surface,
        opd_omits_incoming_wavefront_tilt).
      oracle: >-
        PSF peak at pixel (114, 0) against a traced chief-ray intersection at
        114.42 pixels (0.42 px, 0.17 Airy radii, below the peak index's own
        quantization); fitted reference-sphere centre 0.57 um from that
        intersection against 209.92 um before, 367x better; pupil wavefront against
        the traced chief-ray point 0.0442 waves P-V against 57.01 before; geometric
        RMS ray radius about that point 0.082 Airy radii, which fits no sphere at
        all.
      on_axis_impact: >-
        none, and bit-identically none: the term is constant across an on-axis
        bundle, and the coupler does not add a constant. Asserted by
        tests/test_m3_off_axis_handoff.py rather than assumed.
    severity: >-
      high for any off-axis work, none for M3's frozen on-axis configuration
    description: >-
      For an off-axis field the declared pupil OPL carries essentially none of the
      linear tilt the geometry requires, so the reconstructed wave converges to the
      wrong point. Measured on M3-REVERSE-TELEPHOTO at Hy = 0.2: the OPL's linear
      slope in y is 8.7e-5 where 0.0684 is needed to reach the geometric image
      point, i.e. 0.13% of it. Fitting the reference sphere finds its centre ON
      AXIS, within 1 um of y = 0, where the wavefront residual drops from 57.0 to
      0.072 waves peak-to-valley -- a clean converging sphere aimed 209 um away
      from where the rays actually go. The shipping PSF lands there too: 1 pixel
      from the axis instead of 114.
    probable_cause: >-
      for an object at infinity Optiland seeds the OPD accumulator on a plane
      perpendicular to z rather than on the incoming wavefront. For an off-axis
      parallel bundle those differ by exactly sin(theta) * y, which cancels the
      convergence tilt. CHE-30 characterized this launch plane and recorded the
      PISTON consequence (its zero moves with the aperture); the TILT consequence
      is invisible on axis, and CHE-30, CHE-32 and CHE-33 all validated on axis
      only. conventions.opd_is_relative_to_chief_ray reads False, which on axis is
      an untestable claim.
    not_fixed_here_because: >-
      referencing the OPD to the incoming tilted wavefront changes the handoff
      convention, and M3.8 must not both invent and verify a path.
    consequences:
      - >-
        the off-axis asymmetry vehicle CHE-37 planned cannot serve its purpose:
        its PSF forms on axis, so it does not break the symmetry that hides a
        transpose.
      - >-
        no frozen M3 configuration can detect an x/y transpose. Covered instead by
        the synthetic-tilt orientation control; see
        no_frozen_configuration_detects_a_transpose.
    evidence: benchmarks/probes/records/m3_psf_verification.json (off_axis_tilt_finding)

  - id: no_frozen_configuration_detects_a_transpose
    found_by: CHE-37 (M3.8)
    owner: CHE-37, mitigated
    description: >-
      Both frozen on-axis configurations are rotationally symmetric, and the
      off-axis one forms its PSF on axis as well (see
      off_axis_handoff_omits_the_pupil_tilt), so an x/y transpose of the output
      grid moves the measured PSF by nothing. The transpose control's detection
      margin is 1.0000066 -- it cannot be made to fail, and by M2's rule it
      therefore validates nothing.
    mitigation: >-
      a synthetic control that CAN fail. A known linear tilt of 0.02 is added to
      the declared OPL along x only; the PSF must move along +x by tilt * R, an
      analytically predicted 36.39 pixels. Measured 36 pixels in x and 0 in y,
      ratio 0.989, and under Perturbation(transpose_axes=True) the displacement
      appears along y instead. The x/y wiring is tested against a predicted
      answer rather than against another run of the same code.
    still_open: >-
      a transpose in the SHIPPING configuration remains undetectable. Fixing that
      needs the off-axis handoff, i.e. the item above.
    resolved_by: >-
      CHE-41, and the fix uncovered a SECOND blind spot the 1.0000066 margin was
      hiding. With the off-axis handoff corrected the shipping PSF sits 114 pixels
      off axis along +y and 0 along x, and Perturbation(transpose_axes=True) moves
      it to (0, 114) -- a displacement of 161 pixels, 66 Airy radii. But CHE-37's
      SCORING still reads a margin of 0.99999978, because it azimuthally averages
      about the grid centre and such an average cannot distinguish a peak at
      (114, 0) from one at (0, 114) for any configuration whatsoever. An off-axis
      field was necessary and not sufficient; the metric had to change too. Two
      repairs are reported rather than one. Centring the analytic reference and the
      azimuthal average on the traced image point -- the smallest change, and the
      one now applied to off_axis_negative_controls -- gives 233.6 in CHE-41's
      record and 674.9 in m3_psf_verification's, and simultaneously lifts the
      OPL-sign, phase-sign, oblique-ramp and distance-sign controls on that
      configuration from within 2.6x of 1.0 to 651x-1400x, which is what an
      asymmetric configuration was supposed to buy in the first place. Dropping the
      azimuthal average entirely gives 12.43. The amplitude control remains
      undetected at 1.00005. Evidence:
      benchmarks/probes/records/m3_off_axis_handoff.json (axis_transpose_control)
      and m3_psf_verification.json (off_axis_negative_controls).

  - id: amplitude_path_is_not_exercised_by_any_m3_configuration
    found_by: CHE-37 (M3.8)
    owner: unassigned; a follow-up
    description: >-
      Optiland's per-ray intensity weights on M3SingletRef are exactly uniform
      (min = max = 1.0, spread 0.0), so replacing every ray amplitude with 1 is an
      exact no-op: the amplitude_weight_omitted control's detection margin is
      1.0000000 and its raw peak ratio is 1.0000000. This is stronger and worse
      than M2's finding that the omission was an exact CONSTANT SCALE -- here it
      is not even a scale.
    consequence: >-
      the reconstruction's amplitude path carries no verification evidence from
      M3. Exercising it needs a non-uniform weight: apodization, vignetting, or a
      polarized Fresnel transmission. M3 has none of these.
    reported_as: an undetected control, not a passing test

  - id: fft_oracle_gate_fails_with_an_unattributed_floor
    found_by: CHE-37 (M3.8)
    owner: CHE-38 (M3.9) for the ray-sampling part; the floor is unassigned
    description: >-
      The fft_oracle_intensity_relative_l2 gate of 1.0e-3 is missed by 15x at the
      frozen configuration (1.509e-2). Varying ONLY the ray count, with grid,
      padding, plane and system held fixed, the residual falls monotonically:
      3.29e-2 / 1.75e-2 / 1.51e-2 / 9.13e-3 / 7.40e-3 / 6.67e-3 at 817 / 1801 /
      3169 / 7057 / 12481 / 27937 traced rays. So most of the excess is the
      protocol's own ray_sampling_error term -- value null, status to_be_measured
      -- which this gate's text already requires to fit inside it, and which CHE-35
      independently found far from converged at these counts.
    unresolved: >-
      the trend FLATTENS at ~6.7e-3, well above the gate, so ray sampling is not
      the whole story. Leading hypothesis, untested: the shipping reconstruction's
      pupil edge is set by where the rays stop and is soft over roughly one ray
      spacing, while the oracle applies a hard circular mask at the largest traced
      radius. That is a difference in the aperture function, which is what sets
      the ring structure the residual measures.
    handling: >-
      reported as a finding. The gate was NOT widened, and the failure is pinned
      as a failure by tests/test_m3_psf_verification.py so it cannot go green
      without someone saying what changed.
    same_cause_as: airy_peak_intensity_relative, which fails 6.1x and whose
      full-window peak deficit collapses from 0.886 at 817 rays to -0.007 at 12481

  - id: airy_gate_residual_aberration_term_was_derived_at_best_focus
    found_by: CHE-37 (M3.8)
    owner: CHE-38 or CHE-39, minor
    description: >-
      The airy_peak_intensity_relative gate composes 9.1e-4 of residual
      aberration, taken from 1 - 0.9990928, which is the Marechal Strehl at the
