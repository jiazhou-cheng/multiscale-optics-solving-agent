version: 1
canonical_static_context: AGENTS.md
agent_entrypoints:
  codex: AGENTS.md
  claude_code: CLAUDE.md
claude_imports:
  - AGENTS.md
dynamic_task_context:
  source: linear_issue
  required_fields:
    - goal
    - acceptance_criteria
    - non_goals
    - linked_specs
    - test_plan
    - owner_agent
loading_policy:
  startup:
    - AGENTS.md
    - current Linear issue
  task_linked_only:
    - docs/context/
    - relevant source files
    - relevant tests
    - selected solver/coupler cards
  retrieval_only:
    - knowledge/
    - long package documentation
  reference_not_startup:
    # Historical material created by CHE-9; load only when a task cites it.
    - docs/archive/
    - paper drafts
    - broad solver catalogs
    - broad benchmark specifications
