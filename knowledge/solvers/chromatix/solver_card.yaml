# Routing-critical facts for M_WAVE_CHROMATIX.
# Field contract follows AGENTS.md "Initial Artifact Boundary".
# Grounded in: docker build of ./docker/Dockerfile (2026-07-30) +
# knowledge/solvers/chromatix/probes/*.py run against that image.
# This supplements, and does not replace, knowledge/solver_cards/chromatix.yaml
# (the flat routing card format used by the current registry docs).

id: chromatix
role: M_WAVE_CHROMATIX
package:
  name: chromatix
  pinned_ref: "0.6.0"
  pinned_commit: d24bdf0022835bb8ce1cdcc6aeafbc7fcb39daee
  install_source: "git+https://github.com/chromatix-team/chromatix.git@d24bdf0022835bb8ce1cdcc6aeafbc7fcb39daee"
  install_hazard: >
    The PyPI package literally named "chromatix" (0.0.1, published 2022-07-10,
    2.6 kB wheel) is an unrelated namesquat with no optics code. `pip install
    chromatix` alone silently installs the wrong package. Always install from
    the pinned git ref above.
  python_requires: ">=3.12"
official_docs: https://chromatix.readthedocs.io/en/latest/
repository: https://github.com/chromatix-team/chromatix
license: MIT
framework: jax
supported_regimes:
  - scalar angular-spectrum propagation on CPU/complex64
  - scalar angular-spectrum propagation on CUDA/complex64, with the output read
    off the array rather than asserted from the request (CHE-60, CHE-61 --
    see devices_tested and precision_verdict_che61)
  - exact FFT-bin homogeneous plane-wave propagation
  - signed paraxial focusing through an ideal thin-lens phase
  - fixed Gaussian grid/padding/determinism scaling
package_reported_unverified_regimes:
  # CHE-57 (PB6) moved most of this list into verified_by_che57_example_reproductions
  # below. What genuinely remains unverified:
  # GPU moved OUT of this list by CHE-60/CHE-61; TPU stays. See devices_tested.
  - TPU execution. jax.devices() reports no TPU on this host and none has ever
    been attempted; the package claims one and this project does not.
  - complex128 at any device. There is no complex128 path -- ScalarField.__init__
    is jnp.asarray(u, dtype=jnp.complex64) unconditionally, so a complex128 array
    handed to Field.build comes back complex64 even under jax_enable_x64=True.
    Ingested only through an explicitly recorded lossy bridge, never faked
    (docs/precision/precision_device_policy.md)
  - jax_enable_x64=True end to end (pinned False everywhere; see conventions.md)
  - thick lenses, gratings and the objective/sensor chain beyond what the examples exercise
  - reading a genuine vendor image (scikit-image is NOT installed; see failure_guide.md)
  - anything in chromatix.experimental other than modified_born_series
verified_by_che57_example_reproductions:
  # 16 repo-owned reproductions of Chromatix 101 and all 15 documented examples,
  # 205 declared checks (46 reference / 84 analytic / 75 invariant / 0
  # qualitative-only). See tutorials/README.md for the inventory, the upstream
  # claims that do NOT reproduce, and the two environment blockers.
  - "propagators: transfer_propagate, transform_propagate, transform_propagate_sas, and the rescaled/shifted asm_propagate(output_dx, shift_yx, use_czt) and transfer_propagate(output_dx, shift_yx) forms, plus bandlimit= and shift_grid"
  - "vector fields and polarization: VectorField, cf.linear, plane_wave(scalar=False), gaussian_plane_wave(amplitude, scalar=False), polarized_multislice_thick_sample -- and the (E_z, E_y, E_x) component order now ESTABLISHED BY MEASUREMENT from three entry points"
  - "chromatic fields: ChromaticScalarField via Spectrum, its (num_wavelengths, 2) dx, and the fact that density weights enter Field.intensity and NOT Field.power"
  - "z-batched propagation: a 1D z adds a leading batch axis, verified on 40- and 51-plane stacks with one jax.grad over all planes"
  - "gradients through objective_point_source -> zernike_aberrations/seidel_aberrations -> phase_change -> ff_lens -> intensity, through phase_change -> ff_lens -> transfer_propagate over 51 planes, through amplitude_change(binarize(...)) -> asm_propagate (a SURROGATE gradient through a hard threshold), and through a two-lens 4f system to a sample amplitude and phase"
  - "the elements/systems layer, verified BIT-IDENTICAL to the equivalent functional calls: OpticalSystem, PlaneWave, FFLens, BasicSensor, Optical4FSystemPSF, Microscope"
  - "utils: siemens_star, zernike_aberrations, seidel_aberrations, defocused_ramps, center_crop, sigmoid_taper, pollen_3d, filaments_3d, Field.spatial_limits/spatial_shape/extent"
  - "ops: shot_noise (key-deterministic) and binarize (hard threshold with a surrogate gradient)"
  - "chromatix.experimental.modified_born_series: the only full-wave solver in the package, validated against a closed form (axial phase gradient 12.5656 vs the analytic k0*n = 12.5664, 0.006%) with its two algorithms agreeing at a complex overlap above 0.99"
derivative:
  mode: native_autodiff
  mechanism: jax.grad through Field pytrees (Field is an equinox Module)
  verified: false
  verified_note: >
    A single directional-derivative probe (probes/gradient_probe.py) passed
    for one path (thin_lens focal length -> transform_propagate -> intensity
    sum), relative error 2.30e-05 against one centered finite-difference
    step. This is NOT the full repository gradient test required by the
    gradient-verification policy (needs multiple step sizes, a convergence table,
    and an ill-conditioned case) and does not cover asm_propagate, vector
    fields, or phase masks. Do not set verified: true from this alone.

    CHE-57 broadens the evidence considerably without changing this verdict:
    jax.grad now demonstrably flows through phase masks (65536 parameters over a
    51-plane stack), through zernike_aberrations and seidel_aberrations, through
    a two-lens 4f system to a sample's amplitude and phase, and through
    chromatix.ops.binarize via a surrogate gradient. All with finite non-zero
    gradients. None of those is a convergence study either, so verified stays
    false.
  optimizer_hazard: >
    CHE-57: two of the four Chromatix optimization examples pass a STALE optax
    state -- their update() rebinds opt_state internally but returns only
    (model, metrics), so the loop re-passes the initial Adam state every
    iteration and the moment estimates never accumulate. This is not cosmetic:
    the Seidel-fitting example reproduces its published numbers ONLY with the
    state frozen (final loss 0.784 vs 9.39 threaded). Before trusting any
    published Chromatix optimization result, check whether its update() returns
    the new state. See failure_guide.md.
devices_reported_by_package: [cpu, gpu, tpu]
devices_tested: [cpu, cuda]
dtypes_validated_for_m1: [complex64]
# CHE-61 (PB4b). dtypes_validated_for_m1 above is left as the M1-era historical
# claim. The authoritative machine-readable table is core/capabilities.py, held
# to the registry by tests/test_registry_matches_capabilities.py.
precision_verdict_che61:
  native_compute: [complex64]
  refused: [complex128]
  verdict: >-
    complex64 is not one option among several here -- it is the ONLY option, and
    complex128 does not exist. This is the FP32 floor of the whole stack:
    Optiland and both couplers reach float64/complex128, and the Chromatix leg
    does not. Asserting a float64 end-to-end pipeline would be false.
  device_note: >-
    asm_propagate runs on cuda:0 and returns complex64 on cuda:0. A cpu request
    stays on the cpu even with a GPU present -- there is no silent fallback in
    either direction (tests/test_precision_gpu_pipeline.py, marked gpu; not
    re-run since CHE-60).
  gpu_trap: >-
    XLA:GPU computes complex64 matmuls in TF32 by default. Measured on a
    256-wavelet einsum against a complex128 reference: 3.5e-04 at the JAX GPU
    default versus 2.3e-07 with precision='highest' and 2.6e-07 for NumPy
    complex64 on the host. So 'complex64 on the GPU' was 1500x less accurate
    than complex64, silently, with the array still reporting dtype=complex64.
    The fix is an explicit precision flag; see core/arrays.py
    matmul_precision_kwargs.
  source: docs/precision/precision_device_policy.md
input_output_artifacts:
  - chromatix.core.field.ScalarField (maps to project artifact `complex_field`)
known_conventions: see conventions.md
cost_scaling: "O(batch * pixels * log(pixels)) for FFT-based propagators (transform_propagate, asm_propagate)"
limitations_and_failure_modes: see failure_guide.md
validated_probe_ids:
  - >
    chromatix example reproductions c00-c15 (CHE-57 / PB6; Chromatix 101 plus all
    15 documented examples, reimplemented as repo-owned executable code with 205
    declared checks -- 46 against published upstream values, 84 analytic, 75
    invariant, 0 qualitative-only -- gated by tests/test_chromatix_tutorials.py.
    Inventory, outcome classification, unreproducible upstream claims and
    environment blockers in tutorials/README.md)
  - import_probe (passed, 2026-07-30)
  - propagation_probe (passed, 2026-07-30; not yet compared to an analytic oracle)
  - gradient_probe (passed for one narrow path, 2026-07-30)
  - m1_engine_contract (passed, 2026-08-11; exact Git commit, isolated CPU import, JAX/NumPy pins)
  - standalone_baseline (passed, 2026-08-11; CHE-14 deterministic scalar ASM baseline,
    identical summary metrics and field-array bytes across two CPU runs, plus nine
    structured failure paths that each produced a diagnostic and no field)
  - L1-WAVE-01 Case 1 (passed, 2026-08-11; exact FFT-eigenmode phase transfer, unpadded)
  - L1-WAVE-01 Case 2 (passed, 2026-08-11; signed paraxial focusing of a finite rectangular pupil)
  - L1-WAVE-01 scaling (CHE-15; fixed Gaussian 64/128/256 grids with
    automatic padding, deterministic complex-field hashes, analytic radius
    and power gates, raw timing and peak RSS evidence, with the CHE-18 scalar
    suite as a mandatory accuracy gate)
known_defective:
  - >
    high_na_ff_lens (vectorial high-NA focusing) is NOT sampling-independent.
    L1-WAVE-01 Case 3 refined only the pupil sampling with all physics fixed and
    observed the |E_z| ring radius move 246 -> 2536 nm and Iz/Ix move 0.126 ->
    0.366, against an independent Richards-Wolf oracle converged to 2e-14
    (Iz/Ix = 0.150087, ring radius 197 nm). Root cause: s_z is derived from
    field.f_grid * lambda / n instead of the pupil position grid, so s_z ~ 1 and
    the 1/cos(theta) Jacobian, the exp(i k f cos theta) defocus, and the output
    zoom_factor all degenerate. Correct in that path: cartesian_to_spherical is
    the standard Richards-Wolf aplanatic polarization transform, and
    VectorField.u component order is (E_z, E_y, E_x). No sqrt(cos theta)
    apodization is applied by the library.
  - >
    thick_plano_convex_lens is implemented through an ABCD matrix and
    ray_transfer, not a surface-resolved wave-optical prescription; it is
    deliberately not used as a wave benchmark case.
# CHE-35 (M3.6). The wave leg of the M3 slice: a real reconstructed pupil field
# propagated to focus, with the two things the adapter used to describe in prose
# replaced by measurements.
m3_pupil_to_focus:
  status: verified
  verified_by: CHE-35 (M3.6)
  probe: knowledge/solvers/chromatix/probes/m3_pupil_to_focus.py
  evidence: knowledge/solvers/chromatix/expected/m3_pupil_to_focus.json
  tests: >-
    archive/tests/gen1/tests/test_m3_pupil_to_focus.py -- ARCHIVED by CHE-67 and
    not runnable, so the phasor convention established below is no longer
    guarded by a live test. The probe and its recorded output still exist and
    still run. Unarchiving is an explicit git mv back under tests/, per
    archive/tests/gen1/README.md.
  phasor_convention:
    status: established        # was: consistent_with, argued from kernel source
    spatial_factor: exp(+i k_z z) for z > 0
    method: >-
      a converging spherical wave written under exp(-i omega t) / exp(+i k z),
      i.e. pupil field exp(-i k sqrt(rho^2 + R^2)), propagated by +R alongside its
      complex conjugate as the control. Exactly one must concentrate.
    measured:
      converging_peak_on_axis: true
      converging_over_diverging_peak_ratio: 1007.9
      analytic_airy_peak_agreement: 0.990   # against (pi a^2 / (lambda R))^2
    adapter_consequence: >-
      a mismatched input phasor is now CHROMATIX_PHASOR_MISMATCH, a structured
      refusal, not a warning. For a converging pupil field the two conventions
      differ by focusing versus defocusing.
  complex64_cast:
    status: measured           # was: a warning string
    input_cast_only_relative_field_error: 2.54e-8
    end_to_end_relative_intensity_l2:
      carrier_conditioned: 4.12e-7
      absolute_carrier: 6.05e-5
    method_note: >-
      padding held identical on both sides. The first version of this probe
      compared a padded Chromatix run against an unpadded float64 reference and
      reported 6.1e-1 for an effect predicted at 6.6e-3; the number was measuring
      padding, not dtype.
  padding:
    declared: chromatix.functional.compute_padding_transfer, explicitly, not by default
    value_for_m3_singlet_ref: 566
    cost_relative_intensity_l2: 9.58e-6
    edge_energy_is_not_the_gate: >-
      the edge-energy fraction moves by only 2x (0.036 -> 0.017) between a run
      carrying 1.4e-1 relative intensity error from wraparound and a correct one.
      Retained as a window-truncation indicator at a 0.05 reporting threshold; the
      padding decision is made against a float64 reference.
  energy_accounting:
    conserved_in_principle: >-
      the ASM transfer function is unit-modulus wherever k_z is real and this grid
      has no evanescent bins, so power over the infinite plane is conserved exactly
    measured_window_ratio: 0.63
    trap: >-
      an UNPADDED run reads 1.0000000 because wraparound recirculates the light
      that should have left the window. A ratio of 1.0 is therefore not evidence
      of correctness on this path.
    attribution: ray sampling, not propagation -- see slice_protocol ray_sampling_error

not_yet_probed:
  - >
    a second solver with an explicit time convention (an FDTD code, say) cross-checked
    against the phasor convention CHE-35 established here
  - Airy-pattern analytic comparison (listed as required in knowledge/solver_cards/chromatix.yaml, not yet done)
  # 'CPU/GPU numerical agreement (no GPU available in this environment)' was here
  # until CHE-68. CHE-61 measured it: the complex64 round trip is 8.3e-07 (L2) on
  # both host and device, i.e. no GPU penalty, against an enforced 2e-5 bound.
  - TPU execution, and therefore any CPU/TPU agreement
  - the gpu-marked suite since CHE-60. Expected to pass, not re-run; a dedicated
    ./run.sh --gpu pytest -q -m gpu pass is outstanding.
  - >
    vector field / polarization paths other than high_na_ff_lens, which was
    probed by L1-WAVE-01 Case 3 and is listed under known_defective
  - batched wavelength (chromatic) propagation
  - >
    a directional-derivative CONVERGENCE STUDY through asm_propagate. CHE-57 adds
    working gradients through transfer_propagate, ff_lens and asm_propagate (the
    DMD example), but those are forward hologram optimizations, not the
    multiple-step-size convergence table the repository gradient contract requires.
  - jax_enable_x64=True end to end
  - "reading a genuine vendor image: scikit-image is not installed, so the two examples that need skimage.data use substituted targets (see tutorials/README.md)"
adapter_location: src/solvers/chromatix/adapter.py
standalone_baseline:
  entry_point: ChromatixAdapter.run_standalone (ChromatixWaveRequest -> ChromatixWaveResult)
  command: >
    ./run.sh python knowledge/solvers/chromatix/probes/standalone_baseline.py
    --output-dir /tmp/chromatix-che14
  expected: knowledge/solvers/chromatix/expected/standalone_baseline.json
  canonical_case: >
    532 nm, n=1, Gaussian waist 10 um on a 128x128 grid at 0.5 um pitch,
    pad_width 256, propagated one Rayleigh range (590.5 um).
  observed: >
    Output 640x640 at unchanged 0.5 um pitch, power ratio 0.9999996,
    input/output edge-energy fractions ~3e-10, runtime 2.9 s cold (JIT) and
    0.06 s warm.
validation_status: analytically_validated_scalar_asm_cpu
validation_note: >
  CHE-12 verified the exact pinned CPU environment and frozen boundary
  conventions. CHE-14 froze the deterministic standalone scalar
  angular-spectrum contract. CHE-18 (benchmarks/level1/L1-WAVE-01) validated
  that path in two stages. Case 1 is exact: FFT-bin plane-wave eigenmodes
  propagated unpadded reproduce u * exp(i k_z z) to float32 round-off (3.3e-4
  rad of phase error at 2952 rad of accumulated phase), pinning the phasor
  sign, the non-paraxial dispersion relation, SI scaling, axis order, and grid
  centring with no approximation in the way. Case 2 validates signed paraxial
  focusing of a finite rectangular pupil: focus at +f*theta to 0.055 input
  pixels, FWHM to 1e-4 (x), sinc^2 sidelobe ratio to 2.6%, and overlap
  0.999999 against an independent float64 angular spectrum. Case 3 (high-NA
  vectorial) is BLOCKED -- see known_defective. CHE-15 adds fixed-Gaussian
  grid, automatic-padding, determinism, CPU runtime, and memory evidence.
  This validates scalar, monochromatic, CPU/complex64 asm_propagate only;
  aperture/Airy diffraction, vectorial focusing, chromatic propagation,
  accelerators, other kernels, and every gradient claim remain unvalidated.
