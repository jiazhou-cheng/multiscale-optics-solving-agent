  - path: benchmarks/probes/off_axis_handoff.py
    bucket: A
    justification: >-
      The silent-defect archetype: the declared pupil OPL carried 0.13% of the
      required tilt, the reconstructed wave converged 209 um off, and it converged
      CLEANLY (0.072 waves PV) so nothing downstream noticed. The missing term is
      n_object * (d0 . r_launch).
    destination: >-
      B1-RAY-OFFAXIS-OPL negative control -- omitting that term must fail
      off-axis, and must not be hidden by an on-axis case.
  - path: benchmarks/probes/psf_oracle_verification.py
    bucket: A
    justification: >-
      Runs the shipping path against two oracles and reports how far each
      perturbation moves relative to the residual it must beat. That
      perturbation-versus-residual framing is the negative-control instrument.
    destination: B3-PSF-SINGLET negative_controls and oracle wiring.
  - path: benchmarks/probes/pupil_to_focus_convergence.py
