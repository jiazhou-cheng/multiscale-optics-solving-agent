version: 0.2.0
# CHE-87: this file lists **implemented** benchmarks only.
#
# It previously also carried nine planned tasks -- four at level 1, three at
# level 2, three at level 3 -- naming components with no adapter, and in three
# cases (M_TMM_JAXLAYERLUMOS, M_PC_LEGUME, C_FIELD_TO_PSF) no registry entry
# either. A manifest that mixes "this runs" with "we would like this to run"
# cannot be used to answer either question. The intent is preserved, marked
# non-executable, in benchmarks/roadmap.md.
# The M1 exit report and its independence check describe the archived gen1
# suites (archive/benchmarks/gen1/). They are the milestone record and stand;
# they are not runnable from here.
m1_exit_report: benchmarks/reports/2026-08/ray_and_wave_baselines.md
m1_independence_check: archive/benchmarks/gen1/archive/benchmarks/gen1/benchmarks/verify_m1_independence.py
levels:
  2:
    name: two-to-three-model orchestration
    tasks:
      - id: L2-PSF-01
        title: PSF-engineered microscope
        # Amended by CHE-36 (M3.7): the graph terminates at the propagated
        # ComplexField. PSF extraction is a measurement on that terminal state,
        # not an edge, and C_FIELD_TO_PSF is no longer a registered coupler.
        # M_SENSOR_IDEAL stays out of M3 (no pixel integration, no noise model).
        graph: [M_RAY_OPTILAND, C_RAY_TO_WAVE, M_WAVE_CHROMATIX]
        terminal_measurement: psf
        protocol_id: M3-SLICE-CPU-V1
        milestone: M3
        implemented: true
        entry_point: benchmarks/physics/L2-PSF-01/run_benchmark.py
        note: >
          Closed by CHE-39 (M3.10). The blocked_by above is gone: M3.1 (CHE-30)
          and M3.4 (CHE-33) verified Optiland's opd_native sign and reference
          plane, and the sensor-side handoff itself was verified by M3.9R
          (CHE-38). What remains open is narrower than the old blocker: on the
          real traced M3-SINGLET-REF system the reconstruction is
          discretization-converged and within its declared validity region,
          but does NOT meet the frozen 1.0e-3 fft_oracle_intensity_relative_l2
          gate (CHE-47 measures 2.2e-3-2.5e-3 at 787,969 rays; a synthetic
          aberration-free bundle reaches 4.07e-4, inside the gate). See
          benchmarks/physics/L2-PSF-01/README.md and the M3 exit report.
        gate_disposition: >-
          CHE-62 re-checked this note and it STANDS UNCHANGED. The gate is still
          unmet; no tolerance is widened and nothing is promoted. CHE-48 -- the
          ticket that would have decomposed the unattributed half of the residual
          -- was marked Done with no comment, no commit and no artifact, so the
          decomposition was never performed and the ticket, not this note, was
          the thing that was wrong. CHE-48 is reopened. The 1.0e-3
          fft_oracle_intensity_relative_l2 gate is therefore carried into M4 as an
          explicit open limitation on benchmark #3, which per PB7 (CHE-58)
          finding F2 must not close it against another Optiland PSF route --
          FFTPSF and HuygensPSF share one Wavefront/OPD front end and are not two
          oracles. Full disposition:
          benchmarks/reports/2026-08/slice_cleanup_disposition.md item 3.
