# Routing-critical facts for C_GENERALIZED_SNELL (CHE-143, M2.7).
#
# Unlike C_PLANAR_DOE_STEP and C_PATCH_WFT this coupler is NOT composed from
# C_RAY_TO_WAVE / C_WAVE_TO_RAY, and it is NOT derived from the ray-wave paper
# (DOI 10.1021/acsphotonics.6c00818) either -- see source_manifest.yaml. It is
# the standard generalized Snell's law / grating equation, applied per ray with
# no field formed at all. Read this card alone; there is nothing to compose.

id: generalized_snell
role: C_GENERALIZED_SNELL
direction: ray_bundle -> ray_bundle

operation_role: diffractive_interaction
interaction:
  id: I_DIFFRACTIVE
  model: generalized_snell
  peer_models:
    - model: full_field
      pack: knowledge/couplers/planar_doe_step
      relation: >
        full_field forms one global coherent field and resamples a spectrum;
        this model forms no field at all. They agree in the smooth limit --
        measured, not assumed, in
        tests/test_diffractive_interaction.py::test_generalized_snell_agrees_with_full_field_for_a_smooth_blazed_grating
        -- and disagree once the surface splits power across more than one
        order, which full_field's spectrum shows directly and this model's
        single_order_dominance margin reports as a low fraction rather than
        silently picking one order.
    - model: local_patch
      pack: knowledge/couplers/patch_wft
      relation: >
        local_patch transforms a local window per patch/ray and can therefore
        run on any substrate curvature local_patch itself supports; this model
        also evaluates locally, per ray, but is refused outright on a conformal
        substrate (MISSING_DECLARATION) because it has no per-ray local tangent
        frame to evaluate the grating equation in, whereas local_patch's
        conformal path is the right model, just not yet implemented.
  entry_point: couplers.interaction.diffractive_interaction
  model_is_never_inferred: >
    The caller names the model, and GeneralizedSnellParameters.model must
    agree with it. The pairing is not inferred in either direction.

transformation: >
  per ray: k_t^out = n_i k0 d_t^in + m grad_t(phi)(x, y), evaluated at the
  ray's own transverse position, then k_n^out = sqrt((n_t k0)^2 - |k_t^out|^2).
  The local phase enters the outgoing OPL as m phi(x, y) / k0 -- the same order
  factor m that multiplies grad(phi), because both come from the m-th order's
  local plane-wave factor exp(i m phi); amplitude picks up
  the local amplitude transmission |t(x, y)|. No wave representation ever
  exists inside this step -- that is the entire reason it is cheap.

not_composed_from_anything: >
  This coupler has no C_RAY_TO_WAVE / C_WAVE_TO_RAY halves to defer to. Its
  entire physics and every convention below live in this one pack.

# --------------------------------------------------------------------------- #
# What is declared, and why each one is refused rather than inferred
# --------------------------------------------------------------------------- #
declared_not_inferred:
  phasor_sign:
    statement: >
      The surface phase follows the repository convention PHASOR =
      "exp(-i omega t)", and DiffractiveSurface.from_phase builds
      t = exp(+i phi) in the one place that convention is applied. A caller
      supplying exp(-i phi) directly gets a conjugated (mirrored) deflection
      that looks like a real, differently-blazed grating.
    control: tests/test_diffractive_interaction.py::test_control_a_phasor_sign_flip_conjugates_the_deflection
  diffraction_order:
    statement: >
      GeneralizedSnellParameters.order defaults to +1, visibly, not silently.
      Flipping its sign conjugates the deflection exactly as flipping the
      phasor sign does -- the two controls exist because they are easy to
      confuse and produce the same-looking wrong answer for different reasons.
    control: tests/test_diffractive_interaction.py::test_control_an_order_sign_flip_conjugates_the_deflection
  refractive_indices:
    statement: >
      n_incident and n_transmitted are declared on DiffractiveSurface and used
      directly here -- the one model of the three that uses a declared index;
      full_field and local_patch refuse anything but 1.0 at dispatch, since
      their transmission-and-transform math has no interface factor for it.

# --------------------------------------------------------------------------- #
# Validity: three predicates, signed normalized margins
# --------------------------------------------------------------------------- #
validity_conditions:
  - id: propagating_order_exists
    statement: "|k_t^out| < n_t k0. A hard limit: beyond it the requested order is evanescent."
    why_it_is_not_a_soft_limit: >
      There is no propagating direction to return. Returning one anyway would
      be a normalized nonsense vector that looks like a valid ray.
    predicate: src/verification/families/predicates.py::generalized_snell_propagating_order
    runtime_enforcement: >
      couplers/generalized_snell.py::generalized_snell_step raises
      ContractError(MODEL_NOT_APPLICABLE) naming the margin.
  - id: local_gradient_smoothness
    statement: >
      The phase change the local curvature accumulates over the declared
      transverse scale (patch_px * sample pitch) must stay under one fringe.
    why_it_is_not_a_soft_limit: >
      Below this margin the finite-difference gradient estimate itself is not
      trustworthy -- "a phase discontinuity that breaks the gradient estimate"
      is this predicate's violated state, not a separate failure mode.
    blind_spot: >
      A UNIFORMLY aliased grating (every sample wrong by the same amount) can
      read as zero curvature. A separate raw-step check inside the same margin
      function catches a step approaching the wrap boundary, but a signal
      already deep in a higher alias band can wrap back to a small-looking
      step -- arbitrary phase unwrapping is out of scope; see failure_guide.md.
    predicate: src/verification/families/predicates.py::generalized_snell_gradient_smoothness
    runtime_enforcement: >
      couplers/generalized_snell.py::generalized_snell_step raises
      ContractError(MISSING_DECLARATION) naming the margin.
  - id: single_order_dominance
    statement: >
      The fraction of local spectral power in the requested order, from a
      windowed transform of exp(i phi) over the declared patch_px.
    why_it_is_measured_not_gated: >
      This is "how smooth", the axis M2.10 (CHE-146) sweeps -- reported in
      diagnostics on every call, not refused on, because a caller who declared
      the model already accepted the reduced-order approximation and is owed
      the number, not a gate they cannot see coming.
    predicate: src/verification/families/predicates.py::generalized_snell_single_order_dominance

# --------------------------------------------------------------------------- #
# Substrate
# --------------------------------------------------------------------------- #
substrate:
  planar_only: >
    CONFORMAL is refused with MISSING_DECLARATION, always, in this delivery:
    the tangential-momentum equation needs the surface's local tangent frame,
    which is position-dependent on a curved substrate, and this model has no
    mechanism to accept one declared per ray. Not a future automatic-frame
    inference problem -- a future explicit declaration, not built here.

# --------------------------------------------------------------------------- #
# Evidence
# --------------------------------------------------------------------------- #
validation_status: characterized
validated_probe_ids:
  - tests/test_diffractive_interaction.py::test_a_linear_phase_ramp_deflects_to_the_exact_grating_angle
  - tests/test_diffractive_interaction.py::test_the_zero_phase_limit_is_ordinary_snells_law
  - tests/test_diffractive_interaction.py::test_the_zero_gradient_limit_with_equal_indices_is_undeflected_propagation
  - tests/test_diffractive_interaction.py::test_an_evanescent_requested_order_is_refused_not_returned_as_nonsense
  - tests/test_diffractive_interaction.py::test_a_local_phase_discontinuity_is_refused_and_the_refusal_is_local
  - tests/test_diffractive_interaction.py::test_generalized_snell_agrees_with_full_field_for_a_smooth_blazed_grating
  - tests/test_diffractive_interaction.py::test_generalized_snell_disagrees_outside_the_smooth_limit
devices_tested: [cpu]
invariants: [unit_direction_norm]

not_yet_probed:
  - >
    Device/dtype parity. The implementation always computes in float64 /
    complex128 plain numpy regardless of the incident bundle's own dtype or
    device -- see core/capabilities.py::C_GENERALIZED_SNELL_CAPABILITIES.
  - >
    CHE-146 (M2.10) delivered the smooth-to-diffractive sweep: family
    B1-GSL-VALIDITY (src/verification/families/b1_gsl_validity.py, driver
    benchmarks/instances/b1_gsl_validity.py), 12 instances against the
    analytic grating equation. Smooth-limit agreement holds to float64
    round-off (9-45 samples/period); the per-ray hard gate refuses at 4
    samples/period (the finite-difference stencil's own maximal-aliasing
    resonance); a genuinely discontinuous (binary) surface refuses at any
    duty cycle, since an edge's sharpness does not depend on how far apart
    the edges are. Open finding, not yet resolved: past the refusal point on
    the period axis, the smoothness margin (predicate 2) aliases back to a
    false "inside validity" reading while the answer is by then off by
    ~1.4 rad -- GENERALIZED_SNELL_SINGLE_ORDER_DOMINANCE (predicate 3) is
    what actually tracks that particular breakdown, though SI frames
    predicate 3 around multi-order/discontinuous surfaces rather than
    single-harmonic aliasing. See B1_GSL_VALIDITY.gate_disposition.note for
    the full account.
  - >
    Multi-order emission. One order per call, by construction -- a caller
    wanting several diffraction orders from the same surface calls this
    multiple times with different `order` values, and nothing here sums them.

derivative:
  mode: surrogate
  verified: false
  statement: >
    No gradient across this interaction is certified. The per-ray algebra is
    closed-form and in principle differentiable, but it runs in plain numpy,
    not an autodiff-traced array module, so no gradient claim is made.

maturity: characterized
maturity_basis: >
  `characterized`: the linear-ramp case reproduces the exact closed-form
  grating angle to round-off, the zero-phase and zero-gradient limits reduce
  to Snell's law and undeflected propagation respectively, and CHE-146
  (M2.10)'s B1-GSL-VALIDITY family now extends that to a 12-instance sweep
  over spatial frequency, duty cycle and incidence angle with a declared
  validity envelope -- matching the measured-exactness-over-many-
  configurations bar C_PLANAR_DOE_STEP and C_PATCH_WFT's `characterized`
  already meets. NOT `validated`: no gradient across this interaction is
  certified, and M2.10 explicitly declined to decide GSL "correct" on the
  strength of its FULL_FIELD comparison, which is CROSS_ROUTE evidence, not
  an independent oracle.

cost_model:
  scaling: O(rays)
  memory_scaling: O(rays)
