# L2-PSF-01, the end-to-end ray -> wave -> PSF slice.
#
# CHE-31 (M3.2) reconciled this file with what M3 actually executes. It was
# written before any of it was implemented and declared several things nothing
# in the repository does; those are now marked M4 rather than left to read as
# capability. The frozen configuration lives in benchmarks/slice_protocol.yaml
# (M3-SLICE-CPU-V1) and is the source of truth for the numbers below.
#
# Executes in M3:  M_RAY_OPTILAND -> C_RAY_TO_WAVE -> M_WAVE_CHROMATIX
#                  then a PSF MEASUREMENT on the terminal field, outside the graph
# Deferred to M4:  every gradient, and the reference-sphere pupil variant.
schema_version: 0.1.0
task_id: L2-PSF-01
nodes:
  - id: lens
    model: M_RAY_OPTILAND
    config:
      wavelength_m: 5.5e-7
      # Hexapolar DENSITY request, not an output ray count -- Optiland returns
      # the survivor count, which is what the protocol's ray criterion applies
      # to. Tested by CHE-38 rather than assumed.
      pupil_samples: 256
  - id: wave
    model: M_WAVE_CHROMATIX
    config:
      propagation: angular_spectrum
      # Pupil-to-focus distance of M3-SINGLET-REF: image_plane_z - exit_pupil_z.
      # Corrected by CHE-33 (amendment A2) from the back focal length, which sits
      # 0.1319 mm short because the exit pupil is not at the rear vertex; that
      # offset is 0.311 waves of defocus at this NA.
      z_m: 4.837461300309598e-3
edges:
  - id: pupil_reconstruction
    coupler: C_RAY_TO_WAVE
    source:
      node: lens
      # CHE-34 (M3.5): was the `wavefront` port. C_RAY_TO_WAVE sums plane
      # WAVELETS, so it needs a direction per sample, and wavefront_samples
      # carries pupil coordinates only. The edge validated before only because
      # producer and consumer both declared metadata neither writes.
      port: rays
    target:
      node: wave
      port: input_field
    config:
      # A PLANE, read from optic.paraxial.XPL()/XPD(). The earlier
      # `reference_sphere: exit_pupil` here was aspirational: C_RAY_TO_WAVE
      # accumulates plane wavelets onto a plane, and nothing in this repository
      # implements a reference-sphere pupil. That variant is M4 scope.
      #
      # These two keys are the DECLARATION the coupler refuses to default
      # (CHE-33, CHE-34): stating the handoff plane is what promotes Optiland's
      # absolute opd into an optical path length with a reference. Without them
      # the edge fails with OPL_REFERENCE_UNVERIFIED rather than reconstructing
      # a plausible field.
      handoff_plane: exit_pupil
      handoff_plane_z_m: 6.814345991561233e-05
      target_sample_pitch_m: 2.6587352810843895e-06
      grid_n: 188
      projection: asm_consistent
# The graph ends here, at the wave node's output field, and that is now a
# statement about physics rather than a workaround (CHE-36, M3.7).
#
# M3.2 read the missing final step as a graph-model constraint: every edge needs
# a target NODE, the only registered consumer of a `psf` artifact was
# M_SENSOR_IDEAL, and M3 excludes it, so a terminal coupler had nothing to point
# at. The better reading is that there was no edge to place. A coupler performs a
# physically meaningful change of representation -- C_RAY_TO_WAVE turns rays into
# a field and carries real assumptions about OPL, phase sign, amplitude and
# handoff plane, which is why it can refuse. `ComplexField -> |U|^2` changes no
# representation; it is a MEASUREMENT of the terminal simulated field.
#
# So C_FIELD_TO_PSF was removed from the registry, and PSF extraction lives in
# src/verification/psf_measurement.py, run by the benchmark
# driver on this node's output_field and recorded in provenance. No sink node was
# added and M_SENSOR_IDEAL is still out of scope.
design_variables: []
# M4 scope, not M3. Kept here as a comment rather than as a declaration,
# because a declared design variable with requires_gradient reads as a
# capability claim and no gradient through either coupler is verified:
# derivative.verified is false for both, asserted by a test.
#
#  - name: asphere_coefficient
#    node: lens
#    parameter: surfaces[2].asphere.a4
#    bounds: [-0.01, 0.01]
#    requires_gradient: true
objectives:
  - name: focal_peak
    node: wave
    port: output_field
    metric: normalized_peak_intensity
    requires_gradient: false
verification:
  - id: pupil_power
    kind: conservation
    target: pupil_reconstruction
    tolerance: 0.001
# M4 scope: needs a custom derivative across the PyTorch -> JAX boundary plus a
# directional finite-difference test before it can be asserted.
#
#  - id: directional_gradient
#    kind: directional_derivative
#    target: asphere_coefficient
#    tolerance: 0.01
require_verified_gradients: false
allow_cycles: false
metadata:
  description: >-
    End-to-end forward slice: real Optiland trace, coherent reconstruction at the
    declared exit pupil, M1-verified Chromatix angular-spectrum propagation to
    focus, normalized PSF. Forward-only in M3.
  protocol_id: M3-SLICE-CPU-V1
  protocol_path: benchmarks/slice_protocol.yaml
  m3_issue: CHE-31
