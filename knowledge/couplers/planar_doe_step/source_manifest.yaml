# Per-source provenance for the C_PLANAR_DOE_STEP knowledge pack.
# Provenance follows AGENTS.md "Sources of Truth".
#
# This pack is deliberately thin on external sources, because the coupler is
# COMPOSED: the accumulation kernel's provenance is
# knowledge/couplers/ray_to_wave/source_manifest.yaml and the resampling
# estimator's is knowledge/couplers/wave_to_ray/source_manifest.yaml. Both bind
# here unchanged and are not duplicated. What is recorded below is only what the
# composition itself is taken from.

sources:
  - url: https://doi.org/10.1021/acsphotonics.6c00818
    source_type: supporting_information
    citation: >
      Cheng, J.; Gao, M.; Shao, Y.; Mao, C.; Milster, T. D.; Fan, J. A.
      A Differentiable Ray-Wave Framework for Hybrid Refractive-Diffractive
      System Modeling and Optimization. ACS Photonics 2026.
    retrieved_at: "2026-08-12"
    usage_note: >
      S4 (Algorithm S1) is this coupler in full: the
      accumulate-transmit-FFT-resample cascade that bounds ray count across
      planar DOEs. The equations for the two halves come from the paper's main
      text eq 2 and SI S2 respectively and are recorded in those packs' own
      manifests. The paper is retrievable from the DOI;
      knowledge/papers/raywave_tracing/README.md records why no PDF is stored.

  - url: https://github.com/jiazhou-cheng/raywave-tracing
    source_type: reference_implementation
    vendored: false
    pinned: false
    executed_by_this_repository: false
    read_at: "2026-08-14"
    read_scope:
      - primary_position_sampling_option_inventory
    read_files:
      - deeplens/raywave.py
    usage_note: >
      This implementation is never executed and never vendored here. Read only
      for the option inventory -- that a uniform-on-grid primary sampling exists
      as a choice. The equations come from the paper. The status of the uniform-primary /
      magnitude-secondary asymmetry is recorded in src/registry/couplers.yaml,
      which is the source of truth for it and is under active revision by
      CHE-120; this pack points there rather than freezing a copy.

# Evidence produced by this repository, not by any source above.
internal_evidence:
  - tests/test_planar_doe_step.py
  - tests/test_coupler_round_trip.py
  - benchmarks/probes/records/planar_doe_step_device.json
  - src/verification/claim_ledger.py
