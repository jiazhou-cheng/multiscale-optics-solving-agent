schema_version: 1
protocol_id: M3-SLICE-CPU-V1
extends: M2-COUPLER-CPU-V1
amendments:
  - id: A1-carrier-conditioned-propagation
    issue: CHE-40 (M3.2A)
    supersedes: >-
      the M3.2 finding that the optical system's absolute SIZE is a binding
      numerical constraint
    summary: >-
      M3.2's measured error was real but its cause was misattributed. The ASM
      transfer function factors exactly as exp(i k z) * exp(i z (k_z - k)), and
      the first factor is a global piston that contributes nothing to a single-
      path PSF. Evaluating only the second factor -- through the exact identity
      k_z - k = -(k_x^2+k_y^2)/(k_z+k), not a paraxial expansion -- drops the
      piston-aligned field error at 47 mm from 1.2e-2 to 6.5e-6 and the intensity
      error from 8.2e-3 to 3.9e-6, with the prescription, NA, grid, oracle, and
      input field all unchanged. Absolute optical-system scale is therefore NOT a
      binding constraint on a carrier-conditioned path.
    evidence: outputs/M3/carrier-phase/result.json
    probe: benchmarks/probes/m3_carrier_phase.py
  - id: A2-singlet-pupil-to-focus-distance
    issue: CHE-33 (M3.4)
    supersedes: >-
      M3-SINGLET-REF.derived.propagation_distance_mm = 4.705604760225210
    summary: >-
      The pupil-to-focus distance the wave leg must propagate is
      image_plane_z_mm - exit_pupil_z_mm. For M3-REVERSE-TELEPHOTO the frozen
      value satisfies that exactly (3.054578897851833). For M3-SINGLET-REF the
      frozen value was the BACK FOCAL LENGTH, 4.705604760225210, while the
      exit-pupil-to-image distance is 4.837461300309598 -- the two differ because
      the exit pupil sits 0.068 mm behind the rear vertex, not at it. The gap is
      0.1319 mm.
    why_it_matters: >-
      0.1319 mm of the wrong propagation distance is rho^2/2 * (1/R_wrong -
      1/R_true) = 0.311 waves of defocus at this NA -- 18x the system's own
      0.017-wave residual aberration and 300x the tightest gate in the tolerance
      budget. It would have been charged to the slice rather than to the number.
    found_by: >-
      CHE-33's analytic oracle. A diffraction-limited system delivers equal
      optical path to its focus, so the declared pupil OPL must equal
      R - sqrt(rho^2 + R^2). At R = 4.7056 mm the residual is 0.311 waves; at
      R = 4.8375 mm it is 0.016999 waves, which independently reproduces this
      protocol's own frozen 0.016996 and Optiland's own Wavefront value of
      0.016999.
    correction: >-
      propagation_distance_mm for M3-SINGLET-REF is 4.837461300309598. The
      superseded value is retained below as propagation_distance_mm_superseded.
      Every other derived number for that system is unaffected: efl, bfl, NA,
      exit-pupil location and diameter, and the image plane z were all measured
      independently and all still agree with the trace.
    evidence: knowledge/couplers/ray_to_wave/expected/coherent_handoff.json
    probe: knowledge/couplers/ray_to_wave/probes/coherent_handoff.py
  - id: A3-off-axis-opl-reference-is-the-incoming-wavefront
    issue: CHE-41
    supersedes: >-
      C_RAY_TO_WAVE opl_reference v1 (CHE-33), which measured the declared pupil
      optical path from Optiland's ray launch state and named that state's surface
      "the launch plane" while using it as a wavefront
    summary: >-
      The declared off-axis OPL reference is now the PLANE WAVEFRONT OF THE
      INCOMING COLLIMATED BUNDLE, stated as a choice rather than defaulted into.
      Optiland launches every ray of an infinite-object trace on one plane
      PERPENDICULAR TO Z (measured: z spread exactly 0 across 3169 rays, direction
      spread 2.8e-17), which is a wavefront only for a bundle travelling along z.
      The two surfaces differ by n_object * (d0 . r_launch) -- a constant on axis,
      linear in the launch coordinate off it. The ray adapter now exports that term
      per ray and the coupler adds it; when the term is constant across the bundle
      it is NOT added, so every on-axis declared OPL is bit-identical to v1's
      rather than one rounding away from it.
    the_alternative_and_why_not: >-
      an explicit chief-ray-referenced frame with the observation window centred on
      the chief ray. Rejected for four reasons, none of them about convenience.
      (1) It makes the coupler's output frame field-dependent, where the wavefront
      is a physical surface the incoming bundle defines identically at every field.
      (2) It makes the oracle circular: under a chief-ray-centred window the PSF
      lands at the window centre by declaration, so "the PSF lands at the traced
      chief-ray intersection" stops being falsifiable. (3) Its correct form
      requires a reference sphere aimed at a chosen image point; its approximate
      form -- subtract a least-squares linear ramp -- is what reported this system
      at 1.0 waves RMS in M3.8 before a geometric spot check caught it, so the
      right and wrong implementations differ by a term shaped exactly like the
      aberration the slice measures. (4) It is the less general choice: a chief-ray
      frame can be built on top of a wavefront-referenced OPL by subtracting the
      exact sphere aimed at the chief-ray intersection, while the reverse needs
      object-space data the exit-pupil export does not carry.
    cost_accepted: >-
      the pupil field carries the tilt, so it must be sampled:
      pitch <= lambda / (2 max|transverse direction cosine|). Measured over real
      marginal rays on M3-REVERSE-TELEPHOTO, the frozen pitch of 1.8258e-06 m is
      50.0% / 72.5% / 94.6% / 105.5% / 116.4% / 158.7% / 257.5% of the admissible
      pitch at Hy = 0 / 0.1 / 0.2 / 0.25 / 0.3 / 0.5 / 1.0. The frozen grid
      therefore admits a tilt-carrying pupil out to Hy ~ 0.25 and needs 2.58x
      refinement at full field. A chief-ray-referenced frame would not sample the
      tilt and would not pay this; that removes the constraint from the numerics,
      not from the physics.
    verification: >-
      a geometric oracle that shares nothing with the reconstruction. On
      M3-REVERSE-TELEPHOTO at Hy = 0.2 the measured PSF peak lands at pixel
      (114, 0) against a traced chief-ray intersection at 114.42 pixels -- 0.42 px
      = 0.17 Airy radii, below the one-pixel quantization of a peak index -- and
      the fitted reference sphere's centre lands 0.57 um from that intersection
      against 209.92 um under v1, an improvement of 367x. The pupil wavefront
      against the traced chief-ray point falls from 57.01 to 0.0442 waves
      peak-to-valley, and an independent reference-sphere-free measure agrees: the
      geometric RMS ray radius about that point is 0.082 Airy radii (max 0.105).
      Removing the term through the shipping code's own perturbation hook moves the
      PSF back by 115 pixels.
    evidence:
      - benchmarks/probes/records/m3_off_axis_handoff.json
      - knowledge/solvers/optiland/expected/off_axis_opd_reference.json
    probe:
      - benchmarks/probes/m3_off_axis_handoff.py
      - knowledge/solvers/optiland/probes/off_axis_opd_reference.py
scope:
  benchmark_ids: [L2-PSF-01]
  execution: end_to_end_graph
  # Amended by CHE-36 (M3.7). The graph terminates at the propagated
  # ComplexField, which is the last physical state the slice evolves. PSF
  # extraction is a MEASUREMENT on that terminal state, run by the benchmark
  # driver after the graph and recorded in provenance -- deliberately not an
  # edge. C_FIELD_TO_PSF was removed from the registry: `ComplexField -> |U|^2`
  # changes no representation, so it is an observable, not a coupler.
  graph: [M_RAY_OPTILAND, C_RAY_TO_WAVE, M_WAVE_CHROMATIX]
  terminal_state: complex_field
  terminal_measurement:
    kind: observable
    quantity: psf
    implementation: src/multiscale_optics_agent/evaluation/psf_measurement.py
    is_a_graph_edge: false
  # M2 forbade engine imports in the coupler *core* and that rule is inherited
  # unchanged. M3 is an end-to-end slice, so the benchmark driver necessarily
  # imports both engines; the constraint is that they never reach the core.
  forbidden_import_prefixes:
    coupler_core: [optiland, chromatix]
  excluded_from_scope:
    - M_SENSOR_IDEAL          # no pixel integration or noise model in M3
    - C_WAVE_TO_RAY           # the slice is one-directional
    - any gradient claim      # forward-only; deferred to M4
  rationale: >-
    M2 verified both coupler directions against analytic oracles while
    deliberately never touching a real engine. M3 closes that gap: a real
    Optiland trace, reconstructed at a declared exit pupil, propagated by the
    M1-verified Chromatix ASM, and measured as a normalized PSF -- where the
    measurement is an observable taken on the terminal field, not a fourth graph
    step (CHE-36).

execution:
  entrypoint: ./run.sh
  device: cpu
  dtype_coupler: complex128
  dtype_wave_engine: complex64      # forced by Chromatix; see tolerance_budget
  wavelength_m: 5.5e-7
  seed: 20260812
  # Inherited from M2-COUPLER-CPU-V1 unless restated.

# ---------------------------------------------------------------------------
# Handoff plane
# ---------------------------------------------------------------------------
handoff_plane:
  name: exit_pupil
  source: optic.paraxial.XPL() and optic.paraxial.XPD()
  constructed: false
  rationale: >-
    Optiland exposes exit pupil location and diameter directly, so the plane is
    read from the system rather than constructed. Rays travel in air after the
    last surface, so projecting each ray from the image plane to the pupil plane
    along its own direction is exact, not an approximation.
  is_a_plane_not_a_sphere: true
  plane_not_sphere_note: >-
    C_RAY_TO_WAVE accumulates plane wavelets onto a PLANE. The
    `reference_sphere: exit_pupil` in examples/graphs/ray_to_wave.yaml was
    aspirational text that nothing implements; it is marked as M4 scope there.
  propagation_target: paraxial focus / image plane
  propagation_method: angular_spectrum   # the M1-verified ASM, unchanged

# ---------------------------------------------------------------------------
# Required numerical conditioning (CHE-40, M3.2A)
# ---------------------------------------------------------------------------
# Both entries are the same rule applied on the two sides of the coupler: form
# phase from a DIFFERENCE against a declared reference, never from an absolute
# accumulated quantity. On the wave side the absolute quantity is k z; on the ray
# side it is Optiland's accumulated OPL. Neither is wrong physically; both are
# unrepresentable at the precision the rest of the budget assumes.
required_conditioning:
  wave_side:
    rule: >-
      phase-insensitive M3 PSF paths MUST propagate with the common carrier phase
      removed: H = exp(i z (k_z - k)), evaluated through the exact identity
      k_z - k = -(k_x^2 + k_y^2)/(k_z + k)
    is_not: a paraxial approximation -- no term is dropped
    implementation: ASM-CARRIER-REMOVED-V1
    module: src/multiscale_optics_agent/adapters/chromatix_carrier_removed.py
    global_phase_policy: retained_as_metadata_not_reapplied
    global_phase_policy_detail: >-
      the removed exp(i k z) is recorded in float64 on the result and is never
      folded back into the complex64 field, because reapplying it there would
      reintroduce exactly the rounding it was removed to avoid. A consumer
      needing absolute optical phase calls reconstruct_absolute_phase; a consumer
      needing intensity or single-path relative phase needs nothing. No consumer
      may read absolute optical phase off the propagated field.
    caller_must_supply_wavelength: >-
      chromatix Field.spectrum is float32, so a carrier phase derived from the
      field is good only to ~3e-8 relative -- about 0.02 rad at 47 mm. Pass the
      float64 wavelength explicitly whenever absolute phase will be reconstructed.
    evidence: outputs/M3/carrier-phase/result.json
    regression_tests: tests/test_carrier_removed_asm.py
  ray_side:
    rule: >-
      coherent phase MUST be formed as phi_i = (2*pi/lambda) * (OPL_i - OPL_ref),
      never directly from absolute accumulated OPL
    reason: >-
      the same conditioning failure as the wave side. CHE-30 established that
      RealRays.opd is absolute accumulated optical path from the ray launch
      state, so at a few tens of millimetres it is ~1e5 waves; forming phase from
      it directly spends the whole float budget on a piston that the PSF cannot
      see.
    owner: M3.4 (CHE-33)
    owns_the_details: >-
      the choice of OPL_ref, the sign convention, and global-phase provenance
      belong to the M3.4 contract; this protocol fixes only that a reference
      subtraction must happen before phase is formed
    status: implemented
    implementation: src/multiscale_optics_agent/couplers/optiland_handoff.py
    implemented_by: CHE-33 (M3.4)
    opl_reference_chosen: >-
      the traced chief ray -- the surviving ray of smallest pupil radius -- with
      sign 'ray minus chief', matching the evaluator convention L1-RAY-01 already
      declared. Because the reference comes from the same trace, CHE-30's
      aperture-dependent launch-plane zero is common to every ray and cancels
      exactly, so the declared OPL is invariant under the one thing that made the
      absolute value meaningless.
    global_phase_policy: retained_as_metadata_not_reapplied
    measured_piston_removed_waves:
      M3-SINGLET-REF: 1218.5651099327156
      M3-REVERSE-TELEPHOTO: 5467.9789054454195
    measured_signal_retained_waves:
      M3-SINGLET-REF: 11.734374712240074
      M3-REVERSE-TELEPHOTO: 15.801773246826363
    known_consequence: >-
      no per-ray area weight is applied, so the reconstructed field amplitude
      scales with ray density. The PSF is convergent in shape but not in scale
      under ray refinement. Recorded rather than hidden; CHE-38 owns it.
    evidence: knowledge/couplers/ray_to_wave/expected/coherent_handoff.json
    regression_tests: tests/test_optiland_coherent_handoff.py

# ---------------------------------------------------------------------------
# Systems
# ---------------------------------------------------------------------------
systems:
  - id: M3-SINGLET-REF
    role: primary_verification_vehicle
    description: >-
      Plano-convex singlet, convex toward the collimated side, built from real
      refractive surfaces, scaled to 1/10 of a 25 mm-radius prescription. Admits
      an analytic Airy oracle.
    scale_status:
      value: safe_fallback_configuration
      amended_by: CHE-40 (M3.2A)
      was: >-
        a required architecture constraint -- M3.2 scaled the prescription to
        keep the pupil-to-focus distance inside the regime where Chromatix's
        float32 cast is not the dominant error
      now: >-
        a cost choice. CHE-40 showed the distance limit was representational, so
        the 1/10 scaling is no longer load-bearing for accuracy. It is kept
        because at 188^2 it is ~120x cheaper than the unscaled system for the
        same physics, and because it is already frozen and verified.
      what_would_change_it: >-
        a ticket that needs a macroscopic system may take the unscaled variant
        under feasibility.rejected_configuration, which is now admissible, and
        pay the grid cost. It may not take it on an unconditioned path.
    construction:
      surface_type: standard        # NOT "paraxial" -- see inadmissible_sources
      refractive_index: 1.5168      # IdealMaterial, so no glass catalog dependency
      radius_mm: 2.5
      center_thickness_mm: 0.2
      stop: surface 1
    derived:
      efl_mm: 4.837461300309598
      bfl_mm: 4.70560476022521
      f_number: 9.7
      semi_aperture_mm: 0.2494
      numerical_aperture: 0.05171631827291936
      exit_pupil_z_mm: 0.06814345991561233
      exit_pupil_diameter_mm: 0.4987073505473812
      image_plane_z_mm: 4.90560476022521
      # Amended by CHE-33 (A2): image_plane_z_mm - exit_pupil_z_mm, which is what
      # the wave leg propagates. The superseded value was the back focal length.
      propagation_distance_mm: 4.837461300309598
      propagation_distance_mm_superseded: 4.70560476022521
      propagation_distance_superseded_by: CHE-33 (M3.4), amendment A2
    diffraction_limited_evidence:
      criterion: Rayleigh quarter wave, peak-to-valley
      peak_to_valley_waves: 0.01699595356250618
      rms_waves: 0.004794729150396517
      marechal_strehl_estimate: 0.9990928255075161
      method: >-
        optical path to a reference sphere centred on the nominal focus, not to
        the image plane, so plane-versus-sphere geometry is not mistaken for
        aberration
    airy_radius_um: 12.974628171691823
  - id: M3-REVERSE-TELEPHOTO
    role: real_aberrated_case
    description: >-
      The bundled Optiland sample already validated in M1 (L1-RAY-01). No
      analytic oracle exists for it, so it is verified against the independent
      FFT/Fraunhofer PSF built from the same traced OPD map.
    derived:
      numerical_aperture: 0.07530880176185195
      exit_pupil_z_mm: 2.1547825721481666
      exit_pupil_diameter_mm: 0.46053493637581633
      image_plane_z_mm: 5.209361469999999
      propagation_distance_mm: 3.0545788978518327
    analytic_oracle_available: false
    analytic_oracle_absent_because: >-
      a real multi-surface objective is not aberration-free, so an Airy pattern
      is not its expected PSF; only an independent implementation over the same
      wavefront can bound it

# ---------------------------------------------------------------------------
# Sampling
# ---------------------------------------------------------------------------
sampling:
  # The limit is PER AXIS. M2 fixed this after CHE-24 tested the direction norm:
  # a diagonal FFT bin has |d| = sqrt(2)*lambda/(2*pitch) yet is exactly
  # representable, so a norm test both over- and under-constrains.
  nyquist_rule: pitch_axis <= wavelength / (2 * max_over_rays(abs(direction_cosine_axis)))
  nyquist_evaluated_over: marginal rays of an actual trace, not a paraxial estimate
  oversampling_factor: 2
  oversampling_rationale: >-
    At the critically admissible pitch the Airy radius spans only ~2.44 pixels,
    which is enough to locate a peak and a first null but not to compare a
    profile. At 2x it spans ~4.9 pixels.
  grids:
    M3-SINGLET-REF:
      nyquist_pitch_max_m: 5.317470562168779e-06
      sample_pitch_m: 2.6587352810843895e-06
      pupil_extent_m: 0.000499568295573393
      grid_n: 188
      airy_radius_in_pixels: 4.88
    M3-REVERSE-TELEPHOTO:
      nyquist_pitch_max_m: 3.651631596391999e-06
      sample_pitch_m: 1.8258157981959995e-06
      pupil_extent_m: 0.0004619720213998758
      grid_n: 254
  ray_count_criterion:
    rule: >-
      at least one traced ray per Nyquist cell of the pupil field, i.e.
      ray_count >= (pupil_extent / sample_pitch)^2 / oversampling^2, evaluated
      as a starting point and then tested rather than assumed
    starting_value: 4096
    tested_by: M3.9 (CHE-38) convergence study
    note: >-
      Optiland's `num_rays` is a hexapolar density request, not an output count;
      the traced survivor count is what this criterion applies to.

# ---------------------------------------------------------------------------
# Tolerance budget
# ---------------------------------------------------------------------------
# Derived from named error sources, each with a measurement or a citation. Not
# read off a passing run: M3.8 tests against these numbers, so setting them from
# observed output would make the comparison circular.
tolerance_budget:
  terms:
    - name: coupler_float64_roundoff
      value: 1.0e-12
      level: field, relative
      source: >-
        M2 measured 7.82e-14 max abs error on the plane-wave analytic oracle at
        16x16; the bound scales with accumulated phase over the output grid and
        with ray count, so 1e-12 is a headroom-carrying restatement
      dominates: nothing at this grid size
    # Amended by CHE-40 (M3.2A). M3.2's 3.5e-4 / 3.4e-3 pair was correct for the
    # absolute-phase path and is retained below as the fallback. On the
    # carrier-conditioned path now required by this protocol, the phase the
    # transfer function must represent is max|z(k_z - k)| rather than k z, and the
    # budget is derived from that instead.
    - name: chromatix_complex64_truncation
      value: 1.0e-4
      level: intensity, relative
      applies_to_path: carrier_conditioned
      source: >-
        eps32 * max|z(k_z - k)| evaluated on each system's own grid: 6.89e-5 for
        M3-SINGLET-REF and 9.55e-5 for M3-REVERSE-TELEPHOTO, so 1.0e-4 covers
        both. Derived from the represented phase, not read off a run -- the
        measured errors in outputs/M3/carrier-phase/result.json sit 20-50x below
        this bound, and M3.8 tests against the bound.
      levels:
        absolute_field_phase:
          value: null
          status: not_preserved_by_the_required_path
          note: >-
            the carrier-conditioned path discards exp(i k z) as an explicit
            global piston. A consumer that needs absolute optical phase must
            reconstruct it in float64 from the recorded carrier; it may not read
            it off the complex64 field.
          cost_if_taken_from_the_absolute_path: 6.4e-3
          cost_source: eps32 * k z at M3-SINGLET-REF's 4.706 mm
        piston_aligned_field:
          value: 1.0e-4
          source: eps32 * max|z(k_z - k)|, worst of the two systems
          note: >-
            this is the field-level metric that means something once the carrier
            is gone: it measures spatially varying wavefront error, which is what
            a PSF is actually made of.
        intensity:
          value: 1.0e-4
          source: >-
            bounded AT the piston-aligned field term rather than at a tenth of
            it. M3.2's 10x field-to-intensity gap came from the common piston
            cancelling under squaring; the conditioned path has already removed
            that piston, so the remaining per-bin error does not cancel and the
            gap does not carry over.
      superseded_absolute_phase_path:
        intensity: 3.5e-4
        field: 3.4e-3
        source: >-
          M3.2, measured against the same float64 reference at each system's own
          distance and NA. Still the correct budget for any path that propagates
          the absolute carrier, which is why it is kept rather than deleted.
        independent_agreement: >-
          M1 declared 3.00e-04 for this engine from 5*eps32 per radian, derived
          independently of that measurement
      dominates: the numerical budget
    - name: reference_system_residual_aberration
      value: 9.1e-4
      level: Strehl deficit
      source: measured, 1 - 0.9990928 for M3-SINGLET-REF
      applies_to: the Airy comparison only
      is_an_error: false
      note: >-
        a physical property of a real singlet, not a defect. It must appear in
        the Airy tolerance because Airy is the perfect-lens limit, and it must
        NOT appear in the FFT-oracle tolerance because that oracle shares the
        same wavefront.
    - name: ray_sampling_error
      value: null
      level: intensity, relative
      status: to_be_measured
      owner: M3.9 (CHE-38)
      # CHE-35 did not measure this term, but its energy accounting located it and
      # the finding is large enough that CHE-38 should not meet it cold.
      che35_finding: >-
        the reconstructed pupil field is nowhere near ray-converged at the counts
        tried. Propagated to focus on the frozen grid with the declared padding,
        the fraction of retained intensity landing within three Airy radii of the
        axis is 0.043 / 0.166 / 0.388 at 217 / 817 / 1801 traced rays, with the
        geometry untouched, while the coupler's own max adjacent-ray phase step
        falls 2.53 / 0.63 / 0.28 rad. The protocol's 4096-ray starting value has
        not been reached and the trend has not flattened.
      che35_caution: >-
        the coupler's ray_density_status reports wavelet_approximation_holds at
        all three counts, because its criterion is a phase step below pi. That
        criterion is satisfied long before the reconstruction is accurate, so it
        must not be read as a convergence certificate.
    - name: grid_truncation_and_padding
      value: 2.0e-5
      level: intensity, relative
      status: measured
      measured_by: CHE-35 (M3.6)
      owner: M3.6 (CHE-35)
      diagnostic: >-
        NOT edge_energy_fraction. CHE-35 measured that fraction moving by only 2x
        (0.036 -> 0.017) between a run carrying 1.4e-1 relative intensity error
        from wraparound and a correctly padded one, so it cannot certify padding.
        It is retained as a window-truncation indicator with a 0.05 reporting
        threshold, and the padding decision is made against a float64 reference
        instead.
      decision: >-
        pad_width is chromatix.functional.compute_padding_transfer's own value,
        566 for M3-SINGLET-REF at the frozen grid, declared explicitly rather than
        left to a default.
      source: >-
        measured 9.58e-6 relative intensity L2 against the same float64
        angular-spectrum reference run at twice that padding, with dtype held
        constant on both sides. 2.0e-5 carries the next sweep term's worth of
        headroom, because the reference at 2x is itself still converging as ~1/pad.
      sweep:
        # pad_width -> relative intensity L2 against pad_width = 1132
        0: 1.39e-1
        94: 7.04e-4
        188: 8.27e-5
        283: 4.00e-5
        566: 9.58e-6
      why_not_half: >-
        pad_width = 94 agrees with 566 to 0.06% on edge-energy fraction and 0.01%
        on peak intensity, and is 73x worse at the intensity level. The cheap
        indicators do not see it.
      evidence: knowledge/solvers/chromatix/expected/m3_pupil_to_focus.json
  gates:
    airy_peak_intensity_relative:
      value: 2.0e-3
      composition: 9.1e-4 residual aberration + 3.5e-4 float32 + margin
      applies_to: [M3-SINGLET-REF]
    fft_oracle_intensity_relative_l2:
      value: 1.0e-3
      composition: >-
        1.0e-4 carrier-conditioned complex64 + margin; no aberration term,
        because the oracle is built from the same wavefront
      not_tightened_because: >-
        CHE-40 cut the complex64 term from 3.5e-4 to 1.0e-4, but ray_sampling_error
        and grid_truncation_and_padding are still unmeasured and must fit inside
        this same gate. Tightening it now would be setting a tolerance against
        terms nobody has measured yet.
      applies_to: [M3-SINGLET-REF, M3-REVERSE-TELEPHOTO]
    energy_accounting_unexplained_residual:
      value: 1.0e-3
      rule: >-
        every loss between traced ray power and PSF integral must be attributed
        to a named mechanism; this bounds the UNATTRIBUTED remainder, not the
        total loss
  no_gate_may_be_satisfied_by_widening: true
  widening_rule: >-
    A gate that fails is a finding to diagnose and report. M2 exited with no
    gate satisfied by loosening a tolerance; M3 inherits that rule.

