[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiscale-optics-agent"
version = "0.1.0"
description = "Typed model-coupler graphs for verified multi-scale optical simulation and inverse design"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Research scaffold" }
]
dependencies = [
  "networkx>=3.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0.12",
]
jax = [
  "jax>=0.6.2",
  "optax>=0.2.8",
  "equinox>=0.13.8",
  "optimistix>=0.0.11",
  "jaxtyping>=0.3.7",
]
wave = [
  "jax>=0.6.2",
  "optax>=0.2.8",
  "equinox>=0.13.8",
  "optimistix>=0.0.11",
  "jaxtyping>=0.3.7",
  "chromatix @ git+https://github.com/chromatix-team/chromatix.git@d24bdf0022835bb8ce1cdcc6aeafbc7fcb39daee",
  "fmmax>=1.7.1",
  # Declared by CHE-37 (M3.8). evaluation/psf_oracles.py needs scipy.special.j1
  # for the analytic Airy pattern. It was already present transitively -- jax,
  # chromatix and optiland each require it, and docker/requirements.txt pins
  # 1.15.3 -- but a verification oracle should not rest on a dependency this
  # project never declared.
  "scipy>=1.10",
]
em = [
  "jax>=0.6.2",
  "optax>=0.2.8",
  "equinox>=0.13.8",
  "optimistix>=0.0.11",
  "jaxtyping>=0.3.7",
  "fdtdx>=0.6.2",
]
torch = [
  "torch>=2.13.0",
  "optiland>=0.6.0",
]
circuit = [
  "jax>=0.6.2",
  "optax>=0.2.8",
  "equinox>=0.13.8",
  "optimistix>=0.0.11",
  "jaxtyping>=0.3.7",
  "sax>=0.18.2",
]

[project.scripts]
multiscale-optics = "multiscale_optics_agent.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"multiscale_optics_agent.registry" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "jax: requires the optional JAX solver environment",
  "torch: requires the optional PyTorch solver environment",
  "integration: exercises an external physics solver",
  "optiland: exercises the real Optiland ray-tracing engine (current-milestone ray model)",
  "chromatix: exercises the real Chromatix wave-propagation engine (current-milestone wave model)",
  "coupler: exercises C_RAY_TO_WAVE / C_WAVE_TO_RAY coupler physics or protocol",
  "fmmax: exercises the FMMAX RCWA adapter (out of current milestone scope, see AGENTS.md)",
  "fdtdx: exercises the FDTDX EM adapter (out of current milestone scope, see AGENTS.md)",
  "sax: exercises the SAX photonic-circuit adapter (out of current milestone scope, see AGENTS.md)",
  "benchmark: full-scale Level-1/Level-2 milestone benchmark bundle reproduction",
  "slow: individually expensive numerical characterization or convergence test",
  "tutorial: reproduces an upstream third-party tutorial; a regression gate on the PINNED dependency, not a test of this repository's physics (CHE-64)",
  "gpu: requires a CUDA device attached to the container (`./run.sh --gpu`); auto-skips otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["multiscale_optics_agent"]
branch = true
