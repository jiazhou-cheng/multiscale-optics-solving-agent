# Routing-critical facts for C_RAY_TO_WAVE.
# Contract follows AGENTS.md "Initial Artifact Boundary" and the frozen
# M2-COUPLER-CPU-V1 boundary table in benchmarks/protocols/m2_coupler_protocol.md.
# Grounded in: knowledge/papers/raywave_tracing/ (DOI 10.1021/acsphotonics.6c00818),
# main text eq 2 and SI Figure S1.

id: ray_to_wave
role: C_RAY_TO_WAVE
direction: ray_bundle -> complex_field
transformation: coherent plane-wavelet accumulation onto a declared plane

scientific_source:
  doi: 10.1021/acsphotonics.6c00818
  equations: [main_text_eq_2]
  figures: [SI_Figure_S1]
  reference_implementation: https://github.com/jiazhou-cheng/raywave-tracing
  reference_implementation_status: >
    NOT vendored, NOT pinned, NOT executed by this repository. No claim here may
    cite it as evidence. All mathematics is taken from the paper; all evidence is
    produced by this repository's own probes.

framework: numpy
frameworks_deliberately_avoided:
  - reason: >
      The coupler core is the physics under test, so it imports neither optiland
      nor chromatix. M1 proved the engines are independently correct; if the core
      could import one, a coupler defect could be misattributed to engine
      behaviour and M1's independence evidence would stop bounding the search.
    forbidden_imports: [optiland, chromatix]

governing_equation: >
  U_plane(x,y) = sum_i a_i * exp(i k (OPL_i + dr_i(x,y))) * <n_hat, d_hat_i>
  with dr_i(x,y) = d_x_i (x - x0_i) + d_y_i (y - y0_i)

# CHE-38 (M3.9R). Read the equation again: the reconstruction plane's z does not
# appear in it. Only the TRANSVERSE offset does. This has three consequences that
# a caller has to know, and none of them is visible from the signature.
the_plane_z_is_not_a_kernel_parameter:
  statement: >
    reference_plane.z_m is metadata. It labels the output and is checked for
    consistency; it does not enter the sum. What the operator returns is one fixed
    superposition of plane waves sampled on a grid.
  consequence_1_moving_the_handoff: >
    To reconstruct on a different plane, the RAY STATE must be advanced there --
    positions along each direction, optical path by n * arc length. That is exact,
    not an approximation: advancing by arc length s changes the per-ray constant
    phase by k s d_z^2, and s d_z^2 = dz d_z for a plane offset dz = s d_z, which
    is precisely the phase an exact plane wave accumulates over dz. Verified in
    archive/tests/gen1/tests/test_m3r_sensor_handoff.py against a single-ray closed
    form -- archived by CHE-67 and therefore NOT RUNNABLE; the derivation above
    stands on its own arithmetic and no live test guards it.
  consequence_2_the_output_is_a_free_space_field: >
    A superposition of plane waves solves the Helmholtz equation exactly, so the
    operator is self-consistent in z. Reconstructing at the pupil and propagating
    to the sensor, and reconstructing at the sensor directly, are the same field in
    exact arithmetic; they differ only through the finite window, the grid and the
    propagator's own error.
  consequence_3_no_wavefront_curvature: >
    The output carries no exp(i k r^2 / 2R) term, because the sum is linear in the
    transverse coordinate. This is invisible in |U|^2 and NOT invisible to a
    subsequent propagation. Measured on M3-SINGLET-REF: about 1.2 rad of phase
    difference against an exact spherical-wave reference at the 5-Airy-radius gate
    edge, while the intensity residual is at 1e-3. A caller who measures a PSF is
    unaffected; a caller who propagates the reconstructed sensor field further is
    not. DISPOSITION (CHE-50): tracked known limitation, no kernel change; see
    known_limitations.no_wavefront_curvature_term below for the consumer-facing
    statement and where it is surfaced. Evidence:
    the sensor-handoff probe's
    experiment_e_shipping_sensor_path.missing_quadratic_phase field. That record
    is NOT COMMITTED -- regenerate it with
    `./run.sh python benchmarks/probes/sensor_handoff_convergence.py`, and read
    CHE-100 first: three committed probe records in this repository no longer
    reproduce, with absolute power and intensity scales differing by ~20 orders
    of magnitude from what is recorded, so a regenerated number must be
    reconciled before it is trusted. The 1.2 rad figure quoted above comes from
    benchmarks/reports/2026-08/sensor_handoff_convergence.md section 5, which IS
    committed and is the citable source.

# CHE-68 (R5 of the M3.5 exit report). CHE-50 closed with a decision and the
# decision lived only in a Linear comment, so no consumer could see it. This is
# that decision, stated where a caller reads. It changes no numerics: the same
# text is emitted as provenance["validity"] and repeated in the module docstring.
known_limitations:
  no_wavefront_curvature_term:
    issue: CHE-50
    status: tracked known limitation -- not a confirmed blocker, not a defect
    decided: no kernel change for now (CHE-50, closed 2026-08-19)
    statement: >-
      The reconstructed field is valid AT the declared reference plane, with zero
      further propagation. It carries no exp(i k r^2 / 2R) term, so a caller who
      propagates it a further distance is outside what CHE-24/CHE-38 verified in
      phase -- and will get no warning from |U|^2, where the error does not appear.
    who_is_affected: >-
      A consumer that measures an intensity or a PSF at the handoff plane is
      unaffected. A consumer that composes this field into a further propagation
      is affected. M4's hybrid compositions are the first such consumer.
    who_is_not_a_witness: >-
      PB7 (CHE-58) put three PSF routes on the Cooke Triplet and did NOT see this
      term, because its post-handoff propagation distance is zero. That is
      PB7's configuration, not evidence the term is absent from the physics.
      PB7 finding F3 says so explicitly.
    measured_impact:
      system: M3-SINGLET-REF, on axis, 550 nm
      phase_error_rad: 1.2
      where: at the 5-Airy-radius gate edge, against an exact spherical-wave reference
      intensity_residual: 1e-3, converging
      complex_field_residual: 0.127, flat rather than convergent
      source: benchmarks/reports/2026-08/sensor_handoff_convergence.md section 5 (CHE-38)
    correct_remedy_today: >-
      To obtain a field on a different plane, advance the RAY STATE to that plane
      and reconstruct there. That is exact, not an approximation -- see
      consequence_1_moving_the_handoff. Do not propagate the reconstructed field
      as a substitute.
    revisit_when: >-
      A propagation-sensitive hybrid composition independently requires it. Either
      resolution -- emitting the term, or refusing an undeclared further-propagation
      request -- is new, separately-verified physics and needs its own ticket and
      its own oracle. Neither is claimed here.
    surfaced_in:
      - src/couplers/ray_to_wave.py (module docstring; and
        provenance["validity"] on every emitted ComplexField)
      - src/couplers/node.py (module docstring)
      - knowledge/couplers/ray_to_wave/conventions.md
      - this card
    test: tests/test_ray_to_wave.py::test_emitted_field_declares_the_curvature_limitation

  near_grazing_phase_cancellation:
    issue: CHE-70
    status: open -- measured defect of the kernel, currently handled at the caller
    statement: >-
      The kernel forms each ray's constant phase as k(OPL - d.x0). For a mode with
      axial direction cosine d_n, propagating a distance Z makes BOTH terms scale
      as Z/d_n while their difference is only Z*d_n, so the relative precision of
      the inputs sets the ABSOLUTE error of the phase:
      delta_phi ~ eps * k * Z / d_n. Near grazing the phase is destroyed, and the
      kernel does not warn.
    who_is_affected: >-
      Any caller whose spectrum reaches grazing incidence. A pupil bundle within a
      few degrees of the axis (every M3 configuration) is unaffected, which is why
      this survived M2 and M3. A caller decomposing a field on a subwavelength grid
      -- where the propagating cone is the full hemisphere -- is affected.
    who_is_not_a_witness: >-
      Any intensity-only comparison. The affected bins carry too little power to
      move |U|^2; CHE-70 measured 2.25e-7 of the field's power in the eight bins
      that dominate the error. Only a complex-field comparison sees it.
    measured_impact:
      grid: 100x100, 250 nm pitch, 500 nm, 50 um propagation (CHE-70 METALENS-AIR-100)
      offending_bins: >-
        8 -- the (30,40) and (40,30) Pythagorean triples and their sign variants,
        where d_u^2 + d_v^2 = 1 exactly, surviving the strict radial < 1 evanescent
        cut at d_n = 1.05e-8
      offending_optical_path_m: 4745.3
      offending_power_fraction: 2.25e-07
      exactness_limit_without_band_limit: 2.8e-09 relative field error, float64
      exactness_limit_with_band_limit: 8.9e-14 relative field error, float64
      float32_phase_representation_error_rad: 7e3
      source: benchmarks/reports/2026-08/metalens_bridge.md section 6
    current_handling: >-
      Declared band limit at the caller, NOT a kernel change.
      couplers.streaming.grazing_floor_for_phase_budget derives the floor from the
      compute precision and the axial extent (d_n >= eps*k*Z/phase_budget; float32
      over 50 um at 0.01 rad gives 7.49e-3, frozen at 1e-2), band_limit_spectrum
      applies it, and any comparison oracle must apply the identical mask so both
      routes carry the same modes.
    revisit_when: >-
      A ticket decides whether the kernel should refuse such modes, band-limit them
      itself, or reformulate the constant phase so the cancellation does not occur.
      Each is a kernel change with its own oracle. Same disposition as CHE-50.
    surfaced_in:
      - knowledge/couplers/ray_to_wave/conventions.md (hazard H4)
      - src/couplers/streaming.py (module docstring)
      - benchmarks/reports/2026-08/metalens_bridge.md
      - this card
    test: tests/test_coherent_bridge.py::TestExactnessLimit::test_the_grazing_band_limit_is_what_makes_the_exactness_limit_exact

required_source_metadata:
  - wavelength_m
  - positions_m
  - directions_unit
  - complex_amplitude
  - optical_path_length_m
  - optical_path_length_reference
provides_target_metadata:
  - wavelength_m
  - sample_pitch_m
  - coordinate_frame
  - origin
  - phasor
  - normalization
  - reference_plane_z_m
  - plane_normal

deliberately_not_required:
  - name: polarization
    reason: >
      The registry port historically demanded it, but M2 is scalar-only and the
      Optiland adapter documents that it does not fabricate polarization. A
      required field nobody can supply is a contract defect, not a safety
      feature. Reinstated when a vector claim is made.

deliberately_refused:
  - name: opd_native
    reason: >
      Optiland's opd sign and reference plane are both recorded unverified by
      M1. A wrong OPL reference is a harmless piston; a wrong OPL sign
      conjugates the wavefront and turns a converging beam into a diverging
      one. Those are indistinguishable downstream, so the ambiguity is refused
      rather than defaulted.
  - name: ray_intensity_as_amplitude
    reason: >
      Optiland emits `intensity` with an explicit intensity_is_not_amplitude
      marker. Converting a weight to an amplitude is a modelling decision (power
      -> sqrt? photon count? already an amplitude?) that the caller must declare
      and test. The coupler does not choose.

# CHE-38 (M3.9R), section 11. Not every ray plane has the same semantics, and the
# card previously implied that it did. There are two distinct operations and this
# implementation is one of them.
reconstruction_semantics:
  implemented:
    id: ray_as_coherent_contribution
    statement: >
      A ray is a coherent optical contribution to the field at a declared
      OBSERVATION-side plane. The inputs are position, direction, optical path and
      complex amplitude; the aperture enters implicitly, as the domain of a
      quadrature in direction space -- i.e. through which rays exist.
    typical_use: declared Ray->Wave handoff at or near a sensor / observation plane
    status: verified
    verified_by: CHE-38 (M3.9R)
    evidence: benchmarks/probes/records/m3r_sensor_handoff.json
  not_implemented:
    id: ray_as_wavefront_sample
    statement: >
      A ray is a SAMPLE of a finite-support wavefront, typically at an exit pupil,
      to be interpolated onto a grid and multiplied by an explicit pupil support
      P(rho) before an FFT/Fresnel propagation.
    typical_use: exit pupil, smooth wavefront reconstruction, FFT PSF workflow
    requires_and_does_not_have:
      - an explicit aperture support function
      - interpolation / reconstruction of the sampled wavefront
      - aperture semantics of any kind
    status: NOT implemented, NOT claimed
    measured_consequence_of_using_it_anyway: >
      the reconstructed pupil rim comes back Fresnel-soft on the sqrt(lambda R)
      scale instead of hard, and does not sharpen with ray count. See the
      aperture_edge validity condition below.
  do_not_claim_both: >
    Both would need separate implementations and separate verification. Only the
    first has either.

supported_regimes:
  - scalar, monochromatic, fully coherent
  - planar reconstruction surface with a single declared normal
  - CPU, float64 / complex128 (the reference numerics)
  # CHE-60/CHE-61 (PB4a/PB4b). Was 'CPU, float64 / complex128' alone.
  - CPU or CUDA, float32 / complex64, with the phase accumulation validated at
    2e-6 against an analytic reference and a complex64 round trip at 8.3e-07 (L2)
    on host and device alike -- no GPU penalty, against an enforced 2e-5 bound
    (docs/precision/precision_device_policy.md)
unsupported_regimes:
  - vector fields and polarization
  - chromatic / broadband ensembles
  - partially coherent sources
  - curved reconstruction surfaces (see ../wave_to_ray curvature bound)
  # 'GPU and TPU' stood here until CHE-68. GPU is verified; TPU is not.
  - TPU. Never attempted on any device this project has access to.
  - float16 input. Promoted to float32 rather than computed in, and refused
    outright upstream in the ray model.
  - NumPy on CUDA. NumPy cannot hold device memory, so CUDA is a JAX-only path
    for this coupler.

validity_conditions:
  - id: sampling_density
    statement: >
      Phase difference between adjacent rays at the reconstruction plane must be
      below pi, or the reconstruction aliases. This is a Nyquist condition on the
      wavefront, not on the output grid.
    enforcement: measured and reported; structured diagnostic when violated
  - id: single_valued_wavefront
    statement: >
      Coherent complex summation remains valid at caustics and at overlapping ray
      branches. Any downstream operation that UNWRAPS phase is not valid there.
    enforcement: documented; caller responsibility
    measured_by: >
      CHE-38 (M3.9R) turned this from a plausible claim into a measurement, and the
      result is the opposite of the usual intuition. At the geometric focus of
      M3-SINGLET-REF the ray bundle collapses to 0.73 um, about 0.11 of one Airy
      first-null radius, so the exact sensor plane IS a caustic in the
      position-space sense. It is also where the operator is BEST conditioned: the
      coherent gain |U|/sum|a_i| at the peak is ~1, because every wavelet arrives
      in phase. The operator reads directions and optical paths and never a local
      ray density, so the position-space degeneracy is not one of its inputs. By
      contrast the exit-pupil plane, where the rays are spread out, is where the sum
      is a near-total-cancellation problem. A handoff must NOT be moved upstream to
      avoid a caustic on this operator's behalf.
  - id: observation_side_handoff_is_the_verified_placement
    statement: >
      The verified placement is at (or near) the observation/sensor plane, with the
      ray state advanced there in the ray domain. Seven handoff planes spanning the
      exit pupil to just past focus were measured against two independent wave
      references; the residual is monotone in the handoff coordinate and best at the
      sensor.
    enforcement: measured; no run-time check (the operator cannot know where it is)
    measured_by: CHE-38 (M3.9R), Experiments A and E
  - id: per_ray_area_weight_at_the_aperture_boundary
    status: implemented_and_partially_resolved (CHE-47)
    statement: >
      The sum is a QUADRATURE over the ray ensemble. The coupler itself still
      applies no area weight -- it uses whatever amplitude the producer supplies
      (unchanged: see coherent_handoff_from_a_ray_trace.amplitude below) -- but as
      of CHE-47 the Optiland producer DOES supply one by default. Hexapolar
      sampling is very nearly equal-area in the interior, and wrong at both
      boundaries: the outermost ring lies exactly on rho = a and is counted as a
      full cell rather than a half cell, and the central ray represents a smaller
      cell than a uniform assignment implies. The effect is an inflated EFFECTIVE
      APERTURE, hence a PSF that is slightly too narrow, first order in the ray
      spacing.
    enforcement: >
      not enforced by the coupler and cannot be: it does not know where the
      aperture is (see the aperture_edge condition). CHE-47 makes the producer
      supply an absolute-area quadrature weight
      (couplers.quadrature.hexapolar_area_weight_m2) by
      default whenever the Optiland adapter can confirm an un-vignetted hexapolar
      fan (optiland_adapter.py's _resolve_ray_quadrature_weight regenerates the
      pupil sampling and matches it row for row against the trace, exactly as
      CHE-41's object-space term does); optiland_handoff.declare_coherent_bundle
      folds it into the amplitude declaration
      (amplitude = sqrt(weight) * quadrature_weight_m2) unless
      HandoffPerturbation(apply_quadrature_weight=False) is passed explicitly.
      C_RAY_TO_WAVE's own kernel (ray_to_wave.py) is untouched by CHE-47.
    measured_by: >
      CHE-38 (M3.9R) on a SYNTHETIC aberration-free bundle at N_f = 23.45,
      against a Rayleigh-Sommerfeld reference: the residual falls as ring_count^-0.87
      (1.21e-2 at 12481 rays to 1.85e-3 at 787969), and the fitted effective NA
      excess tracks 1/(2 * rings) -- exactly half a ring spacing of extra radius --
      over a 16x range of ring counts. Applying a radial trapezoid weight (outer
      ring 1/2, central ray 3/4) collapses the residual to a CONVERGED 4.07e-4,
      flat from 64 rings upward and inside the 1e-3 gate. CHE-47
      (benchmarks/probes/quadrature_weight.py) reproduced this mechanism as
      the PRODUCTION default and re-measured it on the REAL (residually
      aberrated) M3-SINGLET-REF trace: the sensor-plane residual against the O2
      wave oracle improves 1.58x (3.91e-3 -> 2.48e-3 at 787969 rays) but does
      NOT reach the 1e-3 gate on the real system -- the analytic Airy oracle O1
      (aberration-free, sharing no code with the trace) is CLOSER to the
      weighted result (2.21e-3) than the aberration-matched O2 oracle is
      (2.48e-3), pointing at O2's own ring-averaged/interpolated pupil-fit
      quality rather than a further coupler-side defect. Not decomposed
      further; see the CHE-47 follow-up items.
    consequence: >
      at uniform weights the slice needs of order 10^6 rays to reach 1e-3 on the
      SYNTHETIC aberration-free case; on the REAL traced system uniform weights
      plateau at 3.9e-3 and CANNOT reach 1e-3 by ray refinement alone (CHE-38).
      With the CHE-47 area weight the real system reaches 2.2-2.5e-3, a genuine
      but partial improvement; the synthetic case still reaches 4e-4. The
      remaining real-system gap is open (see card.yaml's evidence above
      and CHE-47's recorded follow-up items), not attributed to a named
      mechanism it has not been shown to cause.
  - id: plane_not_surface
    statement: Equation 2 reconstructs onto a plane with one normal n_hat.
    enforcement: contract validation
  - id: aperture_edge_is_resolved_only_to_a_fresnel_scale
    scope: >
      APPLIES TO the ray_as_wavefront_sample mode only -- i.e. to using this
      operator to rebuild a finite-support pupil function. It is not a bound on the
      verified observation-side handoff, and CHE-38 (M3.9R) corrected the card on
      exactly this point: the previous wording implied every ray plane carried this
      term, and the sensor-side measurement shows it does not.
    statement: >
      Each ray contributes an infinite plane wave, so the sum contains no aperture
      support term. Asked to reconstruct a hard pupil edge, it returns a Fresnel-soft
      boundary instead of a truncation -- amplitude near 1/2 at the geometric rim, an
      overshoot fringe inside it, a tail outside -- over a transition scale
      sqrt(lambda R) set by the bundle's own convergence, and the transition does NOT
      sharpen as the ray spacing falls.
    enforcement: >
      documented only, and it is the one condition here that nothing can measure at
      run time: the coupler is never told where the aperture is. RealRays carries no
      mask and Optic.trace returns survivors only (CHE-32), so the boundary is
      implicit in which rays exist, and a reconstruction cannot distinguish "the beam
      ends here" from "the stop is here".
    measured_by: >
      CHE-38 (M3.9) and re-measured in CHE-38 (M3.9R). On M3-SINGLET-REF,
      sqrt(lambda R) = 51.6 um = 19.4 pupil pixels = 0.21 of the pupil radius at a
      Fresnel number of 23.45, and the rim amplitude settles near 0.50 for every ray
      count above 12481. Evidence: benchmarks/probes/records/m3_convergence.json
      (aperture_edge_hypothesis) and benchmarks/probes/records/m3r_sensor_handoff.json
      (o4_exit_pupil_negative_control).
    the_correct_reference_for_the_rim: >
      M3.9R closed CHE-38 section 13's loose end. The measured rim slope, in units of
      1/sqrt(lambda R), was compared against a ONE-DIMENSIONAL straight Fresnel knife
      edge (1.0009) and read as an unexplained 26% discrepancy. The straight edge was
      simply the wrong reference. The circular-aperture Debye/Lommel solution at this
      Fresnel number gives 0.7142 with a rim amplitude of 0.4839 and an overshoot of
      1.143, against a measured slope near 0.744. The gap closes to a few percent,
      attributable to pixel binning and the finite fit band. The earlier
      rim-curvature / azimuthal-averaging / pixel-binning explanations are WITHDRAWN
      as the cause of a 26% effect; the correct geometry accounts for it.
    conclusion: >
      This implementation cannot be ASSUMED to reconstruct finite pupil support from
      survivor rays alone. That is a statement about pupil reconstruction. It is NOT
      a statement that C_RAY_TO_WAVE is incorrect, and it is NOT a bound on the
      observation-side handoff: at the sensor the residual against two independent
      wave references is monotone in ray count with no floor and no turn-around, and
      the previous "adding rays makes the total disagreement worse" behaviour does
      not recur.
    withdrawn_claims:
      - >
        "the resulting error is set by the pupil Fresnel number a^2/(lambda R) and
        does not fall with ray count, grid or padding" -- true of exit-pupil
        reconstruction, FALSE of the sensor-side handoff, where the residual falls as
        ring_count^-0.87 and is removed by a per-ray area weight.
      - >
        "any comparison against an oracle that assumes a hard stop carries this term"
        -- too general. At the sensor handoff the aperture is carried correctly, as
        the domain of a direction-space quadrature.
      - >
        "adding rays makes the TOTAL disagreement worse ... the turnaround is near
        28000 traced rays" -- an exit-pupil artifact. Re-measured at the sensor
        handoff over 217 to 787969 rays, no turn-around occurs against the
        independent wave oracle.

derivative:
  mode: not_applicable_yet
  verified: false
  verified_note: >
    Ray->wave is a coherent sum and is differentiable in principle with respect
    to ray amplitudes, positions, and OPLs. No gradient is claimed in M2 because
    none has been tested. See ../wave_to_ray for the direction where the paper's
    estimator is deliberately biased.

# CHE-68: was [cpu] / [complex128], which was true at M2 and stale after PB4.
# core/capabilities.py is the machine-readable source; this card summarises it.
devices_tested: [cpu, cuda]
dtypes_validated: [complex128, complex64]
device_and_precision_note: >
  CHE-60/CHE-61. complex128 on the CPU remains the reference and is what the
  analytic oracles below were measured against. complex64 is validated at 2e-6
  (phase accumulation, analytic reference) and the coupler boundary is tested to
  stay on the device rather than round-tripping through the host
  (tests/test_precision_gpu_pipeline.py, tests/test_precision_execution_matrix.py,
  both marked gpu and not re-run since CHE-60). Requested, resolved and actual
  are three distinct things: the emitted provenance reads dtype, device and
  namespace off the produced array and never asserts them from the request.
validated_probe_ids:
  - >
    engine_independence (passed, 2026-08-12; CHE-24). Static AST scan of the
    core modules plus a subprocess check that sys.modules contains neither
    optiland nor chromatix after a reconstruction.
  - >
    exact_plane_wave_oracle (passed, 2026-08-12; CHE-24). A collimated bundle
    launched from many lateral positions reconstructs
    N * <n,d> * exp(+i k d.r) at four tilt angles, to a tolerance derived from
    float64 round-off (32 * eps64 * N) rather than chosen. Simultaneously pins
    the OPL handling, the dr(x,y) ramp, the phasor sign, and the projection
    factor, because removing any one of them breaks it.
  - >
    launch_position_invariance (passed, 2026-08-12). Two ensembles of the same
    angular mode, one on a grid and one at random lateral positions, agree to
    round-off. This is the entire content of the dr(x,y) term.
  - >
    linearity (passed, 2026-08-12). Reconstructing two modes jointly equals the
    sum of their separate reconstructions.
  - >
    chromatix_asm_cross_check (passed, 2026-08-12; CHE-24). Advancing rays
    geometrically by 40 um and reconstructing agrees with propagating the
    z=0 reconstruction through the M1-verified Chromatix angular spectrum:
    relative residual 2.77e-05 against a bound of 3.00e-04 derived from M1's
    own float32 phase round-off figure (5 * eps32 per radian, 502.7 rad
    accumulated). The residual is below one eps32 per radian, so it is
    accumulated rounding and not a physics disagreement. Chromatix is imported
    by the test driver only, never by the coupler core.
  - >
    negative_controls 4/4 detected (passed, 2026-08-12). Phase sign flipped,
    projection factor omitted, oblique ramp omitted, axes transposed -- each
    run through the SHIPPING implementation with one term removed, each with a
    passing unperturbed control.
  - >
    negative_control_blind_spots (passed, 2026-08-12). Two recorded traps: the
    projection factor is exactly 1 at normal incidence, and the oblique ramp is
    inert for a single centred on-axis ray. Both omissions are proven
    undetectable in those configurations, which is why the negative tests are
    run off-axis and multi-ray.
  - >
    grid_nyquist_condition (passed, 2026-08-12). |d_t| <= lambda / (2 * pitch)
    enforced with a structured diagnostic; the same bundle refused at a 1 um
    pitch reconstructs exactly at 0.25 um, confirming the limit is the grid and
    not the physics.

# CHE-33 (M3.4). The coupler needs a complex amplitude and an OPL with a declared
# reference; a real Optiland trace supplies neither. This is what has to be
# declared before the coupler will accept one, and how each declaration was
# checked. Implementation: src/couplers/handoff.py
coherent_handoff_from_a_ray_trace:
  status: verified
  verified_by: CHE-33 (M3.4)
  probe: benchmarks/probes/ray_to_wave/coherent_handoff.py
  evidence: benchmarks/probes/records/ray_to_wave/coherent_handoff.json
  tests: tests/test_optiland_coherent_handoff.py
  declarations:
    optical_path_length:
      source: RealRays.opd via the ray adapter's opd_native
      unit_conversion: native millimetres -> metres (CHE-30 part 4)
      plane_transfer: >-
        opd is accumulated to the final traced image surface, while the exported
        positions are the image-space asymptote at the exit pupil. Subtract
        n_image * (z_image - z_plane) / N per ray. Exact, because image space is
        homogeneous; n_image is read from the prescription, not assumed to be 1.
      reference: >-
        the traced chief ray, sign 'ray minus chief'. The aperture-dependent
        launch-plane zero CHE-30 warned about is common to every ray in the trace
        and cancels exactly in this subtraction.
      # CHE-41 versions this declaration, because a handoff convention is part of
      # the coupler contract and a change to it is not an edit.
      version: C_RAY_TO_WAVE opl_reference v2 (CHE-41)
      reference_surface: >-
        the plane WAVEFRONT of the incoming collimated bundle, not Optiland's
        launch plane. RealRays.opd accumulates from a plane perpendicular to z,
        which is a wavefront only along z; the difference is
        n_object * (d0 . r_launch), exported per ray by the ray adapter as
        object_space_reference_offset_m and added here. When that term is constant
        across the bundle it is NOT added: a constant cannot survive the chief-ray
        subtraction, and skipping it is what makes every on-axis declared OPL
        bit-identical to v1's.
      why_the_wavefront_and_not_a_chief_ray_frame: >-
        both are defensible and the choice is stated rather than defaulted. The
        wavefront is a physical surface the bundle defines identically at every
        field; a chief-ray-referenced frame is chosen per field, makes the oracle
        circular (the PSF lands at the window centre by declaration), and has no
        exact form that does not re-introduce a reference sphere aimed at a chosen
        image point -- whose approximate form, a least-squares linear ramp,
        manufactured a 1.0-wave false aberration finding in M3.8. It is also the
        more general choice: a chief-ray frame can be layered on a
        wavefront-referenced OPL, while recovering the tilt from a chief-ray frame
        needs object-space data the exit-pupil export does not carry. Full
        reasoning: benchmarks/protocols/slice_protocol.yaml amendment A4.
      sampling_consequence: >-
        the pupil field carries the tilt, so pitch <= lambda /
        (2 max|transverse direction cosine|). On M3-REVERSE-TELEPHOTO the frozen
        pitch is 94.6% of admissible at Hy = 0.2, inadmissible from Hy ~ 0.25, and
        needs 2.58x refinement at full field.
      superseded:
        version: C_RAY_TO_WAVE opl_reference v1 (CHE-33)
        reference_surface: Optiland's ray launch state, used as though it were a wavefront
        numerically_identical_for: >-
          every field whose object-space term is constant across the bundle, i.e.
          every configuration M3.4-M3.8 verified
        wrong_for: >-
          any off-axis field. At Hy = 0.2 it retained 0.13% of the required tilt
          (slope 8.7e-5 against 0.0684) and converged 209 um from the traced
          chief-ray intersection with a healthy-looking 0.072-wave-P-V residual.
      global_phase_policy: retained_as_metadata_not_reapplied
    amplitude:
      # CHE-47 (M3.9R extension) changed the DEFAULT mapping. The bare
      # sqrt(intensity_i) declaration below is still available
      # (HandoffPerturbation(apply_quadrature_weight=False)) and is exactly what
      # ships when the adapter cannot confirm an un-vignetted hexapolar fan.
      default_mapping: a_i = sqrt(intensity_i) * quadrature_weight_m2_i
      default_mapping_status: implemented_by CHE-47, verified_by CHE-47
      default_mapping_source: >-
        quadrature_weight_m2_i is an ABSOLUTE per-ray pupil/phase-space area
        element in square metres (couplers.quadrature.
        hexapolar_area_weight_m2), producer-supplied by the Optiland adapter
        whenever it can regenerate the hexapolar pupil sampling Optic.trace used
        and match it row for row against the traced ray count (the same
        row-count-match technique CHE-41 uses for the object-space term).
        Radial-trapezoid corrected: interior rings get the nominal cell
        pi*a^2/(3*num_rings^2), the central ray 3/4 of it, the outermost ring
        (sitting exactly on rho = a) 1/2 of it.
      legacy_mapping: a_i = sqrt(intensity_i)
      legacy_mapping_when: >-
        the adapter could not confirm an un-vignetted hexapolar fan (a
        non-hexapolar distribution, or a trace where at least one ray was
        vignetted so ring order no longer matches row order), OR
        HandoffPerturbation(apply_quadrature_weight=False) is passed explicitly
        (the CHE-38 negative-test / pre-CHE-47 configuration).
      normalization: >-
        with the default mapping: an absolute-area quadrature, so the
        reconstructed discrete power CONVERGES under ray refinement instead of
        growing as (ray count)^2 -- CHE-33/CHE-38's N^2.0024 finding is
        resolved for a bundle the adapter could weight (CHE-47: fitted exponent
        -0.0098, r^2 = 0.23, i.e. flat/noise, vs the legacy path's 1.9948,
        r^2 = 0.9999, reproducing CHE-33/CHE-38 almost exactly). With the
        legacy mapping: raw, no per-ray area factor and no 1/N -- a traced set
        is a physical ensemble, not a Monte Carlo sample -- so the reconstructed
        amplitude scales with ray density and the field converges in shape but
        not in scale under ray refinement (CHE-33/CHE-38's original finding,
        still exactly reproduced on that path).
      no_phase_available: >-
        RealRays.i is a real intensity. Every radian of the reconstructed field
        therefore comes from the OPL, which is why a wrong OPL is not a degraded
        field but a different one.
  verification:
    analytic_oracle: >-
      equal optical path to the focus, so OPL(rho) - OPL(0) = R - sqrt(rho^2 + R^2)
      exactly for a perfect system. Residual on M3-SINGLET-REF: 0.016999 waves
      peak-to-valley.
    independent_implementations_agreeing:
      - this declaration: 0.016999 waves
      - Optiland's own Wavefront (opposite sign convention, own reference sphere): 0.016999
      - M3.2's frozen diffraction-limited evidence (different probe): 0.016996
    falsifiers_detected:
      opl_sign_flipped_waves: 23.45
      plane_transfer_omitted_waves: 11.77
      structural: >-
        both perturbations also move the reconstructed pupil intensity by more
        than 50% relative L2, which is the observable the negative tests gate on.
        Checking the declared array against itself would prove nothing: M2's
        lesson is that a shared convention error cancels in a round trip.
  refusals:
    - REFERENCE_PLANE_MISMATCH when the producer's plane kind or axial position
      disagrees with the consumer's declaration
    - OPL_REFERENCE_UNVERIFIED when no declaration was made, which is still the
      behaviour for a bare adapter record
    - MISSING_DECLARATION when the record carries no image-space refractive index
    - OBJECT_SPACE_REFERENCE_MISSING (CHE-41) when the record was traced off axis
      and carries no object-space reference term. Deliberately NOT a warning and
      not a silent zero, because the missing quantity cannot be reconstructed
      downstream and its absence produces a converging sphere aimed at the axis.
      An on-axis record without the term is still accepted, because there the
      omission is a piston.
    - >-
      CHE-47's quadrature weight does NOT add a refusal here -- a missing or
      non-hexapolar-consistent weight falls back to the legacy
      sqrt(intensity_i) amplitude mapping rather than raising, because (unlike
      the object-space term) an unweighted bundle is still coherent and
      correct, just not scale-invariant under ray refinement. The adapter's own
      NON_HEXAPOLAR_SAMPLING code (couplers.quadrature)
      is caught internally at that boundary and recorded as
      quadrature_weight.unavailable_reason, never propagated to the caller.

# CHE-38 (M3.9R). The placement question M3.4-M3.9 never asked: is the exit pupil
# where this operator should be used at all? Measured over seven declared planes.
observation_side_handoff:
  status: verified
  verified_by: CHE-38 (M3.9R)
  probe: benchmarks/probes/sensor_handoff_convergence.py
  evidence: benchmarks/probes/records/m3r_sensor_handoff.json
  tests: >-
    archive/tests/gen1/tests/test_m3r_sensor_handoff.py -- ARCHIVED by CHE-67 and
    not runnable. 21 of its 27 tests already skipped for the missing record
    (CHE-63); archiving removed the 6 live ones too, so this verification is now
    unguarded. Unarchiving is an explicit git mv back under tests/, per
    archive/tests/gen1/README.md.
  report: benchmarks/reports/2026-08/sensor_handoff_convergence.md
  # Local-only: `outputs/` is gitignored and exists on the machine that
  # produced the run. The measurement this card relies on is stated in the
  # fields above; the figures are illustration, not the evidence.
  figures_local_only: outputs/M3/CHE-38-M3.9R/
  system_verified: M3-SINGLET-REF, on axis, 550 nm
  verdict: >-
    A. Sensor-side Ray->Wave handoff verified. The residual against two independent
    wave references is monotone in ray count with no floor and no turn-around, and
    on a synthetic aberration-free bundle it is attributed to the ray ensemble's
    per-ray area weight rather than to the wavelet kernel.
  verified_does_not_mean_the_shipped_slice_meets_the_gate:
    at_uniform_ray_weights: >-
      the traced slice at the sensor sits at 3.84e-3 against O2 at 787969 rays --
      still falling, no floor -- so the SHIPPED configuration does not meet the
      1.0e-3 gate at any ray count this study could afford. What is verified is that
      the residual is a refinement error and not a structural one.
    unattributed_remainder: >-
      at 787969 rays the traced slice reads 3.84e-3 while a synthetic bundle at the
      same ring count reads 1.85e-3 against the same class of reference. Roughly half
      the traced residual, in quadrature, is NOT yet attributed. Candidates, none
      of them measured: the O2 oracle's own wavefront representation (ring-averaged
      traced OPL from a 256-ring trace, linearly interpolated, and held FIXED while
      the slice ray count varies), and the aberration's distortion of the
      pupil-coordinate-to-direction mapping that the equal-area argument assumes.
      This is recorded as open rather than explained.
    half_a_ring_spacing_prediction_is_right_in_kind_not_in_exponent: >-
      the fitted effective-NA excess is 1.05x to 1.51x the naive 1/(2 rings) over 64
      to 512 rings and falls as ring_count^-0.83, not ring_count^-1. The mechanism is
      confirmed by the trapezoid-weight collapse, which is the strong evidence; the
      shallower exponent is an open loose end and is NOT explained here.
  references_used:
    - id: O1
      what: analytic Airy, [2 J1(v)/v]^2, paraxial, aberration-free
      shares_with_the_slice: nothing
      numerical_aperture: >-
        the largest traced transverse direction cosine. NOT a / sqrt(a^2 + R^2),
        which is 0.29% smaller for this singlet because the marginal ray crosses the
        axis about 14 um before the declared image plane. Using the sphere value
        instead is a 4e-3 relative L2 on its own -- four times the gate -- so this
        is a load-bearing declaration and not bookkeeping.
    - id: O2a
      what: >-
        the constructed hard-support pupil (exact support, uniform amplitude, traced
        wavefront by radial interpolation) propagated to the sensor by independent
        float64 angular spectrum on a 2048 um window
      shares_with_the_slice: the ray-measured wavefront only; never the coupler
    - id: O2b
      what: >-
        the same pupil through an exact Rayleigh-Sommerfeld surface integral in polar
        form -- a different REPRESENTATION (Huygens spherical waves), not a different
        discretization, with no FFT and therefore no wraparound
      agreement_with_O2a: 2.4e-4 in intensity over the gate disc
    - id: O3
      what: the highest-ray-count result, used ONLY for ray-sampling convergence
      not_allowed_to: establish physical correctness
    - id: O4
      what: M3.9's exit-pupil reconstruction, retained as a negative control
      label: out of contract; see the aperture_edge validity condition
  what_was_checked_and_cleared:
    eikonal_consistency_of_the_declared_handoff: >-
      dOPL/drho equals the transverse direction cosine to 2.5e-8 in the interior and
      8.6e-7 at the rim. The declared OPL and the declared directions describe the
      same wavefront, so the handoff itself was cleared before the oracle was
      believed. This is the measurement that redirected the investigation.
    an_underfitted_oracle_that_nearly_became_a_coupler_defect: >-
      building O2's pupil phase from a 5-term polynomial in rho^2 gives a fit
      residual of 1.3e-3 waves -- which looks excellent -- and a rim SLOPE 0.28%
      wrong, because RMS over the pupil does not bound the derivative at the edge.
      That oracle charges the coupler about 5e-3, monotone in ray count, five times
      the gate. Retained in the record as a named control.
  caution_for_callers: >-
    do not move a handoff upstream to avoid a caustic. At the geometric focus the
    bundle collapses to ~0.11 of one Airy first-null radius, and that is where this
    operator is best conditioned (coherent gain ~1). It reads directions and optical
    paths, never a local ray density.

# CHE-41 (M3.9). The off-axis half of the handoff, which CHE-33 left unprobed and
# CHE-37 found broken. Same implementation module; the OPL reference is versioned.
off_axis_handoff:
  status: verified at one field
  verified_by: CHE-41
  probe: benchmarks/probes/off_axis_handoff.py
  evidence: benchmarks/probes/records/m3_off_axis_handoff.json
  tests: >-
    archive/tests/gen1/tests/test_m3_off_axis_handoff.py -- ARCHIVED by CHE-67 and
    not runnable, so this verification is unguarded. Unarchiving is an explicit
    git mv back under tests/, per archive/tests/gen1/README.md.
  field_verified: M3-REVERSE-TELEPHOTO, Hx = 0, Hy = 0.2
  geometric_oracle:
    what_it_is: >-
      the reconstructed field's PSF must land at the TRACED CHIEF-RAY INTERSECTION
      and the fitted reference sphere's centre must be there too. Both are
      geometry, computed from the ray bundle, and neither is satisfiable by a
      convention that is self-consistent but aimed at the wrong place.
    psf_peak_pixels: [114, 0]
    psf_peak_predicted_pixels: 114.41892625675855
    psf_error_in_airy_radii: 0.17173756200504023
    fitted_sphere_centre_error_m: 5.717799865452328e-07
    fitted_sphere_centre_error_improvement_over_v1: 367.1362751001203
    pupil_wavefront_pv_waves_against_the_chief_ray_point: 0.04424271330843872
    superseded_pupil_wavefront_pv_waves: 57.01174774014233
    reference_sphere_free_cross_check: >-
      geometric RMS ray radius about the chief-ray point 0.082 Airy radii, max
      0.105. Fits no sphere, so it cannot inherit a sphere-centre error -- which is
      the M3.8 method note that caught a 1.0-wave false finding.
    negative_control: >-
      the superseded declaration re-run through HandoffPerturbation(
      reference_incoming_wavefront=False) moves the PSF 115 pixels back onto the
      axis. A fix whose omission changes nothing is not a fix.
  axis_transpose_control:
    margin_before: 1.0000066 (CHE-37, and unfailable on any frozen configuration)
    margin_after_che37_metric_unchanged: 0.99999978
    margin_after_che37_metric_recentred: 233.63715040771217
    margin_after_window_metric_no_azimuthal_average: 12.4293824456337
    margin_in_m3_psf_verification_off_axis_controls: 674.878
    finding: >-
      the off-axis field was necessary and not sufficient. CHE-37's metric
      azimuthally averages about the grid CENTRE, and such an average cannot
      distinguish a peak at (114, 0) from one at (0, 114) for ANY configuration --
      a second, independent blind spot that the single number 1.0000066 was
      hiding. Two repairs, both reported. Centring the analytic reference and the
      azimuthal average on the traced image point detects the transpose at 233.6x
      here and 674.9x in m3_psf_verification's off_axis_negative_controls, where
      it also lifts the OPL-sign, phase-sign, oblique-ramp and distance-sign
      margins from within 2.6x of 1.0 to 651x-1400x. Scoring with no azimuthal
      average at all detects it at 12.4x. The peak moves 161 pixels, 66 Airy
      radii, from y to x.
    still_undetected: >-
      the amplitude control, at 1.00005. That is the standing amplitude blind spot
      (amplitude_path_is_not_exercised_by_any_m3_configuration) and not this
      handoff's -- though note it is no longer EXACTLY 1.0 as it is on axis, so
      ReverseTelephoto's off-axis ray weights are not perfectly uniform.
  on_axis_impact: >-
    none, bit-identically. The object-space term is constant across an on-axis
    bundle and is therefore not applied; the declared OPL array compares equal
    under numpy.array_equal, and the frozen 0.016999-wave residual is unmoved.

not_yet_probed:
  - off-axis fields beyond Hy = 0.2, where the frozen pitch stops admitting the
    tilt the declared reference puts in the pupil (limit Hy ~ 0.25, 2.58x
    refinement needed at full field). CHE-41 verified one field, not a field scan.
  - off-axis fields in x, or in both axes at once. CHE-41 used a one-axis field
    deliberately, because that is what makes the transpose control non-vacuous.
  - a finite-object (non-collimated) launch, where the object-space reference is a
    point rather than a plane. The ray adapter refuses to supply a term there
    rather than supplying a zero it has not tested.
  - a system whose image space is not air, where the plane transfer's n_image
    stops being 1 (both M3 systems are in air; the value is read, so this is a
    coverage gap rather than a correctness one)
  - reconstruction error versus ray count for a non-planar wavefront (deferred to CHE-26 round trip)
  - power conservation against a physical aperture rather than a chosen ensemble
  - behaviour at a caustic or with multi-valued phase
  - any gradient

measured_behaviour:
  power_scaling: >
    N identical in-phase wavelets give N times the amplitude and N^2 times the
    discrete power -- true of the KERNEL, unconditionally, for any bundle whose
    amplitude does not itself carry a compensating per-ray factor. Reported, not
    gated by C_RAY_TO_WAVE: it is bookkeeping about a chosen ensemble's
    amplitude, not a conservation law the kernel enforces. CHE-47 gives the
    Optiland producer path a compensating factor (quadrature_weight_m2) by
    default, so a bundle built through optiland_handoff.declare_coherent_bundle
    no longer exhibits this scaling in practice (measured: fitted power-vs-N
    exponent -0.0098 against the legacy path's 1.9948); a bundle built any other
    way, or with apply_quadrature_weight=False, still does.
  two_independent_sampling_conditions: >
    Grid Nyquist (can the output pitch write the steepest ramp?) and ray
    density (do adjacent wavelets agree to better than pi?) fail independently,
    and refining one does not fix the other. Both are reported so the failing
    one is identifiable; the usual wasted debugging step is refining the grid
    when the ray count is the problem.
  ray_density_diagnostic_limit: >
    The nearest-neighbour scan is O(N^2) and is skipped above 4096 rays,
    reporting not_computed rather than a fabricated estimate.

# CHE-34 (M3.5). The core is a pure function over typed contracts; this is what
# makes it runnable from a graph edge without moving any physics out of the core.
runnable_graph_edge:
  status: implemented
  implemented_by: CHE-34 (M3.5)
  module: src/couplers/node.py
  tests: tests/test_ray_to_wave_node.py
  is_a_wrapper: >-
    proven, not asserted: the field it writes is bit-identical (np.array_equal,
    not allclose) to calling ray_to_wave directly on the same bundle. A tolerance
    would have let the node acquire arithmetic of its own and quietly invalidate
    M2's evidence for what a graph executes.
  port_correction:
    was: {name: rays_or_wavefront, artifact: wavefront_samples}
    now: {name: ray_bundle, artifact: ray_bundle}
    reason: >-
      the implemented physics is a sum of plane WAVELETS and needs a direction
      per sample; WavefrontSamples carries (N, 2) pupil coordinates and none.
      The hedged port name was concealing an input type the coupler could never
      have accepted.
    version_bump: 0.1.0 -> 0.2.0
  declaration_is_edge_configuration: >-
    handoff_plane and handoff_plane_z_m. An undeclared ray record is promoted
    only when the edge states the plane, and is otherwise refused with
    OPL_REFERENCE_UNVERIFIED. A record that already declares its own OPL
    reference and amplitude is consumed as-is and is never re-declared.
  refusals:
    - {condition: per-axis Nyquist violation, code: SHAPE_MISMATCH}
    - {condition: no OPL declaration, code: OPL_REFERENCE_UNVERIFIED}
    - {condition: handoff plane kind or position mismatch, code: REFERENCE_PLANE_MISMATCH}
    - {condition: empty bundle, code: EMPTY_ENSEMBLE}
    - {condition: non-finite input, code: NON_FINITE}
    - {condition: source artifact of the wrong kind, code: ARTIFACT_KIND_MISMATCH}
    - {condition: missing or unusable edge config, code: MISSING_DECLARATION}
  validate_and_transform_cannot_disagree: >-
    both are driven from one diagnose(); every refusal above is exercised through
    both entry points. Two parallel checklists is how a validator comes to
    approve a request that then fails.
  cost_model_correction: >-
    the registry's O(rays + pixels) understated the work by a factor of the grid
    size. estimate() reports rays x grid points, which is the driver a graph
    needs to reject an infeasible configuration. Memory really is additive,
    because the core contracts two separable ramps instead of materializing an
    (N, ny, nx) tensor, so the two scale differently and both are reported.
  no_gradient_claimed: >-
    require_gradients=True is refused. derivative.verified is false and M3 is
    forward-only by protocol.

implementation_location: src/couplers/ray_to_wave.py
runnable_node_location: src/couplers/node.py
test_location: tests/test_ray_to_wave.py
# One of the three values on knowledge/README.md's ladder, and nothing else.
# This was `analytically_validated_scalar_planar_cpu`, which is not on the ladder: it fused the
# rung with its qualifier, so nothing could check either. Both are kept,
# separately.
validation_status: scientifically_validated
validation_scope: >-
  Scalar, monochromatic, planar reference plane, CPU and CUDA. Validated
  against an analytic case and an independent float64 angular-spectrum
  implementation. The wavefront-curvature term is a declared and tested
  omission, not an oversight; no gradient across the boundary is certified.
validation_note: >
  CHE-22 authored this pack from the paper; CHE-24 implemented main-text eq 2
  and validated it. The exact analytic oracle pins every factor of the equation
  at once, the Chromatix cross-check provides an independent implementation,
  and 4/4 negative controls are detected with passing unperturbed controls.
  This validates scalar, monochromatic, fully coherent reconstruction onto a
  PLANAR surface at float64 on CPU. Vector fields, chromatic ensembles, partial
  coherence, curved reconstruction surfaces, accelerators, caustics, and every
  gradient claim remain unvalidated.

# --- The batched planar DOE step (CHE-95) -------------------------------------
#
# `C_PLANAR_DOE_STEP` composes this direction with C_WAVE_TO_RAY into one
# registered coupler with a graph node: accumulate every incident ray onto a
# common plane through the operator on this card, apply the DOE transmission
# once, transform, and resample a fixed budget back to rays. SI Algorithm S1.
#
# The full description -- what it bounds, the exactness gate, and the three
# conventions that change across it (OPL resets to zero, the amplitude becomes
# a spectral amplitude, power is not conserved by default) -- is on the
# wave_to_ray card under `batched_planar_step`, because the resampling half is
# where the interesting choices are. What matters on THIS card:
#
#   * the accumulation is this operator, unchanged, at ASM_CONSISTENT
#     projection. The step adds no physics to it;
#   * the no-wavefront-curvature limitation recorded above therefore applies to
#     the accumulated field inside the step exactly as it does when this
#     operator is called directly;
#   * the step's outgoing rays are valid AT the declared plane, and the OPL
#     reset means a consumer cannot recover the incident path from them.
batched_planar_step_reference: knowledge/couplers/wave_to_ray/card.yaml::batched_planar_step

# --- The patch-based local WFT step (CHE-96) ----------------------------------
#
# `C_PATCH_WFT` is the general ray-DOE method, of which the batched step above
# is a special case (SI S10). The full description is on the wave_to_ray card
# under `patch_step`, because the decomposition-and-resample half is where the
# choices are. What matters on THIS card:
#
#   * the RECONSTRUCTION of a patch bundle is this operator, unchanged, at
#     ASM_CONSISTENT projection, and it is where a patch run spends its time:
#     O(N_rays x N_pixels) against upstream's O(N_rays) + one FFT. Every cost
#     number CHE-96 recorded is a number about this operator;
#   * this operator is what makes the patch step's launch-position phase rule
#     correct. `ray_to_wave` already references each wavelet's ramp to the ray's
#     own position, so a patch bundle must NOT carry a launch-position phase --
#     `spectrum_to_rays` applies one and the patch step deliberately does not;
#   * the patch step's OPL reset means a consumer of its bundle cannot recover
#     the incident path, exactly as for the batched step.
#
# Evidence that the pair reproduces an independent implementation: a single
# full-aperture patch enumerated through this operator matches
# verification/asm_oracle.angular_spectrum_float64 at 7.1e-13 relative field
# error on the paper's demo2 system, at MATCHED padding
# (benchmarks/probes/records/ray_wave/demo2_paper_jax.json).
patch_step_reference: knowledge/couplers/wave_to_ray/card.yaml::patch_step
