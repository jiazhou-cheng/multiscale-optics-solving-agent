id: jax-fem
validation_status: unvalidated
blocked: true  # see knowledge/solvers/jax_fem/solver_card.yaml `blocker`
role: M_THERMAL_JAX_FEM
framework: jax
official_docs: https://deepmodeling.github.io/jax-fem/
repository: https://github.com/deepmodeling/jax-fem
license: GPL-3.0  # PyPI classifier says "BSD" -- that is WRONG, verified against the real LICENSE file
install:
  pip_name: jax-fem
  pinned_version: "0.0.12"
  install_hazard: >
    The published wheel declares ZERO dependencies (not even jax/numpy).
    `pip install jax-fem` alone is not usable; see
    knowledge/solvers/jax_fem/failure_guide.md for the real dependency set
    (taken from the project's own environment.yml) and
    docker/requirements.txt for the pinned install used in this project.
  environment: docker/Dockerfile (image `agent_solver`)
  critical_blocker: >
    jax_fem.solver (the actual FEM solve entry point) cannot be imported
    without petsc4py, which has no prebuilt PyPI wheel. As pinned, this
    solver can build meshes and Problem definitions but CANNOT run a solve.
    Do not route benchmark work to M_THERMAL_JAX_FEM until this is resolved.
knowledge_pack: knowledge/solvers/jax_fem/  # conventions.md, capability_notes.md, api_minimal_examples.md, failure_guide.md, probes/
agent_should_use_for:
  - steady/transient heat models as supported (NOT CURRENTLY EXECUTABLE, see blocker)
  - thermo-mechanical deformation (NOT CURRENTLY EXECUTABLE, see blocker)
  - differentiable material and boundary-parameter studies (NOT CURRENTLY EXECUTABLE, see blocker)
  - mesh generation only (jax_fem.generate_mesh) -- this part does work today
agent_should_not_assume:
  - electromagnetic and FEM meshes share coordinates or units
  - implicit differentiation is configured automatically
  - temperature-dependent materials remain smooth over all ranges
  - jax_fem.solver is importable in this environment -- it is not (petsc4py missing)
  - the PyPI license classifier ("BSD") is correct -- the real LICENSE file is GPLv3
required_probes:
  - one-dimensional analytic heat-conduction case  # BLOCKED by petsc4py
  - mesh-convergence study  # BLOCKED by petsc4py
  - total heat-source conservation after transfer  # BLOCKED by petsc4py
  - directional derivative of conductivity or source amplitude  # BLOCKED by petsc4py
benchmarks: [L2-THERMO-01, L3-ROBUST-01]
