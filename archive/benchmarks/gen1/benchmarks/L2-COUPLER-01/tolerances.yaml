# L2-COUPLER-01 tolerances (CHE-29), under M2-COUPLER-CPU-V1.
#
# Every entry states its basis. A tolerance chosen because it made a test pass
# is not a tolerance, and the protocol requires the two stochastic ones in
# particular to be derived from the data rather than picked.

# Round-off derived, not chosen: float64 resolution over an M-term coherent sum
# of unit wavelets, with the grid ramp included in the phase argument.
plane_wave_oracle_max_abs_error: 1.0e-9
plane_wave_oracle_basis: >
  N * eps64 * max|k * (OPL + d_t . (r - r0))| for the 64-ray collimated bundle
  on the 16x16 output grid, rounded up. Observed values sit orders of magnitude
  inside this.

# The enumeration limit has no sampling error, so only round-off remains.
round_trip_relative_rms: 1.0e-12
round_trip_basis: >
  Deterministic enumeration of every propagating bin. Measured 1.4e-15 at
  authoring time; the gate is loosened only to the nearest safe decade so that
  a genuine regression still fails it.

# A mismatched phase-sign pairing must be caught, not merely be different. If
# this floor is not met the round trip is not a test of anything.
mismatched_pairing_min_relative_rms: 0.5
mismatched_pairing_basis: >
  A conjugated wavefront is a different field, not a perturbed one. Anything
  below this would mean the round trip cannot detect a shared-convention error.

# |exp(i phi)| = 1 exactly, so a pure-phase DOE conserves discrete power up to
# FFT round-off only.
phase_doe_power_ratio_tolerance: 1.0e-10

# Protocol constants, restated here so a change shows up in this file's hash.
unbiasedness_k_sigma: 3
unbiasedness_basis: >
  The tolerance IS the measured standard error of the ensemble mean. Not a
  constant. A failure may not be repaired by raising k or the realization count.

convergence_exponent_tolerance: 0.1
convergence_basis: >
  Monte Carlo error falls as N^-1/2. Gated on the exponent fitted over a
  six-point sweep, never on the error at a single N. Sixteen seeds per point:
  measured during CHE-25, eight seeds gave a fitted exponent of -0.58 on a
  concentrated spectrum where 64 seeds gave -0.48, so too few realizations can
  manufacture an apparent anomaly rather than merely widen an error bar.
