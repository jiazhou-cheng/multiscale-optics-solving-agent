# B3-PSF-SINGLET-01, the FROZEN configuration, as a graph document.
#
# CHE-115 (M3.3). This is the substrate proof's primary graph: the configuration
# whose committed number is `fft_oracle_intensity_relative_l2 = 2.2072391812867093e-3`
# against a 1.0e-3 gate. That number was produced by
# `benchmarks/probes/quadrature_weight.py::characterize()` calling
# `benchmarks/probes/sensor_handoff_convergence.py`'s helpers directly, and it is
# reproduced BIT-IDENTICALLY through `GraphExecutor` from this file
# (tests/test_substrate_proof.py::test_the_frozen_number_is_reproduced_bit_identically).
#
# Why this is a second document rather than an edit to `ray_to_wave.yaml`:
# that file is the M3.9 PUPIL-plane configuration (grid 188 at the 2.659 um
# Nyquist-bound pupil pitch, then a 4.837 mm Chromatix propagation to focus),
# reconciled by CHE-31 and still the thing several M3 records describe. CHE-38
# (M3.9R) replaced the pupil-plane handoff with a SENSOR-plane one, and it is
# that configuration -- not the pupil one -- the frozen gate number belongs to.
# Editing the older document would have silently restated what those records
# claim to describe.
#
# Executes:  M_RAY_OPTILAND -> C_RAY_TO_WAVE -> M_WAVE_CHROMATIX
#            then a PSF MEASUREMENT on a field, outside the graph (CHE-36).
#
# The two arms this document supports, both through `runtime.variants`:
#   * as committed        -- the handoff is ON the sensor, so the wave node
#                            propagates zero distance and the sensor-plane field
#                            IS the coupler's output. This is the frozen gate.
#   * near_sensor_fine    -- override `advance_to_z_m` to 0.001 R upstream and
#                            the wave node propagates the residual, because it
#                            derives its distance from the field's own plane.
#                            This is the arm that exercises M_WAVE_CHROMATIX
#                            with real work, so the three-node claim is honest.
schema_version: 0.1.0
task_id: B3-PSF-SINGLET-01
nodes:
  - id: lens
    model: M_RAY_OPTILAND
    config:
      sample: M3SingletRef
      # Micrometres, the adapter's verified native unit. 5.5e-7 m.
      wavelength: 0.55
      Hx: 0.0
      Hy: 0.0
      # Hexapolar ring DENSITY, not an output ray count: Optiland returns the
      # survivors, which is 787,969 rays here and is the count every number in
      # the residual investigation (CHE-47, CHE-103, CHE-117) was measured at.
      num_rays: 512
      # The plane the trace is EXPORTED at. It must agree with the plane the
      # edge declares its OPL reference on, or C_RAY_TO_WAVE refuses with
      # REFERENCE_PLANE_MISMATCH -- correctly, since the two planes are a
      # pupil-to-focus distance apart.
      handoff_plane: exit_pupil
  - id: wave
    model: M_WAVE_CHROMATIX
    config:
      propagation: angular_spectrum
      # The ABSOLUTE target plane, not a distance. The adapter derives
      # `z = target_plane_z_m - input_field.z_m`, which is what makes the
      # `near_sensor_fine` variant a one-key change on the edge: move the
      # reconstruction upstream and the propagation distance follows.
      #
      # As committed the reconstruction is already at this plane, so the
      # distance is exactly zero and this node is a complex64 round trip. That
      # is not a defect of the graph -- it is the frozen configuration, and the
      # cost of the round trip is measured rather than assumed (the instance
      # reports the terminal field's residual beside the float64 one).
      target_plane_z_m: 4.90560476022521e-3
      # Zero padding. A zero-distance transfer function has no wraparound to
      # suppress, and padding would change the grid the measurement is taken on.
      pad_width: 0
edges:
  - id: sensor_reconstruction
    coupler: C_RAY_TO_WAVE
    source:
      node: lens
      # Ray bundle, not `wavefront`: C_RAY_TO_WAVE sums plane WAVELETS and needs
      # a direction per sample (CHE-34).
      port: rays
    target:
      node: wave
      port: input_field
    config:
      # The DECLARATION the coupler refuses to default (CHE-33/CHE-34): stating
      # the plane is what promotes Optiland's absolute opd into an optical path
      # length with a reference. Without it the edge fails with
      # OPL_REFERENCE_UNVERIFIED rather than reconstructing a plausible field.
      handoff_plane: exit_pupil
      handoff_plane_z_m: 6.814345991561233e-05
      # CHE-115 added this key. The declared plane is where the OPL is
      # REFERENCED FROM; this is the plane the field is RECONSTRUCTED AT, and
      # before it existed a graph document could name only `image_surface` or
      # `exit_pupil` -- so the sensor-plane handoff CHE-38 established as the
      # intended contract could not be written down as a graph at all.
      #
      # 4.90560476022521e-3 m is the declared paraxial image plane, which is
      # where M3 says the PSF is measured. NOT the best-focus plane, which sits
      # 7.1 um short and is reported as a named error term elsewhere rather than
      # quietly adopted.
      advance_to_z_m: 4.90560476022521e-3
      # 0.5 um and 256: constraint 2 of CHE-38's three, not the Nyquist limit --
      # 12.97 pixels per Airy radius, a 128 um window = 9.87 Airy radii, which
      # holds the 5-Airy-radius gate disc with margin for the wing metrics.
      target_sample_pitch_m: 0.5e-6
      grid_n: 256
      # Field-preserving, which is the correct convention for a coupler.
      # `sensor_obliquity` is the detector model of main-text eq 2 and belongs
      # to a measurement, not to a representation change.
      projection: asm_consistent
# The graph ends at the wave node's output field. PSF extraction is a
# MEASUREMENT (verification/psf_measurement.py), not a fourth node:
# C_FIELD_TO_PSF was retired by CHE-36 on the grounds that |U|^2 changes no
# representation. Pinned by
# tests/test_graph_validation.py::test_field_to_psf_is_not_a_registered_coupler.
design_variables: []
objectives:
  - name: focal_peak
    node: wave
    port: output_field
    metric: normalized_peak_intensity
    requires_gradient: false
verification:
  - id: handoff_power
    kind: conservation
    target: sensor_reconstruction
    tolerance: 0.001
require_verified_gradients: false
allow_cycles: false
metadata:
  description: >-
    The frozen B3-PSF-SINGLET configuration: a real Optiland trace of
    M3-SINGLET-REF at 512 hexapolar rings, exported at the exit pupil, advanced
    in the ray domain to the declared image plane, coherently reconstructed
    there by C_RAY_TO_WAVE onto a 256 x 256 grid at 0.5 um, and routed through
    M_WAVE_CHROMATIX. Forward-only: no gradient across this boundary is
    verified.
  family_id: B3-PSF-SINGLET
  instance_id: B3-PSF-SINGLET-01
  frozen_gate: fft_oracle_intensity_relative_l2 <= 1.0e-3, NOT_MET at 2.2072391812867093e-3
  m3_issue: CHE-115
  supersedes_for_this_gate: >-
    benchmarks/probes/quadrature_weight.py::characterize() and
    benchmarks/probes/sensor_handoff_convergence.py, which produced the frozen
    number by calling the coupler directly.
