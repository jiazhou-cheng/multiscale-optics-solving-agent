# Routing-critical facts for M_THERMAL_JAX_FEM.
# Field contract follows AGENTS.md "Initial Artifact Boundary".
# Grounded in: docker build of ./docker/Dockerfile (2026-07-30) +
# knowledge/solvers/jax_fem/probes/*.py run against that image.
# This supplements, and does not replace, knowledge/solver_cards/jax_fem.yaml.

id: jax-fem
role: M_THERMAL_JAX_FEM
package:
  name: jax-fem
  pinned_version: "0.0.12"
  install_source: "pip install jax-fem==0.0.12"
  install_hazard: >
    The published wheel declares ZERO dependencies (no Requires-Dist lines
    at all, not even jax or numpy -- confirmed by inspecting the wheel
    METADATA and the project's own pyproject.toml, which has no
    `dependencies = [...]` field). `pip install jax-fem` alone gives you an
    import that will fail the moment you touch real functionality. The
    official docs recommend `conda env create -f environment.yml` instead
    of pip. This project's docker/requirements.txt pins the real dependency
    set by hand, taken from that environment.yml: numpy, scipy, matplotlib,
    meshio==5.3.5, gmsh==4.15.2, fenics-basix==0.11.0, pyfiglet==1.0.4 --
    MINUS petsc4py (see blocker below).
  python_requires: ">=3.10 (per pyproject.toml; upstream's own conda env
    dogfoods python==3.13.13, untested by us at that version)"
official_docs: https://deepmodeling.github.io/jax-fem/
repository: https://github.com/deepmodeling/jax-fem
license: "GPL-3.0 (confirmed by fetching the actual LICENSE file at
  https://raw.githubusercontent.com/deepmodeling/jax-fem/main/LICENSE, full
  GPLv3 text). NOTE: PyPI's classifier metadata for this package
  misleadingly says 'License :: OSI Approved :: BSD License' -- do not
  trust the PyPI classifier for this package. GPLv3 is copyleft; consider
  this before bundling jax-fem source (not just invoking its CLI/API) into
  any distributed adapter code."
framework: jax
knowledge_pack: knowledge/solvers/jax_fem/

blocker:
  severity: critical
  summary: >
    The actual FEM solve entry point cannot be used at all in this
    environment. `jax_fem.solver` does an unconditional top-level
    `from petsc4py import PETSc`, so merely importing it raises
    `ModuleNotFoundError: No module named 'petsc4py'`. petsc4py has no
    prebuilt PyPI wheel (source-dist only; requires compiling PETSc from
    source with a Fortran compiler, BLAS/LAPACK, and typically MPI) and was
    deliberately not built into this lightweight pip-based image.
  what_still_works: >
    `jax_fem.problem` (Problem, Mesh, FiniteElement) and
    `jax_fem.generate_mesh` (rectangle_mesh, box_mesh, box_mesh_gmsh,
    cylinder_mesh_gmsh) import and run fine -- verified with a real 4x4
    rectangle mesh (see probes/mesh_probe.py). So problem/mesh construction
    works; only the linear/nonlinear solve step is blocked.
  follow_up_options:
    - "Build PETSc + petsc4py from source in the Docker image (gfortran,
      libopenmpi-dev, libblas-dev, liblapack-dev, then `pip install petsc
      petsc4py`) -- slow, adds real build complexity."
    - "Switch to a conda-based image (e.g. condaforge/miniforge3) and
      `conda install -c conda-forge petsc4py` for a prebuilt binary --
      matches the project's own documented install path."
    - "Re-check on refresh (package-refresh policy)
      whether a future jax-fem release makes petsc4py optional/lazy."
    - "Debian's apt DOES ship python3-petsc4py, but that installs into the
      system Debian Python's site-packages, not this image's
      from-source-built python:3.12-slim interpreter -- not a quick fix
      without changing the base image."
  do_not: >
    Do not hand-roll a replacement linear solver to work around this and
    call the result "jax-fem" -- that would misrepresent what the actual
    jax_fem.solver code path does (repository scientific-contract requirements: no
    fabricated solver output).

supported_regimes_if_unblocked:
  - steady-state Poisson / linear elasticity (per official Quickstart)
  - topology optimization (jax_fem.mma exists: method of moving asymptotes)
  - transient/thermal problems (per project's intended M_THERMAL_JAX_FEM use)
derivative:
  mode: implicit
  verified: false
  verified_note: >
    Not probed at all -- the solve entry point that would be differentiated
    is unreachable (see blocker). Do not set any derivative claim for this
    solver until the blocker is resolved and a real gradient probe passes.
devices_reported: [cpu, gpu]
devices_tested: []
input_output_artifacts:
  - meshio.Mesh (mesh generation output, confirmed real)
  - jax_fem.problem.Problem (subclassing contract, not yet exercised end-to-end)
known_conventions: see conventions.md
limitations_and_failure_modes: see failure_guide.md
validated_probe_ids:
  - import_probe (passed, 2026-07-30; observes the pyfiglet banner side effect)
  - mesh_probe (passed, 2026-07-30; real 4x4 rectangle mesh, meshio.Mesh output)
  - solver_failure_probe (EXPECTED FAILURE captured, 2026-07-30; regression
    check -- re-run on every refresh, see package-refresh policy)
not_yet_probed:
  - >-
    everything in knowledge/solver_cards/jax_fem.yaml required_probes, all
    BLOCKED by the petsc4py issue -- one-dimensional analytic
    heat-conduction case, mesh-convergence study, total heat-source
    conservation after transfer, directional derivative of conductivity or
    source amplitude
adapter_location: not yet implemented (src/multiscale_optics_agent/adapters/
  only has base.py as of 2026-07-30)
validation_status: unvalidated
recommendation_for_registry: >
  src/multiscale_optics_agent/registry/models.yaml's M_THERMAL_JAX_FEM entry
  should carry an explicit caveat that this model is not currently
  executable end-to-end in the agent_solver environment, pending a
  petsc4py-capable image. Do not route a benchmark or planner decision to
  M_THERMAL_JAX_FEM until that caveat is either resolved or explicitly
  accepted by whoever is running the benchmark.
