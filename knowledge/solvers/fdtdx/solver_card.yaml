# Routing-critical facts for M_EM_FDTDX.
# Field contract follows AGENTS.md "Initial Artifact Boundary".
# Grounded in: agent_solver Docker image (docker/requirements.txt, fdtdx==0.6.2)
# + knowledge/solvers/fdtdx/probes/*.py run against that image on 2026-07-30.
# This supplements, and does not replace, knowledge/solver_cards/fdtdx.yaml.

id: fdtdx
role: M_EM_FDTDX
package:
  name: fdtdx
  pinned_version: "0.6.2"
  install_source: "fdtdx==0.6.2"  # real PyPI package, no namesquat/org-move hazard
  python_requires: ">=3.11,<3.14"
official_docs: https://fdtdx.readthedocs.io/en/latest/
repository: https://github.com/ymahlau/fdtdx
license: not confirmed in this pass (check pyproject.toml before publishing benchmarks)
framework: jax
supported_regimes:
  - 3D full-wave FDTD (Yee-grid style), periodic or PML boundaries
  - dispersive materials (Lorentz/Drude pole models)
  - GDS-imported geometry (extruded polygons)
  - S-parameter extraction workflow (calculate_sparam(s), setup_sparams_simulation)
  - inverse-design parameterization utilities (Device, ParameterContainer, TanhProjection, SubpixelSmoothedProjection)
  - detectors: EnergyDetector, FieldDetector, PhasorDetector, ModeOverlapDetector, PoyntingFluxDetector
derivative:
  mode: native_autodiff (claimed) / time-reversed adjoint via full_backward (intended mechanism)
  verified: false
  verified_note: >
    Both directional-derivative probes in probes/gradient_probe.py FAILED to
    produce a trustworthy result:
    (1) jax.grad w.r.t. source wavelength returned exactly 0.0 while a
    centered finite-difference estimate gave a large nonzero value
    (~-1.02e6) -- a phantom zero gradient, plausibly from an internal
    round()-based step-count discretization that blocks AD.
    (2) jax.grad w.r.t. background permittivity, passed directly into
    Material(permittivity=<traced>) and then through place_objects(),
    raised jax.errors.ConcretizationTypeError: place_objects() performs
    concrete Python-level introspection (math.isclose on permittivity
    components) that cannot be traced.
    Neither the naive "close over a traced scalar and call place_objects
    inside jax.grad" pattern works. The package's real differentiable
    pattern is almost certainly: build the object graph once with concrete
    values (place_objects), then differentiate only through
    apply_params(arrays, objects, params, key) + run_fdtd with respect to
    the `params` pytree -- this was NOT worked out in this pass. Do not
    trust derivative.mode for ANY parameter until that path is probed.
devices_reported: [gpu (default), tpu, cpu, METAL]
devices_tested: [cpu]
dtypes_observed: [float32]
input_output_artifacts:
  - fdtdx.fdtd.container.ArrayContainer / FieldState (fields.E, fields.H) -> maps to project artifacts `near_field_surface` / `vector_field`
known_conventions: see conventions.md
cost_scaling: "O(time_steps * grid_cells); grid_cells = volume / resolution^3"
limitations_and_failure_modes: see failure_guide.md
validated_probe_ids:
  - import_probe (passed, 2026-07-30)
  - propagation_probe (passed, 2026-07-30; vacuum/periodic-boundary Gaussian source, no analytic oracle comparison yet)
  - gradient_probe (both sub-probes FAILED as designed to surface real problems -- see derivative.verified_note; this satisfies repository gradient-verification requirement by documenting a genuine broken case, not a passing gradient test)
not_yet_probed:
  - Fresnel interface / waveguide mode (required_probes item, not done)
  - PML boundary + domain-size convergence (probe above used periodic boundaries only)
  - dedicated near-field/phasor monitor convention (only EnergyDetector's real-valued field array convention is confirmed)
  - the correct Device/ParameterContainer-based differentiable pattern
  - S-parameter extraction workflow (calculate_sparam)
  - CPU/GPU numerical agreement (no GPU in this environment)
adapter_location: not yet implemented (src/multiscale_optics_agent/adapters/ only has base.py as of 2026-07-30)
validation_status: unvalidated
