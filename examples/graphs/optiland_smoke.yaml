schema_version: 0.1.0
task_id: null
nodes:
  - id: lens
    model: M_RAY_OPTILAND
    config:
      sample: ReverseTelephoto
      backend: numpy
      wavelength: 0.55
      Hx: 0.0
      Hy: 0.0
      num_rays: 16
metadata:
  description: >-
    Single-node forward-only smoke graph for M_RAY_OPTILAND, mirroring
    benchmarks/probes/optiland/raytrace_probe.py: the bundled
    ReverseTelephoto sample lens traced on the default (non-differentiable)
    numpy backend. No edges, design variables, or objectives -- this graph
    only exercises node/model validation against the packaged registry.
    config['wavelength'] is supplied to Optiland in its verified native
    micrometre unit; the adapter persists wavelength and position in SI while
    preserving RealRays.opd as a native, reference-unverified value.
