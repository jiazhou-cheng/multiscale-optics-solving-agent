    destination: Regenerated alongside inventory.yaml.
  - path: benchmarks/README.md
    bucket: C
    justification: >-
      Describes the per-task `benchmarks/levelN/<task_id>/` layout -- task.md,
      public_config.yaml, oracle_graph.yaml, cases/public, cases/hidden -- which is
      the retired design, and points at a `level2/` path that no longer exists.
      Rewritten rather than deleted; see pending_edits.

  # =========================================================================
  # src/agent/
  # =========================================================================
  - path: src/agent/benchmark_suite.py
    part: the harness
    bucket: A
    justification: >-
      Three declared context policies, the 8-code outcome taxonomy with its
      remedies, trial arithmetic reporting a rate over declared trials,
      void-vs-failed separation, the pluggable `command:` participant, and
      first-stage-that-failed grading. None of this is specific to the A1 tasks.
    destination: >-
      Stays in src/agent/ as the agent-evaluation harness (M9), which consumes
      VerificationResult rather than grading physics itself.
  - path: src/agent/benchmark_suite.py
    part: the six _reference_A1-* implementations and AgentTask entries
    bucket: C
    justification: The task definitions in the retired A1 id space.
  - path: src/agent/benchmark_suite.py
    part: the closed forms inside the six task definitions
    bucket: A
    justification: >-
      Five analytic oracles, each VERIFIED against the pinned solver before it
      shipped, each with a measured tolerance basis: R/(n-1) and EFL - t/n
      (1e-13 relative measured); t(1-1/n) (3.750048 mm real trace, 1.3e-5 from the
      closed form); w0 sqrt(1+(z/zR)^2) (6.040167 vs 6.039084 um, 1.8e-4);
      0.61 lambda/NA (6.65 vs 6.4985 um, a 2.3% sampling limit not a physics error);
      z tan(theta) (+17.5017 vs +17.4977 um, 2.3e-4). Plus the two MEASURED traps:
      Optiland's add_layer um/nm slip returning 0.04216384 against bare glass's
      0.04216456, and Chromatix's kykx meaning cycles-per-length on asm_propagate
      and radians-per-length on plane_wave, with the displacement opposite in sign.
    destination: >-
      Oracles of B1-RAY-EFL, B1-RAY-PLATE, B1-WAVE-GAUSS, B1-WAVE-AIRY,
      B1-WAVE-TILT; traps become B0-UNITS-01 and B0-UNITS-02, where contract
      status is `ok` and the physics is wrong.
  - path: src/agent/__init__.py
    bucket: A
    justification: Package marker for the agent harness.
    destination: Unchanged.

  # =========================================================================
  # src/verification/ -- benchmark-facing parts
  # =========================================================================
  - path: src/verification/claim_ledger.py
    bucket: A
    justification: >-
      A hand-maintained proto-schema for exactly this architecture: Oracle,
      OracleIndependence, GateStatus, ClaimKind, StochasticEvidence,
      tolerance-with-basis, and the enforced rule that a SHARES_CODE oracle cannot
      gate. Reuse the enums; do not fork them.
    destination: >-
      Enums move to the family schema; CLAIMS becomes a PROJECTION of the family
      registry so the two cannot drift (M0.5.2).
  - path: src/verification/psf_oracles.py
    bucket: A
    justification: >-
      The independent analytic PSF oracles. Expensive to derive and the only
      independent deciders the composed families have.
    destination: B3-PSF-SINGLET oracle callables.
  - path: src/verification/metrics.py
    bucket: A
    justification: >-
      The centralized metric definitions (CHE-112), promoted from an M2
      deliverable to a substrate one. NCC, relative L2 on field, relative L2 on
      intensity, power ratio and MSE-unit-sum each had more than one
      implementation, so a benchmark and its own probe could disagree about what
      a number means. Every definition states what it is blind to, and
      tests/test_metrics.py demonstrates each blind spot rather than asserting it.
    destination: >-
      Referenced by Metric.definition on every family; the single source for
      what a metric name means.
  - path: src/verification/psf_measurement.py
    bucket: A
    justification: PSF metric measurement -- Strehl, first null, encircled energy, residual L2.
    destination: src/verification/metrics.py (M2.4), one canonical definition each.
  - path: src/verification/asm_oracle.py
    bucket: A
    justification: >-
      The repository's own float64 ASM/RS propagator (O2). Genuinely useful
      characterization evidence that must NEVER decide a gate -- L2-PSF-01 once set
      a negative-control floor from an O2 comparison and had to retire it as
      circular.
    destination: >-
      Oracle kind with independence SHARES_CODE, structurally barred from gating.
  - path: src/verification/analytic.py
    bucket: A
    justification: >-
      The five closed forms promoted out of the retired A1 task set before it was
      deleted, each with the measured agreement against the pinned solver that its
      tolerance was derived from, the wrong answer that tolerance rejects, and
      where relevant what it deliberately does NOT separate.
    destination: >-
      Oracles of B1-RAY-EFL, B1-RAY-PLATE, B1-WAVE-GAUSS, B1-WAVE-AIRY and
      B1-WAVE-TILT, authored by M1.1 and M1.2.
  - path: src/verification/fixed_suite.py
    bucket: A
    justification: >-
      The FIXED-V1 selection itself (CHE-135). The choice is the deliverable, so
      it lives in one reviewable place; a test rejects any justification
      reducible to "it already existed".
    destination: The versioned manifest under benchmarks/instances/.
  - path: src/verification/hazards.py
    bucket: A
    justification: >-
      The two measured traps, with the numbers the mistaken code actually returns:
      Optiland's add_layer um/nm slip at 0.04216384 against bare glass's
      0.04216456, and Chromatix's kykx meaning cycles-per-length on asm_propagate
      and radians-per-length on plane_wave with the displacement opposite in sign.
      Both report an `ok` contract, which is what makes them the archetype.
    destination: B0-UNITS-01 and B0-UNITS-02, authored by M1.3.
  - path: src/verification/status.py
    bucket: A
    justification: >-
      The seven verification statuses, in their own module because both the
      family schema and the verifier need them. They exist separately because a
      pass/fail boolean cannot tell "the solver refuses this dtype" from "the
      approximation does not apply here" from "it ran and the number is wrong".
    destination: >-
      VerificationResult.status (M0.5.3) and BenchmarkFamily.failure_semantics.
  - path: src/verification/declaration_ledger.py
    bucket: A
    justification: >-
      The one place that maps every registry declaration -- 52 assumptions,
      warnings, hard limits and invariants across six components -- to the
      evidence that it is not merely prose. Asserted complete in BOTH directions:
      a declaration with no entry is a gap, an entry whose declaration was edited
      or deleted is orphaned, and every evidence reference is resolved against the
      tree rather than trusted as a string. Closes the same completeness gap M1.3
      and M2.4 each asked for separately.
    destination: >-
      B0-CONTRACT's declaration coverage and M2.4's invariant battery, from one
      source of truth rather than two hand-maintained lists.
  - path: src/verification/evidence.py
    bucket: A
    justification: >-
      The join between an executed instance and a VerificationResult: run and
      verify, fit a convergence exponent WITH its slope standard error, judge a
      broken twin against the gate's own threshold, take ensemble statistics with
      ddof=1, hash a scientific fingerprint, and write a provenance-stamped
      record. It lives here rather than in runtime/ because the dependency has to
      run that way -- an executor that imported verification/ could grade its own
      run.
    destination: >-
      Every family driver under benchmarks/instances/; the shared half of what
      each of them would otherwise reimplement.
  - path: src/verification/refusals.py
    bucket: A
    justification: >-
      The refusal catalogue: for every ContractCode, what triggers it, what would
      fix it, and which of the five negative outcomes it is. A test fails if a
      code has no entry or an entry names a code that no longer exists.
    destination: >-
      B0-CONTRACT's oracle, and the structured-refusal half of M3.2's discovery
      API.
  - path: src/verification/result.py
    bucket: A
    justification: >-
      VerificationResult and its parts: Measurement (a number cannot be reported
      without an uncertainty and a basis), MetricResult carrying whether its
      tolerance may gate, declared-versus-observed validity, the negative-control
      outcomes including FIRED_BACKWARDS, and the structured diagnostic codes.
      No top-level pass boolean and no scalar score.
    destination: >-
      The structure every scientific verdict this project makes is reported in;
      schemas/verification_result.schema.json is generated from it.
  - path: src/verification/verifier.py
    bucket: A
    justification: >-
      verify(family, instance, execution_record). Re-evaluates the family's
      validity predicates against the parameters the run actually realized rather
      than trusting the instance's declaration, and reads no committed record as
      truth.
    destination: The single entry point fixed evaluation and future RL both call.
  - path: src/verification/families/__init__.py
