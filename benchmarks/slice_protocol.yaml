    rms_waves: 0.0895
    peak_to_valley_waves: 0.3003
    rayleigh_quarter_wave_limited: false
    marechal_valid_regime: true
    chosen_this_way_because: >-
      past the 0.25-wave Rayleigh criterion, so unambiguously not diffraction
      limited, while still inside Marechal's ~0.1-wave validity regime. A more
      strongly aberrated case would leave that regime and make the Strehl
      cross-check meaningless.
    airy_profile_relative_l2: 8.954e-2      # 15x the diffraction-limited case
