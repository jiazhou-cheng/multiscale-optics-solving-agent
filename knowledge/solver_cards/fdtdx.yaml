id: fdtdx
validation_status: unvalidated
role: M_EM_FDTDX
framework: jax
official_docs: https://fdtdx.readthedocs.io/
repository: https://github.com/ymahlau/fdtdx
install:
  source: "fdtdx==0.6.2"  # real PyPI package, pip install fdtdx works directly
  pinned_version: "0.6.2"
  python_requires: ">=3.11,<3.14"
  environment: docker/Dockerfile (image `agent_solver`), see docker/requirements.txt
  hazard: >
    The GitHub main-branch README example uses a `grid=fdtdx.UniformGrid(...)`
    SimulationConfig field that does NOT exist on the pinned 0.6.2 wheel
    (AttributeError). Use `resolution=<meters>` instead. See failure_guide.md.
knowledge_pack: knowledge/solvers/fdtdx/  # conventions.md, capability_notes.md, api_minimal_examples.md, failure_guide.md, probes/
agent_should_use_for:
  - general full-wave electromagnetic structures
  - raw near-field monitors
  - absorbed-power fields
  - differentiable small-to-medium inverse-design problems (pending a working gradient path, see below)
agent_should_not_assume:
  - grid, PML, or simulation duration are converged
  - monitor output is already power normalized
  - reverse-mode memory is acceptable for every domain
  - field array axis order is (x, y, z, component) -- it is (component, x, y, z), confirmed
  - jax.grad over the naive setup+run function produces a correct gradient for any parameter -- two attempts both failed (phantom zero for wavelength, ConcretizationTypeError for permittivity); see knowledge/solvers/fdtdx/conventions.md
required_probes:
  - vacuum/plane-wave propagation  # done, see knowledge/solvers/fdtdx/probes/propagation_probe.py
  - Fresnel interface or waveguide mode  # not yet done
  - PML and domain-size convergence  # not yet done (probe above used periodic boundaries)
  - near-field monitor convention  # partially done (EnergyDetector array convention confirmed; no dedicated phasor/near-field monitor probed)
  - directional derivative and memory scaling  # attempted and FAILED both ways tried; documented honestly, not verified -- see knowledge/solvers/fdtdx/solver_card.yaml derivative.verified_note
benchmarks: [L1-EM-01, L2-GRATING-01, L2-THERMO-01, L3-ROBUST-01]
