schema_version: 0.1.0
task_id: null
nodes:
  - id: lens
    model: M_RAY_OPTILAND
    config:
      sample: ReverseTelephoto
      backend: numpy
      wavelength: 0.55
      Hx: 0.0
      Hy: 0.0
      num_rays: 16
metadata:
  description: >-
    Single-node forward-only smoke graph for M_RAY_OPTILAND, mirroring
    knowledge/solvers/optiland/probes/raytrace_probe.py: the bundled
    ReverseTelephoto sample lens traced on the default (non-differentiable)
    numpy backend. No edges, design variables, or objectives -- this graph
    only exercises node/model validation against the packaged registry.
    config['wavelength'] is in optiland's native, independently-unverified
    length unit (see src/multiscale_optics_agent/adapters/optiland_adapter.py
    module docstring), not SI meters.
