not_yet_probed:
  # knowledge/README.md makes this list a gate on unattended execution, so a
  # stale entry either blocks validated work or teaches readers to discount the
  # list. Two entries have been cleared and removed rather than left: GPU device
  # placement, and the dedicated gpu-marked suite -- 48 passed in 69 s on one
  # RTX A6000, 2026-08-20 and re-confirmed 2026-08-22. What remains untested:
  - TPU. Never attempted, and Optiland reports no TPU device.
  - more than the two devices this project's policy allows at once (AGENTS.md)
  - pupil power and coordinate orientation
  - a system whose exit pupil is real rather than virtual (both M3 systems are
    virtual -- CHE-32)
  - off-axis fields beyond Hy = 0.2 through the full slice (CHE-41 exported and
    verified the object-space reference at one off-axis field; the exit-pupil
    handoff itself is still only pinned at Hx=Hy=0 -- CHE-32)
  - an off-axis field in x, or in both axes at once (CHE-41 used y only and did so
    deliberately, because a one-axis field is what makes the transpose control
    non-vacuous)
  - the object-space reference for a finite-object launch, where the launch state
    is a point rather than a plane
  - hard-stop / vignetting non-smoothness UNDER AUTOGRAD. CHE-57 found the
    numpy-path consequence (see derivative.optimizer_hazard), but the torch
    autograd behaviour across a hard stop is still untested.
  - the full repository gradient test at float64 (CHE-57 established the
    convergence table in a tutorial reproduction, not in a gradient test)
adapter_location: src/solvers/optiland/adapter.py
# One of the three values on knowledge/README.md's ladder, and nothing else.
# The qualifier that used to be smuggled into this string now has its own field:
# it is informative and should be separated from the ladder value, not lost.
validation_status: environment_verified
validation_scope: >-
  NumPy CPU/float64 forward tracing, plus torch CUDA float32/float64 tracing
  with a gradient. Sequential geometric optics only.
validation_note: >
  CHE-12 verified the pinned CPU environment and native geometry/wavelength
  units. CHE-13 stabilizes the standalone deterministic ray-state contract.
  CHE-17 adds L1 analytic accuracy evidence for free space, ideal paraxial
  focus, and one catalog plano-convex prescription. CHE-16 adds fixed-case
  sampling, determinism, CPU runtime, and memory evidence. CHE-30 establishes
  the RealRays.opd convention -- quantity, sign, reference plane, and unit --
  see opd_convention above. CHE-32 adds the exit-pupil handoff plane and the
  adapter-owned M3SingletRef system, both pinned at the M1 standard -- see
  exit_pupil_handoff and adapter_owned_systems above -- without moving the
  default image-surface export. Registered M1 capability is NumPy CPU/float64
  forward tracing only; GPU, float32, gradients, and broader prescriptions
  remain unverified.

# --- Routing guidance, merged from the deleted flat card (CHE-92) -------------
#
# The only content the flat routing card carried that this one did not. Kept
# verbatim in substance: it answers "should I reach for this solver?", which is
# a different question from everything else on this card and the one a planner
# asks first.
agent_should_use_for:
  - sequential lens tracing
  - wavefront and aberration analysis
  - lens-parameter optimization (torch backend only)
  - the ray leg of the ray-to-wave slice
agent_should_not_assume:
  - every analysis object preserves gradients
  - hard stops and vignetting are smooth
  - exported ray weight is already a coherent field amplitude
  - >-
    a bare `pip install optiland` gives you differentiability. It does not:
    torch is not a declared dependency, so the default install is NumPy-only
    and `optiland.backend.supports_gradients` is False. See package.install_hazard.
  - >-
    the ray count returned by trace(num_rays=N) equals N. Aperture and pupil
    sampling change it; 16 requested has been observed to yield 817 traced.
