  diffraction_limited:
    analytic_airy_profile_relative_l2: 5.866e-3
    analytic_airy_profile_max_abs: 4.613e-3
    first_null_ratio_measured_over_analytic_same_grid: 0.99632
    first_null_estimator_bias_at_frozen_sampling: 0.1093
    first_null_method: >-
      the same estimator is run over the analytic pattern sampled on the same
      grid and the comparison is the RATIO. At 2.44 pixels per Airy radius the
      estimator reads an exactly known Airy null 10.9% high, so an absolute
      comparison against 0.61 lambda/NA would be measuring the estimator.
    pupil_wavefront_pv_waves_at_the_frozen_plane: 0.016999
