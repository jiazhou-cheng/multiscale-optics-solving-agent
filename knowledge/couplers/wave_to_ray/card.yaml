# Routing-critical facts for C_WAVE_TO_RAY.
# Contract follows AGENTS.md "Initial Artifact Boundary" and the frozen
# M2-COUPLER-CPU-V1 boundary table in benchmarks/protocols/m2_coupler_protocol.md.
# Grounded in: knowledge/papers/raywave_tracing/ (DOI 10.1021/acsphotonics.6c00818),
# main text eq 1 and Figure 1c; SI S2 (eqs S1-S5), S3 (eqs S6-S9),
# S4 (Algorithm S1), S7 (Algorithm S2).

id: wave_to_ray
role: C_WAVE_TO_RAY
direction: complex_field -> ray_bundle
transformation: >
  angular-spectrum decomposition, evanescent cut, importance-weighted Monte
  Carlo sampling of propagating plane-wave modes into rays

scientific_source:
  doi: 10.1021/acsphotonics.6c00818
  equations: [main_text_eq_1, main_text_eq_4, S1, S2, S3, S4, S5, S6, S7, S8, S9]
  algorithms: [Algorithm_S1, Algorithm_S2, Algorithm_S3]
  figures: [Figure_1c, Figure_3c, Figure_4, SI_Figure_S3, SI_Figure_S4, SI_Figure_S6]
  reference_implementation: https://github.com/jiazhou-cheng/raywave-tracing
  reference_implementation_status: >
    NOT vendored, NOT pinned, NOT executed by this repository. No claim here may
    cite it as evidence.

framework: numpy
frameworks_deliberately_avoided:
  - reason: coupler core is the physics under test; see ../ray_to_wave/card.yaml
    forbidden_imports: [optiland, chromatix]

estimator:
  target_integral: >
    U_obs(r) = double-integral of U_tilde(ku,kv) exp(i(ku x + kv y + kn d)) dku dkv   (eq S2)
  statement: >
    This coupler is a quadrature scheme for an integral whose exact value is
    known, not an approximation of the physics. That is why enumerating every
    propagating bin must reproduce the deterministic reference exactly, and why
    that check is mandatory before any stochastic claim.
  amplitude: a_i = U_tilde(ku_i, kv_i) / p(ku_i, kv_i)      # eq 1 / eq S4
  direction: d_hat_i = (ku_i, kv_i, kn_i) / k
  normal_component: kn = +sqrt(k^2 - ku^2 - kv^2)
  normalization: 1/N                                          # eq S5
  launch_phase: phi = ku * x_p + kv * y_p                     # Algorithm S1 line 9
  evanescent_rule: ku^2 + kv^2 > k^2 discarded; discarded power reported as a named loss
  unbiasedness_mechanism: >
    The 1/p importance weight. Rays drawn from high-density regions carry
    proportionally less weight. Omitting it while sampling non-uniformly
    produces a confidently wrong field that still looks like a field.

sampling_densities:
  - id: p_uni
    definition: uniform over propagating bins
    note: robust; assumes nothing about the spectrum
  - id: p_mag
    definition: proportional to |U_tilde(ku,kv)|
    note: >
      Faster for spectra concentrated in a single lobe (Figure 4a, metalens);
      comparable to uniform for multilobed spectra (Figure 4b, Siemens star).
      Paper calls it robust and generally effective, with that caveat.

sampling_is_an_input: >
  The core takes pre-drawn spectral indices as an argument; drawing them is a
  separate seeded step. Bitwise determinism is then trivial, one implementation
  serves both the reference and the gradient study, and Algorithm S2's
  "directions held fixed during backpropagation" becomes structural rather than
  a detail to remember.

cascade:
  algorithm: Algorithm_S1
  applies_to: planar surfaces only
  rule: >
    Accumulate ALL incident rays into U_in on the common plane, apply the DOE
    transmission once, take one global FFT, then resample a caller-specified
    budget of P launch positions times S secondary rays. Outgoing ray count is
    the budget P*S, not the product of incoming and secondary counts.
  preserves: coherent interference at the plane
  not_applicable_to: >
    Conformal (curved) DOEs. Rays there strike different local tangent planes
    with position-dependent frames and normals, so there is no common plane to
    accumulate onto. The direct per-patch implementation is retained, and patch
    size is then bounded by the curvature condition below.

validity_conditions:
  - id: curvature_bound
    statement: eps_curv <= arcsin(D / (2 R))      # eq S9 / main text eq 4
    independent_of: the DOE phase profile
    planar_limit: R -> infinity gives eps_curv -> 0
    assumptions: [one principal curvature direction at a time, quadratic sag, D << R]
    enforcement: executable precondition with a structured diagnostic (CHE-27)
  - id: evanescent_fraction
    statement: >
      A large discarded-power fraction is the signature of a field that should
      not be turned into rays at all.
    enforcement: reported as a named loss term, never absorbed silently
  - id: grazing_bin
    statement: kn = 0 at the propagating/evanescent boundary is singular for 1/kn-type factors.
    enforcement: excluded by default and recorded as an open question

stochastic_contract:
  reproducibility: bitwise for a given (seed, configuration)
  reproducibility_is_not_accuracy: >
    A bitwise-reproducible wrong answer is the failure mode this separation
    exists to catch.
  required_evidence:
    - exactness limit under full bin enumeration, tolerance derived from dtype round-off
    - unbiasedness within 3 standard errors over >= 32 seeds, tolerance IS the measured standard error
    - fitted convergence exponent -0.5 +/- 0.1 over >= 5 sweep points
    - variance comparison between p_uni and p_mag at matched N
  forbidden:
    - reporting a single realization as the accuracy result
    - selecting the best of several seeds
    - tuning N or the realization count after seeing the metric
  why_single_realization_is_forbidden: >
    SI Figures S3/S4: a converged system still looks speckled in one
    realization, and an undersampled one produces strong seed-dependent
    speckle across the whole plane. The distinction between physical speckle
    and Monte Carlo noise IS reproducibility across seeds, so it cannot be
    assessed from one seed.

derivative:
  mode: fixed_direction_estimator
  mechanism: >
    Sampled wavevector and resulting ray direction held FIXED during
    backpropagation; p detached; gradients flow only through U_tilde in the
    amplitude a = U_tilde / p.detach().   (SI S7.2, Algorithm S2)
  verified: false
  known_biased: true
  measured_2026_08_12: >
    CHE-28 finding, and the opposite of what the issue expected. In the regime
    this repository implements -- a FIXED spectral grid and a fixed observation
    plane -- the fixed-direction estimator is not detectably biased. Over 32
    realizations at N=2048 the surrogate mean sits within 1 standard error of
    the true derivative for both a linear functional and a windowed-intensity
    functional after 20 um of propagation, and stays inside 3 SE across N from
    512 to 32768 while the standard error falls ~8x.

    The reason is structural: on a fixed spectral grid the sampled direction is
    a property of the BIN, not of the DOE parameter, so there is no direction
    gradient to neglect. The paper's caveat describes the continuous-wavevector
    formulation -- the situation SI S7.3's Gumbel-Softmax relaxation exists to
    address.

    What IS measurable is the reverse: detaching the sampling density is what
    makes the estimator unbiased, not what biases it. Letting p track the
    parameter biases the quadratic objective's gradient by 26 standard errors,
    because detaching drops exactly the term the omitted score-function term of
    the discrete sampling distribution would have cancelled.

    This does NOT promote the claim. One parameter, one grid, one wavelength,
    two objectives, no vector or chromatic path, and no optimization loop.
    verified stays false.
  omitted_terms:
    - score-function term of the discrete sampling distribution
    - gradients associated with changes in the sampled secondary-ray directions
  two_quantities_not_to_conflate:
    - derivative of the fixed-direction surrogate objective (estimator should compute this exactly)
    - derivative of the true objective (estimator is biased with respect to this, by construction)
  paper_position: >
    Neglects direction gradients, but provides low-variance gradients
    sufficient for stable DOE optimization.
  rejected_alternative:
    id: gumbel_softmax
    source: SI S7.3, Algorithm S3, eqs S11-S15
    forward_bias: none (Gumbel-max identity, eq S12, preserves the sampling distribution)
    backward: approximate, generally biased surrogate
    temperature_used: 3
    rejection_reason: >
      Memory. Retains an N_t x qD x qD tensor per batch, and both N_t and qD
      must be large for accurate Monte Carlo ray-wave simulation.
    m2_status: documented, not implemented

supported_regimes:
  - scalar, monochromatic, fully coherent
  - planar tangent patch
  - CPU, float64 / complex128 (the reference numerics)
  # CHE-60/CHE-61 (PB4a/PB4b). Was 'CPU, float64 / complex128' alone.
  - CPU or CUDA, float32 / complex64, with the round trip measured at 8.3e-07
    (L2) on host and device alike against an enforced 2e-5 bound
    (docs/precision/precision_device_policy.md)
unsupported_regimes:
  - vector fields and polarization
  - chromatic / broadband
  - partial coherence
  # 'GPU and TPU' stood here until CHE-68. GPU is verified; TPU is not.
  - TPU. Never attempted on any device this project has access to.
  - NumPy on CUDA. NumPy cannot hold device memory, so CUDA is a JAX-only path
    for this coupler.
  - conformal DOE inverse design

# CHE-68: was [cpu] / [complex128], which was true at M2 and stale after PB4.
# core/capabilities.py is the machine-readable source; this card summarises it.
devices_tested: [cpu, cuda]
dtypes_validated: [complex128, complex64]
device_and_precision_note: >
  CHE-60/CHE-61. complex128 on the CPU remains the reference, and the stochastic
  evidence ladder below (exactness limit, unbiasedness, N^-1/2 convergence,
  variance by sampling density) was established there and is not re-derived at
  complex64. What is tested on the device is that a wave->ray round trip stays on
  the GPU with no silent host copy
  (tests/test_precision_execution_matrix.py, marked gpu, not re-run since
  CHE-60). Sampling reproducibility is seed-based and independent of device.
validated_probe_ids:
  - >
    engine_independence (passed, 2026-08-12; CHE-25). AST scan confirms the core
    imports neither optiland nor chromatix.
  - >
    exactness_limit (passed, 2026-08-12; CHE-25). Enumerating every propagating
    bin with the 1/p weight reproduces the source field at round-off:
    relative 1.41e-15 on a multilobed (random) field and 8.88e-16 on a
    concentrated (Gaussian) field, against a bound derived from float64
    round-off over an M-term coherent sum. This is the mandatory first check --
    it removes sampling as an excuse before any stochastic claim.
  - >
    centered_dft_pairing (passed, 2026-08-12). The spatial origin is index n//2,
    so the transform must be centered on both sides. Pinned as a test because
    pairing the n//2 origin with an ordinary transform leaves an exp(-i pi m)
    offset per axis and the reconstruction misses the field entirely.
  - >
    evanescent_accounting (passed, 2026-08-12). At a 200 nm pitch (below
    lambda/2) 129 of 256 bins propagate and 45.50 percent of the spectral power
    is evanescent and discarded. Reported as a named loss. Control: at a 1 um
    pitch every bin propagates and the fraction is exactly zero.
  - >
    bitwise_determinism (passed, 2026-08-12). Identical (seed, configuration)
    gives identical wavevectors, amplitudes and reconstructed field; different
    seeds give different realizations, so determinism is not achieved by
    ignoring the seed.
  - >
    unbiasedness (passed, 2026-08-12; CHE-25). Ensemble mean over 32 independent
    seeds at N=2048 agrees with the deterministic reference within 3 standard
    errors, for both p_uni and p_mag, on a scalar linear functional (the overlap
    with the true field). The tolerance IS the measured standard error.
  - >
    convergence_order (passed, 2026-08-12; CHE-25). Fitted exponent over a
    six-point sweep from N=256 to 8192: -0.4924 for p_uni and -0.4930 for p_mag
    on a multilobed field, against the required -0.5 +/- 0.1. Gated on the
    fitted exponent, not on the error at one N.
  - >
    variance_by_density (passed, 2026-08-12; CHE-25). RMS error at matched
    N=1024. Concentrated Gaussian spectrum: 1.499e-01 (p_uni) versus 2.673e-02
    (p_mag), a 5.6x advantage. Multilobed random spectrum: 6.700e-01 versus
    5.888e-01, a 1.14x advantage. Consistent with the paper's Figure 4 claim
    that magnitude-proportional sampling exploits spectral concentration and is
    only comparable to uniform without it.
  - >
    negative_controls 4/4 detected (passed, 2026-08-12). Importance weight
    omitted (biased beyond 3 SE under p_mag), evanescent bin selected (refused),
    kn sign flipped (detected in the emitted directions), launch phase omitted
    (detected for multi-position emission).
  - >
    negative_control_blind_spots (passed, 2026-08-12). Two recorded traps,
    each pinned as its own test. Under p_uni the missing 1/p weight is a
    constant scale factor equal to the propagating-mode count, so the bias test
    would pass for the wrong reason and must be run under p_mag. The launch
    phase is exactly 1 at a single centred position, so it must be tested with
    off-centre launches.
  - >
    inconsistent_density_refused (passed, 2026-08-12). A density that is zero
    where the spectrum is nonzero is refused, because those modes are never
    drawn and no 1/p reweighting can recover them -- inconsistent, not merely
    noisy.
  - >
    ray_budget (passed, 2026-08-12). Output count is the caller's P*S budget,
    not a function of the input size. Feeds the Algorithm S1 cascade in CHE-26.

  - >
    round_trip_and_cascade (passed, 2026-08-12; CHE-26).
    wave -> rays -> wave is exact in the enumeration limit (relative RMS < 1e-14)
    and converges at the Monte Carlo rate under sampling;
    rays -> wave -> rays recovers the modal amplitudes to 1e-10; and two
    deliberately mismatched pairings (flipped phasor, mismatched obliquity
    convention) each break the round trip, which is what makes the exactness
    result mean anything. Algorithm S1 holds the ray count at the caller's P*S
    budget across a two-surface cascade, a pure-phase DOE conserves discrete
    power to 1e-10, and a 0.5-amplitude DOE gives exactly 0.25.
  - >
    curvature_bound (passed, 2026-08-12; CHE-27). eq S9 bounds the measured
    locally-extracted direction error across R = 1k/10k/100k wavelengths and
    D = 50..400 wavelengths, all 12 combinations. Tight where observable
    (bound/measured = 1.15 at D = 400 lambda, R = 10k lambda) and conservative
    below the observability width.

  - >
    gradient_characterization (passed, 2026-08-12; CHE-28). Surrogate derivative
    measured against a step-size-stable finite-difference reference on the exact
    field. See derivative.measured_2026_08_12 for the finding. Includes the
    recorded null case: at the DOE plane itself a pure-phase mask leaves |U|
    pointwise unchanged, so every intensity objective there is exactly
    theta-independent and a bias study run there compares two estimates of zero.

not_yet_probed:
  - gradient in a continuous-wavevector formulation, where the paper's direction-gradient caveat does bite
  - gradient through an actual optimization loop
  - Gumbel-Softmax relaxation (documented, deliberately not implemented)
  - behaviour when the evanescent fraction is large enough to invalidate a ray picture
  - conformal (curved) surfaces
  - vector fields, chromatic ensembles, GPU

registry_note: >
  The M1 independence check asserted this coupler's ABSENCE, via a check named
  wave_to_ray_not_claimed. CHE-23 registered the coupler, so that check could no
  longer hold. It was REPLACED rather than deleted, because the property it
  protected still matters: the registry must not claim a wave->ray capability
  that has not been established. Registration is not a capability claim.

  The replacements assert that the entry is not `validated`, that its gradient
  is unverified, that its derivative mode is `surrogate` rather than
  native_autodiff, and that it is declared lossy.

  Where they are checked has moved twice, and the second move is the one worth
  knowing about. They were originally string-matched inside
  archive/benchmarks/gen1/benchmarks/verify_m1_independence.py; CHE-88 archived that script with the
  gen1 suite, which would have retired the audit a second time in exactly the
  way this note warns against. They are now asserted against the packaged
  registry by
  tests/test_coupler_knowledge_pack.py::test_wave_to_ray_registration_is_not_a_capability_claim,
  which checks them as properties rather than as source text and does not depend
  on any benchmark surviving.

  One claim was renamed in the move. `wave_to_ray_registered_experimental`
  became `wave_to_ray_not_validated`: CHE-87 set every registry entry's
  `maturity` from what is actually measured, and this coupler is now
  `characterized`. The property the check protects is the ceiling, not the exact
  rung -- a Monte Carlo estimator with no certified gradient is not validated.
registry_claims_now_audited:
  - wave_to_ray_not_validated
  - wave_to_ray_gradient_unverified
  - wave_to_ray_gradient_mode_is_surrogate
  - wave_to_ray_declared_lossy

measured_behaviour:
  curvature_observability_width: >
    CHE-27 finding, not stated in the paper. A patch of width D resolves
    directions no finer than lambda/D, while the curvature spread it carries is
    D/2R. The effect is therefore only spectrally observable when
    D > sqrt(2 lambda R). Below that the aperture's own diffraction limit
    dominates and the measured error falls far under eq S9 -- measured
    bound/measured ratios were 208 at D = 100 lambda, 12.7 at 200, and 1.15 at
    400, for R = 10k lambda where sqrt(2 lambda R) = 141 lambda. The bound
    remains correct throughout; it simply cannot be confirmed tight below that
    width, and a 200:1 gap there is a property of the aperture rather than
    slack in the bound. Exposed as curvature_observability_width().
  local_versus_global_measurement: >
    Also CHE-27. Validating eq S9 against the extreme angle present in the whole
    patch's angular spectrum makes it look violated at every patch size,
    because that number is the truncated aperture's edge diffraction: a flat
    50-lambda patch already reaches 0.02 rad at its first sinc null, fifty times
    the curvature bound at R = 100k lambda. eq S9 bounds the error in the
    EXTRACTED direction, so the measurement uses per-window spectral centroids,
    which the window's own symmetric diffraction does not bias.
  fit_noise_in_the_convergence_exponent: >
    The fitted exponent is itself a noisy estimate. On the concentrated
    spectrum it read -0.5834 averaging 8 seeds per sweep point, -0.4982 at 32,
    and -0.4842 at 64. The 8-seed value sits outside the required -0.5 +/- 0.1
    band and would have looked like a real anomaly. Recorded because it is the
    single-realization rule in another guise: averaging too few realizations
    does not just widen an error bar, it can manufacture a finding. The gating
    test therefore uses 16 seeds per point, and CHE-29 should use more.
  projection_convention: >
    Main-text eq 2 carries the <n,d> obliquity factor and SI eq S5 does not, so
    they are different operators. Measured: summing every propagating mode of a
    random 16x16 field reproduces the field to 7.1e-15 WITHOUT the factor and
    misses it by 2.2 percent of peak amplitude WITH it. The coupler pair
    therefore uses the factor-free form, since a representation change must
    preserve the field; the eq-2 form is retained as an explicitly named sensor
    model. See ../ray_to_wave/conventions.md.
  normalization_resolution: >
    The open question of how SI eq S5's 1/N combines with eq S2's dk measure is
    resolved by construction rather than argued: the spectrum is defined with
    the 1/(ny*nx) of the inverse transform folded in, so the coefficients ARE
    the modal amplitudes and the exactness limit pins the scale. Parseval then
    reads sum|U~|^2 = (1/(ny*nx)) sum|u|^2.

implementation_location: src/couplers/wave_to_ray.py
test_location: tests/test_wave_to_ray.py
# One of the three values on knowledge/README.md's ladder, and nothing else.
# This was `characterized_stochastic_scalar_planar_cpu`, which is not on the ladder: it fused the
# rung with its qualifier, so nothing could check either. Both are kept,
# separately.
validation_status: environment_verified
validation_scope: >-
  A Monte Carlo estimator: scalar, planar, CPU and CUDA. Its convergence and
  its negative controls are measured and its bias is characterized, but a
  stochastic estimator is not `scientifically_validated` by any single
  realization, and the direction-gradient bias is documented rather than
  certified away.
validation_note: >
  CHE-22 authored this pack from the paper; CHE-25 implemented SI S2 and
  Algorithm S2 and characterized the estimator in the order the protocol
  requires: exactness limit first, then unbiasedness against the measured
  standard error, then a fitted convergence exponent, then variance by sampling
  density. All four pass, with 4/4 negative controls detected and both of their
  blind spots pinned as tests.

  The status is "characterized" rather than "validated" deliberately. What is
  established is that the estimator is unbiased and converges at the Monte
  Carlo rate for scalar, monochromatic, fully coherent fields on a planar
  patch at float64 on CPU. Curved surfaces, the round trip and cascade, every
  gradient claim, vector fields, chromatic ensembles, and accelerators remain
  unestablished.

# --- The batched planar DOE step (CHE-95) -------------------------------------
#
# `C_PLANAR_DOE_STEP` is a registered coupler with a graph node, and it composes
# this direction with the other one: accumulate every incident ray onto a common
# plane through C_RAY_TO_WAVE, apply the DOE transmission once, transform, and
# resample a fixed budget through C_WAVE_TO_RAY. SI Algorithm S1.
#
# It had existed as `couplers/cascade.py::planar_doe_step` since M2 and was
# library-only -- no registry entry, no capability declaration, no graph node --
# so the one operator that bounds ray count across stacked DOEs could not appear
# in a graph. CHE-95 promoted it rather than writing a new coupler, because the
# mathematics was already verified; what was missing was reachability.
batched_planar_step:
  coupler_id: C_PLANAR_DOE_STEP
  implementation: src/couplers/cascade.py::planar_doe_step
  graph_node: src/couplers/doe_node.py
  what_it_bounds: >-
    The outgoing ray count is the caller's P x S budget and does NOT depend on
    the incident count. Asserted directly on a three-surface stack in
    tests/test_planar_doe_step.py: same budget at surfaces two and three, and
    the same outgoing count for three different incident populations. Per-ray
    branching would instead multiply by the secondary count at every surface,
    which is the failure this operator exists to prevent.
  exactness_gate: >-
    With secondary_count=None every propagating bin is enumerated, so there is
    no sampling error and re-accumulating the outgoing rays must reproduce the
    transmitted field to dtype round-off. Measured at < 1e-12 relative L2 on a
    16x16 complex128 random field with a random-phase DOE
    (tests/test_planar_doe_step.py::test_full_enumeration_still_reproduces_the_transmitted_field,
    CPU, numpy). This is the only oracle the composed step has -- it has no
    analytic case of its own -- so promotion to a graph node is conditional on
    it, not merely accompanied by it.
  conventions_that_change_across_the_step:
    optical_path_length: >-
      RESET TO ZERO on the outgoing rays. The incident path is already folded
      into the accumulated field's phase, so carrying it forward would
      double-count it. The consequence for a caller is that the phase reference
      is rebased to this plane: an OPL measured downstream is measured from
      here, not from wherever the incident bundle launched.
    amplitude: >-
      Becomes the importance-weighted spectral amplitude U~[m]/p[m]. No per-ray
      correspondence to the incident amplitudes survives the accumulation.
    power: >-
      NOT conserved by default, deliberately. A lossy DOE legitimately loses
      power, and `preserve_energy` -- which renormalizes to the incident power
      -- is off by default because switching it on hides exactly the case a
      conservation check exists to catch. When on, the applied factor is
      reported in the diagnostics and in the field's provenance.
  primary_position_sampling: >-
    Offered as an option, not adopted as the estimator. Secondary directions are
    drawn by spectrum magnitude while `uniform_on_grid` draws positions
    UNIFORMLY, and the paper does not justify that asymmetry. The alternative,
    `incident_positions`, keeps each incident ray's own transverse position and
    refuses rather than replaces when asked for more positions than the bundle
    has -- an invented position is a fabricated ray.
  sampler_cost_measured: >-
    The flat multinomial draw over propagating bins is 8.8% of the step at the
    paper's largest sampling load (SI Table S2 Hologram RW-P: 501^2 grid, 4000
    secondary rays, complex128, CPU). The reference implementation uses a
    two-stage marginal/conditional sampler for speed and for CUDA's category
    limit; neither reason transfers at that fraction on the host, so the flat
    sampler is kept. Evidence and the pre-stated decision rule:
    benchmarks/probes/records/doe_step_sampler_cost.json. Revisit if the draw
    moves to a device.
  gradient: >-
    None certified. Inherits this direction's fixed-direction estimator, so the
    registry records derivative.mode=surrogate with verified=false. Registering
    the step as a graph node did not change that, and the node refuses
    require_gradients=True.
  not_yet_probed:
    - a conformal substrate. The step REFUSES nothing structurally here because
      it takes a plane as an argument, but the accumulation is only valid on a
      planar surface -- rays on a curved one strike different tangent frames.
      Use couplers/curvature.py to size a patch instead.
    # 'the step on a device' was here and is cleared: the full-enumeration
    # exactness limit holds on cuda:0 at complex64 round-off, 2.475e-06
    # relative L2 on a 64x64 grid, with the outgoing directions and the
    # transmitted field both read off the arrays as living on cuda:0 rather
    # than off the request. Evidence:
    # benchmarks/probes/records/planar_doe_step_device.json, produced by
    # benchmarks/probes/gpu/planar_doe_step_device.py.
    # 'a stacked configuration at the paper's scale' was here and is partly
    # cleared by CHE-96: this operator ran as demo3's RW-F route at SI Table S2
    # System 3's configuration -- 200x200 DOE, 3000 launch positions, 20000
    # secondary each, 60 M rays on cuda:0 -- in
    # benchmarks/probes/records/ray_wave/demo3_characterization_rw_f.json.
    # What is NOT cleared: it was not run at the paper's 5.3e9-ray budget, and
    # the count-bounding property is still asserted only on a 16x16 stack.
    - >-
      the paper's full ray budget on a stack. See `patch_step.cost_ceiling`
      below -- 1.2 h per run at 1.78e9 rays with an O(rays x pixels)
      reconstruction, which is the CHE-95 k-space fast path's case.

# --- The patch-based local WFT step (CHE-96) ----------------------------------
#
# `C_PATCH_WFT` is the general ray-DOE method, and the point most likely to be
# missed is the relation between it and the step above: **`C_PLANAR_DOE_STEP` is
# a special case of this, not a peer of it.** SI S10 says so about the global
# aggregation Algorithm S1 performs -- "For conformal DOEs, this global
# aggregation before ray-DOE interaction is not applicable ... We therefore
# retain the direct implementation." The direct implementation is this one.
patch_step:
  coupler_id: C_PATCH_WFT
  implementation: src/couplers/patch.py
  graph_node: src/couplers/patch_node.py
  relation_to_the_batched_step: >-
    They coincide when there is exactly ONE launch position -- demo2's RW-F
    row, where a single full-aperture patch and a single global spectrum are
    the same object. They diverge as soon as there are many: the batched step
    resamples one global spectrum at many positions, the patch step transforms
    a different local patch per position. Both were run on demo3, which needs
    many launch positions because the refractive lens downstream introduces
    field-dependent aberrations a single primary ray cannot represent.
  exactness_gate: >-
    A single full-aperture patch with every propagating mode enumerated
    reproduces the independent float64 discrete ASM
    (verification/asm_oracle.angular_spectrum_float64) at **7.1e-13** relative
    field error on the paper's own demo2 system -- 100x100 SLM, 6.3 um pitch,
    lambda 0.7 um, z = 1.26 mm -- and at 1.4e-12 on a 33x33 synthetic case.
    Complete enumeration is unbiased at 5.9e-15. tests/test_patch_wft.py, and
    benchmarks/probes/records/ray_wave/demo2_paper_jax.json.

    The comparison is only an exactness measurement when the two PERIODICITIES
    match. A discrete ASM is periodic with its padded period, so the same route
    scored against an oracle padded 2x reads 8.8e-3 at pad 199 and 0.33 at pad
    101 -- neither is an error in either implementation, both are the wraparound
    between two periods. Every recorded score names its oracle's pad.
  convergence_relation: >-
    SI S2 relation (2), measured rather than cited: sub-aperture patches
    uniformly covering the aperture converge to the full-aperture response.
    On demo2 at SI Table S2's parameters (patch 51^2, pad factor 4, 16000
    incident, 1e4 secondary, 1.6e8 rays) RW-P reaches NCC 0.999418 against both
    the ASM oracle and the RW-F route, and the 5x3 budget sweep is monotone in
    both incident and secondary count
    (benchmarks/probes/records/ray_wave/demo2_cost_sweep.json).
  conventions_that_change_across_the_step:
    optical_path_length: >-
      RESET TO ZERO at the patch plane, for the same reason the batched step
      resets it: each patch's phase is already in its spectral amplitude. The
      graph node is STRICTER than C_RAY_TO_WAVE about an undeclared incident
      OPL for that reason -- a guessed reference would be absorbed and could
      not be audited afterwards.
    amplitude: >-
      `coverage * A[m] / p[m]`, where `coverage = A_draw / A_patch`. The
      direction of that ratio is easy to invert and the inversion is invisible
      on the full-aperture anchor, where it is exactly 1.
    launch_position_phase: >-
      NONE, and this is the one most likely to be got wrong. `spectrum_to_rays`
      applies `exp(i k (d_u x_p + d_v y_p))` because there the spectrum's origin
      is the plane's and the ray launches elsewhere. Here the padded patch is
      centred on the patch centre, so the spectrum's origin IS the launch point
      and `ray_to_wave` already references its ramp to each ray's position.
      Adding it again double-counts it -- and, again, is invisible on the
      full-aperture anchor.
  three_refusals:
    even_patch_px: >-
      An even patch has no centre sample, so "centred on a ray" is undefined,
      and the odd-pad and even-(pad - patch) rules are jointly unsatisfiable.
      The paper's own sizes are 40, 50 and 100, so this REFUSES rather than
      rounds: a caller transcribing one should be told which value ran.
    derived_pad: >-
      `pad_factor` is a preference and `pad_px` is derived from clearance,
      centring and oddness. Clearance is `pad > max|c| + (grid + patch)/2`,
      strictly, with exactly one exemption -- the full-aperture single patch,
      which IS the window and has nothing outside it to contaminate. Padding
      that case is not the safe choice: it moves the mode grid off the oracle's
      and the anchor reads 0.57 instead of 1.4e-12.
    coverage_basis: >-
      Caller-supplied patch centres need a declared `CoverageBasis`. The Monte
      Carlo correction is unbiased only for a known sampling density and the
      density cannot be read back off the positions; a guess scales the whole
      field by a constant and looks entirely plausible.
  apodization: >-
    NONE offered. Any taper below 1 removes field no other patch replaces, so
    the partition-of-unity argument behind the convergence relation breaks and
    the coherent sum stops converging to the full-DOE response.
  cost_ceiling: >-
    Reconstruction is O(N_rays x N_pixels) -- `ray_to_wave` contracts a
    separable einsum -- against upstream's O(N_rays) + one FFT. Measured
    consequences: demo2's RW-P needed 40 batches where the paper used 2, and
    94.9 s where the paper reports 2.275 s; demo3 does not converge at any
    budget that fits. This is the evidence for the k-space fast path tracked on
    CHE-95, which landed as CHE-101 -- so the numbers below supersede the
    O(N_rays x N_pixels) framing above for any run on the `kspace_splat` route.

    **Current demo3 budget (CHE-120, M5.3).** NCC 0.9 seed-to-seed needs
    **1.49e9 rays, 0.14 h/run** on the shipped estimator, or **1.02e9 rays,
    0.094 h** with position importance sampling. Was 1.74e9 rays and 1.085 h at
    M0.4, so 11.5x on wall clock, decomposing exactly as 6.71x throughput
    (M5.1 + M5.2, field unchanged to 7 significant figures) x 1.162x
    extrapolation-law correction x 1.471x variance. The paper's SI Table S2
    budget is 2.6e9, so the shipped estimator sits 1.74x below it -- agreement,
    on a two-decade extrapolation whose model spread is 2.9x.

    **Do not extrapolate a seed-to-seed NCC ladder on slope 1.** The committed
    record did, and it is one power out: what two realizations share is the
    deterministic |mu|^2, what differs is noise whose spatial variance goes as
    (E|n|^2)^2, so NCC ~ N^2 while it is small. Use the saturating form
    NCC = 1 / (1 + c N^-p), which respects NCC <= 1; the measured p is 1.64 and
    it beat the power law out of sample (0.437 predicted against 0.4105
    measured, versus 0.57).
  how_to_tell_a_converged_run_from_an_unconverged_one: >-
    Four checks, in this order. The first two are cheap and catch almost
    everything; the third is the one that actually decides.

    1. **Is the NCC above the noise floor?** An NCC over N_px pixels has a
    standard error near 1/sqrt(N_px), so anything below 3/sqrt(N_px) is zero
    with an error bar. demo3's 420^2 sensor puts that floor at 0.0071. A ladder
    fitted through sub-floor rungs returned a slope of 5.7 once; rungs only
    1.5-2.9x above it flattened a slope from ~1.4 to 0.93. Start a ladder at 3x
    the floor or higher.

    2. **Is the reconstruction oversampled enough that the NCC means anything?**
    At `kspace_oversample = 1.5` demo3's seed-to-seed NCC reads ~0.08 and does
    not move when the variance changes by 1.73x -- it is dominated by a
    reconstruction artifact common to both realizations. At `oversample = 8.0`
    the same configuration reads 0.0054 and tracks the variance. A seed-to-seed
    NCC at low oversampling is not a convergence measurement.

    3. **Does the variance fall as 1/N?** This is the direct test and it has no
    floor and no saturation. Estimate V = sum_px Var_r[F_r] over >= 3 seeds at
    two or more ray counts; the exponent should be -1 (measured -0.995 over 8x).
    A shallower exponent is a floor that no budget removes. Compare arms on
    ABSOLUTE V rather than a signal-normalized version: every arm estimates the
    same field with the same one_over_n normalization, so V is already comparable
    and its ratios are exact, while the signal estimate sum|F_bar|^2 - V/R (3.7%
    of the total at demo3's 2e7-ray configuration, known to a few percent) would
    add its own error to every ratio for nothing.

    4. **Is the estimator the one you think it is?** Two arms with different
    sampling can have the same noise level and different means. Score
    ||F_bar_A - F_bar_B||^2 against V_A/R_A + V_B/R_B; it is 1 when the means
    agree. Its own fluctuation is ~sqrt(2/N_px), and pixel noise in speckle is
    not independent, so read a departure against a few multiples of that.
  primary_position_density: >-
    The centre density is uniform by default, and "uniformly covers the DOE
    profile" in SI S2 constrains the SUPPORT, not the density -- any density
    with the right support converges, at different rates. CHE-120 derived the
    optimum and measured it.

    The variance-optimal density over the candidate positions is q_c ~ f_c with
    f_c the modulus of the importance weight a ray from c carries
    (Cauchy-Schwarz). Because the direction axis already uses p ~ |U~|, that
    weight has constant modulus within a patch, so **f_c = ||U~_c||_1** -- the
    L1 norm of that patch's own spectrum. Computed exactly over all 90,601
    demo3 candidates, the ceiling on this axis is **1.4413x**, and
    q ~ sqrt(window energy) -- one integral image, no transforms -- captures
    1.4412x of it at correlation 0.99995, because a phase-only mask's patch is a
    quasi-random phase over the n_c aperture samples in its window and
    ||U~_c||_1 ~ sqrt(n_c). Measured end to end: 1.4523x i.i.d., 1.4685x with
    equal-mass CDF strata, and the closed form predicts to 0.15% the direction
    term it is derived for (B falls 1.4391x against 1.4413x predicted; the
    position term A falls 1.5849x).

    Why only 1.44x when M2 measured 4.96x for magnitude sampling on the
    direction axis: demo3's DOE amplitude is FLAT inside its aperture, so the
    only spatial structure is the rim taper of the dilated draw region -- mean
    window fill 0.347, and 10.4% of candidate positions hold no aperture sample
    at all. **On a DOE with structured transmission the ceiling is different and
    possibly much larger**; compute it per configuration with
    couplers.patch_positions.predicted_variance_ratio, which needs the mask
    alone.

    Two traps. `q ~ energy` instead of `q ~ sqrt(energy)` gets 1.096x, three
    quarters of the way back to uniform. And equal-AREA strata with one draw
    each cancel importance sampling almost entirely (1.090x), because the
    between-cell allocation is then uniform whatever the density; use equal-mass
    strata, where pi_c = P q_c exactly and the weights are unchanged. The
    general weight the module applies is lambda_c = P / (D pi_c) with pi_c the
    expected draw count -- 1/(D q_c) for the i.i.d. and CDF draws, the stratum's
    own mass for the equal-area tiling.

    Stratification on its own buys nothing here (1.008x): 1,000 draws over
    90,601 positions is too sparse to bite on an integrand that decorrelates at
    the sample pitch.
  the_allocation_between_patches_and_secondaries: >-
    Already optimal at the preset's values, and worth recording so it is not
    searched again. Fixed P x S is NOT fixed cost -- the padded transform is per
    patch and the draw, trace and reconstruction are per ray, so
    c = P (a + b S) -- and the variance is V = A/P + B/(PS). Minimizing V at
    fixed c gives S* = sqrt(a B / (b A)) = 2.15e4 against the shipped 20,000,
    which is 0.1% from the optimum in the objective (2.26e4 and 0.3% for the
    importance-sampled arm). Two significant figures because S* goes as
    sqrt(a/b) and the cost model's residual is 6.4%. Confirmed directly: V x
    cost over four cells at fixed P x S = 2e7 is minimized at the shipped cell.
    The optimum is quadratically flat, which is why it was never worth tuning.
  where_the_variance_is: >-
    V(P, S) = A/P + B/(PS), fitted to 0.14% residual and cross-validating onto
    an axis it was not fitted on (0.6%). At the shipped S = 20,000, 74.6% of V
    sits in the term that falls with P*S and 25.4% in the term that falls only
    with P. **That split says how V responds to the two knobs -- it is what sets
    S* -- and is NOT a division into reducible and irreducible shares.** Reading
    it as one would cap the achievable gain at 1.084x, which the measured 1.4685x
    falsifies: a position density multiplies whole patches, so it scales both
    terms (A by 1.5849x, B by 1.4391x, both measured). What IS irreducible is
    reweighting the DIRECTION axis: p ~ |U~| is the Cauchy-Schwarz optimum over
    densities, a proof rather than a measurement. So every "choose a better
    density" lever is now at its optimum, and what remains untried is correlated
    sampling on the direction axis -- the bound constrains densities, not
    correlations -- and control variates against an analytic surrogate.
    benchmarks/reports/2026-08/demo3_estimator_variance.md.
  gradient: >-
    None certified. Inherits the fixed-direction estimator; the registry records
    derivative.mode=surrogate with verified=false and the node refuses
    require_gradients=True.
  not_yet_probed:
    - >-
      a conformal substrate. REFUSED by `Substrate`, not approximated -- the
      SI S2 exactness relation does not hold there and the planar case's
      confidence must not be inherited.
    - >-
      this step on a device. It is numpy/complex128 only and
      core/capabilities.py says so. The expensive half of a patch run, the
      reconstruction, does execute on cuda:0 under JAX and did throughout
      demo2 and demo3.
    - the paper's full ray budget, on either demo. See `cost_ceiling`.
