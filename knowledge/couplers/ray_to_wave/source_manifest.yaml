# Per-source provenance for the C_RAY_TO_WAVE knowledge pack.
# Provenance follows AGENTS.md "Sources of Truth".

sources:
  - url: https://doi.org/10.1021/acsphotonics.6c00818
    source_type: peer_reviewed_paper
    citation: >
      Cheng, J.; Gao, M.; Shao, Y.; Mao, C.; Milster, T. D.; Fan, J. A.
      A Differentiable Ray-Wave Framework for Hybrid Refractive-Diffractive
      System Modeling and Optimization. ACS Photonics 2026.
    local_copy: knowledge/papers/raywave_tracing/paper.pdf
    retrieved_at: "2026-08-12"
    usage_note: >
      Primary source of truth for this coupler. Sections used: main text eq 2
      (the coherent wavelet sum with the <n_hat, d_hat> projection factor),
      Figure 1b/1c (the ray-DOE interaction picture), and Figure 2b (the planar
      full-field patch rule and the linear-phase-ramp treatment of off-centre
      incident rays).

  - url: https://doi.org/10.1021/acsphotonics.6c00818
    source_type: supporting_information
    local_copy: knowledge/papers/raywave_tracing/supporting_information.pdf
    retrieved_at: "2026-08-12"
    usage_note: >
      Section S2 and Figure S1 supply the physical interpretation transcribed in
      theory.md: a ray is a plane wavelet carrying exp(i k OPL) (Fig S1b), an
      arbitrary wavefront decomposes into angular-spectrum modes (Fig S1a), and a
      collimated bundle represents one angular mode only when per-ray phases
      compensate the OPL differences of their lateral launch positions (Fig S1c).
      That last statement is the exact-oracle test for this direction.

  - url: https://arxiv.org/abs/2605.15418
    source_type: preprint
    retrieved_at: "2026-08-12"
    usage_note: >
      Recorded for citation completeness. The journal version above is the
      version transcribed; the preprint was not separately consulted.

  - url: https://github.com/jiazhou-cheng/raywave-tracing
    source_type: reference_implementation
    vendored: false
    pinned: false
    executed_by_this_repository: false
    retrieved_at: null
    read_at: "2026-08-22"
    read_revision: "777e753be7778b09bf13fb55c633a56ac4ad04e5"
    read_scope: configuration_and_option_inventory_plus_reconstruction_algorithm
    read_files:
      - deeplens/raywave.py  # RayWave.huygens_psf, read in full for CHE-101
    usage_note: >
      Read, never executed, and never vendored -- and the distinction between
      those three is the point of this entry.

      Every equation in theory.md come from the paper and its SI, not from this
      code. That was true before it was read and is still true: the derivations,
      the estimator, the curvature bound and Algorithm S1 were all worked from
      the published text, which is why the two implementations converging on the
      same projection-convention split is corroboration rather than copying.

      What WAS taken from reading it, in CHE-95: the knowledge that four options
      exist and are worth having. Primary-position sampling, an energy-preserving
      renormalization, a flat zero-padding policy, and a collapsed single-ray
      preview. Each was then specified and implemented here from its physical
      description -- and two were deliberately changed rather than copied:
      `preserve_energy` is OFF by default because renormalizing to the incident
      power hides a DOE that is losing power for a real reason, and the uniform
      primary-position sampler is offered as an option rather than adopted,
      because the paper does not justify sampling positions uniformly while
      sampling directions by spectrum magnitude.

      CHE-101 read further, and the scope above says so rather than leaving it
      implied. `RayWave.huygens_psf` was read in full at revision `777e753`, and
      what was taken from it is an **algorithm**, not an equation: evaluate the
      same eq-2 wavelet sum as a bilinear splat into a k-grid followed by one
      inverse FFT, instead of as a real-space contraction. That is a strictly
      larger debt than CHE-95's option inventory and is recorded as one.

      The equations are still the paper's. A plane wavelet is a k-space delta by
      SI S2's own construction, so the two evaluations are the same operator --
      which is why the ported route reproduces this repository's exact route to
      7.1e-13 on the full-enumeration limit rather than merely resembling it.

      Three details were deliberately NOT copied, each because measurement said
      not to. Upstream crops the padded field at `(K - n) // 2`, which is a
      sample off this repository's `n // 2` coordinate origin whenever the two
      grids differ in parity. Upstream requires a full four-neighbour footprint
      and discards any ray in the top k-bin; here the upper neighbour is clamped,
      whose interpolation weight is zero there anyway, so the ray is kept.
      Upstream also drops rays landing outside the sensor extent before
      accumulating, which is a sensor model rather than a reconstruction: a
      wavelet contributes a ramp across the whole plane regardless of where it
      crosses it, and this repository's exact route has no such crop, so porting
      it would have made the two routes disagree for a reason unrelated to the
      algorithm.

      Nothing about upstream's *accuracy* was inherited. It has no test suite, so
      the ported route was verified against this repository's own exact route,
      and the k-grid oversampling it defaults to (1.5) was measured here to leave
      9% intensity error on demo3 and is not used at that value.

      No number in any coupler card comes from this source. Every one comes from
      a probe run in the agent_solver container, and the entries below say which.

  - source_type: inherited_repository_evidence
    retrieved_at: "2026-08-12"
    usage_note: >
      Three constraints on this coupler come from prior milestones rather than
      the paper, and are recorded in conventions.md as hazards H1-H3: Optiland's
      opd sign and reference plane are unverified (M1, CHE-13/CHE-17); Optiland's
      ray `intensity` is a weight and is marked intensity_is_not_amplitude
      (M1 adapter contract); and chromatix asm_propagate returns padded arrays,
      measured at 256^2 -> 1756^2 (M1, CHE-15).

  - url: https://github.com/jiazhou-cheng/raywave-tracing
    source_type: reference_data
    vendored: true
    pinned: true
    pinned_revision: "16ed3d7"
    executed_by_this_repository: false
    retrieved_at: "2026-08-22"
    local_copy: benchmarks/probes/data/
    files:
      - benchmarks/probes/data/demo2_smile_phase_profile.npy
      - benchmarks/probes/data/demo3_smile_phase_profile.npy
    usage_note: >
      Two SLM phase masks, (100, 100) and (200, 200) float32 in [-pi, pi], taken
      from the paper's reference implementation and committed here as DATA. They
      are the inputs to the Fig 5b and Fig 5c reproductions (CHE-96) and cannot
      be regenerated from anything in this repository.

      This is a separate entry from the `reference_implementation` one on
      purpose, and the distinction is the whole point. Code from that repository
      is read, never vendored, never executed; these arrays are vendored
      deliberately and are not code. Folding them into the implementation entry
      would make it say the source was vendored, which would be false about the
      code and would erase the reason the other entry exists.

      Vendored, therefore pinned: an input that changes silently makes every
      recorded number unreproducible. `16ed3d7` is the upstream revision the
      arrays were copied at.

      Nothing about the surrounding notebooks was copied. The three places where
      copying them would have been wrong -- intensity accumulated instead of
      field, a phase flip that compensates a DeepLens `Ray.flip_xy` this
      repository does not have, and an `(n-1)/2` origin rule against this
      repository's `n // 2` -- are recorded in the reproduction probes rather
      than reproduced.
