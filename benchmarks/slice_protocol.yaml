  - id: no_runnable_coupler_exists_yet
    found_by: CHE-31 (confirmed at M3 open)
    owner: CHE-34 (M3.5)
    status: resolved
    resolved_by: CHE-34 (M3.5)
    description: >-
      couplers/base.py declares Coupler.transform and nothing defines it, so
      GraphValidator currently validates edges that cannot execute.
    resolution: >-
      src/multiscale_optics_agent/couplers/ray_to_wave_node.py implements the
      Coupler protocol for C_RAY_TO_WAVE. It is a wrapper over the M2 core and is
      tested to be bit-identical to the direct function call, so M2's
      verification evidence still binds on what a graph runs. The core keeps its
      engine-agnosticism; the node is a separate module and is covered by the
      same AST and sys.modules checks.
    also_found: >-
      the edge only validated because producer and consumer both declared
      metadata neither writes. C_RAY_TO_WAVE's source port was
      wavefront_samples, which carries pupil coordinates and NO directions, so a
      plane-wavelet sum could never have consumed it; and M_RAY_OPTILAND's rays
      port claimed amplitude and polarization that RealRays does not expose --
      the CONTRACT GAP recorded in models.yaml since 2026-07-30. Both were
      narrowed to what is real, C_RAY_TO_WAVE moved to 0.2.0, and the example
      graph's edge now sources the rays port.

inadmissible_sources:
  - id: optiland_paraxial_surface
    applies_to: any wavefront or OPL handed to a coupler
    rule: surface_type "paraxial" must not be used
    evidence: CHE-30, knowledge/solvers/optiland/conventions.md
    reason: >-
      The paraxial interaction model subtracts (x^2+y^2)/(2f) but leaves the
      direction un-normalized, so the following propagation adds the axial
      distance rather than the Euclidean one and the intended cancellation never
      happens. Measured OPL at the focus is f - h^2/(2f): 0.36 mm, about 655
      waves, at f = 50 mm and h = 6 mm. That is a defocus, not a rounding error.
  - id: undeclared_optiland_opl
    rule: >-
      ContractCode.OPL_REFERENCE_UNVERIFIED stays enforced. An OPL is admissible
      only when its reference is declared, and for an infinite object that
      reference is aperture-dependent, so the declaration must record the EPD.
    evidence: CHE-30
