entries:

  # =========================================================================
  # benchmarks/applied/ -- CHE-139 (M1.1.5), authored after the direction change
  # =========================================================================
  # Not old task layer: it was written on the shipping builder and adapter, gates
  # nothing, and its own README forbids a tolerance. Rows exist because the
  # coverage test refuses an unclassified file, not because a verdict was in doubt.
  - path: benchmarks/applied/commercial_lens_systems/README.md
    bucket: A
    justification: >-
      States the chain under test end to end and the rule the benchmark rests on:
      it decides nothing, carries no tolerance and no verdict, and every
      comparison it reports names the basis on which it is comparable.
    destination: >-
      stays where it is. If this workload ever becomes a family it is B4
      characterization, never a gate; the README is the text that says why.
  - path: benchmarks/applied/commercial_lens_systems/catalog_sources.py
    bucket: A
    justification: >-
      The vendor-traceability rule as executable code: every published number
      carries its manufacturer document, and an unpublished radius, thickness,
      glass or spacing becomes a ConstructionRefusal rather than an estimate.
      M-10X is kept precisely because it fails that test.
    destination: >-
      the construction-refusal evidence behind the commercial-prescription claims,
      and the input half of any future B4 characterization of this workload.
  - path: benchmarks/applied/commercial_lens_systems/benchmark_systems.py
    bucket: A
    justification: >-
      Separates what the manufacturer publishes from what installation adds --
      ordering, orientation, air gaps, entrance pupil, object and image
      configuration -- with a ParameterSource on every value, so a catalog number
      and an assembly choice can never be confused in a result.
    destination: >-
      the assembly-provenance pattern (catalog vs assembly_choice) for composed
      systems built from vendor parts.
  - path: benchmarks/applied/commercial_lens_systems/run_benchmark.py
    bucket: A
    justification: >-
      Drives the shipping path only: a ModelRunRequest carrying a canonical
      prescription, no Optic of its own, no ray tracing and no optical physics in
      the benchmark. That is what makes it evidence about the builder rather than
      about itself.
    destination: >-
      the CPU/GPU comparison and characterization reduction it already writes;
      superseded by the executor and family runner if this workload is promoted.
  - path: benchmarks/applied/commercial_lens_systems/records/*.json
    glob: true
    bucket: A
    justification: >-
      The characterization output actually produced for the four built systems,
      including the CPU/GPU comparison and the components record that names the
      refused part. Provenance, never an oracle.
    destination: >-
      the recorded evidence behind the commercial-lens construction claims; read
      as records, not as gates.
  - path: benchmarks/applied/commercial_lens_systems/figures/*.png
    glob: true
    bucket: A
    justification: >-
      The per-system diagnostic figures the runs emitted, including the reversed
      achromat that the benchmark reports as installed backwards.
    destination: >-
      illustration attached to the records above; nothing reads them
      programmatically.

  # =========================================================================
  # benchmarks/agents/ -- the V1 agent suite
  # =========================================================================
  - path: benchmarks/agents/README.md
    part: the A1 exclusion table
    bucket: A
    justification: >-
      Nine candidate benchmarks rejected with a MEASURED reason: the unseedable
      numba BSDF (two identical calls differ by ~1%), the VTK headless hang, the
      unreachable Thorlabs .zmx/.seq artifacts (1313-byte HTML page), the
      jax_enable_x64 exclusion, and the two Adam-state traps plus t35 rejected
      ONLY for runtime. Recording why a candidate is not a benchmark is expensive
      knowledge and the runtime rejections are the shortlist for a cheaper V2.
    destination: >-
      B0 family metadata -- the excluded-candidate register, with the two
      Adam-state traps and t35 carried as B0 candidates pending a cheap surrogate.
  - path: benchmarks/agents/README.md
    part: the five design decisions and the failure taxonomy table
    bucket: A
    justification: >-
      Context policy as a property of the task, three declared trials reported as
      a rate, void-vs-failed, the 8-code taxonomy, and first-stage-that-failed
      grading. These are harness design decisions with reasons; they survive the
      task set they were first written for.
    destination: >-
      Agent-evaluation harness documentation (M9). Not verifier material -- these
      grade an agent, not physics.
  - path: benchmarks/agents/README.md
    part: the six-task table and "Adding a benchmark"
    bucket: C
    justification: >-
      Documents the A1-* task set and the procedure for extending it in the
      retired id space.
  # =========================================================================
  # benchmarks/manifest.yaml
  # =========================================================================
  - path: benchmarks/manifest.yaml
    part: "levels: block (L2-PSF-01 task entry)"
    bucket: C
    justification: >-
      The L1/L2/L3 "levels" taxonomy is the old design, replaced by the family
      registry plus benchmarks/instances/.
  - path: benchmarks/manifest.yaml
    part: "the L2-PSF-01 entry's note: and gate_disposition: prose"
    bucket: A
    justification: >-
      The frozen 1.0e-3 fft_oracle_intensity_relative_l2 gate is UNMET at
      2.2e-3-2.5e-3 on 787,969 rays while a synthetic aberration-free bundle
      reaches 4.07e-4; and the rule that it must not be closed against another
      Optiland PSF route, because FFTPSF and HuygensPSF share one Wavefront/OPD
      front end and are not two oracles (PB7/CHE-58 finding F2).
    destination: >-
      B3-PSF-SINGLET: the tolerance with its basis, gate_status NOT_MET, and the
      oracle-independence rule as a structural constraint rather than prose.
  - path: benchmarks/manifest.yaml
    part: "characterizations: block (DEMO3-RW-P)"
    bucket: A
    justification: >-
      Already the labelling discipline this revision asks for:
      validation_target false, a why_not saying the paper states no conventional
      reference exists, what_it_does_support, and a cost_ceiling with its 2.9x
      model spread. It must be migrated, not rewritten from scratch.
    destination: B4-DEMO3 family metadata, verbatim where the field maps.
  - path: benchmarks/manifest.yaml
    part: "m1_exit_report / m1_independence_check pointers"
    bucket: A
    justification: >-
      Provenance pointers into the archived gen1 suite and its independence
      check. They are the milestone record for benchmarks that no longer run.
    destination: Family provenance_rule references for B1 ray/wave families.

  # =========================================================================
  # benchmarks/physics/L2-PSF-01/ -- the two files CHE-116 did NOT delete
  #
  # CHE-116 (M4.1) deleted run_benchmark.py (both of its verdicts: the task
  # wrapper, bucket C; and the M3-SINGLET-REF prescription plus graph
  # construction, bucket B, whose destination B3-PSF-SINGLET-01 now exists as a
  # committed instance, a committed graph document and a committed record) and
  # evaluate.py (bucket A, whose destination src/verification/metrics.py
  # exists). Their rows are gone because a row for a path that is not there
  # reads as coverage and is not; the deletion is recorded in this directory's
  # README and in benchmarks/reports/2026-08/b3_composed_families.md.
  # =========================================================================
  - path: benchmarks/physics/L2-PSF-01/tolerances.yaml
    bucket: A
    justification: >-
      Tolerance VALUES together with their derivations. A tolerance without its
      basis cannot be re-justified later and cannot be checked for
      may_gate eligibility.
    destination: >-
      B3-PSF-SINGLET tolerances, each as (threshold, basis, may_gate). Bases that
      are recorded measurements rather than independent derivations become
      may_gate false.
  - path: benchmarks/physics/L2-PSF-01/README.md
    bucket: A
    justification: >-
      The residual analysis behind the unmet gate, including the split between
      attributed and unattributed residual and the negative controls -- one of
      which (inverted quadrature weight) fires backwards.
    destination: >-
      B3-PSF-SINGLET negative_controls, and the evidence trail CHE-117 must
      either close or re-scope.

  # =========================================================================
  # benchmarks/instances/ -- canonical instances, run through the substrate
  # =========================================================================
  - path: benchmarks/instances/FIXED-V1.yaml
    bucket: A
    justification: >-
      The canonical fixed suite's committed, versioned manifest (CHE-135):
      33 instances across all five categories, each with its fingerprint, its tier
      and the positive justification for selecting it. Generated from
      src/verification/fixed_suite.py and re-rendered in memory by the test, so
      the two cannot disagree. Replaces what manifest.yaml's levels: block did.
    destination: The acceptance-criteria layer for every claim made after it.
  - path: benchmarks/instances/b0_contract.py
    bucket: B
    justification: >-
      POSITIVE: the ten canonical B0 instances, executed. This is the only place
      each of the five negative outcomes -- unsupported, invalid_configuration,
      out_of_validity, lossy_but_allowed, blocked -- is produced by a DIFFERENT
      shipping component refusing a real request, and the only place the two
      ok-contract-wrong-physics traps are re-measured on the pinned installs
      rather than read out of a record. Freezing it keeps the five statuses
      individually reachable rather than individually declared.
    destination: >-
      B0-CONTRACT / B0-DTYPE / B0-VALIDITY / B0-UNITS canonical instances, run by
      tests/test_b0_instances.py in the default gate.
    note: >-
      Three instances are graphs through GraphExecutor; the other seven are
      refused before a graph could run -- a capability intersection, a bridge
      policy, an artifact-level declaration -- and go through the shipping
      refusal path, which is what those questions are about.
  - path: benchmarks/instances/b1_ray.py
    bucket: B
    justification: >-
      POSITIVE: the five B1 ray families executed against the shipping Optiland
      adapter, and the only place three load-bearing conventions of the traced
      record are written down executably -- that a collimated on-axis ray's
      transverse position at the first surface IS its launch position (which makes
      sin(i) = rho/R exact), that the image plane refracts, and that a traced focal
      length is not a paraxial one. Each of those had a wrong reading that produced
      a plausible number, and each is now a comment beside the code that depends on
      it.
    destination: >-
      B1-RAY-EFL / -PLATE / -SNELL / -LAGRANGE / -OFFAXIS-OPL canonical instances,
      run by tests/test_b1_ray_instances.py in the default gate.
    note: >-
      Also carries the device/precision matrix (RAY-4) and the unsupported-request
      probe (RAY-5). B1-RAY-LAGRANGE's gate was NOT_MET at 1.3e-7 against 1e-10
      and is now MET at 1.2e-15 against 1e-13, because the ORACLE was corrected
      rather than the tolerance widened: the finite-real-ray bilinear form is
      preserved only by a LINEAR symplectic map, so the gate is now the
      DIFFERENTIAL invariant on two independent tangent vectors, extrapolated to
      zero ray separation. The 1.3e-7 finite-ray number is retained as a
      non-gating characterization metric at its original 1e-10 threshold. The
      device/precision matrix's CPU-vs-CUDA agreement is measured on real
      hardware and persisted at
      benchmarks/probes/records/optiland/b1_ray_device_precision.json.
  - path: benchmarks/instances/b1_wave.py
    bucket: B
    justification: >-
      POSITIVE: the seven B1 wave families executed through the Chromatix graph
      node, and the only place three families were found unable to support their
      own claims -- GAUSS/TILT/FWDBWD sitting outside their own sampling
      predicate while meeting their gates, TALBOT unable to revive because a
      binary grating's high orders dephase, and ASM-VALIDITY unable to
      demonstrate aliasing because an 8 um beam's bandwidth is fifty times
      inside the grid's. Each diagnosis is a comment beside the parameter it
      changed, and no tolerance moved.
    destination: >-
      B1-WAVE-GAUSS / -AIRY / -TILT / -PLANEPHASE / -FWDBWD / -TALBOT /
      -ASM-VALIDITY canonical instances, run by tests/test_b1_wave_instances.py.
    note: >-
      Also carries the device observation (WAVE-3), whose CUDA arm is measured on
      real hardware and persisted at
      benchmarks/probes/records/chromatix/b1_wave_device_observation.json: the
      placement is read from array_state on the live JAX array before
      jax.device_get, and the persisted .npy placement is recorded beside it as a
      contrast because host bytes report cpu for every run. Asserted by
      tests/test_b1_wave_gpu.py. The complex64 accuracy cost (WAVE-2) is measured
      once, by B0-DTYPE-01, against the independent float64 angular spectrum
      rather than twice. TALBOT's tolerance basis is the m^4 non-paraxial order
      dephasing (pi/2) m^4 (lambda/d)^2, and the driver decomposes it against a
      paraxial and an exact float64 kernel on the same grid rather than asserting
      it.
  - path: benchmarks/instances/b1_gsl_validity.py
    bucket: B
    justification: >-
      POSITIVE: the 12 B1-GSL-VALIDITY instances executed against the shipping
      GENERALIZED_SNELL coupler, the smooth-limit agreement (float64 round-off
      over 9-45 samples/period) and the demonstrated period-axis and
      duty-cycle breakdowns this family exists to find. Also the place a
      genuine, pre-existing limitation of single_order_dominance's off-axis
      target direction and a non-monotonic reading of the coupler's own
      local-gradient-smoothness margin past its first refusal point were
      found and are recorded rather than silently worked around.
    destination: >-
      B1-GSL-VALIDITY-PERIOD-{01..08}, -DUTY-{01..03} and -OFFAXIS-01
      canonical instances.
    note: >-
      The three DUTY instances and PERIOD-06 refuse at the per-ray level
      (MISSING_DECLARATION) by design -- a genuinely discontinuous edge
      breaks the coupler's local-gradient estimate regardless of duty cycle
      -- and single_order_dominance is measured directly, bypassing that
      gate, so the family still records a graded signal on those instances.
  - path: benchmarks/instances/b2_transitions.py
    bucket: B
    justification: >-
      POSITIVE: the four B2 transition families executed -- exact ray-to-wave,
      the route budget on two systems, the stochastic wave-to-ray estimator with
      its four evidence kinds in enforced order, and the round trip in both
      directions with both arms. Four constructions had to be corrected to get
      here and every one of them had already produced a plausible number: the
      reconstruction was owed the SI eq S5 1/N, enumerating a MAGNITUDE density
      is not the exactness limit, unbiasedness must be measured on a SIGNED
      linear functional against an independent probe rather than on a norm or
      against the field itself, and a centred real Gaussian probe cannot see
      either broken twin. No tolerance moved; two tolerance BASES were completed.
    destination: >-
      B2-R2W-EXACT-01, B2-R2W-ROUTE-{ONNODE,OFFNODE}-{01,02,04,08},
      B2-W2R-STOCH-01 and the B2-ROUNDTRIP canonical instances, run by
      tests/test_b2_transition_instances.py.
    note: >-
      The three W2R blind spots are measured rather than asserted, and two of the
      six controls needed their own configuration to be observable at all --
      normal_sign is exactly inert at z = 0 and the evanescent fraction is
      exactly 0 at that pitch, so both would have reported green.
  - path: benchmarks/instances/b2_equiv.py
    bucket: B
    justification: >-
      POSITIVE: the patch/global equivalence anchor, the drawn convergence ladder,
      and the enumerated sub-aperture instance that separates "the estimator is
      wrong" from "the estimator has sampling error". It also records the family's
      most useful finding: the equivalence is exact where the patch mode grid and
      the oracle mode grid coincide and only there -- 1.7e-15 at the DOE plane
      against 0.84 at z = 1.26 mm, with neither route wrong.
    destination: >-
      B2-EQUIV-FULL-01, B2-EQUIV-SUB-{004,016,064,225} and
      B2-EQUIV-SUB-ENUMERATED, run by tests/test_b2_equiv_instances.py.
    note: >-
      Two of the three negative controls are exactly inert at full aperture --
      coverage is 1 and the launch offset is 0 -- which is how a real
      A_patch/A_draw inversion survived. The anchor measures that blindness as a
      number and the sub-aperture instances gate the controls.
  - path: benchmarks/instances/b3_psf_singlet.py
    bucket: B
    justification: >-
      POSITIVE: this is the substrate proof. It is the only place a real Optiland
      trace becomes a real ExecutionRecord and that record is handed to verify()
      against a real family, so freezing it keeps the loop -- family, instance,
      executor, verifier -- exercised end to end by the test suite rather than by
      a person remembering to run it.
    destination: >-
      B3-PSF-SINGLET-01, the canonical instance, and the replacement for
      benchmarks/physics/L2-PSF-01/run_benchmark.py (CHE-115).
    note: >-
      CHE-115 closed this. It reproduces the frozen
      fft_oracle_intensity_relative_l2 = 0.0022072391812867093 BIT-IDENTICALLY
      from the committed graph document examples/graphs/psf_singlet_sensor.yaml --
      asserted with ==, not approx, by
      tests/test_substrate_proof.py::test_the_frozen_number_is_reproduced_bit_identically.
      The two things that had to change were config['advance_to_z_m'] on the
      C_RAY_TO_WAVE edge, without which a graph could not name the sensor plane at
      all, and reading the PSF with PsfNormalization.RAW rather than PEAK, because
      the metric peak-normalizes its own inputs and dividing twice costs one ULP.

  # =========================================================================
  # benchmarks/systems/ -- layer-C specs, drivers and records, CHE-141 (M2.5)
  # onward. B3-4F-IDEAL (CHE-144, M2.8) is the first system authored here.
  # =========================================================================
  - path: benchmarks/systems/b3_4f_ideal.py
    bucket: B
    justification: >-
      POSITIVE: the ideal 4f relay driver -- fft2/mask/ifft2 realized directly
      with numpy, since no M_WAVE_CHROMATIX capability implements an ideal
      lens's Fourier-transforming property. Runs, measures and verifies all
      nine canonical instances and demonstrates every declared negative
      control firing on at least one of them.
    destination: The nine B3-4F-IDEAL-* canonical instances.
    note: >-
      Confirmed the order-n sign convention (x0_n = -n / Lf) and the
      finite-samples_per_period aliasing tail against scipy.special.jv while
      authoring; both are recorded in the family module's docstring rather than
      only in this driver.
  - path: benchmarks/systems/b3_doe_inline.py
    bucket: B
    justification: >-
      POSITIVE: the embedded-DOE driver -- a diffractive interaction INSIDE a
      refractive train, so its outgoing ray bundle is handed straight to an
      Optiland trace with no reconstruction in between. Two topologies:
      collimated bundle into a linear phase ramp in front of a real singlet, and
      a converging bundle out of one singlet through the ramp into a second that
      relays the intermediate image at -1.914x. It computes its own reference
      rather than importing one -- closed_form_outgoing rebuilds the outgoing
      bundle from the grating equation and m phi(x_snap) / k0 and shares no line
      with couplers/generalized_snell.py, which a test enforces at the source
      level -- and runs six arms per instance so the exactness limits, the
      unmodulated Strehl denominator and the independently constructed
      admissible bundle are all measured rather than assumed. Its m = -1
      instance is what found the order/OPL inconsistency in
      couplers/generalized_snell.py that CHE-148 fixed.
    destination: The twelve B3-DOE-INLINE-* and six B4-DOE-INLINE-* canonical instances.
  - path: benchmarks/systems/b3_4f_real.py
    bucket: B
    justification: >-
      POSITIVE: the real aberrated 4f relay driver, and the first thing in this
      tree that composes the whole hybrid chain end to end -- C_WAVE_TO_RAY at
      full enumeration, an Optiland trace through a real refractive group,
      diffractive_interaction(model=FULL_FIELD) at the shared focal plane, a
      second Optiland trace, and a C_RAY_TO_WAVE sensor reconstruction. It
      imports B3-4F-IDEAL's own mask constructor and order reductions rather
      than copying them, which is what makes "the modulation is unchanged from
      4F-1" true by identity. Drives both families and demonstrates all five
      declared negative controls firing.
    destination: The five B3-4F-REAL-* and eight B4-4F-REAL-* canonical instances.
    note: >-
      Three things were found by running it rather than by deriving them, and
      each is recorded where a reader will meet it: displacing the ray LAUNCH
      POSITIONS does not displace the object (the spectral sum is periodic with
      the object grid, so the object grid is the field of view); the shared
      plane's axial position is not load-bearing at any displacement this
      geometry admits, because the field there is the object's own spectrum and
      its depth of focus is of order a metre; and the aperture axis has a hard
      ceiling where the aberration's residual ray angle stops fitting the
      shared plane's grid, which C_RAY_TO_WAVE refuses with SHAPE_MISMATCH.
  - path: benchmarks/systems/records/*.json
    glob: true
    bucket: B
    justification: >-
      POSITIVE: the nine B3-4F-IDEAL-* instance records -- the sweep across
      samples_per_period from deep inside to far outside the declared
      FFT_GRID_NYQUIST bound, plus the grid-snapped/off-grid carrier pair.
    destination: B3-4F-IDEAL-{SIN-01..05,BIN-01,BIN-02,CARRIER-SNAPPED,CARRIER-OFFGRID}.

