    repository: https://github.com/deepmodeling/jax-fem
    pinned_ref: "0.0.12"
    retrieved_at: "2026-07-30"
    notes: >
      REMOVED from this project by CHE-87 (2026-08-22). It never had an
      adapter; its registry entry, knowledge pack and dependency pins are gone
      and there is no knowledge/solvers/jax_fem/ any more. Two blockers are
      recorded in benchmarks/roadmap.md, and the second is not about optics: a
      LICENCE MISMATCH -- PyPI metadata claims BSD, the repository's actual
      LICENSE is GPLv3 against this project's MIT. Retained here as a catalog
      entry only.
      Real PyPI package (`pip install jax-fem`), but the published wheel
      declares NO dependencies at all (not even jax/numpy) -- the real
      dependency set had to be reconstructed from the project's own
      environment.yml. The actual FEM solve entry point
      (`jax_fem.solver`) hard-imports petsc4py, which has no prebuilt wheel;
      NOT executable end-to-end in this project's lightweight pip-based
      container without a much heavier PETSc build.
