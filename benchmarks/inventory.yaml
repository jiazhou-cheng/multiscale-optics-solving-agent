      re-checkable. Distinct from the probe records above in one way that matters:
      a probe record is a measurement somebody chose to keep, and an instance
      record is what verify() concluded about a declared family at a declared
      point in its parameter space. That is why these carry TWO fingerprints (the
      instance and the result) and why they have no unenrolled register --
      every one is written by a driver, so an unstamped one means somebody
      hand-wrote it.
