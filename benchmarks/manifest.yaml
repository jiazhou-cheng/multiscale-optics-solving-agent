version: 0.1.0
m1_exit_report: benchmarks/M1_BASELINE_REPORT.md
m1_independence_check: benchmarks/verify_m1_independence.py
levels:
  1:
    name: one-model simulation
    tasks:
      - id: L1-RAY-01
        title: Optiland analytic ray accuracy
        primary_model: M_RAY_OPTILAND
        implementation: benchmarks/level1/L1-RAY-01
        command: >-
          ./run.sh python benchmarks/level1/L1-RAY-01/run_benchmark.py
          --output-dir outputs/L1-RAY-01
        scaling_command: >-
          ./run.sh python benchmarks/level1/L1-RAY-01/run_scaling.py
          --backend numpy --output-dir outputs/L1-RAY-01/scaling
        scaling_evaluator: >-
          ./run.sh python benchmarks/level1/L1-RAY-01/evaluate.py
          --section scaling --output-dir outputs/L1-RAY-01/scaling
        bundle_command: >-
          ./run.sh python benchmarks/level1/L1-RAY-01/run_all.py
          --output-dir outputs/M1/ray
        bundle_evaluator: >-
          ./run.sh python benchmarks/verify_m1_independence.py
        evaluator_version: "1.0.0"
        protocol: benchmarks/protocol.yaml
        result_schema: benchmarks/schemas/result.schema.json
        provenance_schema: benchmarks/schemas/provenance.schema.json
      - id: L1-WAVE-01
        title: Chromatix wave-propagation accuracy, exact to high-NA vectorial
        primary_model: M_WAVE_CHROMATIX
        implementation: benchmarks/level1/L1-WAVE-01
        command: >-
          ./run.sh python benchmarks/level1/L1-WAVE-01/evaluate.py
          --case gaussian --output-dir outputs/L1-WAVE-01
        reference_command: >-
          ./run.sh python benchmarks/level1/L1-WAVE-01/generate_reference.py
        scaling_command: >-
          ./run.sh python benchmarks/level1/L1-WAVE-01/run_scaling.py
          --device cpu --output-dir outputs/L1-WAVE-01/scaling
        scaling_evaluator: >-
          ./run.sh python benchmarks/level1/L1-WAVE-01/evaluate.py
          --section scaling --output-dir outputs/L1-WAVE-01/scaling
        bundle_command: >-
          ./run.sh python benchmarks/level1/L1-WAVE-01/run_all.py
          --output-dir outputs/M1/wave
        bundle_evaluator: >-
          ./run.sh python benchmarks/verify_m1_independence.py
        evaluator_version: "1.0.0"
        protocol: benchmarks/protocol.yaml
        result_schema: benchmarks/schemas/result.schema.json
        provenance_schema: benchmarks/schemas/provenance.schema.json
        cases:
          - id: case1_exact_primitive
            gates: true
            summary: >-
              FFT-compatible Helmholtz plane-wave eigenmodes propagated
              unpadded, against an exact analytic phase-transfer oracle
              u*exp(i k_z z). No approximation anywhere, so the tolerance is
              derived from float32 phase round-off rather than chosen.
          - id: case2_paraxial_focus
            gates: true
            summary: >-
              Finite rectangular pupil, ideal paraxial thin lens, and three
              signed input tilts. Focal position and diffraction compared to an
              analytic Fresnel/Fourier oracle; an independent float64 angular
              spectrum separates paraxial-model error from solver error.
          - id: case3_high_na_vector
            gates: false
            status: blocked
            summary: >-
              High-NA linearly polarized objective against an independent
              float64 Richards-Wolf quadrature oracle. BLOCKED: Chromatix
              0.6.0's high_na_ff_lens is not sampling-independent -- refining
              only the pupil sampling moves the focal scale by 10x, while the
              oracle converges to 2e-14. Root cause recorded in the bundle's
              blocked_reason and in benchmark_design.md.
        scope_note: >-
          Sampling, padding, reference-quadrature convergence, and negative
          perturbations qualify the benchmark but do not define additional
          physical cases. A catalog plano-convex lens is deliberately not used:
          Chromatix 0.6.0's thick_plano_convex_lens is implemented through an
          ABCD matrix and ray_transfer rather than a surface-resolved
          wave-optical prescription. Chromatix-generated snapshots remain
          regression evidence only, never oracles.
      - id: L1-TMM-01
        title: Multilayer Bragg mirror
        primary_model: M_TMM_JAXLAYERLUMOS
      - id: L1-RCWA-01
        title: Binary grating diffraction
        primary_model: M_RCWA_FMMAX
      - id: L1-EM-01
        title: Full-wave waveguide component
        primary_model: M_EM_FDTDX
      - id: L1-PC-01
        title: Photonic-crystal band structure
        primary_model: M_PC_LEGUME
  2:
    name: two-to-three-model orchestration
    tasks:
      - id: L2-COUPLER-01
        title: Bidirectional ray-wave coupler characterization
        graph: [C_RAY_TO_WAVE, C_WAVE_TO_RAY]
        protocol_id: M2-COUPLER-CPU-V1
        milestone: M2
        implemented: true
        entry_point: benchmarks/level2/L2-COUPLER-01/run_benchmark.py
        note: >
          Tests the couplers against each other and against analytic oracles, with
          no solver engine in the coupler core. Deliberately not a graph benchmark:
          L2-PSF-01 below is the end-to-end path, and it needs a verified
          Optiland-to-coupler OPL convention that M2 did not establish.
      - id: L2-PSF-01
        title: PSF-engineered microscope
        graph: [M_RAY_OPTILAND, C_RAY_TO_WAVE, M_WAVE_CHROMATIX, C_FIELD_TO_PSF, M_SENSOR_IDEAL]
        implemented: false
        blocked_by: >
          Optiland's opd_native sign and reference plane remain unverified (M1
          limitation, carried into M2), so no admissible optical path length can be
          handed to C_RAY_TO_WAVE from a real trace yet.
      - id: L2-META-01
        title: Unit-cell-to-system meta-optic imaging
        graph: [M_RCWA_FMMAX, C_CELL_TO_SURFACE, M_WAVE_CHROMATIX]
      - id: L2-GRATING-01
        title: Full-wave near-field to far-field/fiber overlap
        graph: [M_EM_FDTDX, C_NEAR_TO_FAR]
      - id: L2-THERMO-01
        title: Optical absorption to thermo-optic response
        graph: [M_EM_FDTDX, C_ABSORPTION_TO_HEAT, M_THERMAL_JAX_FEM, C_TEMPERATURE_TO_MATERIAL]
  3:
    name: hard inverse design
    tasks:
      - id: L3-HYBRID-01
        title: Wide-field refractive-diffractive microscope
      - id: L3-ACHROMATIC-01
        title: Achromatic meta-optic computational imager
      - id: L3-ROBUST-01
        title: Robust adaptive-fidelity grating coupler
