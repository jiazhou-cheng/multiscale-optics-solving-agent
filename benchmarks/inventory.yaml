  - path: benchmarks/protocols/m1_baseline_protocol.md
    count: 1
    by: CHE-106 (M1.1)
    survives_as: >-
      knowledge/solvers/optiland/conventions.md and
      knowledge/solvers/chromatix/conventions.md, which carry the same boundary
      items -- units, axis order, frame, handedness, phasor sign, amplitude
