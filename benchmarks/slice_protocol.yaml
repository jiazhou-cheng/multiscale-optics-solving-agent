schema_version: 1
protocol_id: M3-SLICE-CPU-V1
extends: M2-COUPLER-CPU-V1
amendments:
  - id: A1-carrier-conditioned-propagation
    issue: CHE-40 (M3.2A)
    supersedes: >-
      the M3.2 finding that the optical system's absolute SIZE is a binding
      numerical constraint
    summary: >-
      M3.2's measured error was real but its cause was misattributed. The ASM
      transfer function factors exactly as exp(i k z) * exp(i z (k_z - k)), and
      the first factor is a global piston that contributes nothing to a single-
      path PSF. Evaluating only the second factor -- through the exact identity
      k_z - k = -(k_x^2+k_y^2)/(k_z+k), not a paraxial expansion -- drops the
      piston-aligned field error at 47 mm from 1.2e-2 to 6.5e-6 and the intensity
      error from 8.2e-3 to 3.9e-6, with the prescription, NA, grid, oracle, and
      input field all unchanged. Absolute optical-system scale is therefore NOT a
      binding constraint on a carrier-conditioned path.
    evidence: outputs/M3/carrier-phase/result.json
    probe: benchmarks/probes/m3_carrier_phase.py
  - id: A2-singlet-pupil-to-focus-distance
    issue: CHE-33 (M3.4)
    supersedes: >-
      M3-SINGLET-REF.derived.propagation_distance_mm = 4.705604760225210
    summary: >-
      The pupil-to-focus distance the wave leg must propagate is
      image_plane_z_mm - exit_pupil_z_mm. For M3-REVERSE-TELEPHOTO the frozen
      value satisfies that exactly (3.054578897851833). For M3-SINGLET-REF the
      frozen value was the BACK FOCAL LENGTH, 4.705604760225210, while the
      exit-pupil-to-image distance is 4.837461300309598 -- the two differ because
      the exit pupil sits 0.068 mm behind the rear vertex, not at it. The gap is
      0.1319 mm.
    why_it_matters: >-
      0.1319 mm of the wrong propagation distance is rho^2/2 * (1/R_wrong -
      1/R_true) = 0.311 waves of defocus at this NA -- 18x the system's own
      0.017-wave residual aberration and 300x the tightest gate in the tolerance
      budget. It would have been charged to the slice rather than to the number.
    found_by: >-
      CHE-33's analytic oracle. A diffraction-limited system delivers equal
      optical path to its focus, so the declared pupil OPL must equal
      R - sqrt(rho^2 + R^2). At R = 4.7056 mm the residual is 0.311 waves; at
      R = 4.8375 mm it is 0.016999 waves, which independently reproduces this
      protocol's own frozen 0.016996 and Optiland's own Wavefront value of
      0.016999.
    correction: >-
      propagation_distance_mm for M3-SINGLET-REF is 4.837461300309598. The
      superseded value is retained below as propagation_distance_mm_superseded.
      Every other derived number for that system is unaffected: efl, bfl, NA,
      exit-pupil location and diameter, and the image plane z were all measured
      independently and all still agree with the trace.
    evidence: knowledge/couplers/ray_to_wave/expected/coherent_handoff.json
    probe: knowledge/couplers/ray_to_wave/probes/coherent_handoff.py
  - id: A3-ray-refinement-does-not-close-the-oracle-gate
    issue: CHE-38 (M3.9)
    supersedes: >-
      the M3.8 reading that the fft_oracle_intensity_relative_l2 residual FLATTENS
      at ~6.7e-3, and its attribution of the whole excess to ray_sampling_error
    summary: >-
      M3.8's six-point sweep stopped at 27937 traced rays, which is where the
      residual is at its MINIMUM. Continued to 787969 rays it turns around and
      rises: 6.67e-3 / 6.82e-3 / 7.24e-3 / 7.67e-3 / 8.04e-3 / 8.32e-3 at 27937 /
      49537 / 98827 / 197377 / 394219 / 787969, a monotone rise fitted at
      N^+0.070 +/- 0.003 over that range against N^-0.455 +/- 0.034 below the
      minimum. So the trend does not flatten and does not extrapolate to the gate;
      two error terms of opposite sign cancel near the middle of the sweep. Ray
      sampling is the term that falls, measured against a ray-refined reference at
      N^-0.609 +/- 0.035, and it is NOT the term that dominates at the frozen
      configuration's own best case.
    what_dominates_instead: >-
      the aperture function. C_RAY_TO_WAVE sums plane wavelets, each an infinite
      plane wave, so the sum is a stationary-phase estimate of the pupil field and
      cannot represent a hard stop. Measured on a window wider than the pupil, the
      reconstructed amplitude at the geometric rim is 0.50 of the interior plateau
      -- the knife-edge value -- with an overshoot fringe inside it and a
      transition whose slope tracks 1/sqrt(lambda R). See
      open_structural_items.wavelet_sum_cannot_represent_a_hard_aperture_edge.
    no_tolerance_was_widened: >-
      the gate stays at 1.0e-3 and stays failing. The aperture term is entered in
      the budget as a named error source that exceeds it, which is the opposite of
      widening: it makes the budget state that it does not close.
    evidence: benchmarks/probes/records/m3_convergence.json
    probe: benchmarks/probes/m3_convergence.py
scope:
  benchmark_ids: [L2-PSF-01]
  execution: end_to_end_graph
  # Amended by CHE-36 (M3.7). The graph terminates at the propagated
  # ComplexField, which is the last physical state the slice evolves. PSF
  # extraction is a MEASUREMENT on that terminal state, run by the benchmark
  # driver after the graph and recorded in provenance -- deliberately not an
  # edge. C_FIELD_TO_PSF was removed from the registry: `ComplexField -> |U|^2`
  # changes no representation, so it is an observable, not a coupler.
  graph: [M_RAY_OPTILAND, C_RAY_TO_WAVE, M_WAVE_CHROMATIX]
  terminal_state: complex_field
  terminal_measurement:
    kind: observable
    quantity: psf
    implementation: src/multiscale_optics_agent/evaluation/psf_measurement.py
    is_a_graph_edge: false
  # M2 forbade engine imports in the coupler *core* and that rule is inherited
  # unchanged. M3 is an end-to-end slice, so the benchmark driver necessarily
  # imports both engines; the constraint is that they never reach the core.
  forbidden_import_prefixes:
    coupler_core: [optiland, chromatix]
  excluded_from_scope:
    - M_SENSOR_IDEAL          # no pixel integration or noise model in M3
    - C_WAVE_TO_RAY           # the slice is one-directional
    - any gradient claim      # forward-only; deferred to M4
  rationale: >-
    M2 verified both coupler directions against analytic oracles while
    deliberately never touching a real engine. M3 closes that gap: a real
    Optiland trace, reconstructed at a declared exit pupil, propagated by the
    M1-verified Chromatix ASM, and measured as a normalized PSF -- where the
    measurement is an observable taken on the terminal field, not a fourth graph
    step (CHE-36).

execution:
  entrypoint: ./run.sh
  device: cpu
  dtype_coupler: complex128
  dtype_wave_engine: complex64      # forced by Chromatix; see tolerance_budget
  wavelength_m: 5.5e-7
  seed: 20260812
  # Inherited from M2-COUPLER-CPU-V1 unless restated.

# ---------------------------------------------------------------------------
# Handoff plane
# ---------------------------------------------------------------------------
handoff_plane:
  name: exit_pupil
  source: optic.paraxial.XPL() and optic.paraxial.XPD()
  constructed: false
  rationale: >-
    Optiland exposes exit pupil location and diameter directly, so the plane is
    read from the system rather than constructed. Rays travel in air after the
    last surface, so projecting each ray from the image plane to the pupil plane
    along its own direction is exact, not an approximation.
  is_a_plane_not_a_sphere: true
  plane_not_sphere_note: >-
    C_RAY_TO_WAVE accumulates plane wavelets onto a PLANE. The
    `reference_sphere: exit_pupil` in examples/graphs/ray_to_wave.yaml was
    aspirational text that nothing implements; it is marked as M4 scope there.
  propagation_target: paraxial focus / image plane
  propagation_method: angular_spectrum   # the M1-verified ASM, unchanged

# ---------------------------------------------------------------------------
# Required numerical conditioning (CHE-40, M3.2A)
# ---------------------------------------------------------------------------
# Both entries are the same rule applied on the two sides of the coupler: form
# phase from a DIFFERENCE against a declared reference, never from an absolute
# accumulated quantity. On the wave side the absolute quantity is k z; on the ray
# side it is Optiland's accumulated OPL. Neither is wrong physically; both are
# unrepresentable at the precision the rest of the budget assumes.
required_conditioning:
  wave_side:
    rule: >-
      phase-insensitive M3 PSF paths MUST propagate with the common carrier phase
      removed: H = exp(i z (k_z - k)), evaluated through the exact identity
      k_z - k = -(k_x^2 + k_y^2)/(k_z + k)
    is_not: a paraxial approximation -- no term is dropped
    implementation: ASM-CARRIER-REMOVED-V1
    module: src/multiscale_optics_agent/adapters/chromatix_carrier_removed.py
    global_phase_policy: retained_as_metadata_not_reapplied
    global_phase_policy_detail: >-
      the removed exp(i k z) is recorded in float64 on the result and is never
      folded back into the complex64 field, because reapplying it there would
      reintroduce exactly the rounding it was removed to avoid. A consumer
      needing absolute optical phase calls reconstruct_absolute_phase; a consumer
      needing intensity or single-path relative phase needs nothing. No consumer
      may read absolute optical phase off the propagated field.
    caller_must_supply_wavelength: >-
      chromatix Field.spectrum is float32, so a carrier phase derived from the
      field is good only to ~3e-8 relative -- about 0.02 rad at 47 mm. Pass the
      float64 wavelength explicitly whenever absolute phase will be reconstructed.
    evidence: outputs/M3/carrier-phase/result.json
    regression_tests: tests/test_carrier_removed_asm.py
  ray_side:
    rule: >-
      coherent phase MUST be formed as phi_i = (2*pi/lambda) * (OPL_i - OPL_ref),
      never directly from absolute accumulated OPL
    reason: >-
      the same conditioning failure as the wave side. CHE-30 established that
      RealRays.opd is absolute accumulated optical path from the ray launch
      state, so at a few tens of millimetres it is ~1e5 waves; forming phase from
      it directly spends the whole float budget on a piston that the PSF cannot
      see.
    owner: M3.4 (CHE-33)
    owns_the_details: >-
      the choice of OPL_ref, the sign convention, and global-phase provenance
      belong to the M3.4 contract; this protocol fixes only that a reference
      subtraction must happen before phase is formed
    status: implemented
    implementation: src/multiscale_optics_agent/couplers/optiland_handoff.py
    implemented_by: CHE-33 (M3.4)
    opl_reference_chosen: >-
      the traced chief ray -- the surviving ray of smallest pupil radius -- with
      sign 'ray minus chief', matching the evaluator convention L1-RAY-01 already
      declared. Because the reference comes from the same trace, CHE-30's
      aperture-dependent launch-plane zero is common to every ray and cancels
      exactly, so the declared OPL is invariant under the one thing that made the
      absolute value meaningless.
    global_phase_policy: retained_as_metadata_not_reapplied
    measured_piston_removed_waves:
      M3-SINGLET-REF: 1218.5651099327156
      M3-REVERSE-TELEPHOTO: 5467.9789054454195
    measured_signal_retained_waves:
      M3-SINGLET-REF: 11.734374712240074
      M3-REVERSE-TELEPHOTO: 15.801773246826363
    known_consequence: >-
      no per-ray area weight is applied, so the reconstructed field amplitude
      scales with ray density. The PSF is convergent in shape but not in scale
      under ray refinement. Recorded rather than hidden; CHE-38 owns it.
    known_consequence_measured_by: CHE-38 (M3.9)
    known_consequence_measurement: >-
      the reconstructed pupil discrete power grows as (traced rays)^2.0024 +/-
      0.0002 over 27937 to 787969 rays, r^2 = 0.9999999 -- amplitude exactly linear
      in ray count, as the missing dA factor implies. Below ~28000 rays the fitted
      exponent is lower (1.63 over the whole sweep) because the sum is not yet a
      quadrature of the aperture at all.
    known_consequence_for_a_convergence_study: >-
      no absolute-scale metric can converge, so every metric in the M3.9 study is a
      ratio: peak-normalized intensity residuals, and peak-over-energy ratios for
      the Strehl-like ones. That is demonstrated rather than asserted -- the
      peak-normalized PSF is bit-identical under an exact power-of-two rescale of
      every ray amplitude, while the raw peak moves by exactly the square. A raw
      peak intensity or raw window energy compared against a fixed tolerance would
      diverge under refinement for a reason that is a property of the missing weight
      and not of the physics.
    known_consequence_hexapolar_note: >-
      hexapolar ring j carries 6j rays over an annulus of area proportional to j, so
      the area per ray is constant except at the centre. A uniform per-ray weight is
      close to the correct quadrature weight, which is why the SHAPE converges at
      all; it is the missing dA, not a bad distribution, that makes the scale
      diverge. A per-ray area model is therefore a smaller change than CHE-33
      feared, but it is still unverified physics and still needs its own ticket.
    evidence: knowledge/couplers/ray_to_wave/expected/coherent_handoff.json
    regression_tests: tests/test_optiland_coherent_handoff.py

# ---------------------------------------------------------------------------
# Systems
# ---------------------------------------------------------------------------
systems:
  - id: M3-SINGLET-REF
    role: primary_verification_vehicle
    description: >-
      Plano-convex singlet, convex toward the collimated side, built from real
      refractive surfaces, scaled to 1/10 of a 25 mm-radius prescription. Admits
      an analytic Airy oracle.
    scale_status:
      value: safe_fallback_configuration
      amended_by: CHE-40 (M3.2A)
      was: >-
        a required architecture constraint -- M3.2 scaled the prescription to
        keep the pupil-to-focus distance inside the regime where Chromatix's
        float32 cast is not the dominant error
      now: >-
        a cost choice. CHE-40 showed the distance limit was representational, so
        the 1/10 scaling is no longer load-bearing for accuracy. It is kept
        because at 188^2 it is ~120x cheaper than the unscaled system for the
        same physics, and because it is already frozen and verified.
      what_would_change_it: >-
        a ticket that needs a macroscopic system may take the unscaled variant
        under feasibility.rejected_configuration, which is now admissible, and
        pay the grid cost. It may not take it on an unconditioned path.
    construction:
      surface_type: standard        # NOT "paraxial" -- see inadmissible_sources
      refractive_index: 1.5168      # IdealMaterial, so no glass catalog dependency
      radius_mm: 2.5
      center_thickness_mm: 0.2
      stop: surface 1
    derived:
      efl_mm: 4.837461300309598
      bfl_mm: 4.70560476022521
      f_number: 9.7
      semi_aperture_mm: 0.2494
      numerical_aperture: 0.05171631827291936
      exit_pupil_z_mm: 0.06814345991561233
      exit_pupil_diameter_mm: 0.4987073505473812
      image_plane_z_mm: 4.90560476022521
      # Amended by CHE-33 (A2): image_plane_z_mm - exit_pupil_z_mm, which is what
      # the wave leg propagates. The superseded value was the back focal length.
      propagation_distance_mm: 4.837461300309598
      propagation_distance_mm_superseded: 4.70560476022521
      propagation_distance_superseded_by: CHE-33 (M3.4), amendment A2
    diffraction_limited_evidence:
      criterion: Rayleigh quarter wave, peak-to-valley
      peak_to_valley_waves: 0.01699595356250618
      rms_waves: 0.004794729150396517
      marechal_strehl_estimate: 0.9990928255075161
      method: >-
        optical path to a reference sphere centred on the nominal focus, not to
        the image plane, so plane-versus-sphere geometry is not mistaken for
        aberration
    airy_radius_um: 12.974628171691823
  - id: M3-REVERSE-TELEPHOTO
    role: real_aberrated_case
    description: >-
      The bundled Optiland sample already validated in M1 (L1-RAY-01). No
      analytic oracle exists for it, so it is verified against the independent
      FFT/Fraunhofer PSF built from the same traced OPD map.
    derived:
      numerical_aperture: 0.07530880176185195
      exit_pupil_z_mm: 2.1547825721481666
      exit_pupil_diameter_mm: 0.46053493637581633
      image_plane_z_mm: 5.209361469999999
      propagation_distance_mm: 3.0545788978518327
    analytic_oracle_available: false
    analytic_oracle_absent_because: >-
      a real multi-surface objective is not aberration-free, so an Airy pattern
      is not its expected PSF; only an independent implementation over the same
      wavefront can bound it

# ---------------------------------------------------------------------------
# Sampling
# ---------------------------------------------------------------------------
sampling:
  # The limit is PER AXIS. M2 fixed this after CHE-24 tested the direction norm:
  # a diagonal FFT bin has |d| = sqrt(2)*lambda/(2*pitch) yet is exactly
  # representable, so a norm test both over- and under-constrains.
  nyquist_rule: pitch_axis <= wavelength / (2 * max_over_rays(abs(direction_cosine_axis)))
  nyquist_evaluated_over: marginal rays of an actual trace, not a paraxial estimate
  oversampling_factor: 2
  oversampling_factor_reviewed_and_retained_by: CHE-38 (M3.9)
  oversampling_rationale: >-
    Measured, not argued from pixel counts. Across a grid sweep at fixed physical
    extent the PSF metrics stop moving at 2x: doubling again to 4x (grid 376)
    changes the FFT-oracle residual and the Airy peak deficit by less than the
    convergence threshold while costing 4x the pixels. Below 2x there is no margin
    at all -- at 1x the pitch sits exactly on the per-axis Nyquist limit of the
    marginal ray, and the next coarser grid in the sweep is refused outright.
  oversampling_rationale_superseded: >-
    At the critically admissible pitch the Airy radius spans only ~2.44 pixels,
    which is enough to locate a peak and a first null but not to compare a
    profile. At 2x it spans ~4.9 pixels.
  oversampling_rationale_superseded_because: >-
    both figures counted the Airy DIAMETER as a radius (see
    open_structural_items.airy_radius_entry_is_a_diameter). The true radius spans
    1.22 pixels at the critical pitch and 2.44 at the frozen 2x. The corrected
    numbers also undercut the old argument rather than rescuing it: 2.44 pixels per
    radius is NOT enough to compare a profile -- M3.8 had to run its first-null
    estimator over the analytic pattern on the same grid because at 2.44 px/radius
    the estimator reads an exactly known null 11% high. 2x is retained on the
    measured grounds above, not on the pixel count.
  grids:
    M3-SINGLET-REF:
      nyquist_pitch_max_m: 5.317470562168779e-06
      sample_pitch_m: 2.6587352810843895e-06
      pupil_extent_m: 0.000499568295573393
      grid_n: 188
      airy_radius_in_pixels: 4.88
    M3-REVERSE-TELEPHOTO:
      nyquist_pitch_max_m: 3.651631596391999e-06
      sample_pitch_m: 1.8258157981959995e-06
      pupil_extent_m: 0.0004619720213998758
      grid_n: 254
  ray_count_criterion:
    rule: >-
      at least one traced ray per Nyquist cell of the pupil field, i.e.
      ray_count >= (pupil_extent / sample_pitch)^2 / oversampling^2, evaluated
      as a starting point and then tested rather than assumed
    starting_value: 4096
    tested_by: M3.9 (CHE-38) convergence study
    note: >-
      Optiland's `num_rays` is a hexapolar density request, not an output count;
      the traced survivor count is what this criterion applies to.
    tested_result:
      by: CHE-38 (M3.9)
      verdict: refuted_as_an_accuracy_criterion
      internal_inconsistency: >-
        the rule as written evaluates to (499.568e-6 / 2.6587e-6)^2 / 2^2 = 188^2
        / 4 = 8836 traced rays at the frozen grid, not to the frozen
        starting_value of 4096 -- a factor of 2.157. The two numbers in this block
        do not agree with each other, and neither is edited here: which one was
        meant is recorded as unknown rather than guessed.
      measured: >-
        neither count reaches any gate. The FFT-oracle residual is 9.13e-3 at 7057
        traced rays and 7.40e-3 at 12481, bracketing both candidate values, against
        a 1.0e-3 gate. Ray refinement to 787969 rays never reaches it either.
      the_uncomfortable_part: >-
        the criterion's value lands close to where the falling ray-sampling term
        and the flat aperture term cancel, so it looks better than the counts on
        either side of it for a reason that has nothing to do with sampling
        adequacy. A criterion that is accidentally near an optimum is more
        dangerous than one that is plainly wrong.
      what_it_is_good_for: >-
        it remains a sensible LOWER bound: below it the reconstruction carries a
        large sampling pedestal -- at 3169 rays only 52% of the propagated power
        lands in the frozen observation window, against 99.9% by 27937 -- so the
        criterion screens out configurations that are obviously inadequate. It
        certifies nothing above that.
      converged_ray_count_measured_instead: >-
        see m3_9_convergence.converged_configuration, which states the count at
        which the peak-normalized PSF stops moving under further refinement.

# ---------------------------------------------------------------------------
# Tolerance budget
# ---------------------------------------------------------------------------
# Derived from named error sources, each with a measurement or a citation. Not
# read off a passing run: M3.8 tests against these numbers, so setting them from
# observed output would make the comparison circular.
tolerance_budget:
  terms:
    - name: coupler_float64_roundoff
      value: 1.0e-12
      level: field, relative
      source: >-
        M2 measured 7.82e-14 max abs error on the plane-wave analytic oracle at
        16x16; the bound scales with accumulated phase over the output grid and
        with ray count, so 1e-12 is a headroom-carrying restatement
      dominates: nothing at this grid size
    # Amended by CHE-40 (M3.2A). M3.2's 3.5e-4 / 3.4e-3 pair was correct for the
    # absolute-phase path and is retained below as the fallback. On the
    # carrier-conditioned path now required by this protocol, the phase the
    # transfer function must represent is max|z(k_z - k)| rather than k z, and the
    # budget is derived from that instead.
    - name: chromatix_complex64_truncation
      value: 1.0e-4
      level: intensity, relative
      applies_to_path: carrier_conditioned
      source: >-
        eps32 * max|z(k_z - k)| evaluated on each system's own grid: 6.89e-5 for
        M3-SINGLET-REF and 9.55e-5 for M3-REVERSE-TELEPHOTO, so 1.0e-4 covers
        both. Derived from the represented phase, not read off a run -- the
        measured errors in outputs/M3/carrier-phase/result.json sit 20-50x below
        this bound, and M3.8 tests against the bound.
      levels:
        absolute_field_phase:
          value: null
          status: not_preserved_by_the_required_path
          note: >-
            the carrier-conditioned path discards exp(i k z) as an explicit
            global piston. A consumer that needs absolute optical phase must
            reconstruct it in float64 from the recorded carrier; it may not read
            it off the complex64 field.
          cost_if_taken_from_the_absolute_path: 6.4e-3
          cost_source: eps32 * k z at M3-SINGLET-REF's 4.706 mm
        piston_aligned_field:
          value: 1.0e-4
          source: eps32 * max|z(k_z - k)|, worst of the two systems
          note: >-
            this is the field-level metric that means something once the carrier
            is gone: it measures spatially varying wavefront error, which is what
            a PSF is actually made of.
        intensity:
          value: 1.0e-4
          source: >-
            bounded AT the piston-aligned field term rather than at a tenth of
            it. M3.2's 10x field-to-intensity gap came from the common piston
            cancelling under squaring; the conditioned path has already removed
            that piston, so the remaining per-bin error does not cancel and the
            gap does not carry over.
      superseded_absolute_phase_path:
        intensity: 3.5e-4
        field: 3.4e-3
        source: >-
          M3.2, measured against the same float64 reference at each system's own
          distance and NA. Still the correct budget for any path that propagates
          the absolute carrier, which is why it is kept rather than deleted.
        independent_agreement: >-
          M1 declared 3.00e-04 for this engine from 5*eps32 per radian, derived
          independently of that measurement
      dominates: the numerical budget
    - name: reference_system_residual_aberration
      value: 9.1e-4
      level: Strehl deficit
      source: measured, 1 - 0.9990928 for M3-SINGLET-REF
      applies_to: the Airy comparison only
      is_an_error: false
      note: >-
        a physical property of a real singlet, not a defect. It must appear in
        the Airy tolerance because Airy is the perfect-lens limit, and it must
        NOT appear in the FFT-oracle tolerance because that oracle shares the
        same wavefront.
    - name: ray_sampling_error
      value: 1.0e-3
      level: intensity, relative
      status: measured
      measured_by: CHE-38 (M3.9)
      owner: M3.9 (CHE-38)
      applies_at: >-
        the converged configuration, 394219 traced rays. At the frozen 3169-ray
        configuration this term is 1.83e-2, which is 18x the FFT gate on its own.
      definition: >-
        relative L2 of the peak-normalized PSF against the RAY-REFINED PSF at the
        same configuration -- 787969 traced rays -- inside 5 Airy radii. Measured
        against the refined result rather than against an oracle deliberately: an
        oracle residual mixes this term with wavelet_aperture_edge_error below, and
        that mixing is what made M3.8 over-read its sweep.
      source: >-
        measured and fitted, not read off a point: 2.10 * N^(-0.609 +/- 0.035) over
        217 to 394219 traced rays with r^2 = 0.972, and 6.79 * N^(-0.715 +/- 0.042)
        over 3169 to 394219 with r^2 = 0.980. The two exponents differ by 0.107,
        which is three times either standard error and is the honest error bar on
        the exponent -- M2's carried-forward lesson, in the form this study can
        exhibit it. Measured 4.90e-4 at 394219 traced rays, so the entered 1.0e-3
        carries headroom and is also the refinement threshold the converged
        configuration was chosen against.
      sweep:
        # traced rays -> relative L2 against the 787969-ray PSF
        217: 5.45e-2
        817: 3.67e-2
        1801: 2.01e-2
        3169: 1.83e-2
        7057: 1.12e-2
        12481: 8.15e-3
        27937: 5.08e-3
        49537: 3.53e-3
        98827: 2.16e-3
        197377: 1.18e-3
        394219: 4.90e-4
      does_not_dominate: >-
        the refined configuration. Past ~28000 traced rays it drops below
        wavelet_aperture_edge_error and the total stops improving; past that point
        adding rays makes the agreement with both oracles WORSE, because the two
        terms had been partially cancelling. See amendments A3.
      che35_finding: >-
        the reconstructed pupil field is nowhere near ray-converged at the counts
        tried. Propagated to focus on the frozen grid with the declared padding,
        the fraction of retained intensity landing within three Airy radii of the
        axis is 0.043 / 0.166 / 0.388 at 217 / 817 / 1801 traced rays, with the
        geometry untouched, while the coupler's own max adjacent-ray phase step
        falls 2.53 / 0.63 / 0.28 rad. The protocol's 4096-ray starting value has
        not been reached and the trend has not flattened.
      che35_finding_confirmed_and_extended: >-
        confirmed by CHE-38 and continued: the same series reads 0.958 by 12481
        traced rays and saturates there. CHE-35's companion claim that ~40% of the
        power leaves the window 'regardless of ray count' is refuted -- that was the
        sampling pedestal, and the window share goes from 0.52 at 3169 rays to
        0.9987 by 27937. See
        open_structural_items.the_frozen_window_is_the_pupil_diameter_rounded_up.
      che35_caution: >-
        the coupler's ray_density_status reports wavelet_approximation_holds at
        all three counts, because its criterion is a phase step below pi. That
        criterion is satisfied long before the reconstruction is accurate, so it
        must not be read as a convergence certificate.
      che35_caution_confirmed: >-
        it reports wavelet_approximation_holds at every count in CHE-38's sweep,
        including counts whose PSF is 50x outside the gate, and reports
        not_computed_above_scan_limit above 4096 rays -- where it would matter most.
        It is a validity check on the wavelet picture and nothing more.
      evidence: benchmarks/probes/records/m3_convergence.json (ray_count_convergence)

    - name: wavelet_aperture_edge_error
      value: 7.1e-3
      level: intensity, relative
      status: measured
      measured_by: CHE-38 (M3.9)
      owner: >-
        unassigned. The measurement is CHE-38's; the defect is a follow-up. See
        open_structural_items.wavelet_sum_cannot_represent_a_hard_aperture_edge.
      source: >-
        relative L2 of the peak-normalized PSF against an analytic HARD-MASK pupil
        of the same radius carrying the exact spherical optical path, propagated
        through the same ASM at the same padding and measured the same way: 7.10e-3
        at 197377 traced rays, where ray_sampling_error is 1.18e-3, i.e. six times
        smaller. A synthetic bundle with the exact optical path to the focus
        reproduces it (6.34e-3), so it is a property of the reconstruction operator
        and not of the trace.
      mechanism: >-
        C_RAY_TO_WAVE sums plane wavelets, each an infinite plane wave, so the sum
        is a stationary-phase estimate of the pupil field and resolves it only over
        a Fresnel zone of the bundle's own convergence. A hard stop comes back as a
        knife-edge diffraction profile: amplitude 0.50 of the interior plateau at
        the geometric rim, an overshoot fringe inside it, and a transition whose
        slope follows sqrt(lambda R)^(-1.02 +/- 0.04), r^2 = 0.995.
      refines_away_with_ray_count: false
      refines_away_with_grid: false
      refines_away_with_padding: false
      scales_with: >-
        the pupil Fresnel number a^2 / (lambda R), as N_f^(-0.752 +/- 0.011),
        r^2 = 0.999 over N_f from 7.8 to 39.1. M3-SINGLET-REF sits at N_f = 23.45.
      this_is_not_a_tolerance_widening: >-
        no gate moved. This term is entered because the budget is composed of named
        error sources and its largest one was missing; the consequence is that the
        budget now states explicitly that it does NOT close at 1.0e-3, rather than
        leaving the excess unattributed. Entering a measured error source is the
        opposite of relaxing a tolerance to accommodate it.
      exceeds: fft_oracle_intensity_relative_l2 (1.0e-3) by 7.1x, on its own
      dominates: >-
        every M3 result once the ray count is above ~28000, and roughly half of the
        frozen configuration's residual in quadrature
      evidence: benchmarks/probes/records/m3_convergence.json (aperture_edge_hypothesis)
    - name: grid_truncation_and_padding
      value: 2.0e-5
      level: intensity, relative
      status: measured
      measured_by: CHE-35 (M3.6)
      owner: M3.6 (CHE-35)
      diagnostic: >-
        NOT edge_energy_fraction. CHE-35 measured that fraction moving by only 2x
        (0.036 -> 0.017) between a run carrying 1.4e-1 relative intensity error
        from wraparound and a correctly padded one, so it cannot certify padding.
        It is retained as a window-truncation indicator with a 0.05 reporting
        threshold, and the padding decision is made against a float64 reference
        instead.
      decision: >-
        pad_width is chromatix.functional.compute_padding_transfer's own value,
        566 for M3-SINGLET-REF at the frozen grid, declared explicitly rather than
        left to a default.
      source: >-
        measured 9.58e-6 relative intensity L2 against the same float64
        angular-spectrum reference run at twice that padding, with dtype held
        constant on both sides. 2.0e-5 carries the next sweep term's worth of
        headroom, because the reference at 2x is itself still converging as ~1/pad.
      sweep:
        # pad_width -> relative intensity L2 against pad_width = 1132
        0: 1.39e-1
        94: 7.04e-4
        188: 8.27e-5
        283: 4.00e-5
        566: 9.58e-6
      why_not_half: >-
        pad_width = 94 agrees with 566 to 0.06% on edge-energy fraction and 0.01%
        on peak intensity, and is 73x worse at the intensity level. The cheap
        indicators do not see it.
      evidence: knowledge/solvers/chromatix/expected/m3_pupil_to_focus.json
  gates:
    airy_peak_intensity_relative:
      value: 2.0e-3
      composition: 9.1e-4 residual aberration + 3.5e-4 float32 + margin
      applies_to: [M3-SINGLET-REF]
    fft_oracle_intensity_relative_l2:
      value: 1.0e-3
      composition: >-
        1.0e-4 carrier-conditioned complex64 + margin; no aberration term,
        because the oracle is built from the same wavefront
      not_tightened_because: >-
        CHE-40 cut the complex64 term from 3.5e-4 to 1.0e-4, but ray_sampling_error
        and grid_truncation_and_padding are still unmeasured and must fit inside
        this same gate. Tightening it now would be setting a tolerance against
        terms nobody has measured yet.
      applies_to: [M3-SINGLET-REF, M3-REVERSE-TELEPHOTO]
    energy_accounting_unexplained_residual:
      value: 1.0e-3
      rule: >-
        every loss between traced ray power and PSF integral must be attributed
        to a named mechanism; this bounds the UNATTRIBUTED remainder, not the
        total loss
  no_gate_may_be_satisfied_by_widening: true
  widening_rule: >-
    A gate that fails is a finding to diagnose and report. M2 exited with no
    gate satisfied by loosening a tolerance; M3 inherits that rule.

# ---------------------------------------------------------------------------
# M3.8 verification result -- CHE-37
# ---------------------------------------------------------------------------
# Evidence: benchmarks/probes/m3_psf_verification.py ->
# benchmarks/probes/records/m3_psf_verification.json, pinned by
# tests/test_m3_psf_verification.py. Numbers below are at the frozen
# configuration and 3169 traced rays unless a ray count is named.
m3_8_verification:
  verdict: >-
    the diffraction-limited slice agrees with the analytic Airy pattern in shape
    and scale, and the two intensity-level gates FAIL, both dominated by ray
    sampling. The failures are reported with a measured attribution rather than a
    widened tolerance.
  diffraction_limited:
    analytic_airy_profile_relative_l2: 5.866e-3
    analytic_airy_profile_max_abs: 4.613e-3
    first_null_ratio_measured_over_analytic_same_grid: 0.99632
    first_null_estimator_bias_at_frozen_sampling: 0.1093
    first_null_method: >-
      the same estimator is run over the analytic pattern sampled on the same
      grid and the comparison is the RATIO. At 2.44 pixels per Airy radius the
      estimator reads an exactly known Airy null 10.9% high, so an absolute
      comparison against 0.61 lambda/NA would be measuring the estimator.
    pupil_wavefront_pv_waves_at_the_frozen_plane: 0.016999
    pupil_wavefront_pv_waves_agrees_with: >-
      this protocol's frozen 0.016996 and Optiland's own Wavefront 0.016999 --
      three implementations, one number
    best_focus_offset_from_the_frozen_image_plane_m: -7.224e-6
    fft_oracle_relative_l2: 1.509e-2
  aberrated_case:
    method: defocus of the diffraction-limited system, 120 um past the frozen plane
    rms_waves: 0.0895
    peak_to_valley_waves: 0.3003
    rayleigh_quarter_wave_limited: false
    marechal_valid_regime: true
    chosen_this_way_because: >-
      past the 0.25-wave Rayleigh criterion, so unambiguously not diffraction
      limited, while still inside Marechal's ~0.1-wave validity regime. A more
      strongly aberrated case would leave that regime and make the Strehl
      cross-check meaningless.
    airy_profile_relative_l2: 8.954e-2      # 15x the diffraction-limited case
    fft_oracle_relative_l2: 3.329e-2
    measured_strehl: 0.6734
    marechal_strehl: 0.7289
    strehl_ratio_measured_over_marechal: 0.9238
    strehl_note: >-
      agreement to 7.6%, which is what a small-aberration expansion evaluated at
      the edge of its regime can deliver. A sanity cross-check, not a gate. Its
      value is that it does not share the FFT oracle's dependence on the traced
      OPD map.
  gates:
    energy_accounting_unexplained_residual: pass, 7.5e-7 against 1.0e-3
    fft_oracle_intensity_relative_l2: FAIL, 1.509e-2 against 1.0e-3 (15x)
    airy_peak_intensity_relative: FAIL, 1.216e-2 against 2.0e-3 (6.1x)
  energy_ledger:
    psf_integral_over_propagated_out: 1.0000007
    propagated_out_over_in: 0.9999986
    propagated_in_over_pupil: 1.0000000
    pupil_over_traced: 2.14e-7
    pupil_over_traced_is_not_a_conservation_law: >-
      it converts a sum of dimensionless ray weights into sum(|u|^2)*dy*dx on a
      grid. The bundle declares reconstruction_normalization = none, so this ratio
      is reported as a measure conversion and is not compared to unity.
    every_step_has_a_named_mechanism: true
    unattributed_remainder: 7.5e-7

# ---------------------------------------------------------------------------
# M3.9 convergence study -- CHE-38
# ---------------------------------------------------------------------------
# Evidence: benchmarks/probes/m3_convergence.py ->
# benchmarks/probes/records/m3_convergence.json, pinned by
# tests/test_m3_convergence.py. On axis throughout: CHE-41 owns the off-axis
# handoff and it is recorded unverified, so no convergence evidence here is built
# on an off-axis field point.
m3_9_convergence:
  verdict: >-
    all three discretizations converge, and the answer they converge to is 8x
    outside the gate. Ray count, grid and padding each reach the point where
    refining them further does not move the peak-normalized PSF; the residual
    against the independent FFT oracle then sits at 8.0e-3 against a 1.0e-3 gate,
    because the dominant error is not a discretization error at all. Convergence
    and correctness are separate claims here and both are reported.
  the_finding_that_changed_a_conclusion: >-
    the ray trend is NOT monotone. See amendments A3: M3.8's sweep ended at its own
    minimum, and past 27937 traced rays the residual rises. More rays make the
    agreement worse.
  ray_count:
    swept: 217 to 787969 traced rays, 12 points, everything else frozen
    oracle_residual:
      # traced rays -> relative L2 against the FFT oracle, inside 5 Airy radii
      217: 5.09e-2
      817: 3.29e-2
      1801: 1.75e-2
      3169: 1.51e-2
      7057: 9.13e-3
      12481: 7.40e-3
      27937: 6.67e-3
      49537: 6.82e-3
      98827: 7.24e-3
      197377: 7.67e-3
      394219: 8.04e-3
      787969: 8.32e-3
    reproduces_m3_8: >-
      the six counts M3.8 also ran agree to every digit M3.8 quoted, with a
      different probe and a different oracle grid factor. That is a cross-probe
      reproduction, not a re-report.
    the_second_oracle_turns_around_too: >-
      the residual against the ANALYTIC AIRY pattern, which shares no code, no grid
      and no traced data with the FFT oracle, is non-monotone in the same way: 4.82e-2
      / 1.28e-2 / 7.23e-3 / 7.82e-3 / 1.00e-2 / 1.09e-2 at 217 / 3169 / 12481 / 27937
      / 197377 / 787969 traced rays, with its minimum at 12481. Airy is the textbook
      answer for a diffraction-limited circular pupil, so ray refinement moves the
      slice AWAY from the accepted answer. That is the strongest single statement
      available that the converged reconstruction is the thing that is wrong.
    fitted_below_the_minimum: N^(-0.455 +/- 0.034), r^2 = 0.973, 217 to 27937 rays
    fitted_above_the_minimum: N^(+0.070 +/- 0.003), r^2 = 0.991, 27937 to 787969 rays
    minimum_at: 27937 traced rays, 6.67e-3
    airy_peak_deficit:
      # traced rays -> signed peak/energy deficit against the analytic Airy
      3169: -1.22e-2
      12481: -2.9e-4
      27937: +3.3e-3
      787969: +9.1e-3
      note: >-
        the metric changes SIGN inside the sweep, so a count near the crossing
        satisfies the 2.0e-3 gate for no physical reason. M3.8's "best over the
        sweep" reading of it was that crossing. Read at the refined end it is
        9.1e-3, which FAILS the gate by 4.6x.
  grid:
    swept: grid_n 64 to 376 at fixed physical extent 4.9984e-4 m, so pitch = extent / grid_n
    extent_is_the_pupil_diameter_to_0_055_percent: >-
      the frozen sampling.grids.M3-SINGLET-REF.pupil_extent_m of 4.995683e-4 m is
      twice the largest traced pupil radius, i.e. the measured pupil diameter, and
      grid_n = 188 is that divided by the pitch (187.897) rounded up. So the window
      exceeds the pupil by 0.055% and the pupil is inscribed in it, which is why the
      reconstruction's soft edge is clipped on this grid. Stated as a ceiling
      relation rather than an identity because it is one.
    measured_max_per_axis_direction_cosine: 0.05171631827291936
    measured_admissible_pitch_m: 5.317470562168779e-06
    agrees_with_the_frozen_value: exactly
    smallest_admissible_grid_n: 94
    refused: >-
      grid_n 64, 80, 90 and 93 are refused by C_RAY_TO_WAVE with SHAPE_MISMATCH and
      a remedy, on REAL traced data rather than a synthetic bundle -- M3.5's
      precondition firing where M3.2's rule predicts, with the boundary bracketed at
      93 and 94.
    the_guard_guards_something_real: >-
      the refusal firing is evidence about the refusal, not about the condition, so
      the guard was switched off and the same rays reconstructed anyway through the
      core's enforce_grid_nyquist=False. At an inadmissible pitch the steepest
      wavelet ramps fold back into the grid and the PSF disagrees with both oracles
      by several times what the same configuration one pixel above the limit gives,
      with the Airy peak deficit an order of magnitude worse. The degradation is NOT
      monotone in how badly the limit is violated -- aliasing folds a frequency to
      wherever it lands -- so the condition is a threshold and not a quality scale.
      RayToWaveCoupler has no such switch and cannot be bypassed, which is the right
      default; the core's flag exists for this kind of characterization.
    stabilizes_at: >-
      grid_n 188. The FFT-oracle residual reads 6.72e-3 / 6.82e-3 / 6.95e-3 /
      7.01e-3 and the Airy peak deficit 6.4e-3 / 5.05e-3 / 4.89e-3 / 4.91e-3 at
      grids 128 / 188 / 256 / 376.
    how_to_read_it: >-
      the FFT-oracle residual is not comparable in absolute value across grids --
      each grid gets its own oracle at its own pupil sampling, and the pixel count
      inside the comparison disc changes with the pitch -- so what the sweep tests
      is stabilization. The Airy peak deficit IS comparable, and at grid 94 it reads
      6.6e-4, which is a coarse-grid bias in a peak-over-energy ratio rather than
      accuracy.
  padding:
    swept: pad_width 0 to 1132 from the SAME reconstructed pupil field
    reference: pad_width 1132, twice the frozen value
    wraparound_appears_first_in_the_wings: >-
      at pad_width 0 the core inside one Airy radius moves by 7.0e-4 while the 3-5
      Airy-radius annulus moves by 2.8e-2 and the 5-30 annulus by 8.6e-2 -- a factor
      of 40 and 120. An unpadded run looks plausible in the core.
    unpadded_power_ratio_reads_unity: >-
      0.999999 at pad_width 0, which is CHE-35's trap intact: wraparound recirculates
      the light that should have left the window.
    edge_energy_indicator_fails_again: >-
      from pad_width 0 to 47 the output edge-energy fraction improves 2.4x (7.8e-5
      to 3.3e-5) while the wing error improves 1.1x (2.80e-2 to 2.52e-2). CHE-35
      demoted it from gate to indicator on synthetic data; it fails the same way on
      real reconstructed data.
    gate_metric_is_nearly_blind_to_padding: >-
      6.74e-3 to 6.82e-3 across the whole sweep, because it is taken inside 5 Airy
      radii where the aperture term dominates. Padding needed its own wing metric.
    frozen_566_retained: >-
      this study's own threshold (wing residual below 1.0e-3 against twice the
      padding) is first met at pad_width 188, at 4.6e-4. It is NOT adopted: CHE-35
      declared 566 against a stricter float64-referenced criterion, and relaxing a
      frozen value on a looser test is the move the widening rule forbids even when
      the value is not a tolerance.
  converged_configuration:
    definition: >-
      each discretization refined independently until the peak-normalized PSF stops
      moving by more than 1.0e-3, which is the tightest gate in this budget and was
      declared before the sweep rather than chosen from it. This is a
      DISCRETIZATION-INDEPENDENCE claim and nothing more.
    system: M3-SINGLET-REF, on axis, 550 nm
    traced_rays: 394219
    hexapolar_rings_requested: 362
    grid_n: 188
    sample_pitch_m: 2.6587352810843895e-06
    pad_width: 566
    observation_plane_z_m: 4.90560476022521e-3
    propagation_method: asm_carrier_removed
    evidence_for_calling_it_converged: >-
      the ray-refinement ladder falls monotonically to 4.90e-4 at this count against
      the 787969-ray PSF; doubling the grid changes the FFT-oracle residual by 1.9%
      and the Airy peak deficit by 1.6e-4; doubling the padding changes the wing
      residual by less than 5e-4.
    residual_against_the_fft_oracle_there: 8.04e-3
    gate: 1.0e-3
    the_warning_that_goes_with_it: >-
      converged is not correct. At this configuration the slice reproduces itself
      under refinement of all three discretizations and still disagrees with the
      independent oracle by 8x the gate, because wavelet_aperture_edge_error is not
      a discretization error. Stating a converged configuration without that
      sentence would be the most misleading thing this study could do.
    cost:
      wall_seconds: 17.7 and 18.8 over two runs, of which 9.3-9.5 is the reconstruction
      peak_rss_bytes: 4.075e9 and 4.070e9
      peak_rss_method: >-
        /proc/<pid>/status VmRSS sampled every 20 ms from OUTSIDE the child, max
        over the run. Not ru_maxrss inside it; see peak_rss_measurement_note.
      at_the_frozen_3169_ray_configuration: >-
        7.70 s and 8.34 s, peak RSS 0.924e9 and 0.918e9 bytes. This is the closer
        analogue of M2's 0.622 s / 843 MiB 4096-ray figure, and it is still not
        comparable: M2's is a coupler round trip on a 16x16 grid, while this is a
        trace plus a 188^2 reconstruction plus a 1320^2 padded ASM under JAX plus a
        measurement, so the resident set is dominated by the JAX runtime and the
        padded field rather than by the coupler.
      where_the_cost_goes: >-
        the reconstruction, and it is the ray count that drives it: 0.6 s at 3169
        rays against 9.4 s at 394219, because C_RAY_TO_WAVE materializes two
        rays-by-grid ramp arrays. The same structure sets the memory. A chunked
        accumulation would cut both by an order of magnitude at the same answer up
        to summation order; not attempted here, because it changes shipping code for
        a study's convenience.
      machine: >-
        shared, unpinned 80-core CPU host inside the agent_solver container. No GPU
        was used or requested.
  peak_rss_measurement_note:
    found_by: CHE-38 (M3.9)
    what: >-
      benchmarks/protocol.yaml names resource.getrusage(RUSAGE_SELF).ru_maxrss as
      the preferred memory method. That is correct for a top-level benchmark driver,
      which is how M1 and M2 used it, and wrong for a CHILD process: the child's
      high-water mark starts at the parent's. Verified in the record with a trivial
      child that allocates nothing and still reports the parent's peak.
    consequence_here: >-
      this study's first cost measurement reported 8.8 GiB for the 3169-ray
      configuration -- the whole sweep's peak, not the configuration's. The figures
      above are sampled from OUTSIDE the child, from /proc/<pid>/status VmRSS every
      20 ms, and sampling begins only after the child's post-exec handshake so no
      post-fork transient is counted. The child self-reports 9.42e9 bytes for every
      configuration -- exactly the probe's own peak -- against measured 4.07e9 at
      394219 rays and 0.92e9 at 3169.
    not_changed_here: >-
      benchmarks/protocol.yaml is M1's and is not amended by an M3 ticket. The
      distinction is recorded here and is worth a follow-up.
  determinism:
    result: bit-identical
    method: >-
      two separate PROCESSES, compared by sha256 of the float64 PSF intensity array
      and by the retained raw peak and raw window energy. Separate processes rather
      than two calls, because two calls in one interpreter share caches, JAX state
      and warmed allocators and can agree for reasons unrelated to determinism.
    checked_at: both the frozen 3169-ray configuration and the converged one
    why_it_is_pass_fail: >-
      the slice has no RNG. Optiland's hexapolar sampler is deterministic, the
      coupler draws nothing, the ASM is a fixed transform. Any variation would be a
      defect, not noise, so this is not a tolerance.
  regression_envelope:
    accuracy: declared
    accuracy_bounds: >-
      the frozen configuration's FFT-oracle residual to +/- 2%, the non-ray floor to
      +/- 5%, the rim amplitude at 0.50 +/- 0.02, the PSF bit-identical across
      processes, and the ray sweep asserted NON-monotone. Enforced by
      tests/test_m3_convergence.py.
    accuracy_rationale: >-
      M2's L6 recorded timings as observations with nothing to regress against. The
      part of that gap this ticket can honestly close is the numbers: the slice is
      deterministic, so its metrics have no run-to-run spread at all and an envelope
      on them is a real regression test.
    timing: NOT declared, deliberately
    timing_rationale: >-
      the container runs on a shared, unpinned 80-core host with no CPU affinity and
      no reserved memory, and this study has two timing samples per configuration.
      Two samples on an uncontrolled machine cannot bound a distribution, and a
      timing gate built from them would fail for reasons unrelated to this code. M1
      and M2's disclaimer is repeated on purpose, with the reason stated.
    what_would_make_a_timing_envelope_declarable: >-
      a pinned machine, or a normalized cost unit -- ray-pixel products per second,
      which feasibility already measures -- plus enough repetitions to characterize
      the spread.
  gates:
    fft_oracle_intensity_relative_l2: >-
      FAIL, and it cannot be closed by refinement. 1.51e-2 at the frozen
      configuration, 6.67e-3 at the sweep's best point, 8.04e-3 at the converged
      one, against 1.0e-3. No tolerance was widened.
    airy_peak_intensity_relative: >-
      FAIL, 9.1e-3 at the refined end against 2.0e-3. It passes only near the count
      where the signed metric crosses zero.
    energy_accounting_unexplained_residual: not re-measured here; M3.8's pass stands
  what_would_close_the_fft_gate:
    not_more_rays: measured, over a 3600x range of ray count
    not_a_finer_grid: measured, over a 6x range at fixed extent
    not_more_padding: measured, over the whole admissible range
    an_aperture_aware_reconstruction: >-
      the actual fix. New physics in the coupler, needing its own ticket. See
      open_structural_items.wavelet_sum_cannot_represent_a_hard_aperture_edge.
    or_a_larger_fresnel_number: >-
      the aperture term falls as N_f^(-0.752 +/- 0.011). Extrapolating to the
      unscaled 25 mm singlet's N_f = 234.5 projects 1.1e-3 for that term, which
      would leave the 1.25e-3 non-ray floor as the dominant one and the gate still
      missed, by ~1.7x rather than 8x. That projection is an extrapolation one decade
      beyond the measured range, obtained by varying R at fixed aperture rather than
      by scaling the system, and the unscaled system was not run.

# ---------------------------------------------------------------------------
# PSF measurement semantics -- frozen by CHE-36 (M3.7)
# ---------------------------------------------------------------------------
# M3.8 compares the measured PSF against an analytic Airy pattern and an
# independent FFT/Fraunhofer oracle. Both are defined only up to a scale, so the
# comparison means nothing unless these are a stated choice rather than an
# accident of the implementation. Frozen here so a later ticket cannot make its
# oracle pass by changing the measurement instead of finding the defect.
psf_measurement:
  category: observable
  is_a_coupler: false
  category_rationale: >-
    a coupler performs a physically meaningful change of representation and
    carries the assumptions that come with it -- C_RAY_TO_WAVE turns rays into a
    field and can refuse. `ComplexField -> |U|^2` changes no representation and
    consults no convention it does not already hold, so it is a measurement of
    the terminal state. C_FIELD_TO_PSF was removed from the registry rather than
    implemented; see open_structural_items.terminal_coupler_has_no_target_node.
  implementation: src/multiscale_optics_agent/evaluation/psf_measurement.py
  runs: after the graph, in the benchmark/measurement layer
  intensity: abs(u)**2
  intensity_taken_in: contracts.PSF.from_complex_field
  normalization:
    required: true
    defaulted: never
    frozen_for_m3_oracles: peak
    definition: intensity / max(intensity) over the sampled window
    why_peak: >-
      neither oracle fixes an absolute scale this slice could be held to. The
      Airy formula's absolute irradiance depends on total flux and aperture area,
      and the flux descends from Optiland's per-ray intensity weights, which are
      uncalibrated -- nothing between the trace and the propagated field converts
      them to watts. A raw comparison would test an arbitrary constant and would
      fail for a reason unrelated to the diffraction physics. Peak normalization
      removes exactly that degree of freedom and leaves peak position, first-null
      radius and profile shape untouched.
    what_it_hides: >-
      a constant multiplicative error, exactly. M2's amplitude-weight omission
      under uniform sampling was one. Energy normalization hides the same
      constant AND makes the result depend on how much energy left the window, so
      it is not a fix.
    mitigation: >-
      the raw scale is not discarded: raw_peak_intensity and raw_window_energy
      are recorded before scaling, and M3.8's energy ledger -- not the normalized
      profile -- is what constrains the multiplicative factor.
  axes:
    source: the propagated field's OUTPUT pitch (dx_out)
    never: the input pupil pitch
    why: >-
      PSF.from_complex_field takes its pitch from the field, so the axes are only
      as correct as the pitch the producing adapter declared. The Chromatix
      adapter carries both: its graph path writes dx_out onto the output
      artifact, and its baseline summary's field_metadata.sample_pitch_m is the
      input pitch. Taking the input pitch would rescale every distance the
      measurement reports while leaving the intensity map entirely plausible.
    enforced_by: >-
      evaluation.psf_measurement.measure_psf_from_record refuses with
      SAMPLE_PITCH_MISMATCH when the record's declared pitch is not the pitch the
      propagation reported. CHE-36 added input/output pitch to the graph path's
      diagnostics so there is something independent to compare against; reading
      the pitch off the artifact being checked is circular.
    asm_preserves_pitch: >-
      true, which makes the check cheap rather than vacuous. It is the same
      assertion for a method that does not preserve it, and the failure it guards
      against is silent.
  coherence_model: monochromatic, fully coherent, scalar (single wavelength)
  absolute_phase_required: false
  absolute_phase_note: >-
    abs(u)**2 is invariant under a global phase, which is what makes CHE-40's
    carrier-removed path admissible for the PSF; required_conditioning above
    mandates that path for any phase-insensitive M3 result.
  invariants:
    - name: nonnegative_intensity
      enforced_by: contracts.PSF.__post_init__ (NEGATIVE_INTENSITY)
    - name: declared_psf_normalization
      enforced_by: contracts.PSF.__post_init__ (MISSING_DECLARATION)
    - name: finite_intensity
      enforced_by: contracts.PSF.__post_init__ (NON_FINITE)
  invariant_provenance: >-
    the first two names are the ones the retired C_FIELD_TO_PSF entry declared
    and nothing executed. They are kept verbatim so M3.10's claim audit can trace
    them from the removed registry entry to the contract that now enforces them.
  failure_path: >-
    the PSF/measurement contract. Invalid construction raises ContractError; no
    graph coupler owns this refusal.
  excluded:
    - pixel integration       # M_SENSOR_IDEAL, out of M3
    - detector noise
    - incoherent aggregation
    - polychromatic aggregation
    - any gradient claim

# ---------------------------------------------------------------------------
# Feasibility verdict
# ---------------------------------------------------------------------------
feasibility:
  verdict: feasible_on_cpu_float64
  evidence: benchmarks/probes/m3_slice_feasibility.py
  binding_constraint: none_of_the_candidates_binds_on_a_carrier_conditioned_path
  binding_constraint_amended_by: CHE-40 (M3.2A)
  binding_constraint_amendment: >-
    M3.2 named Chromatix's complex64 cast against propagation distance as the
    binding constraint. CHE-40 showed that constraint was an artefact of
    propagating the absolute carrier phase, not of the dtype: with the carrier
    removed, the same complex64 engine holds 2.7e-4 relative intensity error at
    470 mm, ten times beyond the distance that rejected the first system. The
    dtype still costs something -- see the tolerance budget -- but it no longer
    bounds the system's absolute size.
  superseded_binding_constraint: chromatix_float32_cast_versus_propagation_distance
  superseded_binding_constraint_detail: >-
    C_RAY_TO_WAVE cost is rays x pixels and measured ~5.5e8 ray-pixel products
    per second, so both selected grids reconstruct in under a second. Neither
    memory nor the coupler is binding. What binds is Chromatix's unconditional
    complex64 cast: the ASM transfer-function phase is 2*pi*z/lambda, so the
    relative field error grows as eps32 * 2*pi*z/lambda. Measured 6.3e-2 at
    z = 47 mm against a predicted 6.4e-2 -- a ratio of 0.98, so the model is
    confirmed rather than fitted.
  rejected_configuration:
    id: unscaled 25 mm-radius singlet
    status: reinstated_as_admissible
    reinstated_by: CHE-40 (M3.2A)
    efl_mm: 48.37
    propagation_distance_mm: 47.06
    measured_float32_field_error: 6.3e-2
    original_reason_for_rejection: >-
      200x over M1's own float32 figure for this engine. A pupil-to-focus
      distance is set by the lens focal length, so this made the reference
      system's absolute SIZE a protocol decision rather than only its
      f-number. Scaling to 1/10 at fixed f-number shortens the propagation,
      reduces the aberration in waves by the same factor, and leaves the
      numerical aperture -- hence the Nyquist pitch -- unchanged.
    why_reinstated: >-
      CHE-40 propagated this system's own 4.987 mm exit pupil the full 47.06 mm
      to focus on a 2048^2 grid at its own 2.659 um pitch. Under the
      absolute-phase path it still fails, at 4.49e-4 relative intensity error
      against M3.2's own 3.5e-4 term -- so M3.2's rejection was correct for the
      propagation it had. Under the carrier-conditioned path the same geometry
      gives 2.21e-7, and the resulting Airy pattern agrees with the float64
      oracle's to within 1e-4 relative. Nothing about the system was changed.
    measured_carrier_conditioned_intensity_error: 2.2117405336498536e-07
    measured_absolute_phase_intensity_error: 4.4879159803374615e-04
    not_selected_because: >-
      cost, not precision. At 2048^2 it is ~120x the pixels of the scaled system
      for the same physics, and M3.9's convergence study sweeps grid and ray
      count on top of that. The scaled system stays the frozen primary; this one
      is available to any later ticket that wants a macroscopic case, and the
      choice is now a budget decision rather than a numerical impossibility.
    cost_only_claim_qualified_by: CHE-38 (M3.9)
    cost_only_claim_qualification: >-
      the choice is not purely a cost decision. CHE-40 was right about the term it
      was arguing over -- complex64 truncation no longer bounds the system's size --
      but scaling also divides the pupil Fresnel number a^2 / (lambda R) by 10, and
      wavelet_aperture_edge_error falls as N_f^(-0.752 +/- 0.011). The 1/10 scaling
      therefore costs a factor of ~5.6 on the dominant error in the slice: 6.3e-3 at
      the scaled system's N_f = 23.45 against a projected 1.1e-3 at the unscaled
      system's 234.5. Cheaper in pixels, worse in physics, and the two were not
      weighed against each other because the term did not exist yet.
    cost_only_claim_qualification_caveat: >-
      the projection is an extrapolation one decade beyond the measured range, and it
      was obtained by varying the convergence distance at fixed aperture rather than
      by scaling the system. Running the unscaled singlet remains unmeasured.
  measured_coupler_throughput_ray_pixels_per_second: 5.5e8
  projected_reconstruction_seconds:
    M3-SINGLET-REF: 0.27
    M3-REVERSE-TELEPHOTO: 0.48
  timing_caveat: >-
    shared, unpinned machine, as in M1 and M2. These figures exist to reject
    infeasible configurations, not as a regression envelope.

# ---------------------------------------------------------------------------
# Inadmissible sources
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Known structural constraints handed to later tickets
# ---------------------------------------------------------------------------
open_structural_items:
  - id: terminal_coupler_has_no_target_node
    found_by: CHE-31
    owner: CHE-36 (M3.7)
    status: resolved
    resolved_by: CHE-36 (M3.7)
    description: >-
      Every graph edge requires a target NODE, and the only registered consumer
      of a `psf` artifact is M_SENSOR_IDEAL, which M3 excludes. So C_FIELD_TO_PSF
      as the final step cannot be expressed as an edge. examples/graphs/
      ray_to_wave.yaml therefore ends at the wave node's output field.
    honest_options:
      - add a minimal sink node for the PSF
      - run the reduction in the benchmark driver and record it in provenance
    not_an_option: >-
      pulling M_SENSOR_IDEAL into M3 to make the graph close, which would widen
      the milestone to make its diagram tidier
    resolution: >-
      the second option, and the framing changed with it. The symptom was read at
      M3.2 as a graph-model constraint -- a terminal coupler with nothing to point
      at. It is better read as the registry having mis-categorized the operation:
      `ComplexField -> |U|^2` is not a cross-representation handoff and so was
      never an edge to place. C_FIELD_TO_PSF is removed from
      registry/couplers.yaml, and PSF extraction is a measurement over the
      existing contracts.PSF primitive
      (src/multiscale_optics_agent/evaluation/psf_measurement.py), run after the
      graph and recorded in provenance. No sink node was added, and M_SENSOR_IDEAL
      stays out of M3.
    also_found: >-
      the entry could not be deprecated in place. CouplerSpec requires
      `framework` and `derivative.mode`, and Framework has no `none`, so any
      surviving entry keeps asserting a framework and a differentiation mode for
      numerics that never existed. The retired entry claimed `framework: jax` and
      `derivative.mode: native_autodiff`; both were artifacts of the abstraction,
      and the schema left removal as the only honest option.
  - id: airy_radius_entry_is_a_diameter
    found_by: CHE-33 (M3.4)
    owner: CHE-37 (M3.8) for the oracle, CHE-38 (M3.9) for the sampling claim
    description: >-
      systems.M3-SINGLET-REF.airy_radius_um = 12.974628171691823 is 1.22*lambda/NA,
      which is the Airy first-null DIAMETER. The radius is 0.61*lambda/NA =
      6.4873 um. The same factor of two propagates into
      sampling.grids.M3-SINGLET-REF.airy_radius_in_pixels = 4.88 (true radius:
      2.44 px at the frozen 2x oversampling) and into the oversampling rationale,
      which argues from "~2.44 px at the critically admissible pitch" -- that
      figure is the radius at 2x, not at 1x.
    not_changed_here_because: >-
      it changes the JUSTIFICATION for oversampling_factor = 2, not the factor
      itself, and the frozen grids are what M3.4-M3.6 are being built against.
      CHE-38 owns whether 2x is still the right number once the radius is counted
      correctly; CHE-37 owns the Airy oracle that consumes the radius directly,
      where using a diameter as a radius would be a factual error in the oracle.
    measured: 0.61 * 0.55 um / 0.05171631827291936 = 6.4873 um
    sampling_half_resolved_by: CHE-38 (M3.9)
    sampling_half_resolution: >-
      the factor of 2 is confirmed -- the Airy RADIUS spans 1.22 pixels at the
      critically admissible pitch and 2.44 at the frozen 2x -- and
      oversampling_factor stays 2 with its rationale replaced rather than repaired,
      because the corrected pixel count does not support the old argument. See
      sampling.oversampling_rationale and its _superseded pair. The frozen fields
      airy_radius_um and airy_radius_in_pixels are still left as they are, since
      nothing reads them: the oracle computes the radius from the first zero of J1
      and tests/test_m3_psf_verification.py asserts the factor of 2 against this
      file, so a later correction still surfaces there rather than silently.
    oracle_half_status: resolved
    oracle_half_resolved_by: CHE-37 (M3.8)
    oracle_half_resolution: >-
      evaluation/psf_oracles.py computes the radius from the first zero of J1
      (3.8317059702075125 / 2 pi = 0.6098349) and never reads airy_radius_um.
      Using the exact coefficient rather than the quoted 0.61 is a further 0.03%.
      The frozen fields are left as they are and the correction is recorded;
      tests/test_m3_psf_verification.py asserts the factor of 2 against this file,
      so correcting the fields later will surface here rather than silently.
    sampling_half_status: resolved by CHE-38 (M3.9)
  - id: off_axis_handoff_omits_the_pupil_tilt
    found_by: CHE-37 (M3.8)
    owner: unassigned; a follow-up, not M3.8
    severity: >-
      high for any off-axis work, none for M3's frozen on-axis configuration
    description: >-
      For an off-axis field the declared pupil OPL carries essentially none of the
      linear tilt the geometry requires, so the reconstructed wave converges to the
      wrong point. Measured on M3-REVERSE-TELEPHOTO at Hy = 0.2: the OPL's linear
      slope in y is 8.7e-5 where 0.0684 is needed to reach the geometric image
      point, i.e. 0.13% of it. Fitting the reference sphere finds its centre ON
      AXIS, within 1 um of y = 0, where the wavefront residual drops from 57.0 to
      0.072 waves peak-to-valley -- a clean converging sphere aimed 209 um away
      from where the rays actually go. The shipping PSF lands there too: 1 pixel
      from the axis instead of 114.
    probable_cause: >-
      for an object at infinity Optiland seeds the OPD accumulator on a plane
      perpendicular to z rather than on the incoming wavefront. For an off-axis
      parallel bundle those differ by exactly sin(theta) * y, which cancels the
      convergence tilt. CHE-30 characterized this launch plane and recorded the
      PISTON consequence (its zero moves with the aperture); the TILT consequence
      is invisible on axis, and CHE-30, CHE-32 and CHE-33 all validated on axis
      only. conventions.opd_is_relative_to_chief_ray reads False, which on axis is
      an untestable claim.
    not_fixed_here_because: >-
      referencing the OPD to the incoming tilted wavefront changes the handoff
      convention, and M3.8 must not both invent and verify a path.
    consequences:
      - >-
        the off-axis asymmetry vehicle CHE-37 planned cannot serve its purpose:
        its PSF forms on axis, so it does not break the symmetry that hides a
        transpose.
      - >-
        no frozen M3 configuration can detect an x/y transpose. Covered instead by
        the synthetic-tilt orientation control; see
        no_frozen_configuration_detects_a_transpose.
    evidence: benchmarks/probes/records/m3_psf_verification.json (off_axis_tilt_finding)

  - id: no_frozen_configuration_detects_a_transpose
    found_by: CHE-37 (M3.8)
    owner: CHE-37, mitigated
    description: >-
      Both frozen on-axis configurations are rotationally symmetric, and the
      off-axis one forms its PSF on axis as well (see
      off_axis_handoff_omits_the_pupil_tilt), so an x/y transpose of the output
      grid moves the measured PSF by nothing. The transpose control's detection
      margin is 1.0000066 -- it cannot be made to fail, and by M2's rule it
      therefore validates nothing.
    mitigation: >-
      a synthetic control that CAN fail. A known linear tilt of 0.02 is added to
      the declared OPL along x only; the PSF must move along +x by tilt * R, an
      analytically predicted 36.39 pixels. Measured 36 pixels in x and 0 in y,
      ratio 0.989, and under Perturbation(transpose_axes=True) the displacement
      appears along y instead. The x/y wiring is tested against a predicted
      answer rather than against another run of the same code.
    still_open: >-
      a transpose in the SHIPPING configuration remains undetectable. Fixing that
      needs the off-axis handoff, i.e. the item above.

  - id: amplitude_path_is_not_exercised_by_any_m3_configuration
    found_by: CHE-37 (M3.8)
    owner: unassigned; a follow-up
    description: >-
      Optiland's per-ray intensity weights on M3SingletRef are exactly uniform
      (min = max = 1.0, spread 0.0), so replacing every ray amplitude with 1 is an
      exact no-op: the amplitude_weight_omitted control's detection margin is
      1.0000000 and its raw peak ratio is 1.0000000. This is stronger and worse
      than M2's finding that the omission was an exact CONSTANT SCALE -- here it
      is not even a scale.
    consequence: >-
      the reconstruction's amplitude path carries no verification evidence from
      M3. Exercising it needs a non-uniform weight: apodization, vignetting, or a
      polarized Fresnel transmission. M3 has none of these.
    reported_as: an undetected control, not a passing test

  - id: fft_oracle_gate_fails_with_an_unattributed_floor
    found_by: CHE-37 (M3.8)
    owner: CHE-38 (M3.9) for the ray-sampling part; the floor is unassigned
    status: attributed by CHE-38 (M3.9); the gate still fails
    attribution:
      by: CHE-38 (M3.9)
      the_floor_was_not_a_floor: >-
        M3.8's sweep ended at its own minimum. Past 27937 traced rays the residual
        RISES -- 6.82e-3 / 7.24e-3 / 7.67e-3 / 8.04e-3 / 8.32e-3 at 49537 / 98827 /
        197377 / 394219 / 787969 -- so there is no floor to attribute; there is a
        cancellation at the middle of the sweep between a falling term and a flat
        one. See amendments A3.
      three_terms_that_add_up:
        non_ray_floor: >-
          1.25e-3, measured by removing the ray leg entirely: an analytic
          hard-mask pupil through the same ASM, the same pad_width 566, the same
          window, the same measurement and the same resampled comparison. This
          bounds what any ray refinement could achieve, and it is already 1.25x the
          gate, which the gate's composition (1.0e-4 complex64 + margin) does not
          account for. It is NOT decomposed further, and the leading unmeasured
          candidate inside it is the oracle's own paraxial image mapping: a single
          FFT with pixel scale lambda*R/(N dx) is the Fraunhofer limit of a
          PARABOLIC converging wave, while the field it is compared against carries
          the exact sphere, and the difference rho^4/(8 R^3) is 0.0078 waves at the
          rim of this pupil. That is an oracle-side term of the same order as the
          system's own residual aberration and it is owed a measurement.
        ray_sampling_error: >-
          1.83e-2 at the frozen 3169 rays, falling as N^-0.609 +/- 0.035 against a
          ray-refined reference. Measured against the refined PSF rather than
          against an oracle, so it is separable from the term below.
        wavelet_aperture_edge_error: >-
          7.1e-3 and flat in ray count. This is the term M3.8 hypothesized and did
          not test.
      hypothesis_verdict: >-
        M3.8's leading hypothesis is CONFIRMED in kind and refuted in scale. The
        pupil edge is soft and the oracle's hard mask is the better model of a real
        stop, but the softness is not 'roughly one ray spacing': it is a Fresnel
        scale, sqrt(lambda R) = 51.6 um = 19.4 pixels = 0.21 of the pupil radius,
        and it does not shrink with ray count.
      localized_to_the_pupil_plane: >-
        comparing the shipping PSF against the analytic hard-mask pupil propagated
        the same way reproduces its disagreement with the oracle (7.10e-3 against
        7.67e-3 at 197377 rays), so neither the propagation nor the oracle is
        implicated. A synthetic bundle carrying the exact optical path to the focus
        reproduces it too, which exonerates Optiland, the OPL declaration and the
        0.017-wave residual aberration.
      still_open: >-
        the defect itself. See
        open_structural_items.wavelet_sum_cannot_represent_a_hard_aperture_edge.
    description: >-
      The fft_oracle_intensity_relative_l2 gate of 1.0e-3 is missed by 15x at the
      frozen configuration (1.509e-2). Varying ONLY the ray count, with grid,
      padding, plane and system held fixed, the residual falls monotonically:
      3.29e-2 / 1.75e-2 / 1.51e-2 / 9.13e-3 / 7.40e-3 / 6.67e-3 at 817 / 1801 /
      3169 / 7057 / 12481 / 27937 traced rays. So most of the excess is the
      protocol's own ray_sampling_error term -- value null, status to_be_measured
      -- which this gate's text already requires to fit inside it, and which CHE-35
      independently found far from converged at these counts.
    unresolved: >-
      the trend FLATTENS at ~6.7e-3, well above the gate, so ray sampling is not
      the whole story. Leading hypothesis, untested: the shipping reconstruction's
      pupil edge is set by where the rays stop and is soft over roughly one ray
      spacing, while the oracle applies a hard circular mask at the largest traced
      radius. That is a difference in the aperture function, which is what sets
      the ring structure the residual measures.
    handling: >-
      reported as a finding. The gate was NOT widened, and the failure is pinned
      as a failure by tests/test_m3_psf_verification.py so it cannot go green
      without someone saying what changed.
    same_cause_as: airy_peak_intensity_relative, which fails 6.1x and whose
      full-window peak deficit collapses from 0.886 at 817 rays to -0.007 at 12481

  - id: wavelet_sum_cannot_represent_a_hard_aperture_edge
    found_by: CHE-38 (M3.9)
    owner: unassigned; a follow-up, and the largest open item in the slice
    severity: >-
      high. It is the dominant error in the M3 forward path and it makes
      fft_oracle_intensity_relative_l2 unreachable at the frozen system, at any ray
      count.
    description: >-
      C_RAY_TO_WAVE reconstructs U(x, y) as a sum of plane wavelets, one per ray,
      each an infinite plane wave over the whole grid. That sum is a
      stationary-phase estimate of the pupil field: it is accurate where the field
      varies slowly over a Fresnel zone of the converging curvature, and a hard stop
      does not. The reconstruction therefore returns the aperture edge as a
      knife-edge diffraction profile rather than as a truncation.
    measured:
      amplitude_at_the_geometric_rim: >-
        0.50 of the interior plateau, the knife-edge value, at every ray count from
        12481 up. Not fitted -- predicted, then measured.
      overshoot_fringe_inside_the_rim: ~1.12 of the plateau
      fresnel_scale: sqrt(lambda R) = 5.158e-5 m = 19.4 pixels = 0.207 * pupil radius
      pupil_fresnel_number: a^2 / (lambda R) = 23.45
      rim_slope_scaling: >-
        the slope of the transition at rho = a, measured on synthetic bundles with R
        varied at fixed aperture, fixed grid, fixed pitch and fixed ray count,
        tracks 1 / sqrt(lambda R) and agrees with the value computed from the
        Fresnel integrals.
      ray_count_dependence: none
      psf_level_cost: >-
        7.1e-3 relative intensity L2 against the analytic hard-mask pupil through
        the same propagation, at a ray count where the ray-sampling term is 5x
        smaller.
    why_the_hard_mask_is_the_reference_and_not_the_reconstruction: >-
      a real stop truncates the beam, so the physical exit-pupil field of this
      system is hard-edged to a very good approximation, and the analytic Airy
      pattern -- an independent oracle that shares nothing with either
      implementation -- assumes the same hard aperture. Both oracles disagree with
      the reconstruction in the same direction and by the same order.
    not_fixed_here_because: >-
      an aperture-aware reconstruction is new physics in the coupler: it needs an
      explicit aperture function on the ray side (which RealRays does not carry --
      CHE-32 recorded that Optiland represents no pupil boundary and the survivor
      list is the only evidence of one), a decision about how to combine it with the
      wavelet sum, and its own verification against a case with a known answer.
      CHE-38 is a convergence study and must not both invent and verify a path.
    what_would_reduce_it: >-
      a larger pupil Fresnel number. The term falls as a^2 / (lambda R) grows, so a
      macroscopic system carries less of it than the 1/10-scaled reference does; see
      feasibility.rejected_configuration.cost_only_claim_qualified_by. It cannot be
      reduced by rays, by grid, or by padding.
    evidence: benchmarks/probes/records/m3_convergence.json (aperture_edge_hypothesis)

  - id: the_frozen_window_is_the_pupil_diameter_rounded_up
    found_by: CHE-38 (M3.9)
    owner: unassigned; recorded, with its consequence already resolved
    severity: low for the frozen result, high for anyone diagnosing on this grid
    description: >-
      sampling.grids.M3-SINGLET-REF has grid_n * sample_pitch_m = 4.99842e-4 m,
      against a frozen pupil_extent_m of 4.99568e-4 m which is twice the largest
      traced pupil radius. grid_n = 188 is that extent divided by the pitch, 187.897,
      rounded up -- so the window exceeds the measured pupil by 0.055% and the pupil
      is inscribed in it. Any structure the reconstruction puts outside the rim --
      the Fresnel edge tail, and at low ray counts a large sampling pedestal -- is
      clipped by the window and is invisible on this grid. The aperture diagnostic
      above had to be run on a 376^2 window at the same pitch to see the edge at all.
    consequence_already_resolved: >-
      CHE-35's window-power figure. It read ~0.6 at the frozen grid and was recorded
      as ~40% of the pupil power leaving the window 'regardless of ray count'. It is
      not ray-count-independent: the share of propagated power inside the frozen
      observation window reads 0.586 / 0.631 / 0.578 / 0.520 at 217 / 817 / 1801 /
      3169 traced rays and 0.9955 / 0.9980 / 0.9987 at 12481 / 27937 / 787969. The
      0.6 was the sampling pedestal of an unconverged reconstruction. CHE-35's
      companion series reproduces exactly once the denominator is matched -- its
      0.043 / 0.166 / 0.388 are this probe's within-3-Airy-radii fractions divided
      by the window share, to three digits -- and it saturates at 0.958.
    evidence: benchmarks/probes/records/m3_convergence.json (ray_count_convergence)

  - id: airy_gate_residual_aberration_term_was_derived_at_best_focus
    found_by: CHE-37 (M3.8)
    owner: CHE-38 or CHE-39, minor
    description: >-
      The airy_peak_intensity_relative gate composes 9.1e-4 of residual
      aberration, taken from 1 - 0.9990928, which is the Marechal Strehl at the
      system's BEST FOCUS (0.00479 waves RMS). The slice observes the frozen image
      plane, 7.22 um from best focus, where the wavefront is 0.00538 waves RMS and
      the Marechal deficit is 1.14e-3. The term is 25% low for the plane the slice
      actually uses.
    impact: >-
      small: 1.14e-3 still sits inside the 2.0e-3 gate. Recorded because the gate
      is composed of named terms and one of them is evaluated at a plane the slice
      does not use.

  - id: no_runnable_coupler_exists_yet
    found_by: CHE-31 (confirmed at M3 open)
    owner: CHE-34 (M3.5)
    status: resolved
    resolved_by: CHE-34 (M3.5)
    description: >-
      couplers/base.py declares Coupler.transform and nothing defines it, so
      GraphValidator currently validates edges that cannot execute.
    resolution: >-
      src/multiscale_optics_agent/couplers/ray_to_wave_node.py implements the
      Coupler protocol for C_RAY_TO_WAVE. It is a wrapper over the M2 core and is
      tested to be bit-identical to the direct function call, so M2's
      verification evidence still binds on what a graph runs. The core keeps its
      engine-agnosticism; the node is a separate module and is covered by the
      same AST and sys.modules checks.
    also_found: >-
      the edge only validated because producer and consumer both declared
      metadata neither writes. C_RAY_TO_WAVE's source port was
      wavefront_samples, which carries pupil coordinates and NO directions, so a
      plane-wavelet sum could never have consumed it; and M_RAY_OPTILAND's rays
      port claimed amplitude and polarization that RealRays does not expose --
      the CONTRACT GAP recorded in models.yaml since 2026-07-30. Both were
      narrowed to what is real, C_RAY_TO_WAVE moved to 0.2.0, and the example
      graph's edge now sources the rays port.

inadmissible_sources:
  - id: optiland_paraxial_surface
    applies_to: any wavefront or OPL handed to a coupler
    rule: surface_type "paraxial" must not be used
    evidence: CHE-30, knowledge/solvers/optiland/conventions.md
    reason: >-
      The paraxial interaction model subtracts (x^2+y^2)/(2f) but leaves the
      direction un-normalized, so the following propagation adds the axial
      distance rather than the Euclidean one and the intended cancellation never
      happens. Measured OPL at the focus is f - h^2/(2f): 0.36 mm, about 655
      waves, at f = 50 mm and h = 6 mm. That is a defocus, not a rounding error.
  - id: undeclared_optiland_opl
    rule: >-
      ContractCode.OPL_REFERENCE_UNVERIFIED stays enforced. An OPL is admissible
      only when its reference is declared, and for an infinite object that
      reference is aperture-dependent, so the declaration must record the EPD.
    evidence: CHE-30
