[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiscale-optics-agent"
version = "0.1.0"
description = "Typed model-coupler graphs for verified multi-scale optical simulation and inverse design"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Research scaffold" }
]
# What the new tree actually imports, as of CHE-173 (R02.1). The five entries this
# replaces (networkx, pydantic, PyYAML, rich, typer) were declared for the tree
# that was deleted and nothing in `src/` imports any of them.
#
# `docker/Dockerfile` installs this project with `pip install --no-deps -e .`, so
# this list does not shape the image -- `docker/requirements.txt` does. It is a
# statement about what the source needs, and a stale one reads as a dependency the
# code has. NumPy is not a backend: it is the array vocabulary JAX and Torch are
# described in, `numerics/arrays.py` imports it at module scope on purpose, and
# `numerics/` still pulls no solver. Later packages add theirs as they land.
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.8",
  "ruff>=0.5",
]
jax = [
  "jax>=0.6.2",
  "optax>=0.2.8",
  "equinox>=0.13.8",
  "optimistix>=0.0.11",
  "jaxtyping>=0.3.7",
]
wave = [
  "jax>=0.6.2",
  "optax>=0.2.8",
  "equinox>=0.13.8",
  "optimistix>=0.0.11",
  "jaxtyping>=0.3.7",
  "chromatix @ git+https://github.com/chromatix-team/chromatix.git@d24bdf0022835bb8ce1cdcc6aeafbc7fcb39daee",
  "scipy>=1.10",
]
torch = [
  "torch>=2.13.0",
  "optiland>=0.6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# Explicit rather than discovered, so a stray scratch directory under src/ cannot
# silently become a shipped package. R01 landed the first two and the deletion of
# the old tree left them as the whole of it; `solvers*` is R05's, and the trailing
# glob is what picks up the `solvers.optiland` subpackage. Later tickets add
# theirs, and `scripts/check_dependencies.py` holds the full declared set.
include = [
  "couplers*",
  "numerics*",
  "operations*",
  "operators*",
  "problems*",
  "representations*",
  "solvers*",
  "sources*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The pytest defaults, restated because this key replaces them rather than
# extending them. The three opt-in trees that used to be listed here
# (`archive/`, `tests_tutorial/`, `benchmarks/agents/`) were deleted with the
# reference implementation, so `pytest .` and `pytest tests` now select the same
# thing and the exclusions have nothing left to exclude.
norecursedirs = [
  "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
]
# `-m "not slow"` is kept: it is the declared default gate, and it costs nothing
# to leave in place for the first `slow` test R02 writes.
#
# The sharding CHE-140 added and CHE-171 re-measured (`-n 8 --dist loadfile`) is
# gone with the suite that justified it. That measurement -- 196 s serial, 60 s at
# eight workers -- was taken against 2727 tests whose cost was importing jax,
# chromatix and optiland in every worker. What is left is the two architecture
# gates, which parse a handful of files with `ast` and import no solver.
# Re-measured after the deletion, same host, default selection, 32 tests:
#
#     -n 0    0.06 s        -n 8    2.68 s
#
# Sharding is now pure overhead: bringing up eight worker processes costs about
# forty times what the suite itself does. `-n 8` on the command line still works,
# and the number goes back into addopts when there is again a suite that pays for
# it -- with a measurement, not by inheriting this one.
addopts = "-ra -m \"not slow\""
markers = [
  "slow: individually expensive numerical characterization or convergence test",
  "gpu: requires a CUDA device attached to the container (`./run.sh --gpu`); auto-skips otherwise",
]
# The other ten markers were deleted with the code that carried them. They named
# solvers, couplers, benchmark tiers and tutorial reproductions that no longer
# exist, and a registered marker matching nothing reads as a suite someone can
# select. `slow` stays because addopts names it; `gpu` stays because
# `make test-gpu` does. `slow` started selecting tests at CHE-185 (R07.1) -- the
# focal-peak convergence sweep in `tests/physics/test_ray_to_scalar.py`, joined by
# CHE-186's speedup gate in `test_ray_to_scalar_kspace.py`. Note that the second
# one is an *acceptance criterion*, and `-m "not slow"` deselects it, so
# `make test-slow` is not optional before merging a change to coupler numerics.
# `gpu` still selects nothing outside `tests/numerics/`.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
# With no top-level package, mypy has to be told where the root is: without
# `explicit_package_bases` it computes a module name by walking up to the first
# directory without `__init__.py`, which is `src/`, and reports every module
# twice under two names.
mypy_path = "src"
explicit_package_bases = true

# optiland 0.6.0 ships no `py.typed` marker and no stubs, so under `strict` every
# `import optiland...` is an error rather than an `Any`. Narrowed to the one
# package that has the problem, and declared here rather than with a per-import
# `# type: ignore`: the fact is a property of the installed distribution, not of
# any one call site, and `warn_unused_ignores` would then fail the day upstream
# adds a marker. Added by CHE-179 (R05.1), the first ticket to import a backend.
# jax and torch are typed and need no entry.
[[tool.mypy.overrides]]
module = ["optiland.*"]
ignore_missing_imports = true

# chromatix 0.6.0 @ d24bdf0 ships no `py.typed` marker either, so the same applies
# for the same reason. Added by CHE-183 (R06.1), the ticket that first imports it.
# jax and torch are typed and need no entry.
[[tool.mypy.overrides]]
module = ["chromatix.*"]
ignore_missing_imports = true

# scipy ships no stubs in the pinned image either. It is used only as an
# *oracle* library -- Bessel functions in `benchmarks/systems/` and in
# `tests/physics/test_thin_element_spectrum.py` -- and nothing in `src/` imports
# it. Added by CHE-211/CHE-212, the first tickets to need a special function this
# project must not implement itself.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
# Enumerated for the same reason as packages.find: there is no single top-level
# package to name.
source = [
  "numerics",
  "representations",
]
branch = true
