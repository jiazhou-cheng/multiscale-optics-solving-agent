# CHE-130 (M0.5.1) -- the triage that has to happen before anything is deleted.
#
# The direction change retires the task-centric A1/L1/L2/L3 benchmark layer and
# keeps the scientific evidence. Those two things live in the same directories
# and sometimes in the same file, so "delete the benchmark stuff" is not a
# reviewable instruction. This file classifies **artifacts, not directories**.
#
# The load-bearing example was `benchmarks/physics/L2-PSF-01/`: `run_benchmark.py`
# was an obsolete task wrapper AND carried the M3-SINGLET-REF prescription that is
# a candidate canonical instance; `evaluate.py` and `tolerances.yaml` held metric
# definitions and tolerance derivations that existed nowhere else. One directory,
# three verdicts -- hence `part:` on entries that split a file. CHE-116 (M4.1)
# closed that example out: the two obsolete files are deleted, their destinations
# exist, and the evidence file stays. That is what a split verdict is for.
#
# Buckets
# -------
#   A  reusable scientific infrastructure or evidence. Test: would this still be
#      true and useful if no agent and no benchmark task existed? Preserve, and
#      name the family / oracle / metric / validity predicate it migrates into.
#   B  candidate canonical case. Test: is this a specific physical setup whose
#      result is worth freezing? A POSITIVE justification is required; "it
#      already exists" is not one and rows that cannot state one become C.
#   C  obsolete task layer. Exists only to serve the old evaluation design.
#
# Coverage
# --------
# `tests/test_benchmark_inventory.py` enumerates every file under `scope:` and
# fails if one is not matched by an entry, and fails if an entry matches nothing.
# An inventory that silently omits a file is how evidence gets deleted.
#
# Globs may not contain `**` and may not cross a directory boundary, so a new
# subdirectory can never be silently absorbed by an existing row.
#
# This issue produces a classification and no behaviour change. Nothing is
# deleted here; deletion is M0.5.4 (CHE-133) and, for the L2-PSF-01 runner, M4.

version: 1

scope:
  - benchmarks
  - src/agent
  - src/verification

# Edits this triage found to be required but which are deliberately NOT made
# here, with the issue that owns them.
pending_edits:
  - path: AGENTS.md
    section: Current Phase
    required_change: >-
      Rewrite from the retired two-class taxonomy ("single-component benchmarks"
      / "composed physics benchmarks") to the B0-B4 family architecture, and give
      "Benchmark Requirements" the family / instance / verifier vocabulary.
    owner: CHE-133 (M0.5.4)
    why_not_here: >-
      AGENTS.md has in-flight uncommitted changes on an unrelated topic. Record
      the edit; land it with the deletion so the two are reviewed together.
  - path: benchmarks/README.md
    section: whole file
    required_change: >-
      The "What is here" table points at `level2/L2-PSF-01/` (a path that no
      longer exists; the directory is `physics/L2-PSF-01/`) and describes the
      per-task `benchmarks/levelN/<task_id>/` layout, which is the retired
      design. Replace with the family registry / `benchmarks/instances/` layout.
    owner: CHE-133 (M0.5.4)
    why_not_here: This issue changes no behaviour and no repository-wide prose.
  - path: src/solvers/optiland/baseline.py
    section: module docstring
    required_change: >-
      The docstring says run_standalone implements the frozen
      "M1-BASELINE-CPU-V2" contract. CHE-106 (M1.1) deleted that protocol, so the
      id no longer resolves to anything in the tree. The rules the docstring names
      -- fresh process, no coupler, fixed artifact set, structured blocker instead
      of a fabricated value -- are still exactly what the function does and should
      be stated without the retired id.
    owner: CHE-106 follow-up, not yet filed
    why_not_here: >-
      every instance record's code_fingerprint covers this file, so a
      docstring-only edit makes all committed instance records stale and forces a
      full driver re-run under tests/test_provenance_fingerprint.py. That is not
      worth spending inside the change that closes M1.1; batch it with the next
      edit that touches this module for a scientific reason.
  - path: src/solvers/chromatix/baseline.py
    section: module docstring
    required_change: >-
      Same as the ray baseline above, for the retired id "M1-BASELINE-CPU-V1".
    owner: CHE-106 follow-up, not yet filed
    why_not_here: >-
      same reason: the file is inside every instance record's code_fingerprint.

# Bucket-C artifacts CHE-133 removed, and where their content survives. Kept as a
# record rather than as `entries:` rows, because the coverage test refuses a row
# that matches no file -- a classification of something that is not there reads
# as coverage and is not.
