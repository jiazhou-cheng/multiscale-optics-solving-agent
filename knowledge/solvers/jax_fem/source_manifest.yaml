# Per-source provenance for the jax-fem knowledge pack.
# Provenance follows AGENTS.md "Sources of Truth".

sources:
  - url: https://pypi.org/pypi/jax-fem/json
    source_type: official_docs  # PyPI JSON API, not prose docs, but the canonical release metadata
    retrieved_at: "2026-07-30"
    usage_note: >
      Used to confirm the real pip name (jax-fem), latest version (0.0.12),
      and requires_python. Its `license` field ("BSD") was found to be
      WRONG (see the LICENSE source below) -- do not trust this field for
      this package again without re-checking the actual repo LICENSE file.

  - url: https://raw.githubusercontent.com/deepmodeling/jax-fem/main/pyproject.toml
    source_type: official_repository
    retrieved_at: "2026-07-30"
    usage_note: >
      Confirmed the package declares NO runtime dependencies at all (no
      `dependencies = [...]` field) -- this is the root cause of the
      install hazard documented in solver_card.yaml and failure_guide.md.

  - url: https://raw.githubusercontent.com/deepmodeling/jax-fem/main/environment.yml
    source_type: official_repository
    retrieved_at: "2026-07-30"
    usage_note: >
      This is the actual dependency list (python==3.13.13, numpy==2.4.6,
      scipy==1.17.1, matplotlib==3.10.9, meshio==5.3.5, petsc4py==3.25.1,
      plus pip extras gmsh==4.15.2, fenics-basix==0.10.0, pyfiglet==1.0.4).
      docker/requirements.txt pins a pip-installable subset of this,
      omitting petsc4py (no prebuilt wheel; see solver_card.yaml blocker).

  - url: https://raw.githubusercontent.com/deepmodeling/jax-fem/main/LICENSE
    source_type: official_repository
    retrieved_at: "2026-07-30"
    usage_note: >
      Full text is GNU GPLv3. Contradicts the PyPI classifier metadata
      ("BSD License") -- trust this file, not the PyPI classifier.

  - url: https://deepmodeling.github.io/jax-fem/guide/Installation.html
    source_type: official_docs
    retrieved_at: "2026-07-30"
    usage_note: >
      States the recommended install path is
      `conda env create -f environment.yml`, not plain `pip install
      jax-fem`. Consistent with the pyproject.toml finding above.

  - url: https://deepmodeling.github.io/jax-fem/guide/Quickstart.html
    source_type: official_docs
    retrieved_at: "2026-07-30"
    usage_note: >
      Describes the Problem/Mesh/solver()/save_sol() workflow used to
      identify which entry points to probe. The `solver()` step described
      here is the one blocked by the missing petsc4py (see solver_card.yaml).

  - url: "installed package jax-fem==0.0.12"
    source_type: installed_source
    retrieved_at: "2026-07-30"
    usage_note: >
      Primary source of truth for what actually imports. Inspected via
      `dir()` on jax_fem, jax_fem.problem, jax_fem.generate_mesh, and by
      attempting `import jax_fem.solver` (fails) inside the agent_solver
      container built from docker/Dockerfile (after adding
      libglu1-mesa/libgl1/libxrender1/libxcursor1/libxinerama1/libxft2/libgomp1
      to satisfy gmsh's runtime library requirements -- see failure_guide.md).

  - url: "apt-cache search petsc (Debian bookworm, inside agent_solver image)"
    source_type: negative_result
    retrieved_at: "2026-07-30"
    usage_note: >
      Confirmed Debian ships `python3-petsc4py` via apt, but it targets the
      system Debian Python, not the from-source-built python:3.12-slim
      interpreter this image uses -- not a drop-in fix. Recorded so a
      future agent doesn't waste time on `apt-get install python3-petsc4py`
      expecting it to satisfy `import petsc4py` in this image.
