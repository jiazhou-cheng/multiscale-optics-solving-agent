# Per-source provenance for the chromatix knowledge pack.
# Provenance follows AGENTS.md "Sources of Truth".

sources:
  - url: https://github.com/chromatix-team/chromatix
    source_type: official_repository
    ref: "0.6.0"
    commit: d24bdf0022835bb8ce1cdcc6aeafbc7fcb39daee
    retrieved_at: "2026-07-30"
    license: MIT
    usage_note: >
      Used to resolve the correct pip install source (chromatix is not on
      PyPI under this name) and to confirm the pyproject.toml dependency
      list pinned into docker/requirements-chromatix.txt.

  - url: https://chromatix.readthedocs.io/en/latest/
    source_type: official_docs
    retrieved_at: "2026-07-30"
    usage_note: >
      Fetched for high-level orientation only (site structure, core
      abstractions, one example snippet). Treated as lower-priority than
      the installed source per the repository source-of-truth policy --
      all specific conventions in conventions.md were re-derived from
      `inspect.getsource` / `inspect.signature` on the pinned commit, not
      copied from this page.

  - url: "installed package at commit d24bdf0022835bb8ce1cdcc6aeafbc7fcb39daee"
    source_type: installed_source
    retrieved_at: "2026-07-30"
    usage_note: >
      Primary source of truth. Inspected via `inspect.signature`,
      `inspect.getdoc`, and `inspect.getsource` on chromatix.functional
      (plane_wave, point_source, objective_point_source, asm_propagate,
      transform_propagate, thin_lens, phase_change, fft, ifft,
      kernel_propagate) and chromatix.core.field.Field, run inside the
      agent_solver container built from docker/Dockerfile. Sections used:
      function docstrings and bodies for propagation kernels; Field class
      docstring and spatial_dims property for axis-order conventions.

  - url: "https://pypi.org/project/chromatix/0.0.1/"
    source_type: negative_result
    retrieved_at: "2026-07-30"
    usage_note: >
      Downloaded and inspected this wheel directly (`pip download chromatix`,
      then `zipfile -l`). It contains only a 22-byte __init__.py and a
      22-byte _about.py from 2022-07-10 -- an unrelated namesquat, not the
      chromatix-team library. Recorded here so no future agent re-discovers
      this the hard way by trying `pip install chromatix` and silently
      getting the wrong package.

  - url: https://chromatix.readthedocs.io/en/latest/101/
    source_type: official_docs
    ref: "as of 2026-08-19"
    retrieved_at: "2026-08-19"
    usage_note: >
      CHE-57 (PB6) reproduced Chromatix 101 as repo-owned executable code
      (knowledge/solvers/chromatix/tutorials/c00_chromatix_101.py). Every printed
      shape, dtype and dx reproduces exactly; the printed Field.power of 1.0000002
      does NOT (the pinned commit gives 1.0000118). Both are float32 normalisation
      residue of a 512x512 plane wave, so the page was built from a different
      commit than the pinned d24bdf0. Recorded rather than silently loosened.

  - url: https://chromatix.readthedocs.io/en/latest/
    source_type: official_docs
    retrieved_at: "2026-08-19"
    usage_note: >
      Used to resolve the CHE-57 example scope. The visible Examples section lists
      only four of the fifteen documented examples; the remaining eleven were found
      in the landing page's hrefs. Seven of the ticket's titles do not match their
      live URL slugs (sas, bandlimited_angular_spectrum, rescaled_propagation, dmd,
      polarized_multislice, highNA_PSF, modified_born) -- the mapping is recorded in
      knowledge/solvers/chromatix/tutorials/README.md. All fifteen were located and
      reproduced; none was out of scope.

  - url: https://github.com/chromatix-team/chromatix/tree/main/docs/examples
    source_type: official_repository
    retrieved_at: "2026-08-19"
    usage_note: >
      Four docs pages (fourier_ptychography, holoscope, cgh, dmd) truncate before
      their optimization cells, so those reproductions were written against the
      source .ipynb notebooks fetched from raw.githubusercontent.com. The notebooks
      are also where their published output values come from -- in particular the
      DMD example's full correlation/loss trajectory and the CGH example's
      Field.extent, intensity shape and correlation history, none of which appear on
      the rendered pages. Per AGENTS.md the pinned install still won every
      disagreement: two examples' published convergence does not reproduce (see
      failure_guide.md, "optax optimizer state silently frozen"), and two need
      scikit-image, which is not installed.

  - url: "installed package chromatix==0.6.0 (commit d24bdf0022835bb8ce1cdcc6aeafbc7fcb39daee)"
    source_type: installed_source
    retrieved_at: "2026-08-19"
    usage_note: >
      Primary source of truth for CHE-57. Signatures and dataclass fields were read
      off the installed package wherever the docs and the pinned API disagreed:
      Optical4FSystemPSF(shape, spacing, f_tube, phase) rather than the docs'
      padding_ratio, Microscope's required spectrum, Source(current_density=, k0=)
      rather than Source(field=), and modified_born_series.solve()'s actual
      component-last return layout rather than the polarization-first one its own
      docstring describes.
