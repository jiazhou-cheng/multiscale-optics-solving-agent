models:
  - id: M_RAY_OPTILAND
    version: 0.1.0
    description: M1-validated sequential geometric ray tracing through the Optiland adapter.
    framework: numpy
    approximation: geometric_optics
    inputs:
      - name: system
        artifact: optical_system
        requires_metadata: [length_unit, wavelength]
        optional: true
        description: Lens prescription, materials, stops, fields, and source definition.
      - name: incident_rays
        artifact: ray_bundle
        optional: true
        description: Optional externally generated rays.
    outputs:
      - name: rays
        artifact: ray_bundle
        # CHE-34 (M3.5) closes the CONTRACT GAP recorded under validity below.
        # `amplitude` and `polarization` were claimed and never written: RealRays
        # exposes a real intensity weight and no polarization state at all. This
        # list is now what the adapter actually puts in the record.
        provides_metadata:
          [
            wavelength,
            coordinates,
            direction,
            intensity_weight,
            optical_path_length_native,
            reference_plane,
          ]
      - name: wavefront
        artifact: wavefront_samples
        provides_metadata:
          [wavelength, coordinates, optical_path_length, amplitude, polarization, pupil_mask]
    # CHE-61 (PB4b): updated FROM executable validation, not from what the
    # package exposes. `optiland.backend.set_precision` is typed
    # Literal['float32','float64'] and `set_device` is torch-backend-only
    # (BackendCapabilityError otherwise) -- both measured on the pinned install,
    # benchmarks/probes/precision/optiland_capability.py. Real adapter-driven traces of M3SingletRef ran on
    # cuda:0 at both precisions with the placement read back off the traced
    # tensors (tests/test_precision_gpu_pipeline.py::TestOptilandOnTheGpu).
    #
    # float16 is absent because Optiland has no float16 mode, not because this
    # project declined to wire one: accepting it would mean casting to float32
    # and calling the result float16 support.
    #
    # The authoritative form of these two lists is
    # core/capabilities.py::OPTILAND_CAPABILITIES; tests/test_registry_matches_
    # capabilities.py fails if the two disagree, so this cannot drift into an
    # aspiration again.
    devices: [cpu, gpu]
    dtypes: [float32, float64]
    derivative:
      mode: native_autodiff
      verified: false
      parameters: ["*"]
      notes: >-
        M1 establishes only the NumPy CPU float64 forward path. Optiland has
        an optional PyTorch backend and one exploratory directional-derivative
        probe exists, but the repository gradient contract has not passed;
        GPU, float32, and differentiable execution are not registered model
        capabilities.
    validity:
      assumptions:
        - Geometric optics is adequate inside the traced lens system.
        - Diffractive effects are introduced only after an explicit ray-to-wave coupler.
      warnings:
        - Ray caustics and hard apertures can create non-smooth derivatives.
        - set_backend mutates global module state and is not thread-safe; never call it concurrently.
        - >-
          CHE-12 verified Optiland 0.6.0 geometry in millimetres and
          wavelength in micrometres on CPU. Convert both to SI at artifact
          boundaries. CHE-30 established the `opd` convention -- absolute
          accumulated optical path in mm, referenced to an aperture-dependent
          launch plane -- and CHE-33 declares it into an OPL; the raw value is
          still not admissible as a phase on its own.
        - >-
          CHE-41: that launch plane is perpendicular to Z, which is a WAVEFRONT
          only for a bundle travelling along z. Off axis the accumulated path
          therefore falls short of a wavefront-referenced one by
          n_object * (d0 . r_launch), and that term is the entire convergence
          tilt: only 0.13% of the required tilt survived without it on
          M3-REVERSE-TELEPHOTO at Hy = 0.2. The adapter now exports the term per
          ray as `object_space_reference_offset_m`, measured from the launch
          state Optic.trace discards, and the coupler REFUSES an off-axis record
          that lacks it. On axis the term is a piston and nothing changes.
        - >-
          CONTRACT GAP found 2026-07-30, RESOLVED by CHE-34 (M3.5) for the
          `rays` port. optiland.rays.real_rays.RealRays (pinned 0.6.0) exposes
          only x, y, z, L, M, N, intensity, opd -- no polarization state and no
          pupil mask -- and the adapter never populated "amplitude" or
          "polarization" despite the port declaring them. The declarations were
          kept while C_RAY_TO_WAVE.source.requires_metadata depended on them,
          which meant the M3 edge validated only because producer and consumer
          were both describing something that does not exist. Both lists were
          narrowed to what is actually written, and the coupler now states the
          declarations it needs on the edge instead. The `wavefront` port below
          is UNCHANGED and still overclaims "amplitude"/"polarization"/
          "pupil_mask"; it is not on the M3 path, and narrowing a port nothing
          in M3 executes would be an unverified change.
    cost_model:
      scaling: O(number_of_surfaces * number_of_rays)
      memory_scaling: O(number_of_rays)
      estimator: solvers.optiland.cost_model.estimate_trace_seconds
      notes: >-
        CHE-118 replaced the scaling string above as the *usable* cost
        information. It is still correct asymptotically and it was still useless
        to a planner: M0.4 scored `estimate()` and recorded "NO PREDICTION ... a
        planner cannot use this estimator to order work by cost". The named
        estimator is a measured affine fit -- a fixed per-call cost plus seconds
        per ray per surface -- calibrated in
        benchmarks/perf/records/optiland_trace_chunk_sweep.json and holding to
        1.9% over 1e3-1e6 rays a call. It is bound to the environment
        fingerprint it was measured on and returns no prediction elsewhere,
        which is the same rule core.performance.compare applies to a ratio.
        Two gaps it does not close: memory is not calibrated at all, so
        memory_scaling above is still an asymptote and nothing predicts
        peak_memory_bytes; and the fit covers propagation of a caller-supplied
        ray population, not Optiland's own ray generation.
    source:
      package: optiland
      docs_url: https://optiland.readthedocs.io/
      repository_url: https://github.com/optiland/optiland
      pinned_version: "0.6.0"
      retrieved_at: "2026-07-30"
    # CHE-87: was `experimental`, as all 17 entries were, which made the field
    # carry no information. `characterized` is the honest value: the forward
    # ray trace is measured against analytic and independent references and its
    # conventions are declared, and it is not `validated` because the gradient
    # contract has not passed (see derivative.verified below).
    maturity: characterized
    tags: [ray, lens, imaging, forward-only]

  - id: M_WAVE_CHROMATIX
    version: 0.1.0
    description: M1-validated scalar angular-spectrum propagation through Chromatix.
    framework: jax
    approximation: scalar_wave
    inputs:
      - name: input_field
        artifact: complex_field
        requires_metadata: [wavelength, sample_pitch, coordinate_frame, phasor]
      - name: optical_surface
        artifact: effective_surface
        requires_metadata: [wavelength, coordinate_frame]
        optional: true
    outputs:
      - name: output_field
        artifact: complex_field
        provides_metadata:
          [wavelength, sample_pitch, coordinate_frame, phasor, polarization, normalization]
    # CHE-61 (PB4b): `gpu` added from executable validation -- asm_propagate ran
    # on cuda:0 through the graph-facing adapter and the output array's own
    # placement was read back (tests/test_precision_gpu_pipeline.py::
    # TestChromatixOnTheGpu). `tpu` is deliberately NOT added: nothing has
    # executed there.
    #
    # dtypes stays [complex64] and that is the substantive claim. Chromatix's
    # ScalarField.__init__ is `jnp.asarray(u, dtype=jnp.complex64)`
    # unconditionally; Field.build handed a complex128 array returns complex64
    # even with jax_enable_x64 enabled (measured, benchmarks/probes/precision/chromatix_capability.py). So
    # complex128 is INGESTIBLE but not supported, and it is recorded as a lossy
    # bridge rather than listed here. Authoritative form:
    # core/capabilities.py::CHROMATIX_CAPABILITIES.
    devices: [cpu, gpu]
    dtypes: [complex64]
    derivative:
      mode: native_autodiff
      verified: false
      parameters: ["*"]
      notes: >-
        M1 establishes only forward scalar asm_propagate on CPU/complex64.
        Gradients, vector fields, and other kernels remain unverified. CHE-61
        adds validated GPU execution of the same complex64 forward path; it
        does not change the gradient claim.
    validity:
      assumptions:
        - Sampling and propagation method satisfy the relevant band-limit conditions.
      warnings:
        - Scalar propagation is not valid for every high-NA or strongly vectorial task.
        - >-
          CHE-12 verified Chromatix distribution 0.6.0 from Git commit
          d24bdf0022835bb8ce1cdcc6aeafbc7fcb39daee with JAX 0.6.2 on CPU;
          M1 validates scalar angular-spectrum cases and a Gaussian scaling
          case; it does not validate vector, accelerator, or gradient paths.
        - >-
          A complex128 input array is silently downcast to complex64 inside
          chromatix.core.field.ScalarField.__init__; there is no verified
          complex128 path through Chromatix for this model. Confirmed
          2026-07-30 while building src/solvers/chromatix/adapter.py.
    cost_model:
      scaling: O(batch * pixels * log(pixels)) for FFT-based propagation
      memory_scaling: O(batch * pixels)
    source:
      package: chromatix
      docs_url: https://chromatix.readthedocs.io/
      repository_url: https://github.com/chromatix-team/chromatix
      pinned_version: "0.6.0"
      pinned_commit: d24bdf0022835bb8ce1cdcc6aeafbc7fcb39daee
      retrieved_at: "2026-07-30"
    # CHE-87: `characterized`, not `validated` -- the scalar ASM forward path is
    # analytically checked on CPU and GPU at complex64, and no gradient,
    # vector-field or non-ASM kernel claim has been established.
    maturity: characterized
    tags: [wave, fourier, imaging, jax, scalar, forward-only]
