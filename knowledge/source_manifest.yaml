    retrieved_at: "2026-07-30"
    notes: >
      Real PyPI package (`pip install optiland`); repository moved orgs
      (github.com/HarrisonKramer/optiland now redirects here). "framework:
      pytorch" is aspirational, not automatic: torch is NOT a declared
      dependency of the optiland PyPI package -- the default backend is
      NumPy (non-differentiable), and the PyTorch/autodiff backend must be
      installed separately and selected explicitly via
      `optiland.backend.set_backend("torch")`. See
      knowledge/solvers/optiland/ for the full knowledge pack.
