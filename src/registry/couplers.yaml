couplers:
  - id: C_RAY_TO_WAVE
    version: 0.2.0
    description: Reconstruct a sampled complex pupil/wavefront field from ray amplitudes and optical path lengths.
    framework: internal
    source:
      # CHE-34 (M3.5): was `rays_or_wavefront` / `wavefront_samples`, and both
      # halves of that were wrong. The implemented physics is a sum of plane
      # WAVELETS, so it needs a direction per sample; `WavefrontSamples` carries
      # (N, 2) pupil coordinates and no directions at all, so it could never have
      # been an admissible input. The hedged port name was hiding that. Version
      # bumped to 0.2.0 because this changes the artifact type of the port.
      name: ray_bundle
      artifact: ray_bundle
      # CHE-23: `polarization` was removed. The Optiland adapter documents that
      # RealRays exposes no polarization state and deliberately refuses to
      # fabricate one, so a required field nobody can supply was a contract
      # defect rather than a safety feature. M2 is scalar-only; reinstate when a
      # vector claim is made.
      #
      # CHE-34: `amplitude` and `optical_path_length` were likewise removed from
      # this list, and this is the substantive change. No ray model in this
      # repository provides either one: Optiland emits a real intensity weight
      # and an absolute accumulated opd whose zero moves with the aperture.
      # Requiring them here made the edge validate only because the producer
      # claimed metadata it does not write. What the coupler actually needs from
      # the RECORD is below; what it needs beyond the record is a declaration
      # supplied on the edge, and it refuses rather than defaults -- see
      # validity.assumptions.
      requires_metadata: [wavelength, coordinates, direction, reference_plane]
      description: >
        A traced ray bundle. Coherent input is accepted directly; an undeclared
        one is promoted only under an explicit edge declaration and is otherwise
        refused with OPL_REFERENCE_UNVERIFIED.
    target:
      name: complex_field
      artifact: complex_field
      provides_metadata:
        [wavelength, sample_pitch, coordinate_frame, phasor, polarization, normalization]
    # CHE-61 (PB4b) replaces CHE-55's description of this coupler, every clause
    # of which has stopped being true. It is no longer pure NumPy: one
    # xp-parameterized implementation executes in NumPy on the host and in JAX
    # wherever the input array lives, with no CPU/GPU fork.
    # ComplexField.__post_init__ no longer force-casts to complex128, and
    # to_artifact_record no longer hard-codes device=Device.CPU -- both now
    # preserve what the data actually is.
    #
    # Validated by execution, not declaration: dtype/device/namespace
    # preservation and the measured float32 agreement in
    # tests/test_precision_execution_matrix.py, GPU residency across the live
    # boundary in tests/test_precision_gpu_pipeline.py.
    #
    # float16 is absent on purpose. The bridge widens a float16 input to float32
    # under SAFE and the coupler computes phase in float32; that is a promotion,
    # and listing float16 here would advertise a computation that never happens.
    # Authoritative form: core/capabilities.py::C_RAY_TO_WAVE_CAPABILITIES.
    devices: [cpu, gpu]
    dtypes: [float32, float64, complex64, complex128]
    derivative:
      mode: finite_difference
      verified: false
      parameters: ["*"]
      notes: Initial safe fallback across PyTorch/JAX. Replace only with a tested unified or custom derivative bridge.
    validity:
      assumptions:
        - Rays adequately sample the pupil and represent a locally single-valued wavefront.
        - Amplitude reconstruction and reference sphere are explicitly defined.
        - >
          The optical path length carries a declared reference. A bare Optiland
          opd_native is not admissible: it is an absolute accumulated path whose
          zero moves with the aperture (CHE-30), and a wrong sign conjugates the
          wavefront.
        - >
          CHE-41: the declared OPL reference is versioned, and v2 measures the
          path from the plane WAVEFRONT of the incoming bundle rather than from
          Optiland's launch plane. The two agree exactly on axis and differ by
          the whole convergence tilt off axis. An off-axis source record that
          carries no object-space reference term is refused with
          OBJECT_SPACE_REFERENCE_MISSING; the term cannot be reconstructed
          downstream, and proceeding without it aims a clean converging sphere at
          the axis instead of at the image point.
        - >
          CHE-34: two declarations must be supplied ON THE EDGE when the source
          record is not already coherent -- the handoff plane (kind and axial
          position) and, through it, the OPL reference and the
          intensity-to-amplitude map. They are configuration, not defaults: a
          request that omits them is refused with OPL_REFERENCE_UNVERIFIED and a
          remedy naming what is missing. See
          src/couplers/handoff.py.
      warnings:
        - Caustics, multi-valued phase, hard vignetting, and sparse rays can invalidate interpolation.
        - >
          Omitting the <n, d> projection factor of main-text eq 2 is undetectable
          at normal incidence and breaks power conservation off-axis.
    cost_model:
      scaling: O(number_of_rays + number_of_pupil_samples)
      memory_scaling: O(number_of_pupil_samples)
    lossy: true
    invariants: [phase_reference_consistency, pupil_power_consistency]
    # CHE-87: `characterized`. The wavelet sum is measured against an analytic
    # case and an independent ASM implementation, with a declared and tested
    # limitation (no wavefront-curvature term). Not `validated`: no gradient
    # across the boundary is certified.
    maturity: characterized
    tags: [ray_wave, pupil, cross_framework]

  - id: C_WAVE_TO_RAY
    version: 0.1.0
    description: >
      Decompose a sampled complex field into its propagating plane-wave modes and
      emit a Monte Carlo sample of them as rays carrying complex amplitudes.
      Registered by CHE-23; implemented and characterized by CHE-25.
    framework: internal
    source:
      name: complex_field
      artifact: complex_field
      requires_metadata: [wavelength, sample_pitch, coordinate_frame, phasor, normalization]
    target:
      name: ray_bundle
      artifact: ray_bundle
      provides_metadata:
        [wavelength, coordinates, directions, amplitude, optical_path_length, normalization]
    # CHE-61 (PB4b), same correction as C_RAY_TO_WAVE above: the FFT, the
    # frequency grid, the evanescent cut and the 1/p weighting all execute in the
    # input field's own namespace, so a complex64 GPU field is decomposed on the
    # GPU and emits a float32/complex64 bundle on the same device. The input is
    # no longer forced to complex128 upstream.
    #
    # One host operation remains and is deliberate: `draw_indices` reads the
    # probability vector to the host because numpy.random.Generator is what pins
    # the seed, and bitwise reproducibility across devices is worth more than
    # avoiding one copy of a probability vector. It is written out in the source
    # rather than left to happen inside rng.choice.
    #
    # `dtypes` here is the ACCEPTED INPUT set, and for this coupler that is
    # complex only: its source port is a ComplexField, so a real dtype has no
    # meaning as an input. The bundle it EMITS carries real geometry
    # (float32/float64) alongside a complex amplitude, at the precision of the
    # field it decomposed -- an output fact the registry schema has no field for,
    # so it is stated here and asserted in core/capabilities.py's output_dtypes.
    #
    # Authoritative form: core/capabilities.py::C_WAVE_TO_RAY_CAPABILITIES.
    devices: [cpu, gpu]
    dtypes: [complex64, complex128]
    derivative:
      # `surrogate`, not `native_autodiff`: the estimator differentiates a
      # fixed-direction surrogate of the objective, not the objective itself.
      mode: surrogate
      verified: false
      parameters: [field_amplitude]
      notes: >
        SI S7.2 fixed-direction estimator. Sampled wavevectors and the resulting
        ray directions are held FIXED during backpropagation and the sampling
        density is detached, so gradients flow only through the spectrum in the
        amplitude a = U_tilde / p.detach(). The paper states directly that this
        neglects gradients associated with changes in the sampled directions, so
        it is a deliberately biased estimator of the true derivative. CHE-28
        measures that bias; verified stays false until the evidence named in
        benchmarks/protocols/coupler_protocol.yaml exists.
    validity:
      assumptions:
        - Scalar, monochromatic, fully coherent field on a planar tangent patch.
        - Sampling density is strictly positive wherever the spectrum is nonzero.
        - Tangent-plane approximation holds within eps_curv <= arcsin(D / 2R).
      warnings:
        - >
          Evanescent modes with ku^2 + kv^2 > k^2 are discarded. The discarded
          power is a real loss and must be reported, not absorbed.
        - >
          Omitting the 1/p importance weight biases the estimator while still
          producing a field that looks plausible.
        - >
          This is a Monte Carlo estimator. Bitwise reproducibility at a fixed
          seed is not evidence of accuracy, and a single realization is never a
          result.
      hard_limits:
        grazing_bin: kn = 0 at the propagating/evanescent boundary is excluded as singular.
    cost_model:
      scaling: O(pixels * log(pixels) + number_of_sampled_rays)
      memory_scaling: O(pixels + number_of_sampled_rays)
    lossy: true
    invariants: [evanescent_power_accounted, importance_weight_applied, unit_direction_norm]
    # CHE-87: `characterized` as a Monte Carlo estimator -- its convergence and
    # its negative controls are measured, and a stochastic estimator cannot be
    # `validated` by a single realization in any case.
    #
    # Scope note: this coupler is a **library API, not a graph node**, and
    # CHE-110 (M2.2) settled that rather than inheriting it. It is registered
    # because it is a real cross-representation handoff with declared
    # conventions, and callers use it directly.
    #
    # The decision, and why it went this way. A registered coupler with no node
    # is something an agent can select and cannot run, so "no node" is only
    # defensible if the executor SAYS so. It now does: a graph edge naming
    # C_WAVE_TO_RAY is refused before anything runs, with the reason and the
    # working alternatives, instead of validating and then dying in a resolver
    # partway through
    # (tests/test_executor.py::
    #  test_a_coupler_with_no_graph_node_is_refused_before_anything_runs).
    #
    # The topology that would need a wave->ray edge -- rays in, diffractive
    # interaction, rays back out to a downstream refractive trace -- is served
    # by C_PLANAR_DOE_STEP and C_PATCH_WFT, which DO have graph nodes and which
    # already emit rays from a spectrum. C_PLANAR_DOE_STEP calls this module
    # directly (couplers/cascade.py imports decompose, draw_indices and
    # spectrum_to_rays); C_PATCH_WFT carries its own per-patch decomposition
    # that matches decompose term for term rather than calling it, which is a
    # duplication worth knowing about and is not the same statement.
    #
    # A bare C_WAVE_TO_RAY edge would be a
    # representation transition with no interaction attached, which is not a
    # stage any system in the M2 ladder has. If one ever does, the node is a
    # small change and this note is what has to change with it.
    #
    # C_RAY_TO_WAVE, C_PATCH_WFT and C_PLANAR_DOE_STEP are the couplers with
    # graph nodes.
    maturity: characterized
    tags: [ray_wave, angular_spectrum, monte_carlo, stochastic]

  - id: C_PLANAR_DOE_STEP
    version: 0.1.0
    description: >
      One batched planar DOE interaction: accumulate every incident ray
      coherently onto the common plane, apply the complex transmission once,
      transform, and resample a fixed P x S budget of outgoing rays. SI
      Algorithm S1. Ray bundle in, ray bundle out; the wave representation is
      internal to the step.
    framework: internal
    source:
      name: incident_rays
      artifact: ray_bundle
      requires_metadata:
        [wavelength, coordinates, directions, amplitude, optical_path_length, reference_plane]
    target:
      name: outgoing_rays
      artifact: ray_bundle
      provides_metadata:
        [wavelength, coordinates, directions, amplitude, optical_path_length, reference_plane]
    # Composed from C_RAY_TO_WAVE and C_WAVE_TO_RAY, so its capability is theirs
    # intersected rather than an independent claim, and the authoritative form is
    # core/capabilities.py::C_PLANAR_DOE_STEP_CAPABILITIES.
    devices: [cpu, gpu]
    dtypes: [float32, float64, complex64, complex128]
    derivative:
      mode: surrogate
      verified: false
      parameters: []
      notes: >-
        Inherits C_WAVE_TO_RAY's fixed-direction estimator: secondary directions
        are held fixed and only the amplitudes carry a derivative, so the
        gradient is a deliberately biased surrogate. No gradient across this
        step is certified, and registering the step does not change that.
    validity:
      assumptions:
        - >-
          The surface is PLANAR. Every incident ray must cross one common
          Cartesian plane, which is what makes a single accumulation valid.
          A conformal substrate has position-dependent tangent frames and
          normals and there is no common plane to accumulate onto; use the
          curvature bound in couplers/curvature.py to size a patch instead.
        - >-
          The declared plane is where the transmission lives. The step does not
          propagate the incident bundle to it.
      warnings:
        - >-
          The step RESETS optical path length to zero on the outgoing rays. The
          incident path is already in the accumulated field's phase, so carrying
          it forward would double-count it -- but the consequence is that the
          phase reference is rebased to this plane, and an OPL measured
          downstream is measured from here.
        - >-
          Power is not conserved by default and should not be. `preserve_energy`
          renormalizes to the incident power and is off by default: a lossy DOE
          legitimately loses power, and renormalizing hides the case a
          conservation check exists to catch. When on, the factor is reported.
        - >-
          The outgoing amplitude is a spectral amplitude U~[m]/p[m], not a
          transformed incident weight. No per-ray correspondence survives the
          accumulation.
        - >-
          Primary launch positions are sampled UNIFORMLY while secondary
          directions are sampled by spectrum magnitude. That asymmetry comes
          from the reference implementation and the paper does not justify it;
          it is offered as an option rather than adopted as the estimator.
    cost_model:
      scaling: O(incident_rays * pixels + pixels * log(pixels) + P * S)
      memory_scaling: O(pixels + P * S)
    lossy: true
    invariants:
      [evanescent_power_accounted, importance_weight_applied, unit_direction_norm, outgoing_count_is_the_budget]
    # `characterized`: the full-enumeration limit reproduces the transmitted
    # field to dtype round-off, and the budget-independence property the step
    # exists for is asserted directly. Not `validated`: no certified gradient,
    # and the composition has no analytic oracle of its own beyond the
    # enumeration limit.
    maturity: characterized
    tags: [ray_wave, doe, cascade, batched]

  - id: C_PATCH_WFT
    version: 0.1.0
    description: >
      Patch-based local windowed Fourier transform: each incident ray extracts
      its own local complex patch of the DOE, transforms it (SI eq S1), and
      emits secondary rays sampled from that patch's angular spectrum (eqs
      S3-S5). Ray bundle in, ray bundle out. C_PLANAR_DOE_STEP is a SPECIAL
      CASE of this, not a peer of it -- SI S10 calls this the direct
      implementation and the global aggregation the shortcut.
    framework: internal
    source:
      name: incident_rays
      artifact: ray_bundle
      requires_metadata:
        [wavelength, coordinates, directions, amplitude, optical_path_length, reference_plane]
    target:
      name: outgoing_rays
      artifact: ray_bundle
      provides_metadata:
        [wavelength, coordinates, directions, amplitude, optical_path_length, reference_plane]
    # CPU-only, and narrower on devices than C_PLANAR_DOE_STEP on purpose: no
    # CUDA or JAX path has been executed, so none is declared. The expensive
    # half of a patch run is the O(rays x pixels) reconstruction in
    # C_RAY_TO_WAVE, which is xp-parameterized and does run on CUDA; the patch
    # transform is not where the time goes.
    #
    # `dtypes` is what is ACCEPTED, and the four are real: the paper's own phase
    # masks are float32. Compute is complex128 regardless -- an upcast, which is
    # lossless -- because the exactness relation this operator exists to satisfy
    # is measured at 1.4e-12, below float32 epsilon, so a float32 compute path
    # could not be gated by the one test that makes it trustworthy. Authoritative
    # form: core/capabilities.py::C_PATCH_WFT_CAPABILITIES.
    devices: [cpu]
    dtypes: [float32, float64, complex64, complex128]
    derivative:
      mode: surrogate
      verified: false
      parameters: []
      notes: >-
        Inherits C_WAVE_TO_RAY's fixed-direction estimator: secondary directions
        are held fixed and only the amplitudes carry a derivative. No gradient
        across this step is certified.
    validity:
      assumptions:
        - >-
          The substrate is PLANAR, declared rather than inferred. On a planar
          substrate the tangent-plane approximation is exact everywhere, so the
          coherent patch sum provably converges to the full-field response (SI
          S2). On a curved one it does not, and the only statement available is
          the bound eps_curv <= arcsin(D/2R). `substrate: conformal` is refused,
          not approximated -- the planar case's confidence must not be inherited.
        - >-
          patch_px is ODD. An even patch has no centre sample, so "centred on a
          ray" is undefined for it, and the odd-pad and even-(pad - patch) rules
          are then jointly unsatisfiable. The paper's sizes (40, 50, 100) are
          all even, so an even request is refused rather than rounded.
        - >-
          pad_px is DERIVED, not taken. pad_factor is a preference; the step
          raises it until clearance, centring and oddness all hold, and reports
          the value it used. A pad that violates clearance produces a plausible
          field that is wrong by 100%.
        - >-
          Patch centres are drawn on the sample grid over the aperture DILATED
          by half a patch. Continuous centres inject a sub-sample linear phase
          and the sweep plateaus at ~0.28 instead of converging; an undilated
          draw is unbiased in the interior and biased at the rim, which reads as
          a soft edge rather than as a defect.
        - >-
          The centre DENSITY is uniform by default and that is a choice, not a
          requirement of the convergence relation -- "uniformly covers" in SI S2
          constrains the support, not the density. CHE-120 derived the
          variance-optimal density (q ~ ||U~_c||_1, the L1 norm of the patch's
          own spectrum) and measured it on demo3. The exactly-computed ceiling
          on that axis is 1.4413x at matched ray count; the integral-image proxy
          q ~ sqrt(window energy) captures 1.4412x of it, and the measured
          end-to-end reduction is 1.4523x i.i.d. or 1.4685x with equal-mass CDF
          strata. The default stays uniform so every committed record remains the
          estimator that produced it;
          couplers.patch_positions.plan_positions supplies the alternative and
          PatchPlan.center_weights carries the lambda_c = P / (D pi_c) that keeps
          it unbiased -- 1/(D q_c) for the i.i.d. and CDF draws, the stratum's
          own mass for the equal-area tiling.
          Unbiasedness of each density is gated against the enumerated exact
          field in tests/test_patch_positions.py, not inferred from the noise
          level. Not yet reachable through the graph node -- library only.
      warnings:
        - >-
          The step RESETS optical path length to zero on the outgoing rays, for
          the same reason C_PLANAR_DOE_STEP does: each patch's phase is already
          in its spectral amplitude. The phase reference is rebased to the patch
          plane.
        - >-
          NO apodization. Any taper below 1 removes field that no other patch
          replaces, so the coherent sum stops converging to the full-DOE
          response -- the partition-of-unity argument behind the convergence
          relation is exactly what a taper breaks.
        - >-
          Reconstruction is O(secondary_rays * pixels). At the paper's Table S2
          parameters that is 1.6e8 rays against 1e4 pixels for the 100^2
          hologram; batching is part of the method, not an optimization.
    cost_model:
      scaling: O(patches * pad^2 * log(pad) + patches * S * pixels)
      memory_scaling: O(pad^2 + patches * S)
      estimator: couplers.patch_cost.estimate_emitter_seconds
      notes: >-
        CHE-119 (M5.2) added a measured estimator for the EMITTER half of the
        scaling above -- the `patches * pad^2 log pad` term. It is affine in two
        axes rather than a scaling string, because the decomposition says so: a
        per-patch term for the transform, the density and the cumulative sum,
        which do not depend on the draw size, and a per-secondary-ray term for
        the search and the assembly, which do. Calibrated in
        benchmarks/perf/records/patch_emitter_cost_model.json and holding to
        6.2% for 16-50 patches at pad 301. Outside that -- a different pad, a
        different environment fingerprint, or few enough patches that the thread
        pool has not amortized -- it returns no prediction rather than
        extrapolating, which is the rule core.performance.compare applies to a
        ratio.
        The `patches * S * pixels` reconstruction term is NOT estimated here and
        is usually the larger of the two; the estimate says so in its notes.
        Memory is not calibrated at all, so memory_scaling above remains an
        asymptote.
        The emitter now runs on host threads (8 by default,
        couplers.patch.PATCH_EMITTER_THREADS), which changes the constant and
        not the asymptote -- and changes no emitted ray: the parallel path is
        the same numpy call on the same input, asserted bitwise in
        tests/test_patch_wft.py.
    lossy: true
    invariants:
      [evanescent_power_accounted, importance_weight_applied, unit_direction_norm, patch_coverage_corrected]
    # `characterized`, on the same reasoning as C_WAVE_TO_RAY: the deterministic
    # full-enumeration limit is gated hard (1.4e-12 against an independent
    # float64 ASM, unbiased at 5.9e-15), but the operator as used is a Monte
    # Carlo estimator over patch centres and spectral modes, and a stochastic
    # estimator is not `validated` by any single realization.
    maturity: characterized
    tags: [ray_wave, doe, patch, windowed_fourier, monte_carlo, stochastic]
