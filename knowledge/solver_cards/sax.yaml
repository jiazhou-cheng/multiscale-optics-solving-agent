id: sax
validation_status: unvalidated
role: M_CIRCUIT_SAX
framework: jax
official_docs: https://gdsfactory.github.io/sax/
repository: https://github.com/gdsfactory/sax  # moved from flaport/sax (old URL still 301-redirects here; verified 2026-07-30)
install:
  source: "pip install sax==0.18.2"  # real PyPI package, unlike chromatix -- no namesquat hazard
  python_requires: ">=3.11.0"
  version_pin_note: >
    Pin by PyPI version, not git commit/tag: git tags on the canonical repo
    (both the old flaport/sax and new gdsfactory/sax URLs) stop at 0.9.2,
    while PyPI's actual latest release is 0.18.2. PyPI is authoritative for
    this package.
  environment: docker/Dockerfile (image `agent_solver`), see docker/requirements.txt
knowledge_pack: knowledge/solvers/sax/  # conventions.md, capability_notes.md, api_minimal_examples.md, failure_guide.md, probes/
agent_should_use_for:
  - photonic network composition
  - compact-model optimization
  - system-level response after verified S-parameter extraction
agent_should_not_assume:
  - port order and propagation directions agree across components
  - "port names follow any fixed scheme -- they depend on the global,
    settable sax.set_port_naming_strategy (verified -- online docs example
    used in0/out0, installed 0.18.2 package's own examples use
    o1/o2/o3/o4 under the optical strategy)"
  - arbitrary interpolated S-parameters remain passive or causal
  - component reference planes are aligned
  - gradient-verified for one component model implies the assembled
    circuit (matrix-solve) path is differentiable
required_probes:
  - analytic two-port cascade  # DONE: single coupler_ideal + straight verified vs analytic phase/energy, see knowledge/solvers/sax/conventions.md
  - reciprocal/passive network checks  # DONE: exact reciprocity + energy conservation for both a single coupler and a full netlist-assembled MZI
  - port permutation failure test  # not yet done
  - directional derivative of a compact-model parameter  # DONE for one closed-form component (coupler_ideal coupling); NOT done through an assembled circuit's matrix-solve backend
benchmarks: [L2-THERMO-01, L3-ROBUST-01]
