# CHE-130 (M0.5.1) -- the triage that has to happen before anything is deleted.
#
# The direction change retires the task-centric A1/L1/L2/L3 benchmark layer and
# keeps the scientific evidence. Those two things live in the same directories
# and sometimes in the same file, so "delete the benchmark stuff" is not a
# reviewable instruction. This file classifies **artifacts, not directories**.
#
# The load-bearing example is `benchmarks/physics/L2-PSF-01/`: `run_benchmark.py`
# is an obsolete task wrapper AND carries the M3-SINGLET-REF prescription that is
# a candidate canonical instance; `evaluate.py` and `tolerances.yaml` hold metric
# definitions and tolerance derivations that exist nowhere else. One directory,
# three verdicts -- hence `part:` on entries that split a file.
#
# Buckets
# -------
#   A  reusable scientific infrastructure or evidence. Test: would this still be
#      true and useful if no agent and no benchmark task existed? Preserve, and
#      name the family / oracle / metric / validity predicate it migrates into.
#   B  candidate canonical case. Test: is this a specific physical setup whose
#      result is worth freezing? A POSITIVE justification is required; "it
#      already exists" is not one and rows that cannot state one become C.
#   C  obsolete task layer. Exists only to serve the old evaluation design.
#
# Coverage
# --------
# `tests/test_benchmark_inventory.py` enumerates every file under `scope:` and
# fails if one is not matched by an entry, and fails if an entry matches nothing.
# An inventory that silently omits a file is how evidence gets deleted.
#
# Globs may not contain `**` and may not cross a directory boundary, so a new
# subdirectory can never be silently absorbed by an existing row.
#
# This issue produces a classification and no behaviour change. Nothing is
# deleted here; deletion is M0.5.4 (CHE-133) and, for the L2-PSF-01 runner, M4.

version: 1

scope:
  - benchmarks
  - src/agent
  - src/verification

# Edits this triage found to be required but which are deliberately NOT made
# here, with the issue that owns them.
pending_edits:
  - path: AGENTS.md
    section: Current Phase
    required_change: >-
      Rewrite from the retired two-class taxonomy ("single-component benchmarks"
      / "composed physics benchmarks") to the B0-B4 family architecture, and give
      "Benchmark Requirements" the family / instance / verifier vocabulary.
    owner: CHE-133 (M0.5.4)
    why_not_here: >-
      AGENTS.md has in-flight uncommitted changes on an unrelated topic. Record
      the edit; land it with the deletion so the two are reviewed together.
  - path: benchmarks/README.md
    section: whole file
    required_change: >-
      The "What is here" table points at `level2/L2-PSF-01/` (a path that no
      longer exists; the directory is `physics/L2-PSF-01/`) and describes the
      per-task `benchmarks/levelN/<task_id>/` layout, which is the retired
      design. Replace with the family registry / `benchmarks/instances/` layout.
    owner: CHE-133 (M0.5.4)
    why_not_here: This issue changes no behaviour and no repository-wide prose.

# Bucket-C artifacts CHE-133 removed, and where their content survives. Kept as a
# record rather than as `entries:` rows, because the coverage test refuses a row
# that matches no file -- a classification of something that is not there reads
# as coverage and is not.
deleted:
  - path: benchmarks/agents/prompts/A1-*.md
    count: 6
    by: CHE-133 (M0.5.4)
    survives_as: >-
      nothing; a prompt is a task statement and the task set is retired. The
      closed forms they were graded against are in src/verification/analytic.py.
  - path: benchmarks/agents/expected/A1-*.json
    count: 6
    by: CHE-133 (M0.5.4)
    survives_as: >-
      nothing. Each file said in its own text that it was a regression signal and
      not the oracle, so nothing scientific went with it.
  - path: benchmarks/agents/test_agent_suite.py
    count: 1
    by: CHE-133 (M0.5.4)
    survives_as: >-
      tests/test_agent_benchmark.py, which now defines its own throwaway tasks and
      therefore tests the harness rather than a task set.
  - path: benchmarks/schemas/result.schema.json
    count: 1
    by: CHE-133 (M0.5.4)
    survives_as: >-
      schemas/verification_result.schema.json, generated from
      verification.result.VerificationResult. The old one hard-coded
      benchmark_id: enum[L1-RAY-01, L1-WAVE-01, L2-COUPLER-01].
  - path: "benchmarks/manifest.yaml levels: block"
    count: 1
    by: CHE-133 (M0.5.4)
    survives_as: >-
      verification.claim_ledger.open_gates() for the unmet 1.0e-3 gate and the
      backwards quadrature control; a caveat on the primary claim for the PB7 rule
      that it must not be closed against another Optiland PSF route; and a
      construction-time rule in BenchmarkFamily that refuses a CROSS_ROUTE oracle
      outside B4.
  - path: benchmarks/roadmap.md L1/L2/L3 planned rows
    count: 10
    by: CHE-133 (M0.5.4)
    survives_as: >-
      the independent-validation standard, kept in roadmap.md and given an
      executable form by the family schema's oracle-independence rules.
  - path: src/agent/benchmark_suite.py A1 task definitions
    count: 6
    by: CHE-133 (M0.5.4)
    survives_as: >-
      src/verification/analytic.py (five closed forms with their measured
      agreements) and src/verification/hazards.py (the two measured traps with
      their numbers), both covered by tests/test_preserved_evidence.py.

entries:

  # =========================================================================
  # benchmarks/agents/ -- the V1 agent suite
  # =========================================================================
  - path: benchmarks/agents/README.md
    part: the A1 exclusion table
    bucket: A
    justification: >-
      Nine candidate benchmarks rejected with a MEASURED reason: the unseedable
      numba BSDF (two identical calls differ by ~1%), the VTK headless hang, the
      unreachable Thorlabs .zmx/.seq artifacts (1313-byte HTML page), the
      jax_enable_x64 exclusion, and the two Adam-state traps plus t35 rejected
      ONLY for runtime. Recording why a candidate is not a benchmark is expensive
      knowledge and the runtime rejections are the shortlist for a cheaper V2.
    destination: >-
      B0 family metadata -- the excluded-candidate register, with the two
      Adam-state traps and t35 carried as B0 candidates pending a cheap surrogate.
  - path: benchmarks/agents/README.md
    part: the five design decisions and the failure taxonomy table
    bucket: A
    justification: >-
      Context policy as a property of the task, three declared trials reported as
      a rate, void-vs-failed, the 8-code taxonomy, and first-stage-that-failed
      grading. These are harness design decisions with reasons; they survive the
      task set they were first written for.
    destination: >-
      Agent-evaluation harness documentation (M9). Not verifier material -- these
      grade an agent, not physics.
  - path: benchmarks/agents/README.md
    part: the six-task table and "Adding a benchmark"
    bucket: C
    justification: >-
      Documents the A1-* task set and the procedure for extending it in the
      retired id space.
  # =========================================================================
  # benchmarks/manifest.yaml
  # =========================================================================
  - path: benchmarks/manifest.yaml
    part: "levels: block (L2-PSF-01 task entry)"
    bucket: C
    justification: >-
      The L1/L2/L3 "levels" taxonomy is the old design, replaced by the family
      registry plus benchmarks/instances/.
  - path: benchmarks/manifest.yaml
    part: "the L2-PSF-01 entry's note: and gate_disposition: prose"
    bucket: A
    justification: >-
      The frozen 1.0e-3 fft_oracle_intensity_relative_l2 gate is UNMET at
      2.2e-3-2.5e-3 on 787,969 rays while a synthetic aberration-free bundle
      reaches 4.07e-4; and the rule that it must not be closed against another
      Optiland PSF route, because FFTPSF and HuygensPSF share one Wavefront/OPD
      front end and are not two oracles (PB7/CHE-58 finding F2).
    destination: >-
      B3-PSF-SINGLET: the tolerance with its basis, gate_status NOT_MET, and the
      oracle-independence rule as a structural constraint rather than prose.
  - path: benchmarks/manifest.yaml
    part: "characterizations: block (DEMO3-RW-P)"
    bucket: A
    justification: >-
      Already the labelling discipline this revision asks for:
      validation_target false, a why_not saying the paper states no conventional
      reference exists, what_it_does_support, and a cost_ceiling with its 2.9x
      model spread. It must be migrated, not rewritten from scratch.
    destination: B4-DEMO3 family metadata, verbatim where the field maps.
  - path: benchmarks/manifest.yaml
    part: "m1_exit_report / m1_independence_check pointers"
    bucket: A
    justification: >-
      Provenance pointers into the archived gen1 suite and its independence
      check. They are the milestone record for benchmarks that no longer run.
    destination: Family provenance_rule references for B1 ray/wave families.

  # =========================================================================
  # benchmarks/physics/L2-PSF-01/ -- one directory, three verdicts
  # =========================================================================
  - path: benchmarks/physics/L2-PSF-01/run_benchmark.py
    part: the task wrapper (CLI, result.json emission, protocol plumbing)
    bucket: C
    justification: >-
      Serves the old evaluation design. Replaced by GraphExecutor (M3.1) plus the
      family runner.
    note: >-
      NOT deleted in M0.5.4. It is the only way to run this case until the
      executor and family runner exist; deletion is owned by M4 (CHE-115/CHE-116).
  - path: benchmarks/physics/L2-PSF-01/run_benchmark.py
    part: the M3-SINGLET-REF prescription and its graph construction
    bucket: B
    justification: >-
      POSITIVE: this is the only composed ray-to-wave case in the repository with
      an independent analytic decider, and it is the case that carries the
      project's one open unmet gate. Freezing it keeps the residual investigation
      (CHE-117) anchored to a fixed physical setup, so a change in the number is
      attributable to code rather than to a moved prescription. Its scientific
      fingerprint is the regression signal for the whole ray-to-wave path.
    destination: B3-PSF-SINGLET-01, canonical instance, origin CANONICAL.
  - path: benchmarks/physics/L2-PSF-01/evaluate.py
    bucket: A
    justification: >-
      The metric definitions -- fft_oracle_intensity_relative_l2 and the rest --
      exist nowhere else in executable form.
    destination: >-
      src/verification/metrics.py (M2.4), as canonical single definitions with a
      documented blind spot each; referenced by B3-PSF-SINGLET's metrics.
  - path: benchmarks/physics/L2-PSF-01/tolerances.yaml
    bucket: A
    justification: >-
      Tolerance VALUES together with their derivations. A tolerance without its
      basis cannot be re-justified later and cannot be checked for
      may_gate eligibility.
    destination: >-
      B3-PSF-SINGLET tolerances, each as (threshold, basis, may_gate). Bases that
      are recorded measurements rather than independent derivations become
      may_gate false.
  - path: benchmarks/physics/L2-PSF-01/README.md
    bucket: A
    justification: >-
      The residual analysis behind the unmet gate, including the split between
      attributed and unattributed residual and the negative controls -- one of
      which (inverted quadrature weight) fires backwards.
    destination: >-
      B3-PSF-SINGLET negative_controls, and the evidence trail CHE-117 must
      either close or re-scope.

  # =========================================================================
  # benchmarks/instances/ -- canonical instances, run through the substrate
  # =========================================================================
  - path: benchmarks/instances/FIXED-V1.yaml
    bucket: A
    justification: >-
      The canonical fixed suite's committed, versioned manifest (CHE-135):
      33 instances across all five categories, each with its fingerprint, its tier
      and the positive justification for selecting it. Generated from
      src/verification/fixed_suite.py and re-rendered in memory by the test, so
      the two cannot disagree. Replaces what manifest.yaml's levels: block did.
    destination: The acceptance-criteria layer for every claim made after it.
  - path: benchmarks/instances/b0_contract.py
    bucket: B
    justification: >-
      POSITIVE: the ten canonical B0 instances, executed. This is the only place
      each of the five negative outcomes -- unsupported, invalid_configuration,
      out_of_validity, lossy_but_allowed, blocked -- is produced by a DIFFERENT
      shipping component refusing a real request, and the only place the two
      ok-contract-wrong-physics traps are re-measured on the pinned installs
      rather than read out of a record. Freezing it keeps the five statuses
      individually reachable rather than individually declared.
    destination: >-
      B0-CONTRACT / B0-DTYPE / B0-VALIDITY / B0-UNITS canonical instances, run by
      tests/test_b0_instances.py in the default gate.
    note: >-
      Three instances are graphs through GraphExecutor; the other seven are
      refused before a graph could run -- a capability intersection, a bridge
      policy, an artifact-level declaration -- and go through the shipping
      refusal path, which is what those questions are about.
  - path: benchmarks/instances/b1_ray.py
    bucket: B
    justification: >-
      POSITIVE: the five B1 ray families executed against the shipping Optiland
      adapter, and the only place three load-bearing conventions of the traced
      record are written down executably -- that a collimated on-axis ray's
      transverse position at the first surface IS its launch position (which makes
      sin(i) = rho/R exact), that the image plane refracts, and that a traced focal
      length is not a paraxial one. Each of those had a wrong reading that produced
      a plausible number, and each is now a comment beside the code that depends on
      it.
    destination: >-
      B1-RAY-EFL / -PLATE / -SNELL / -LAGRANGE / -OFFAXIS-OPL canonical instances,
      run by tests/test_b1_ray_instances.py in the default gate.
    note: >-
      Also carries the device/precision matrix (RAY-4) and the unsupported-request
      probe (RAY-5). One family's gate does NOT close and says so:
      B1-RAY-LAGRANGE measures 1.3e-7 against a 1e-10 tolerance whose basis is a
      paraxial conservation law, and the tolerance is left alone.
  - path: benchmarks/instances/b3_psf_singlet.py
    bucket: B
    justification: >-
      POSITIVE: this is the substrate proof. It is the only place a real Optiland
      trace becomes a real ExecutionRecord and that record is handed to verify()
      against a real family, so freezing it keeps the loop -- family, instance,
      executor, verifier -- exercised end to end by the test suite rather than by
      a person remembering to run it.
    destination: >-
      B3-PSF-SINGLET-01, the canonical instance, and the replacement for
      benchmarks/physics/L2-PSF-01/run_benchmark.py once it reproduces the frozen
      fingerprint (CHE-115).
    note: >-
      It does NOT yet reproduce the 2.21e-3 frozen number, and does not claim to:
      256 rings rather than 512, and a centred-half-window metric rather than the
      5-Airy-radius radial-profile residual. Both differences are declared.

  # =========================================================================
  # benchmarks/protocols/ -- frozen contracts holding tolerance derivations
  # =========================================================================
  - path: benchmarks/protocols/protocol.yaml
    bucket: A
    justification: >-
      The M1 baseline contract: declared tolerances, sampling, device and dtype
      for the ray and wave node baselines.
    destination: >-
      B1 ray/wave family execution_policy and tolerance bases. Moves to
      protocols/archive/ only once M1 expresses its content executably.
  - path: benchmarks/protocols/coupler_protocol.yaml
    bucket: A
    justification: >-
      Defines the four stochastic evidence kinds -- exactness limit,
      unbiasedness, convergence exponent, variance characterization -- that
      StochasticEvidence already mirrors, plus the coupler tolerance derivations.
    destination: B2-W2R-STOCH stochastic_policy; B2 tolerance bases.
  - path: benchmarks/protocols/slice_protocol.yaml
    bucket: A
    justification: >-
      1785 lines of frozen M3 contract: the per-axis Nyquist derivation, the
      exclusion of M_SENSOR_IDEAL and why the graph terminates at the propagated
      ComplexField, the sampling and validity envelope.
    destination: >-
      ValidityPredicate bases (per-axis Nyquist from marginal ray angles;
      declared planarity) and B3-PSF-SINGLET execution_policy.
  - path: benchmarks/protocols/m1_baseline_protocol.md
    bucket: A
    justification: Prose contract for the M1 baselines; carries the tolerance reasoning.
    destination: B1 family question/basis text.
  - path: benchmarks/protocols/m2_coupler_protocol.md
    bucket: A
    justification: Prose contract for the coupler benchmarks.
    destination: B2 family question/basis text.
  - path: benchmarks/protocols/m3_slice_protocol.md
    bucket: A
    justification: Prose contract for the M3 slice, including the reference-plane decision.
    destination: B3-PSF-SINGLET family question/basis text.

  # =========================================================================
  # benchmarks/schemas/
  # =========================================================================
  - path: benchmarks/schemas/performance.schema.json
    bucket: A
    justification: >-
      The performance-record contract behind the M0.4 baseline harness; taxonomy-
      free and still the shape the cost records are written in.
    destination: B4-COST resource_cost schema.
  - path: benchmarks/schemas/provenance.schema.json
    bucket: C
    justification: >-
      RECLASSIFIED by CHE-133 after the grep test found it. This carries the SAME
      baked-in taxonomy as result.schema.json --
      benchmark_id: enum[L1-RAY-01, L1-WAVE-01, L2-COUPLER-01] and a protocol_id
      enum of M1/M2 protocol names -- which is what result.schema.json was deleted
      for; the ticket named only the one file. Its only readers are archived gen1
      tests (archive/tests/gen1/) which cannot run, and the live provenance
      contract is the generated schemas/provenance.schema.json plus
      core.provenance.VOLATILE_KEYS.
    note: >-
      NOT deleted here: the M0.5.4 deletion list did not include it and deleting a
      file only archived code reads is a separate decision. Removal owned by
      CHE-115, and tests/test_retired_taxonomy.py allowlists it with this reason
      so the finding cannot go quiet.

  # =========================================================================
  # benchmarks/roadmap.md and its source catalog
  # =========================================================================
  - path: benchmarks/roadmap.md
    part: the ten L1/L2/L3 planned-benchmark rows
    bucket: C
    justification: >-
      Task definitions in a retired taxonomy. Four name model ids
      (M_TMM_JAXLAYERLUMOS, M_PC_LEGUME and the two dangling L1 entries) that
      never existed anywhere in this repository.
  - path: benchmarks/roadmap.md
    part: the removed-solver findings and the independent-validation standard
    bucket: A
    justification: >-
      FMMAX's unresolved phase/sign convention against a reflectance magnitude
      matched to ~1e-7; fdtdx's two failed gradient paths (jax.grad w.r.t. source
      wavelength returning exactly 0.0, and ConcretizationTypeError from
      place_objects); jax-fem's PyPI-BSD-versus-actual-GPLv3 mismatch and its
      unconditional petsc4py import. Plus the standard the L3 tasks were written
      against: independent final validation, multiple initializations, held-out
      perturbations, equal compute budgets, gradient checks, and a full accounting
      of solver calls -- which still applies to whatever replaces them.
    destination: >-
      Retired-component register (keeps living in roadmap.md), and the
      independence standard becomes the oracle-independence rules the family
      schema enforces structurally.
  - path: benchmarks/roadmap.md
    part: the C_FIELD_TO_PSF paragraph
    bucket: A
    justification: >-
      Records that C_FIELD_TO_PSF was retired on a definitional argument --
      extracting |U|^2 from a terminal field is a measurement, not a
      cross-representation handoff -- and names the test that pins it. Nothing in
      this migration reopens it.
    destination: >-
      Unchanged in place; tests/test_graph_validation.py::test_field_to_psf_is_not_a_registered_coupler
      stays as its executable form.
  - path: benchmarks/roadmap_source_catalog.yaml
    bucket: A
    justification: >-
      Source catalog for the roadmap's claims -- which paper or probe each retired
