# Routing-critical facts for M_RAY_OPTILAND.
# Field contract follows AGENTS.md "Initial Artifact Boundary".
# Grounded in: agent_solver container (docker/Dockerfile, optiland==0.6.0 +
# separately-pinned CPU torch==2.13.0) + knowledge/solvers/optiland/probes/*.py
# run against that image, 2026-07-30.
# This supplements, and does not replace, knowledge/solver_cards/optiland.yaml
# (the flat routing card format used by the current registry docs).

id: optiland
role: M_RAY_OPTILAND
package:
  name: optiland
  pinned_version: "0.6.0"
  install_source: "pip install optiland==0.6.0"
  install_hazard: >
    A bare `pip install optiland` gives you a NumPy-only installation with
    NO differentiability. torch is not a declared dependency (confirmed via
    `importlib.metadata.distribution('optiland').requires`) even though the
    project is described as PyTorch-differentiable. You must separately
    install torch and call `optiland.backend.set_backend('torch')` at
    runtime to get gradients or GPU support. See failure_guide.md.
  python_requires: ">=3.10"
official_docs: https://optiland.readthedocs.io/en/latest/
repository: https://github.com/optiland/optiland
repository_note: >
  knowledge/solver_cards/optiland.yaml currently lists
  https://github.com/HarrisonKramer/optiland, which now 301-redirects here.
  The PyPI package's own Project-URL metadata confirms optiland/optiland is
  canonical.
license: not yet confirmed in this pass (not read from LICENSE file or PyPI classifier)
framework: numpy (M1-validated adapter path)
supported_regimes:
  - sequential geometric ray tracing on CPU/float64 with the NumPy backend
  - manufactured free-space and ideal paraxial cases
  - a spherical plano-convex catalog prescription with aperture classification
  - the bundled ReverseTelephoto sample at one field and wavelength
  - the adapter-owned M3SingletRef system at one field and wavelength (see
    adapter_owned_systems)
  - ray export at the paraxial exit pupil as well as the image surface (see
    exit_pupil_handoff)
package_reported_unverified_regimes:
  - optional PyTorch backend, GPU execution, and native autodiff
  - wavefront/PSF/MTF/Zernike analysis modules
  - tolerancing and optimization modules
derivative:
  mode: native_autodiff
  mechanism: >
    torch.Tensor autograd through the "torch" backend, selected at runtime
    via optiland.backend.set_backend('torch'). The NumPy backend
    (default) has no gradients: `supports_gradients` is False under numpy,
    True under torch (both observed directly, see conventions.md).
  verified: false
  verified_note: >
    A single directional-derivative probe (probes/gradient_probe.py) passed
    for one path (ReverseTelephoto sample lens, surfaces.surfaces[1]
    radius-of-curvature -> Optic.trace() -> mean(x^2+y^2) RMS-spot proxy at
    Hx=Hy=0), relative error 1.11e-03 against one centered finite-difference
    step (eps=1e-4). This tolerance is looser than the JAX-based solvers in
    this repository (typically 1e-4 to 1e-13) -- not yet root-caused; could
    be non-smoothness near the optical axis, float64 autograd error
    accumulation through the ray-trace recursion, or something else. Do not
    set verified: true, and re-check tolerance before relying on this path
    in a tight optimization loop. This is NOT the full repository gradient
    test (needs multiple step sizes, a convergence table, and
    an ill-conditioned case) and covers only this one parameter/objective
    pair -- not wavefront/OPD export, not every surface type, not GPU.
devices_reported_by_package: [cpu, gpu]
devices_tested: [cpu]
dtypes_validated_for_m1: [float64]
input_output_artifacts:
  - optiland.rays.real_rays.RealRays (maps to project artifact `ray_bundle`)
known_conventions: see conventions.md
# CHE-30 (M3.1). Structured so a consumer can act on it; the prose version and
# the reasoning live in conventions.md. Established against manufactured
# geometries with closed-form answers, every case exact to float64 round-off:
# knowledge/solvers/optiland/probes/opd_convention_probe.py, asserted with its
# falsifiers in tests/test_optiland_opd_convention.py.
opd_convention:
  status: verified
  verified_by: CHE-30
  field: RealRays.opd
  quantity: absolute_optical_path_length
  # NOT an OPD relative to a chief ray, which is what the name suggests. CHE-41
  # tested this off axis, where it is testable at all: at Hy = 0.2 the chief ray's
  # own opd_native is 11051.3 waves rather than zero. The flag was right; what was
  # missing was a statement of which SURFACE the accumulation starts from, now in
  # reference_plane_infinite_object below.
  is_relative_to_chief_ray: false
  is_relative_to_chief_ray_verified_off_axis: CHE-41 (Hy = 0.2, chief opd = 11051.3 waves)
  index_weighted: true
  unit: mm
  unit_basis: lens geometry unit; scales exactly with the prescription
  sign: >-
    non-negative accumulation; larger means longer optical path. The
    accumulator adds be.abs(t * n_pre) at every standard surface, so it never
    decreases through propagation or refraction.
  sign_is_monotonic: false
  sign_monotonicity_exceptions:
    # Both subtract, so monotonicity is a property of the purely refractive
    # path rather than of RealRays.opd in general.
    - interactions/thin_lens_interaction_model.py subtracts (x^2 + y^2) / (2 f)
    - interactions/phase_interaction_model.py adds a signed opd_shift (DOE)
  accumulation_site: >-
    surfaces/standard_surface.py:
    rays.opd = rays.opd + be.abs(t * self.material_pre.n(rays.w))
  weighting_medium: material_pre  # the medium BEFORE each surface weights that segment
  reference_plane: ray_launch_state  # where RealRays seeds the accumulator to zero
  reference_plane_infinite_object:
    expression: positions[1] - (EPD - min(positions[1:-1]))
    source: fields/field_types/angle.py::_get_starting_z_offset
    depends_on_aperture: true
    # The consequence that matters: changing the aperture moves the OPL zero,
    # so an absolute Optiland OPL is only meaningful at a declared EPD.
    piston_is_aperture_dependent: true
    # CHE-41: the plane's ORIENTATION, which CHE-30's on-axis cases could not see.
    # It is perpendicular to z, not to the incoming bundle, so it is a wavefront
    # only along z. Measured off axis at Hy = 0.2: launch z spread exactly 0.0 and
    # launch direction spread 2.8e-17 across 3169 rays, against a wavefront's
    # predicted z spread of tan(theta) * EPD = 0.031531 mm.
    is_perpendicular_to_z: true
    is_a_wavefront_of_the_incoming_bundle: false
    omitted_term_off_axis: n_object * (d0 . r_launch)
    omitted_term_shape: >-
      linear in the LAUNCH coordinate, so a piston on axis (exactly constant, span
      0.0) and the entire convergence tilt off it. A consumer that removes a piston
      is unaffected on axis and wrong by the whole tilt off axis: on
      M3-REVERSE-TELEPHOTO at Hy = 0.2 the pupil OPL retains 0.13% of the required
      tilt without it, and the reconstructed wave converges 209 um from the traced
      chief-ray intersection (CHE-37, CHE-41).
    omitted_term_is_not_recoverable_downstream: >-
      it is evaluated at the launch coordinate, and no object-space coordinate
      survives into an exit-pupil export. The adapter therefore exports it as
      object_space_reference_offset_m, regenerating the launch state through
      ray_tracer.ray_generator.generate_rays; a re-trace of the regenerated state
      reproduces Optic.trace exactly (max |dx| = |dy| = |d opd| = 0.0).
    verified_off_axis_by: CHE-41
  reference_plane_finite_object:
    expression: object surface sag + object surface z
    depends_on_aperture: false
    # CHE-41 did not probe this path, and the adapter refuses to supply an
    # object-space reference term for it rather than supplying a zero. A point
    # source IS a common wavefront, so the term should be zero -- but an untested
    # zero is still an untested claim.
    object_space_reference_available: false
  m1_anomaly_explained:
    observation: opd = 12 for a declared 10 mm planar separation
    explanation: EPD was 2.0 mm, so the aimed launch plane sat at z = -2 mm
    residual_mm: 0.0
  wavefront_sign_note: >-
    Optiland's own wavefront code (wavefront/strategy.py) reports
    (opd_ref - opd), i.e. chief-minus-ray, which is the REVERSE of the
    ray-minus-chief evaluator convention L1-RAY-01 declared. A consumer that
    mixes the two conjugates the wavefront.
  inadmissible_sources:
    - surface_type: paraxial
      reason: >-
        The paraxial interaction model subtracts (x^2+y^2)/(2f) but leaves the
        direction un-normalized (rays.N = copysign(1, N)), so the following
        propagation adds the axial distance instead of the Euclidean one and
        the intended cancellation never happens. OPL to the focus is therefore
        NOT flat: the bare lens term survives, measured at 0.36 mm (~655 waves
        at 550 nm) for f = 50 mm at h = 6 mm. Use real refractive surfaces for
        any wavefront handed to a coupler.
# CHE-32 (M3.3). Where the adapter hands rays off, and what a position at that
# plane means. Probed first (tmp_probes/optiland_exit_pupil_probe.py), then
# recorded through the export path itself
# (probes/exit_pupil_handoff.py -> expected/exit_pupil_handoff.json) and
# asserted in tests/test_optiland_adapter.py.
exit_pupil_handoff:
  status: exercised
  exercised_by: CHE-32
  config_key: config['handoff_plane']
  supported_values: [image_surface, exit_pupil]
  default: image_surface
  default_is_unchanged_by_che32: true
  default_evidence: >-
    omitting config['handoff_plane'] reproduces CHE-13's frozen
    scientific_array_sha256 e494af41... bit-identically, and naming
    'image_surface' explicitly gives the same hash. Regression-locked in
    tests/test_optiland_adapter.py; L1-RAY-01 re-run and its bundle
    fingerprint 43dab1ee... unchanged.
  plane_is_read_not_constructed: true
  source_api: optic.paraxial.XPL() and optic.paraxial.XPD()
  xpl_reference_frame: image_surface
  # The one fact the export depends on. Treating XPL as an absolute coordinate
  # would put the plane a whole focal length away and still look plausible.
  plane_expression: exit_pupil_z = image_surface_z + XPL
  protocol_agreement:
    against: benchmarks/slice_protocol.yaml (M3-SLICE-CPU-V1, frozen by M3.2)
    M3-REVERSE-TELEPHOTO:
      exit_pupil_z_mm: 2.1547825721481666
      exit_pupil_diameter_mm: 0.46053493637581633
      relative_error: 0.0            # both quantities
    M3-SINGLET-REF:
      exit_pupil_z_mm: 0.06814345991561233
      exit_pupil_diameter_mm: 0.4987073505473812
      relative_error: 0.0            # both quantities
  pupil_is_virtual_on_both_m3_systems: true
  virtuality_detail: >-
    ReverseTelephoto's exit pupil lands at z = 2.155 mm with five refracting
    surfaces beyond it; M3SingletRef's at z = 0.0681 mm with one. So the
    comfortable justification -- "rays are in air after the last surface,
    therefore back-projection is exact geometry" -- is false for both: the line
    being extended passes back through glass the ray never travelled in.
  position_semantics: image_space_asymptote_at_the_pupil_plane
  position_semantics_detail: >-
    NOT a physical ray intersection. The exit pupil is defined by where
    image-space rays appear to come from, so advancing each ray along its own
    image-space direction to the pupil z evaluates that apparent origin exactly.
    That is what a wavefront-over-the-pupil calculation wants; "where the ray is"
    is not what x_m/y_m mean at this plane, and the exported metadata says so.
  projection_is_a_reparameterization: true
  projection_evidence:
    collinearity_residual_max: 2.5e-17   # ||d x (P_pupil - P_image)|| / step, worst of the two systems
    directions_bitwise_identical: true
    opd_and_intensity_bitwise_identical: true
    note: >-
      no optical path is added or removed by the projection; OPL handling at the
      pupil is M3.4 (CHE-33), not this.
  pupil_boundary:
    representation: implicit_in_surviving_rays
    mask_available_from_optiland: false
    reason: >-
      RealRays carries no mask attribute and Optic.trace returns survivors only,
      so a vignetted candidate is absent rather than flagged.
    exported_instead: measured extent of the traced survivors, labelled derived
    survived_field_is_not_a_mask: >-
      the `survived` array is an all-true derived boolean stating the membership
      of each exported row; it must not be promoted into an Optiland pupil mask.
    measured_extent_does_not_bracket_the_paraxial_value: >-
      sampling density pulls the measured extent inward while pupil aberration
      pushes real marginal rays outward. On both M3 systems the measured
      semi-extent lands slightly ABOVE the paraxial semi-diameter
      (2.4978e-4 m vs 2.4935e-4 m for M3-SINGLET-REF; 2.3099e-4 m vs 2.3027e-4 m
      for M3-REVERSE-TELEPHOTO). A consumer needing the aperture must use the
      paraxial diameter.
  structured_failures:
    - code: OPTILAND_EXIT_PUPIL_UNRESOLVED
      when: XPL()/XPD() raise, or return a non-finite value
      behaviour: >-
        RunStatus.FAILED with the code in diagnostics; never a silent fallback to
        the image surface, which would be wrong by the whole pupil-to-focus
        distance with nothing to notice it by
    - code: OPTILAND_HANDOFF_PLANE_UNREACHABLE
      when: a traced ray has N = 0 and so never reaches the requested plane
    - code: OPTILAND_UNSUPPORTED_HANDOFF_PLANE
      when: any other plane is requested
      eager: true      # rejected before optiland is imported
      not_implemented_in_particular: >-
        a reference SPHERE. The ray-to-wave coupler accumulates onto a plane.
  not_exercised:
    - off-axis fields (only Hx=Hy=0 was run at this plane)
    - a system whose exit pupil is real rather than virtual
    - the torch backend at the exit-pupil plane

# CHE-32 (M3.3). One system, owned by the adapter rather than bundled, because
# no bundled sample qualifies.
adapter_owned_systems:
  - id: M3SingletRef
    protocol_id: M3-SINGLET-REF
    added_by: CHE-32
    is_not_the_custom_prescription_path: >-
      the name must appear in the adapter's _SUPPORTED_SAMPLES and
      inputs['system'] is still refused. The difference from a bundled system is
      only where the prescription is written down, not how loosely it is
      admitted; both are probed and pinned to the same M1 standard.
    prescription_source: benchmarks/slice_protocol.yaml, systems[M3-SINGLET-REF]
    construction:
      plano_convex_singlet: convex toward the collimated side
      surface_type: standard          # NOT paraxial -- CHE-30 ruled that out as an OPL source
      refractive_index: 1.5168        # IdealMaterial, so no glass-catalog dependency
      radius_mm: 2.5
      center_thickness_mm: 0.2
      f_number: 9.7
      aperture: derived from the f-number rather than restated, so the two cannot drift
    why_not_a_bundled_sample: >-
      tmp_probes/optiland_exit_pupil_probe.py measured all fourteen systems in
      optiland.samples.objectives on axis at 550 nm, peak-to-valley optical path
      to a sphere centred on the image point. The best is WideAngle100FOV at 0.36
      waves against Rayleigh's 0.25, and ReverseTelephoto is 1.02. None is
      diffraction-limited, so M3.2's Airy oracle has no bundled vehicle.
    diffraction_limited_evidence:
      measured_by: M3.2, recorded in benchmarks/slice_protocol.yaml
      not_measured_by: CHE-32
      peak_to_valley_waves: 0.01699595356250618
      criterion: Rayleigh quarter wave, peak-to-valley
    m1_standard_evidence:
      probe: knowledge/solvers/optiland/probes/exit_pupil_handoff.py
      expected: knowledge/solvers/optiland/expected/exit_pupil_handoff.json
      request: numpy/cpu/float64, 550 nm, Hx=Hy=0, num_rays=16
      surviving_ray_count: 817
      deterministic: true
      scientific_array_sha256:
        image_surface: fbe6f86e49f5db6b64553956017b0b54d80f8b6174d47a15b5b86a54d4960864
        exit_pupil: b24794af2c1a6481d46ef64efe69ca0bf45f5e4019234aeb4a754bc63e16c94d
      all_finite: true
      max_direction_norm_error: 6.661338147750939e-16
      direction_norm_tolerance: 1.0e-12
      image_plane_z_mm: 4.90560476022521    # matches the frozen protocol exactly
      intensity: >-
        exactly 1.0 for every survivor at this field and aperture -- no
        vignetting or Fresnel loss is modelled on this path
    not_exercised:
      - off-axis fields
      - any wavelength other than 550 nm
      - the torch backend and gradients on this system
      - an independent PSF or Airy comparison (that is M3.8's, not this ticket's)

cost_scaling: >-
  O(number_of_surfaces * number_of_rays) model; CHE-16 measured fixed-
  prescription CPU scaling at requested hexapolar sampling 8, 16, 32, and 64.
limitations_and_failure_modes: see failure_guide.md
validated_probe_ids:
  - import_probe (passed, 2026-07-30)
  - raytrace_probe (passed, 2026-07-30; bundled sample system only, not an analytic oracle)
  - gradient_probe (passed for one narrow path with looser-than-JAX tolerance, 2026-07-30)
  - m1_engine_contract (passed, 2026-08-11; exact pin, isolated CPU import, and known-distance mm/um check)
  - standalone_baseline (CHE-13; deterministic ReverseTelephoto CPU/float64 trace,
    SI boundary conversion, survivor-aware shape, finite/unit-direction checks,
    structured failures, and stable scientific-array hash)
  - L1-RAY-01 (CHE-17; free-space and paraxial analytic oracles plus Edmund
    Optics TECHSPEC #45-362 full prescription/reference trace on CPU/float64)
  - L1-RAY-01 scaling (CHE-16; ReverseTelephoto requested sampling 8/16/32/64,
    deterministic scientific hashes and survivor counts, raw timing and peak
    RSS evidence, with the CHE-17 analytic suite as a mandatory accuracy gate)
  - opd_convention_probe (CHE-30; RealRays.opd quantity, sign, reference plane,
    and unit established against manufactured geometries with closed-form
    answers, each with the competing hypothesis it rules out; also establishes
    that surface_type="paraxial" is not an admissible OPL source)
  - exit_pupil_handoff (CHE-32; exit-pupil plane read from Paraxial.XPL()/XPD()
    and reproduced against the frozen M3-SLICE-CPU-V1 geometry for both M3
    systems, projection checked as collinearity along each traced ray, and
    M3SingletRef pinned at the M1 standard at both handoff planes)
  - off_axis_opd_reference (CHE-41; establishes that the opd accumulator is seeded
    on a plane PERPENDICULAR TO Z rather than on a wavefront of the incoming
    bundle, that the launch state can be regenerated exactly, that the omitted
    term is a piston on axis and the whole convergence tilt off axis, and what a
    tilt-carrying pupil costs in sampling at seven field points)
not_yet_probed:
  - GPU device placement (no GPU in this environment)
  - pupil power and coordinate orientation
  - a system whose exit pupil is real rather than virtual (both M3 systems are
    virtual -- CHE-32)
  - off-axis fields beyond Hy = 0.2 through the full slice (CHE-41 exported and
    verified the object-space reference at one off-axis field; the exit-pupil
    handoff itself is still only pinned at Hx=Hy=0 -- CHE-32)
  - an off-axis field in x, or in both axes at once (CHE-41 used y only and did so
    deliberately, because a one-axis field is what makes the transpose control
    non-vacuous)
  - the object-space reference for a finite-object launch, where the launch state
    is a point rather than a plane
  - hard-stop / vignetting non-smoothness (existing solver card already flags this as an assumption to check)
adapter_location: src/multiscale_optics_agent/adapters/optiland_adapter.py
validation_status: environment_verified
validation_note: >
  CHE-12 verified the pinned CPU environment and native geometry/wavelength
  units. CHE-13 stabilizes the standalone deterministic ray-state contract.
  CHE-17 adds L1 analytic accuracy evidence for free space, ideal paraxial
  focus, and one catalog plano-convex prescription. CHE-16 adds fixed-case
  sampling, determinism, CPU runtime, and memory evidence. CHE-30 establishes
  the RealRays.opd convention -- quantity, sign, reference plane, and unit --
  see opd_convention above. CHE-32 adds the exit-pupil handoff plane and the
  adapter-owned M3SingletRef system, both pinned at the M1 standard -- see
  exit_pupil_handoff and adapter_owned_systems above -- without moving the
  default image-surface export. Registered M1 capability is NumPy CPU/float64
  forward tracing only; GPU, float32, gradients, and broader prescriptions
  remain unverified.
