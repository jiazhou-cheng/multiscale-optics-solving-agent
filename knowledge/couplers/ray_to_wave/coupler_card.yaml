# Routing-critical facts for C_RAY_TO_WAVE.
# Contract follows AGENTS.md "Initial Artifact Boundary" and the frozen
# M2-COUPLER-CPU-V1 boundary table in benchmarks/M2_COUPLER_PROTOCOL.md.
# Grounded in: knowledge/papers/raywave_tracing/ (DOI 10.1021/acsphotonics.6c00818),
# main text eq 2 and SI Figure S1.

id: ray_to_wave
role: C_RAY_TO_WAVE
direction: ray_bundle -> complex_field
transformation: coherent plane-wavelet accumulation onto a declared plane

scientific_source:
  doi: 10.1021/acsphotonics.6c00818
  equations: [main_text_eq_2]
  figures: [SI_Figure_S1]
  reference_implementation: https://github.com/jiazhou-cheng/raywave-tracing
  reference_implementation_status: >
    NOT vendored, NOT pinned, NOT executed by this repository. No claim here may
    cite it as evidence. All mathematics is taken from the paper; all evidence is
    produced by this repository's own probes.

framework: numpy
frameworks_deliberately_avoided:
  - reason: >
      The coupler core is the physics under test, so it imports neither optiland
      nor chromatix. M1 proved the engines are independently correct; if the core
      could import one, a coupler defect could be misattributed to engine
      behaviour and M1's independence evidence would stop bounding the search.
    forbidden_imports: [optiland, chromatix]

governing_equation: >
  U_plane(x,y) = sum_i a_i * exp(i k (OPL_i + dr_i(x,y))) * <n_hat, d_hat_i>
  with dr_i(x,y) = d_x_i (x - x0_i) + d_y_i (y - y0_i)

required_source_metadata:
  - wavelength_m
  - positions_m
  - directions_unit
  - complex_amplitude
  - optical_path_length_m
  - optical_path_length_reference
provides_target_metadata:
  - wavelength_m
  - sample_pitch_m
  - coordinate_frame
  - origin
  - phasor
  - normalization
  - reference_plane_z_m
  - plane_normal

deliberately_not_required:
  - name: polarization
    reason: >
      The registry port historically demanded it, but M2 is scalar-only and the
      Optiland adapter documents that it does not fabricate polarization. A
      required field nobody can supply is a contract defect, not a safety
      feature. Reinstated when a vector claim is made.

deliberately_refused:
  - name: opd_native
    reason: >
      Optiland's opd sign and reference plane are both recorded unverified by
      M1. A wrong OPL reference is a harmless piston; a wrong OPL sign
      conjugates the wavefront and turns a converging beam into a diverging
      one. Those are indistinguishable downstream, so the ambiguity is refused
      rather than defaulted.
  - name: ray_intensity_as_amplitude
    reason: >
      Optiland emits `intensity` with an explicit intensity_is_not_amplitude
      marker. Converting a weight to an amplitude is a modelling decision (power
      -> sqrt? photon count? already an amplitude?) that the caller must declare
      and test. The coupler does not choose.

supported_regimes:
  - scalar, monochromatic, fully coherent
  - planar reconstruction surface with a single declared normal
  - CPU, float64 / complex128
unsupported_regimes:
  - vector fields and polarization
  - chromatic / broadband ensembles
  - partially coherent sources
  - curved reconstruction surfaces (see ../wave_to_ray curvature bound)
  - GPU and TPU

validity_conditions:
  - id: sampling_density
    statement: >
      Phase difference between adjacent rays at the reconstruction plane must be
      below pi, or the reconstruction aliases. This is a Nyquist condition on the
      wavefront, not on the output grid.
    enforcement: measured and reported; structured diagnostic when violated
  - id: single_valued_wavefront
    statement: >
      Coherent complex summation remains valid at caustics and at overlapping ray
      branches. Any downstream operation that UNWRAPS phase is not valid there.
    enforcement: documented; caller responsibility
  - id: plane_not_surface
    statement: Equation 2 reconstructs onto a plane with one normal n_hat.
    enforcement: contract validation

derivative:
  mode: not_applicable_yet
  verified: false
  verified_note: >
    Ray->wave is a coherent sum and is differentiable in principle with respect
    to ray amplitudes, positions, and OPLs. No gradient is claimed in M2 because
    none has been tested. See ../wave_to_ray for the direction where the paper's
    estimator is deliberately biased.

devices_tested: [cpu]
dtypes_validated: [complex128]
validated_probe_ids:
  - >
    engine_independence (passed, 2026-08-12; CHE-24). Static AST scan of the
    core modules plus a subprocess check that sys.modules contains neither
    optiland nor chromatix after a reconstruction.
  - >
    exact_plane_wave_oracle (passed, 2026-08-12; CHE-24). A collimated bundle
    launched from many lateral positions reconstructs
    N * <n,d> * exp(+i k d.r) at four tilt angles, to a tolerance derived from
    float64 round-off (32 * eps64 * N) rather than chosen. Simultaneously pins
    the OPL handling, the dr(x,y) ramp, the phasor sign, and the projection
    factor, because removing any one of them breaks it.
  - >
    launch_position_invariance (passed, 2026-08-12). Two ensembles of the same
    angular mode, one on a grid and one at random lateral positions, agree to
    round-off. This is the entire content of the dr(x,y) term.
  - >
    linearity (passed, 2026-08-12). Reconstructing two modes jointly equals the
    sum of their separate reconstructions.
  - >
    chromatix_asm_cross_check (passed, 2026-08-12; CHE-24). Advancing rays
    geometrically by 40 um and reconstructing agrees with propagating the
    z=0 reconstruction through the M1-verified Chromatix angular spectrum:
    relative residual 2.77e-05 against a bound of 3.00e-04 derived from M1's
    own float32 phase round-off figure (5 * eps32 per radian, 502.7 rad
    accumulated). The residual is below one eps32 per radian, so it is
    accumulated rounding and not a physics disagreement. Chromatix is imported
    by the test driver only, never by the coupler core.
  - >
    negative_controls 4/4 detected (passed, 2026-08-12). Phase sign flipped,
    projection factor omitted, oblique ramp omitted, axes transposed -- each
    run through the SHIPPING implementation with one term removed, each with a
    passing unperturbed control.
  - >
    negative_control_blind_spots (passed, 2026-08-12). Two recorded traps: the
    projection factor is exactly 1 at normal incidence, and the oblique ramp is
    inert for a single centred on-axis ray. Both omissions are proven
    undetectable in those configurations, which is why the negative tests are
    run off-axis and multi-ray.
  - >
    grid_nyquist_condition (passed, 2026-08-12). |d_t| <= lambda / (2 * pitch)
    enforced with a structured diagnostic; the same bundle refused at a 1 um
    pitch reconstructs exactly at 0.25 um, confirming the limit is the grid and
    not the physics.

not_yet_probed:
  - reconstruction error versus ray count for a non-planar wavefront (deferred to CHE-26 round trip)
  - power conservation against a physical aperture rather than a chosen ensemble
  - behaviour at a caustic or with multi-valued phase
  - any gradient

measured_behaviour:
  power_scaling: >
    N identical in-phase wavelets give N times the amplitude and N^2 times the
    discrete power. Reported, not gated: it is bookkeeping about a chosen
    ensemble, not a conservation law about a physical aperture.
  two_independent_sampling_conditions: >
    Grid Nyquist (can the output pitch write the steepest ramp?) and ray
    density (do adjacent wavelets agree to better than pi?) fail independently,
    and refining one does not fix the other. Both are reported so the failing
    one is identifiable; the usual wasted debugging step is refining the grid
    when the ray count is the problem.
  ray_density_diagnostic_limit: >
    The nearest-neighbour scan is O(N^2) and is skipped above 4096 rays,
    reporting not_computed rather than a fabricated estimate.

implementation_location: src/multiscale_optics_agent/couplers/ray_to_wave.py
test_location: tests/test_ray_to_wave.py
validation_status: analytically_validated_scalar_planar_cpu
validation_note: >
  CHE-22 authored this pack from the paper; CHE-24 implemented main-text eq 2
  and validated it. The exact analytic oracle pins every factor of the equation
  at once, the Chromatix cross-check provides an independent implementation,
  and 4/4 negative controls are detected with passing unperturbed controls.
  This validates scalar, monochromatic, fully coherent reconstruction onto a
  PLANAR surface at float64 on CPU. Vector fields, chromatic ensembles, partial
  coherence, curved reconstruction surfaces, accelerators, caustics, and every
  gradient claim remain unvalidated.
