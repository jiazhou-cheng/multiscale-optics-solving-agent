schema_version: 1
protocol_id: M2-COUPLER-CPU-V1
extends: M1-BASELINE-CPU-V1
scope:
  benchmark_ids: [L2-COUPLER-01]
  execution: single_process_coupler_core
  # The coupler core is the physics under test. It must be engine-agnostic:
  # it consumes and produces repository artifacts, never solver objects.
  # Engine adapters may be imported by the *benchmark driver* to build inputs
  # and to supply an independent wave oracle, but never by the coupler core.
  forbidden_import_prefixes:
    coupler_core: [optiland, chromatix]
  rationale: >-
    M1 proved the two engines are independently correct. M2 tests the
    transformation between their representations. If the coupler core imported
    either engine, a coupler defect could be masked by, or misattributed to,
    engine behavior.

execution:
  entrypoint: ./run.sh
  device: cpu
  warmup_runs: 2
  measured_repeats: 7
  seed: 20260812
  synchronize_before_timing: true
  synchronize_after_timing: true
  timing:
    clock: time.perf_counter_ns
    unit: seconds
    primary_statistic: median
    additional_statistics: [minimum, p95]
  cpu_isolation:
    require_observed_affinity: true
    require_logical_cpu_count: true
    require_cpu_model: true
    require_thread_counts: true
    pinning_required: false
    rule: Record observable affinity and thread counts; never claim isolation unless applied.
  peak_memory:
    preferred_method: resource.getrusage(RUSAGE_SELF).ru_maxrss
    linux_conversion: Multiply ru_maxrss KiB by 1024 and report integer bytes.
    unsupported_behavior:
      status: unsupported
      required_diagnostic: true

# M1 baselines were analytic and used no RNG. C_WAVE_TO_RAY is a Monte Carlo
# estimator, so determinism and accuracy are separate claims that need separate
# evidence. This block is the substantive addition of M2-COUPLER-CPU-V1.
stochastic_estimator:
  applies_to: [C_WAVE_TO_RAY]
  seed_policy:
    explicit_seed_required: true
    generator: numpy.random.Generator(PCG64)
    rule: >-
      A given (seed, configuration) pair must reproduce bitwise-identical
      sampled wavevectors, amplitudes, and reconstructed field. Bitwise
      determinism is a reproducibility claim only; it is never evidence that
      the estimator is accurate.
  single_realization_rule: >-
    A single Monte Carlo realization must never be reported as the accuracy
    result. Report the ensemble mean over independent seeds together with its
    standard error, and report the realization spread.
  required_evidence:
    exactness_limit:
      description: >-
        With every propagating spectral bin enumerated and the importance
        weight applied, the estimator must reduce to the deterministic
        reference to round-off. This removes sampling as an excuse before any
        stochastic claim is made.
      tolerance_basis: dtype_roundoff_derived
    unbiasedness:
      description: >-
        Ensemble mean over R independent seeds must agree with the
        deterministic reference within k standard errors of the mean.
      min_realizations: 32
      k_sigma: 3
      rule: >-
        The tolerance is the measured standard error, not a chosen constant. A
        failure must not be repaired by raising k or R.
    convergence_order:
      description: >-
        Root-mean-square field error must fall as N^(-1/2) in the sampled-ray
        count N. Fit the exponent on a log-log sweep and gate on the fitted
        value, not on the error at a single N.
      expected_exponent: -0.5
      exponent_tolerance: 0.1
      min_sweep_points: 5
    variance_comparison:
      description: >-
        Report estimator variance for each supported sampling density p,
        including uniform and spectral-magnitude sampling, at matched N.
  forbidden:
    - Reporting a converged mean without its standard error.
    - Selecting the best of several seeds.
    - Tuning the seed, N, or R after seeing the metric.

differentiability:
  default_claim: not_verified
  rule: >-
    The fixed-direction estimator detaches the sampling density and the sampled
    ray directions, so it is a deliberately biased estimator of the true
    derivative. M2 characterizes that bias; it does not certify the gradient.
  required_evidence_before_any_claim:
    - Directional finite-difference comparison at multiple step sizes.
    - A reported bias magnitude with the regime in which it was measured.
    - An explicit statement of which terms the estimator omits.
  promotion_rule: >-
    derivative.verified may only be set true for a specific, named coupler
    direction and parameter, and only with the evidence above recorded in the
    benchmark bundle.

artifacts:
  required:
    - result.json
    - provenance.json
    - arrays.npz
    - plot.png
    - tolerances.yaml
    - README.md
  additional_required:
    - convergence.json
    - ensemble_statistics.json
  hash:
    algorithm: sha256
    coverage: exact_file_bytes
    exclusion: provenance.json cannot contain its own content hash.
    record_in: provenance.json
  generated_output_rule: Never hand-edit or fabricate solver outputs, timings, or hashes.

result_sections:
  accuracy:
    separate_from_performance: true
    required: [oracle, metrics, tolerances, pass]
  performance:
    separate_from_accuracy: true
    required: [warmup_runs, measured_repeats, samples_seconds, statistics, peak_memory]
  stochastic:
    separate_from_accuracy: true
    required: [seed, realizations, mean, standard_error, convergence_exponent]

reproducibility:
  scientific_fingerprint:
    algorithm: sha256
    includes:
      - accuracy section with volatile keys stripped
      - deterministic reference arrays
      - tolerance file hashes
      - seed and sampled-wavevector hashes
    excludes:
      - wall-clock timings and runtime samples
      - peak memory observations
      - timestamps, run identifiers, output paths, process identifiers
      - git dirty flag
    rule: >-
      Reuses core.provenance volatile-key
      stripping. Ensemble means over a fixed seed sequence are physics and are
      included; per-realization wall-clock is not.

failure:
  status: blocked
  required: [code, message, stage, exception_type]
  solver_values_permitted: false
  distinction: >-
    "blocked" means no well-defined number exists to compare. "failed" means two
    well-defined numbers disagree. A non-converged Monte Carlo estimate is
    neither: report it with its standard error and mark the gate failed.

provenance:
  required:
    - benchmark_id
    - protocol_id
    - command
    - git_commit
    - dirty_worktree
    - python_version
    - platform
    - machine
    - cpu_model
    - logical_cpu_count
    - process_cpu_affinity
    - thread_counts
    - device
    - dtype
    - seed
    - engine_versions
    - input_parameters
    - artifact_hashes
    - timestamp_utc
  additional_required:
    - coupler_id
    - coupler_direction
    - forbidden_modules_loaded
    - rng_generator
    - realizations
