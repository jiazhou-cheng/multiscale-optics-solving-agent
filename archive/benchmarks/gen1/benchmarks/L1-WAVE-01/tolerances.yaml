schema_version: 2

# ---------------------------------------------------------------------------
# Case 1 -- exact primitive
# ---------------------------------------------------------------------------
# Case 1 has no approximation of any kind, so its tolerance is *derived* rather
# than chosen. The propagator evaluates exp(i k_z z) in single precision, so the
# accumulated phase -- which reaches ~2950 rad at the longer distance here --
# carries one float32 epsilon of relative error. The bound is therefore
#     max(case1_phase_floor_rad, factor * eps_float32 * |k_z z|)
# which at z = 2.5e-4 m evaluates to ~1.8e-3 rad against an observed 3.3e-4.
# A fixed absolute tolerance would either be vacuous at long z or impossible at
# short z; this one stays meaningful at both.
case1_phase_round_off_factor: 5.0
case1_phase_floor_rad: 1.0e-5
case1_amplitude_relative: 1.0e-5
case1_rms_round_off_factor: 5.0
case1_rms_floor: 1.0e-5
# The mode is periodic and the propagation lossless and unpadded, so discrete
# power is conserved to round-off with no window-truncation excuse.
case1_power_conservation_relative: 1.0e-5
# Propagate +z then -z and recover the input.
case1_round_trip_rms_floor: 1.0e-5

# ---------------------------------------------------------------------------
# Case 2 -- paraxial focusing
# ---------------------------------------------------------------------------
# Signed focal position, in input pixels. Observed 0.011-0.054 px.
case2_centroid_input_pixels: 0.1
# FWHM by sub-pixel interpolation against 0.8859 * lambda * f / L.
# Observed 1e-4 (x, 201-sample aperture) to 6.5e-3 (y, 121-sample aperture);
# the difference is the discrete-aperture-vs-continuous-sinc model gap, which
# the evaluator measures separately by applying the same estimator to the
# analytic field on the same grid.
case2_fwhm_relative: 0.02
# First sidelobe of a sinc^2 is 0.047180 -- a pure shape number, independent of
# wavelength, aperture, and focal length. Observed 1.2%-2.6% relative.
case2_sidelobe_relative: 0.05
# Complex overlap against the paraxial Fresnel oracle. Observed 0.99625; the
# 0.4% gap is model error, not solver error (see the independent-ASM gate).
case2_overlap_fresnel_minimum: 0.99
# Complex overlap against the independent float64 angular spectrum. Two exact
# calculations, so this is tight: observed 0.999999.
case2_overlap_independent_asm_minimum: 0.9999
case2_power_conservation_relative: 1.0e-3
case2_output_edge_energy_fraction_maximum: 1.0e-4

# ---------------------------------------------------------------------------
# Case 3 -- high-NA vectorial
# ---------------------------------------------------------------------------
# Joint 3-component complex overlap against the Richards-Wolf oracle.
case3_vector_overlap_minimum: 0.99
# Dimensionless peak-intensity ratios; oracle gives Iz/Ix = 0.150087 at NA 0.9.
case3_component_ratio_relative: 0.05
# E_z must vanish on axis and be antisymmetric under x -> -x.
case3_ez_on_axis_maximum: 1.0e-3
case3_ez_antisymmetry_maximum: 1.0e-3
# THE SAMPLING QUALIFICATION. The focal field is a physical object: refining
# the pupil sampling alone, with every physical parameter fixed, must leave its
# scale and its dimensionless component ratios unchanged. Both are required to
# hold across the pupil sweep to this relative spread.
case3_scale_stability_relative: 0.02
case3_ratio_stability_relative: 0.02
# The oracle must be shown converged before it judges anything: the relative
# spread of Iz/Ix over the last three quadrature orders.
case3_oracle_quadrature_relative: 1.0e-6

# ---------------------------------------------------------------------------
# Negative perturbations
# ---------------------------------------------------------------------------
# A perturbation counts as detected only when it drives the case's own primary
# metric past this multiple of that metric's tolerance, so a marginal result
# can never be scored as a successful detection.
perturbation_detection_margin: 10.0
